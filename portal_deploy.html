                  {p.isExtra&&<span className="b b-p">Extra</span>}<span className="b" style={{background:roundsOf(p)>0?"rgba(16,185,129,0.14)":"rgba(255,255,255,0.06)",color:roundsOf(p)>0?"#4ade80":"rgba(255,255,255,0.4)",border:"none"}}>{roundsOf(p)} rounds</span>{!(rosterPins&&rosterPins[p.id])&&<span className="b" style={{background:"rgba(255,255,255,0.06)",color:"rgba(255,255,255,0.35)",border:"none"}}>never registered</span>}
                </div>
              </div>
              <div style={{display:"flex",gap:4,flexWrap:"wrap",justifyContent:"flex-end"}}>
                {(
                  <>
                    <button className="btn btn-gh btn-sm" onClick={()=>setEditing({id:p.id,name:p.name,tee:p.tee||"Whites",hcp:p.hcp||"",email})}>Edit</button>
                    <button className="btn btn-r btn-sm" onClick={()=>setConfirmDel(p)}>Delete</button>
                  </>
                )}
              </div>
            </div>
          );
        })}
      </div>
    </div>

    {/* DELETE CONFIRM */}
    {confirmDel&&(
      <div className="overlay">
        <div className="modal">
          <div style={{fontSize:14,fontWeight:700,marginBottom:6,color:"#f87171"}}>Delete {confirmDel.name}?</div>
          <div style={{fontSize:12,color:"rgba(255,255,255,0.6)",marginBottom:10,lineHeight:1.7}}><b style={{color:"#e2e8f0"}}>{roundsOf(confirmDel)} rounds played</b> · {(rosterPins&&rosterPins[confirmDel.id])?<span style={{color:"#fbbf24"}}>HAS REGISTERED (has a PIN)</span>:"never registered"}{(rosterEmails&&rosterEmails[confirmDel.id])?<span> · {rosterEmails[confirmDel.id]}</span>:null}</div>
          {(rosterPins&&rosterPins[confirmDel.id])&&<div style={{fontSize:11.5,color:"#fbbf24",marginBottom:10,lineHeight:1.6}}>⚠ This player has registered in the app — deleting clears his PIN and he&rsquo;d have to sign up again. Restore puts him back, but not the PIN.</div>}
          <div style={{fontSize:12,color:"rgba(255,255,255,0.45)",marginBottom:16,lineHeight:1.6}}>Removes them from every list, picker, count and email &mdash; and clears their PIN, email and admin flag. <b style={{color:"rgba(255,255,255,0.7)"}}>Their past rounds stay on the books</b>: the tournament fund and old standings do not change. Restore them any time from the Deleted list.</div>
          <div style={{display:"flex",gap:8}}>
            <button className="btn btn-r" style={{flex:1}} onClick={()=>deletePlayer(confirmDel.id)}>Delete Forever</button>
            <button className="btn btn-gh" style={{flex:1}} onClick={()=>setConfirmDel(null)}>Cancel</button>
          </div>
        </div>
      </div>
    )}

    </div>

    {deletedList.length>0&&(
      <div className="card" style={{marginTop:14}}>
        <div className="card-hdr"><span className="card-title">🗑 Deleted ({deletedList.length})</span><span style={{fontSize:10,color:"rgba(255,255,255,0.35)",marginLeft:10}}>removed from every list · restore any time</span></div>
        <div style={{padding:"6px 14px 12px"}}>
          {deletedList.map(p=>(
            <div key={p.id} className="p-row" style={{opacity:0.75}}>
              <div style={{flex:1}}><div className="p-name">{p.name}</div><div className="p-sub">{roundsOf(p)} rounds{p.isExtra?" · extra":""}</div></div>
              <button className="btn btn-gh btn-sm" onClick={()=>restoreDeleted(p.id)}>Restore</button>
            </div>
          ))}
        </div>
      </div>
    )}


    {/* RESET PIN CONFIRM */}
    {confirmResetPin&&(
      <div className="overlay">
        <div className="modal">
          <div style={{fontSize:14,fontWeight:700,marginBottom:6,color:"#f87171"}}>Reset {confirmResetPin.name}'s PIN?</div>
          <div style={{fontSize:12,color:"rgba(255,255,255,0.45)",marginBottom:16,lineHeight:1.6}}>Their current PIN is removed. They'll need to re-register via the app.</div>
          <div style={{display:"flex",gap:8}}>
            <button className="btn btn-r" style={{flex:1}} onClick={()=>resetPin(confirmResetPin.id)}>Reset PIN</button>
            <button className="btn btn-gh" style={{flex:1}} onClick={()=>setConfirmResetPin(null)}>Cancel</button>
          </div>
        </div>
      </div>
    )}

    {/* SET PIN MODAL */}
    {confirmSetPin&&(
      <div className="overlay">
        <div className="modal">
          <div style={{fontSize:14,fontWeight:700,marginBottom:6}}>Set PIN for {confirmSetPin.name}</div>
          <div style={{fontSize:12,color:"rgba(255,255,255,0.45)",marginBottom:14,lineHeight:1.6}}>Enter a new PIN (4+ digits). The player can then log into the main app with it.</div>
          <input className="inp" type="text" inputMode="numeric" value={newPinVal} onChange={e=>setNewPinVal(e.target.value.replace(/[^0-9]/g,""))} placeholder="New PIN (4\u20135 digits)" autoFocus style={{marginBottom:6,fontSize:18,textAlign:"center",letterSpacing:"0.2em"}}/>
          {(()=>{const v=String(newPinVal||"");if(v.length<4)return null;const hit=Object.entries(rosterPins||{}).find(([pid,pv])=>String(pid)!==String(confirmResetPin&&confirmResetPin.id)&&String(pv)===v);if(!hit)return null;const who=(all||[]).find(p=>String(p.id)===String(hit[0]));return(<div style={{fontSize:11,fontWeight:600,color:"#fbbf24",background:"rgba(245,158,11,0.08)",border:"1px solid rgba(245,158,11,0.15)",borderRadius:8,padding:"6px 10px",marginBottom:10}}>⚠ Already <b>{who?who.name:"another member"}</b>’s PIN — try the last 5 of the phone.</div>);})()}
          <div style={{display:"flex",gap:8}}>
            <button className="btn btn-g" style={{flex:1}} onClick={()=>setPin(confirmSetPin.id,newPinVal)} disabled={!newPinVal||newPinVal.length<4}>Set PIN</button>
            <button className="btn btn-gh" style={{flex:1}} onClick={()=>{setConfirmSetPin(null);setNewPinVal("");}}>Cancel</button>
          </div>
        </div>
      </div>
    )}
      </div>);
}

// ── ACCESS TAB (role management + portal users) ──────────────────────────────
function AccessTab({user}){
  const extra=useDB("extraPlayers");
  const rosterEdits=useDB("rosterEdits");
  const rosterAdmins=useDB("rosterAdmins");
  const portalUsers=useDB("settings/portalUsers");
  const portalPasswords=useDB("settings/portalPasswords");
  const [adminQ,setAdminQ]=useState("");
  const [section,setSection]=useState("app");
  const portalPerms=useDB("settings/portalPerms");
  const canSee=k=>isMaster(user.role)||((portalPerms&&portalPerms[k])===true);
  const [newPU,setNewPU]=useState({name:"",email:"",role:"superadmin",password:""});
  const [addingPU,setAddingPU]=useState(false);
  const [confirmRemoveAdmin,setConfirmRemoveAdmin]=useState(null);
  const [confirmRemovePU,setConfirmRemovePU]=useState(null);
  const [editPwId,setEditPwId]=useState(null);
  const [editPwVal,setEditPwVal]=useState("");
  const [toast,showToast]=useToast();

  const all=useMemo(()=>{
    const base=ROSTER.map(p=>({...p,name:(rosterEdits&&rosterEdits[p.id])||p.name}));
    const ex=Object.values(extra||{});
    return[...base,...ex].sort((a,b)=>a.name.localeCompare(b.name));
  },[extra,rosterEdits]);

  const admins=all.filter(p=>rosterAdmins&&rosterAdmins[p.id]).map(p=>({...p,role:rosterAdmins[p.id]})).sort((a,b)=>(ROLE_LEVELS[b.role]||0)-(ROLE_LEVELS[a.role]||0));
  const adminSearch=all.filter(p=>adminQ&&p.name.toLowerCase().includes(adminQ.toLowerCase())&&!(rosterAdmins&&rosterAdmins[p.id])).slice(0,6);
  const portalUserList=Object.entries(portalUsers||{}).map(([k,v])=>({...v,_key:k}));

  function changeRole(id,newRole){
    wr("rosterAdmins/"+id,newRole);
    // If downgrading from admin to scoring, remove portal password
    if(newRole==="scoring"){dl("settings/portalPasswords/"+id);}
    showToast("Role updated ✓");
  }
  function removeAdmin(p){
    if(p.role==="master"){showToast("Can't remove master","err");return;}
    dl("rosterAdmins/"+p.id);
    dl("settings/portalPasswords/"+p.id);
    setConfirmRemoveAdmin(null);
    showToast("Admin removed ✓");
  }
  function savePortalPw(id){
    if(editPwVal.length<6){showToast("Password must be 6+ characters","err");return;}
    wr("settings/portalPasswords/"+id,editPwVal);
    setEditPwId(null);setEditPwVal("");
    showToast("Portal password set ✓");
  }
  function clearPortalPw(id){
    dl("settings/portalPasswords/"+id);
    showToast("Portal password removed ✓");
  }
  function grantAdmin(id){
    wr("rosterAdmins/"+id,"scoring");
    setAdminQ("");
    showToast("Added as Scoring Admin — change role above if needed ✓");
  }
  function addPortalUser(){
    if(!newPU.name||!newPU.email||newPU.email.indexOf("@")<1){showToast("Name and a valid email required","err");return;}
    if(!newPU.password||newPU.password.length<6){showToast("Password required — 6+ characters (Firebase minimum)","err");return;}
    const em=newPU.email.trim();
    let sec;
    try{sec=firebase.app("pwmgr");}catch(e){sec=firebase.initializeApp(FB,"pwmgr");}
    sec.auth().createUserWithEmailAndPassword(em,newPU.password).then(()=>{
      return sec.auth().signOut();
    }).then(()=>{
      ps("settings/portalUsers",{name:newPU.name,email:em,role:newPU.role||"superadmin"});
      setNewPU({name:"",email:"",role:"superadmin",password:""});
      setAddingPU(false);
      showToast("Portal account created ✓ — they can sign in now");
    }).catch(err=>{
      if(err&&err.code==="auth/email-already-in-use"){
        ps("settings/portalUsers",{name:newPU.name,email:em,role:newPU.role||"superadmin"});
        setNewPU({name:"",email:"",role:"superadmin",password:""});
        setAddingPU(false);
        showToast("Account already existed — registered here with the chosen role ✓");
      } else {
        showToast("Couldn't create account: "+((err&&err.message)||err),"err");
      }
    });
  }
  function removePortalUser(pu){
    dl("settings/portalUsers/"+pu._key);
    setConfirmRemovePU(null);
    showToast("Portal user removed ✓");
  }

  return(<div>
    <Toast msg={toast.msg} type={toast.type}/>
    <div className="pg-eyebrow">Admin</div>
    <div className="pg-title">Access Management</div>
    <div className="pg-sub">Designate admin roles — easy on/off</div>

    <div className="info-box"><strong>Player PINs are managed in the Roster tab.</strong> Use this page to control who has admin access and what level.</div>

    {/* ── ROLE LEGEND ── */}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:16}}>
      {[
        {role:"master",emoji:"⭐",title:"Master",desc:"Full access everywhere",count:admins.filter(a=>a.role==="master").length},
        {role:"admin",emoji:"🛡️",title:"Super Admin",desc:"Manage days, teams, roster",count:admins.filter(a=>a.role==="admin").length},
        {role:"scoring",emoji:"📊",title:"Scoring",desc:"Enter scores, publish results",count:admins.filter(a=>a.role==="scoring").length},
      ].map(({role,emoji,title,desc,count})=>{
        const c=ROLE_COLORS[role];
        return(
          <div key={role} style={{background:c.bg,border:"1px solid "+c.border,borderRadius:10,padding:"12px 10px",textAlign:"center"}}>
            <div style={{fontSize:20,marginBottom:4}}>{emoji}</div>
            <div style={{fontFamily:"Barlow Condensed,sans-serif",fontSize:22,fontWeight:800,color:c.color}}>{count}</div>
            <div style={{fontSize:11,fontWeight:700,color:c.color}}>{title}</div>
            <div style={{fontSize:9,color:"rgba(255,255,255,0.35)",marginTop:2,lineHeight:1.4}}>{desc}</div>
          </div>
        );
      })}
    </div>

    {isMaster(user.role)&&(
      <div className="card" style={{marginBottom:14}}>
        <div className="card-hdr"><span className="card-title">👁 Optional extra access for Super Admins</span><span style={{fontSize:10,color:"rgba(255,255,255,0.35)",marginLeft:10}}>Master only</span></div>
        <div style={{padding:"10px 14px"}}>
          <div style={{fontSize:11.5,color:"rgba(255,255,255,0.5)",lineHeight:1.6,marginBottom:10}}>Super Admins already see their standard set. Everything below is <strong>off by default</strong> — switch on only what you want to hand them. Visibility, never control: roles, adds &amp; removals stay yours. <strong>Portal access is per person:</strong> create their login under Portal Users, then tick <strong>App door</strong> on their row to show the Admin Portal link in their app. Off by default.</div>
          {[
            ["Portal menu items (your Master Only group)", ALL_NAV_ITEMS.filter(n=>n.master).map(n=>[n.id, n.label])],
            ["Inside the Access tab", [["portalUsers","See the Portal Users list &amp; send password resets (create / role / remove stay Master)"]]],
          ].map(([group,rows])=>(
            <div key={group} style={{marginBottom:10}}>
              <div style={{fontSize:10,fontWeight:800,color:"rgba(255,255,255,0.35)",textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:4}}>{group}</div>
              {rows.map(([k,label])=>(
                <label key={k} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 0",borderBottom:"1px solid rgba(255,255,255,0.05)",cursor:"pointer",fontSize:12.5,color:"rgba(255,255,255,0.75)"}}>
                  <input type="checkbox" checked={(portalPerms&&portalPerms[k])===true} onChange={e=>wr("settings/portalPerms/"+k,e.target.checked?true:null)} style={{width:17,height:17,flexShrink:0}}/>
                  <span dangerouslySetInnerHTML={{__html:label}}/>
                </label>
              ))}
            </div>
          ))}
        </div>
      </div>
    )}

    {canSee("portalUsers")&&(
      <div className="sec-tabs">
        {[["app","🛡️ App Admins"],["portal","🔑 Portal Users"]].map(([id,label])=>(
          <button key={id} className={`mtab${section===id?" on":""}`} style={{fontSize:12}} onClick={()=>setSection(id)}>{label}</button>
        ))}
      </div>
    )}

    {section==="app"&&(<div>
      {/* ── ADD AN ADMIN ── */}
      <div className="card">
        <div className="card-hdr"><span className="card-title">+ Add Admin</span></div>
        <div className="card-body">
          <div className="lbl">Search player to add</div>
          <input className="inp" placeholder="Type a name…" value={adminQ} onChange={e=>setAdminQ(e.target.value)}/>
          {adminSearch.length>0&&(
            <div style={{marginTop:8,border:"1px solid rgba(255,255,255,0.08)",borderRadius:8}}>
              {adminSearch.map(p=>(
                <div key={p.id} style={{display:"flex",alignItems:"center",padding:"9px 12px",gap:8,borderBottom:"1px solid rgba(255,255,255,0.04)"}}>
                  <span style={{flex:1,fontSize:13,fontWeight:500,color:"#e2e8f0"}}>{p.name}</span>
                  <button className="btn btn-g btn-sm" onClick={()=>grantAdmin(p.id)}>+ Add as Scoring Admin</button>
                </div>
              ))}
            </div>
          )}
          {adminQ&&adminSearch.length===0&&<div style={{marginTop:6,fontSize:12,color:"rgba(255,255,255,0.3)"}}>No matches (or already an admin)</div>}
          <div style={{fontSize:10,color:"rgba(255,255,255,0.25)",marginTop:8,lineHeight:1.6}}>New admins are added as Scoring Admin by default. Change their role to Super Admin in the list above.</div>
        </div>
      </div>

      {/* ── CURRENT ADMINS — each with independent role dropdown ── */}
      <div className="card" style={{marginTop:12}}>
        <div className="card-hdr"><span className="card-title">Current Admins ({admins.length})</span></div>
        {admins.length===0&&<div style={{padding:"14px 16px",fontSize:12,color:"rgba(255,255,255,0.3)"}}>No admins yet. Use the search above to add someone.</div>}
        {admins.map(p=>{
          const isMasterP=p.role==="master";
          const isSuperAdmin=p.role==="admin";
          const c=ROLE_COLORS[p.role]||ROLE_COLORS.scoring;
          const hasPw=!!(portalPasswords&&portalPasswords[p.id]);
          const isEditingPw=editPwId===p.id;
          return(
            <div key={p.id} style={{borderBottom:"1px solid rgba(255,255,255,0.04)"}}>
              <div style={{display:"flex",alignItems:"center",gap:10,padding:"12px 16px"}}>
                {/* Name */}
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:14,fontWeight:600,color:"#e2e8f0",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</div>
                </div>
                {/* Independent role selector per person */}
                {isMasterP?(
                  <span style={{fontSize:11,fontWeight:700,padding:"5px 12px",borderRadius:20,background:c.bg,border:"1px solid "+c.border,color:c.color,whiteSpace:"nowrap"}}>⭐ Master</span>
                ):(
                  <select value={p.role} onChange={e=>changeRole(p.id,e.target.value)}
                    style={{padding:"6px 10px",borderRadius:8,border:"1.5px solid "+c.border,background:c.bg,color:c.color,fontSize:12,fontWeight:700,fontFamily:"DM Sans,sans-serif",cursor:"pointer",outline:"none",minWidth:145}}>
                    <option value="admin">🛡️ Super Admin</option>
                    <option value="scoring">📊 Scoring Admin</option>
                  </select>
                )}
                {/* Remove */}
                {!isMasterP&&(
                  <button onClick={()=>setConfirmRemoveAdmin(p)} style={{background:"none",border:"1px solid rgba(239,68,68,0.2)",borderRadius:6,padding:"5px 9px",color:"#f87171",fontSize:10,fontWeight:700,cursor:"pointer",fontFamily:"DM Sans,sans-serif",flexShrink:0}}>✕ Remove</button>
                )}
              </div>
              {/* Portal password — Super Admins only */}
              {isSuperAdmin&&(
                <div style={{padding:"0 16px 12px"}}>
                  {isEditingPw?(
                    <div style={{display:"flex",gap:6,alignItems:"center"}}>
                      <input className="inp" type="password" placeholder="6+ characters" value={editPwVal} onChange={e=>setEditPwVal(e.target.value)} onKeyDown={e=>e.key==="Enter"&&savePortalPw(p.id)} style={{flex:1,fontSize:12,padding:"7px 10px"}} autoFocus/>
                      <button className="btn btn-g btn-sm" onClick={()=>savePortalPw(p.id)} disabled={editPwVal.length<6} style={{opacity:editPwVal.length<6?0.4:1}}>Save</button>
                      <button className="btn btn-gh btn-sm" onClick={()=>{setEditPwId(null);setEditPwVal("");}}>Cancel</button>
                    </div>
                  ):(
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      {hasPw?(
                        <>
                          <span style={{fontSize:11,fontWeight:600,color:"#34d399",display:"flex",alignItems:"center",gap:4}}>
                            <span style={{width:6,height:6,borderRadius:"50%",background:"#34d399",display:"inline-block"}}></span>
                            Portal password set
                          </span>
                          <button onClick={()=>{setEditPwId(p.id);setEditPwVal("");}} style={{fontSize:10,fontWeight:600,color:"rgba(255,255,255,0.4)",background:"none",border:"none",cursor:"pointer",fontFamily:"DM Sans,sans-serif"}}>Change</button>
                          <button onClick={()=>clearPortalPw(p.id)} style={{fontSize:10,fontWeight:600,color:"#f87171",background:"none",border:"none",cursor:"pointer",fontFamily:"DM Sans,sans-serif"}}>Remove</button>
                        </>
                      ):(
                        <button onClick={()=>{setEditPwId(p.id);setEditPwVal("");}} style={{fontSize:11,fontWeight:600,color:"#60a5fa",background:"rgba(59,130,246,0.08)",border:"1px solid rgba(59,130,246,0.2)",borderRadius:6,padding:"5px 12px",cursor:"pointer",fontFamily:"DM Sans,sans-serif"}}>🔑 Set portal password</button>
                      )}
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>)}

    {section==="portal"&&canSee("portalUsers")&&(<div>
      <div className="info-box"><strong>Portal Users</strong> can sign into this portal with a password. Master has full access; Super Admins manage games and rosters.</div>
      <div className="card">
        <div className="card-hdr">
          <span className="card-title">Portal Users ({portalUserList.length})</span><span style={{fontSize:10,color:"rgba(255,255,255,0.35)",marginLeft:10}}>You set the first password · changes go by reset email · App door = shows the portal link in their app</span>
          {isMaster(user.role)&&<button className="btn btn-g btn-sm" onClick={()=>setAddingPU(v=>!v)}>{addingPU?"Cancel":"+ Add User"}</button>}
        </div>
        {addingPU&&(
          <div style={{padding:"12px 14px",background:"rgba(16,185,129,0.04)",borderBottom:"1px solid rgba(255,255,255,0.05)"}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
              <input className="inp" placeholder="Name" value={newPU.name} onChange={e=>setNewPU(p=>({...p,name:e.target.value}))}/>
              <input className="inp" placeholder="Email (required for portal sign-in)" value={newPU.email} onChange={e=>setNewPU(p=>({...p,email:e.target.value}))}/>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr auto auto",gap:8}}>
              <input className="inp" type="password" placeholder="Password (6+ chars — you set it, they can change it later)" value={newPU.password} onChange={e=>setNewPU(p=>({...p,password:e.target.value}))}/>
              <select className="inp" style={{width:"auto"}} value={newPU.role} onChange={e=>setNewPU(p=>({...p,role:e.target.value}))}>
                <option value="superadmin">Super Admin</option>
              </select>
              <button className="btn btn-g btn-sm" onClick={addPortalUser}>Add</button>
            </div>
          </div>
        )}
        {portalUserList.length===0&&<div style={{padding:"14px 16px",fontSize:12,color:"rgba(255,255,255,0.3)"}}>No portal users added yet. You access via master password.</div>}
        {portalUserList.map(pu=>(
          <div key={pu._key} className="p-row">
            <div style={{flex:1}}>
              <div className="p-name">{pu.name}</div>
              {pu.email&&<div className="p-sub">{pu.email}</div>}
            </div>
            {isMaster(user.role)&&pu.email&&(
              <label title="Show the Admin Portal door on this person’s Admin tab in the app" style={{display:"flex",alignItems:"center",gap:6,marginRight:10,fontSize:11,fontWeight:700,color:pu.appDoor===true?"#4ade80":"rgba(255,255,255,0.4)",cursor:"pointer",whiteSpace:"nowrap"}}>
                <input type="checkbox" checked={pu.appDoor===true} onChange={e=>wr("settings/portalUsers/"+pu._key+"/appDoor",e.target.checked?true:null)} style={{width:16,height:16}}/>
                App door
              </label>
            )}
            {canSee("portalUsers")&&pu.email&&(
              <button className="btn btn-sm" style={{fontSize:10.5,color:"#60a5fa",borderColor:"rgba(59,130,246,0.3)",marginRight:6}} onClick={()=>{
                auth.sendPasswordResetEmail(pu.email).then(()=>showToast("Reset email sent to "+pu.email+" ✓")).catch(err=>showToast("Reset failed: "+((err&&err.message)||err),"err"));
              }}>🔑 Send password reset</button>
            )}
            {isMaster(user.role)?(
              <select className="inp" style={{width:"auto",padding:"4px 8px",fontSize:11}} value={pu.role||"superadmin"} onChange={e=>wr("settings/portalUsers/"+pu._key+"/role",e.target.value)}>
                <option value="superadmin">Super Admin</option>
                <option value="master">⭐ Master</option>
              </select>
            ):(

// ── ATTEND TAB (matches main app: attendance/rounds = array of {date, players[]}) ──
// ── VERBATIM COPY of the app's Standings leaderboard maths — do not "improve" it.
function moneyLeaderboard(rounds){
    const safeArray=x=>Array.isArray(x)?x:Object.values(x||{});
    const normName=n=>{if(!n)return"";return String(n).trim().replace(/\s+/g," ").split(" ").map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(" ");};
    const players = {};
    rounds.forEach(r=>{
      // ── Individual (Stableford) rounds: paid from buy-in, winnings from the
      //    round's own computed awards + skins awards. Team math never runs.
      if(r.scores.gameMode==='individual'){
        const buyIn=parseFloat(r.scores.buyIn)||25;
        Object.keys(r.scores.indScores||{}).forEach(nm=>{
          const pn=normName(nm);
          if(!players[pn])players[pn]={name:pn,rounds:0,won:0,paid:0};
          players[pn].rounds++; players[pn].paid+=buyIn;
        });
        safeArray(r.scores.awards).forEach(a=>{const pn=normName(a&&a.name);if(players[pn])players[pn].won+=(parseFloat(a.amount)||0);});
        safeArray(r.scores.skinsAwards).forEach(a=>{const pn=normName(a&&a.name);if(players[pn])players[pn].won+=(parseFloat(a.amount)||0);});
        return;
      }
      safeArray(r.teams).forEach(team=>{
        safeArray(team.players).forEach(p=>{
          const pn = normName(p&&p.name);
          if(!pn) return;
          if(!players[pn]) players[pn]={name:pn,rounds:0,won:0,paid:0};
          players[pn].rounds++;
          players[pn].paid+=25;
        });
      });
      [{seg:'front',pot:r.scores.frontPot,pl:r.scores.frontPlaces||1,k1:'f1',k2:'f2'},
       {seg:'back',pot:r.scores.backPot,pl:r.scores.backPlaces||1,k1:'b1',k2:'b2'},
       {seg:'overall',pot:r.scores.overallPot,pl:r.scores.overallPlaces||1,k1:'o1',k2:'o2'}
      ].forEach(({seg,pot:segPot,pl,k1,k2})=>{
        const p=parseFloat(segPot||0); if(!p)return;
        const sc=safeArray(r.teams).map(t=>({...t,score:parseFloat((r.scores.teamScores&&r.scores.teamScores[t.id]?r.scores.teamScores[t.id][seg]:NaN))})).filter(t=>!isNaN(t.score));
        if(!sc.length)return;
        sc.sort((a,b)=>a.score-b.score);
        const best=sc[0].score;
        const tied1st=sc.filter(t=>t.score===best);
        const secondScore=sc.find(t=>t.score!==best)?.score;
        const tied2nd=secondScore!==undefined?sc.filter(t=>t.score===secondScore):[];
        const c1=r.scores[k1]?parseFloat(r.scores[k1]):0;
        const c2=r.scores[k2]?parseFloat(r.scores[k2]):0;
        const first=c1>0?c1:(pl===1?p:p*0.6);
        const sec=c2>0?c2:p*0.4;
        if(tied1st.length>1){
          const split=Math.floor(pl===1?p/tied1st.length:(first+sec)/tied1st.length);
          tied1st.forEach(t=>safeArray(t.players).forEach(px=>{if(players[normName(px&&px.name)])players[normName(px&&px.name)].won+=split/safeArray(t.players).length;}));
        } else {
          safeArray(tied1st[0].players).forEach(px=>{if(players[normName(px&&px.name)])players[normName(px&&px.name)].won+=Math.floor(first)/safeArray(tied1st[0].players).length;});
          if(pl===2&&tied2nd.length>0){
            const split2=Math.floor(sec/tied2nd.length);
            tied2nd.forEach(t=>safeArray(t.players).forEach(px=>{if(players[normName(px&&px.name)])players[normName(px&&px.name)].won+=split2/safeArray(t.players).length;}));
          }
        }
      });
      const snet=Math.max(0,parseFloat(r.scores.skinsPot||0)-(r.scores.tournFund||0));
      const tsk=Object.values(r.scores.skinCounts||{}).reduce((s,x)=>s+x,0);
      if(tsk>0){
        const psk=Math.floor(snet/tsk);
        Object.entries(r.scores.skinCounts||{}).forEach(([tid,cnt])=>{
          if(!cnt)return;
          const team=safeArray(r.teams).find(t=>String(t.id)===String(tid)); if(!team)return;
          safeArray(team.players).forEach(px=>{if(players[normName(px&&px.name)])players[normName(px&&px.name)].won+=(psk*cnt)/safeArray(team.players).length;});
        });
      }
    });
    return Object.values(players).map(p=>({...p,won:Math.round(p.won),net:Math.round(p.won-p.paid),returnPct:p.paid>0?Math.round(p.won/p.paid*100):0}));
  }

function AwardsTab({user}){
  const history=useDB("history");
  const attendance=useDB("attendance/rounds");
  const season=useDB("settings/season");
  const saved=useDB("awards");
  const signupLog=useDB("stats/signupLog");
  const guestLog=useDB("stats/guestLog");
  const [toast,showToast]=useToast();
  const [edits,setEdits]=useState({});
  const [customs,setCustoms]=useState([]);
  const [srcFilter,setSrcFilter]=useState("all");
  const [openId,setOpenId]=useState(null);
  const year=String((season&&season.endDate?season.endDate:new Date().toISOString().slice(0,10)).slice(0,4));
  const published=!!(saved&&saved[year]&&saved[year].published);

  const rounds=React.useMemo(()=>Object.values(history||{}).filter(r=>r&&r.scores&&(r.teams||r.scores.gameMode==="individual")),[history]);
  const inSeason=r=>!(season&&season.endDate&&String(r.date||"")>season.endDate);

  // ── compute everything once ──
  const S=React.useMemo(()=>{
    const P={};
    const normName=n=>{if(!n)return"";return String(n).trim().replace(/\s+/g," ").split(" ").map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(" ");};
    const get=n=>{const k=normName(n);if(!k)return null;if(!P[k])P[k]={name:k,rounds:0,won:0,skins:0,firsts:0,seconds:0,partners:new Set(),bestF:null,bestB:null,bestO:null,worstF:null,worstB:null,worstO:null,winRounds:0,silverRounds:0,guestsBrought:0,guestNames:new Set(),hcpLog:[],firstTee:0,lastTee:0,prefRounds:0};return P[k];};
    const teamRows=[];
    rounds.filter(inSeason).forEach(r=>{
      const scI=r.scores||{};
      if(scI.gameMode==="individual"){
        const buyIn=parseFloat(scI.buyIn)||25;
        Object.keys(scI.indScores||{}).forEach(nm=>{const p=get(nm);if(p){p.rounds++;}});
        
        
        return;
      }
      const teams=Array.isArray(r.teams)?r.teams:Object.values(r.teams||{});
      const sc=r.scores||{};const ts=sc.teamScores||{};
      const rowsR=teams.map((t,ti)=>{
        const plist=Object.values(t.players||{});
        plist.forEach(pp=>{if(pp&&pp.isGuest&&pp.guestOf){const h=get(pp.guestOf);if(h){h.guestsBrought++;h.guestNames.add(String(pp.name||"").trim());}}});
        plist.forEach(pp=>{
          if(!pp||!pp.name)return;
          const pr=get(pp.name);if(!pr)return;
          const hc=parseFloat(pp.handicap);
          if(!isNaN(hc)&&hc>0){pr.hcpLog.push({date:r.date||"",hcp:hc});}
          if(pp.teePreference==="first")pr.firstTee++;
          if(pp.teePreference==="last")pr.lastTee++;
          pr.prefRounds++;
        });
        const players=plist.map(p=>p&&p.name).filter(Boolean);
        const raw=ts[t.id]||ts[ti]||ts[String(ti)]||{};
        const num=v=>{const n2=parseFloat(v);return isNaN(n2)?null:n2;};
        const f=num(raw.front),b=num(raw.back),o=num(raw.overall);
        return {ti,id:t.id,players,f,b,tot:o!=null?o:((f!=null&&b!=null)?f+b:null),date:r.date,day:r.day};
      });
      rowsR.forEach(x=>{x.players.forEach(n=>{const p=get(n);if(!p)return;p.rounds++;x.players.forEach(o=>{if(o!==n)p.partners.add(o);});});});
      teamRows.push(...rowsR.filter(x=>x.tot!=null||x.f!=null||x.b!=null));
      // ── money: faithful port of the app's Standings maths ──
      const roundWinners=new Set(), roundSeconds=new Set();
      const segs=[{seg:"f",pot:sc.frontPot,pl:sc.frontPlaces||1,k1:"f1",k2:"f2"},
                  {seg:"b",pot:sc.backPot,pl:sc.backPlaces||1,k1:"b1",k2:"b2"},
                  {seg:"tot",pot:sc.overallPot,pl:sc.overallPlaces||1,k1:"o1",k2:"o2"}];
      segs.forEach(({seg,pot,pl,k1,k2})=>{
        const p0=parseFloat(pot||0);if(!p0)return;
        const list=rowsR.filter(x=>x[seg]!=null).sort((x,y)=>x[seg]-y[seg]);
        if(!list.length)return;
        const best=list[0][seg];const tied1=list.filter(x=>x[seg]===best);
        const secondScore=(list.find(x=>x[seg]!==best)||{})[seg];
        const tied2=secondScore!==undefined?list.filter(x=>x[seg]===secondScore):[];
        const c1=parseFloat(sc[k1]||0),c2=parseFloat(sc[k2]||0);
        const first=c1>0?c1:(pl===1?p0:p0*0.6);const sec=c2>0?c2:p0*0.4;
        if(tied1.length>1){
          const split=Math.floor(pl===1?p0/tied1.length:(first+sec)/tied1.length);
          tied1.forEach(x=>x.players.forEach(nm=>{const p=get(nm);if(p){roundWinners.add(p.name);}}));
        } else {
          tied1.forEach(x=>x.players.forEach(nm=>{const p=get(nm);if(p){roundWinners.add(p.name);}}));
          if(pl===2&&tied2.length){
            const split2=Math.floor(sec/tied2.length);
            tied2.forEach(x=>x.players.forEach(nm=>{const p=get(nm);if(p){roundSeconds.add(p.name);}}));
          }
        }
      });
      const snet=Math.max(0,parseFloat(sc.skinsPot||0)-(parseFloat(sc.tournFund)||0));
      const tsk=Object.values(sc.skinCounts||{}).reduce((s2,x)=>s2+(parseInt(x)||0),0);
      if(tsk>0){
        const psk=Math.floor(snet/tsk);
        Object.entries(sc.skinCounts||{}).forEach(([tid,cnt])=>{
          const n2=parseInt(cnt)||0;if(!n2)return;
          const team=rowsR.find(x=>String(x.id)===String(tid))||rowsR[Number(tid)];
          if(!team||!team.players.length)return;
          team.players.forEach(nm=>{const p=get(nm);if(p){p.skins+=n2;}});
        });
      }
      // one placement per ROUND, not per category
      roundWinners.forEach(nm=>{const p=get(nm);if(p)p.winRounds++;});
      roundSeconds.forEach(nm=>{if(roundWinners.has(nm))return;const p=get(nm);if(p)p.silverRounds++;});

    });
    // money comes from the app's own leaderboard code, not a re-implementation
    const money={};moneyLeaderboard(rounds.filter(inSeason)).forEach(m=>{money[m.name]=m;});
    const arr=Object.values(P).map(p=>{const m=money[p.name]||{won:0,paid:0,net:0,rounds:0};const gross=Math.round(m.won);const paid=Math.round(m.paid||0);return {...p,partners:p.partners.size,gross,paid,won:gross,net:Math.round(gross-paid),moneyRounds:m.rounds||0,returnPct:paid>0?Math.round(gross/paid*100):0};});
    const attRounds=attendance?(Array.isArray(attendance)?attendance:Object.values(attendance)):[];
    const attIn=attRounds.filter(inSeason);
    const attBy={};attIn.forEach(r=>((r.players)||[]).forEach(n=>{const k=normName(n);if(k)attBy[k]=(attBy[k]||0)+1;}));
    arr.forEach(p=>{p.attend=attBy[p.name]||p.rounds;});
    Object.keys(attBy).forEach(n=>{if(!arr.find(p=>p.name===n))arr.push({name:n,rounds:0,won:0,skins:0,firsts:0,seconds:0,partners:0,spent:attBy[n]*25,net:-attBy[n]*25,attend:attBy[n]});});
    // sign-up order + guests
    const gl=Object.values(guestLog||{});const gby={};gl.forEach(x=>{const k=normName(x&&x.host);if(k)gby[k]=(gby[k]||0)+(Number(x.count)||1);});
    const sl=Object.values(signupLog||{}).filter(x=>x&&x.name);
    const ord={};sl.forEach(x=>{const k=String(x.name).trim();if(!ord[k])ord[k]={n:0,sum:0};ord[k].n++;ord[k].sum+=Number(x.order)||0;});
    const anyTeamGuests=Object.values(P).some(p=>p.guestsBrought>0);
    arr.forEach(p=>{const o=ord[p.name];p.avgOrder=o&&o.n?Math.round((o.sum/o.n)*10)/10:null;p.signupCount=o?o.n:0;p.guests=anyTeamGuests?(p.guestsBrought||0):(gby[p.name]||0);p.guestPeople=p.guestNames?p.guestNames.size:0;
      const lg=(p.hcpLog||[]).slice().sort((x,y)=>String(x.date).localeCompare(String(y.date)));
      if(lg.length>=4){p.hcpFirst=lg[0].hcp;p.hcpLast=lg[lg.length-1].hcp;p.hcpMove=Math.round((p.hcpLast-p.hcpFirst)*10)/10;p.hcpPoints=lg.length;}
      else {p.hcpFirst=null;p.hcpLast=null;p.hcpMove=null;p.hcpPoints=lg.length;}
      p.firstPct=p.prefRounds>=5?Math.round((p.firstTee/p.prefRounds)*100):null;
      p.lastPct=p.prefRounds>=5?Math.round((p.lastTee/p.prefRounds)*100):null;});
    const weeks=new Set(attIn.map(r=>r.date)).size;
    return {players:arr,teamRows,weeks};
  },[rounds,attendance,signupLog,guestLog,season]);

  const top=(key,dir,filter)=>{const l=S.players.filter(p=>(filter?filter(p):true)&&p[key]!=null).sort((a,b)=>dir==="asc"?a[key]-b[key]:b[key]-a[key]);return l;};
  const teamTop=(key,dir)=>S.teamRows.filter(x=>x[key]!=null).sort((a,b)=>dir==="asc"?a[key]-b[key]:b[key]-a[key]);
  const rel=v=>v===0?"E":(v>0?"+"+v:String(v));
  const nameList=x=>x.players.join(" & ");

  const AWARDS=[
    {id:"ironman",src:"full",icon:"🏋️",title:"The Iron Man",blurb:"Showed up more than anyone. The backbone of the fund.",board:top("attend","desc",p=>p.attend>0).slice(0,5).map(p=>({name:p.name,detail:p.attend+" rounds"}))},
    {id:"money",src:"full",icon:"💰",title:"Money List Champion (Gross)",blurb:"Took home more cash than any man in the group — total winnings, before what he paid in.",board:top("gross","desc",p=>p.gross>0).slice(0,5).map(p=>({name:p.name,detail:"$"+p.gross+" won"}))},
    {id:"net",src:"full",icon:"📈",title:"Best Net — Up on the Year",blurb:"Won more than he paid in. Everyone else funded this.",board:top("net","desc",p=>p.attend>=5).slice(0,5).map(p=>({name:p.name,detail:(p.net>=0?"+$":"-$")+Math.abs(p.net)+" net · $"+p.gross+" of $"+p.paid+" in"}))},
    {id:"skins",src:"full",icon:"🔪",title:"The Skinner",blurb:"Cut the pot to ribbons. Most skins won all season.",board:top("skins","desc",p=>p.skins>0).slice(0,5).map(p=>({name:p.name,detail:p.skins+" skins"}))},
    {id:"donor",src:"full",icon:"🩸",title:"Most Generous Donor",blurb:"Lost the most money this season — paid in far more than he took home. We thank you for your service.",board:top("net","asc",p=>p.attend>=5).slice(0,5).map(p=>({name:p.name,detail:"$"+Math.abs(p.net)+" down · $"+p.gross+" won of $"+p.paid+" in"}))},
    {id:"bridesmaid",src:"full",icon:"💐",title:"Always the Bridesmaid",blurb:"Runner-up more than anyone, and walked away with nothing those days.",board:S.players.filter(p=>p.silverRounds>0).sort((a,b)=>(b.silverRounds-b.winRounds)-(a.silverRounds-a.winRounds)||b.silverRounds-a.silverRounds).slice(0,5).map(p=>({name:p.name,detail:p.silverRounds+" runner-up round"+(p.silverRounds===1?"":"s")+" · "+p.winRounds+" win"+(p.winRounds===1?"":"s")+" in "+p.rounds}))},
    {id:"social",src:"full",icon:"🤝",title:"The Social Butterfly",blurb:"Played with more different partners than anyone.",board:top("partners","desc",p=>p.partners>0).slice(0,5).map(p=>({name:p.name,detail:p.partners+" partners"}))},
    {id:"perfect",src:"full",icon:"📅",title:"Perfect Attendance",blurb:"Never missed. Not once.",board:S.players.filter(p=>S.weeks>0&&p.attend>=S.weeks).sort((a,b)=>b.attend-a.attend).slice(0,5).map(p=>({name:p.name,detail:p.attend+" of "+S.weeks+" weeks"}))},
    {id:"early",src:"new",icon:"🐓",title:"First Man In",blurb:"Signs up before the ink is dry.",board:top("avgOrder","asc",p=>p.signupCount>=3).slice(0,5).map(p=>({name:p.name,detail:"avg #"+p.avgOrder+" to sign up"}))},
    {id:"late",src:"new",icon:"🐌",title:"The Procrastinator",blurb:"Always last. Always squeezing in.",board:top("avgOrder","desc",p=>p.signupCount>=3).slice(0,5).map(p=>({name:p.name,detail:"avg #"+p.avgOrder+" to sign up"}))},
    {id:"host",src:"full",icon:"🚪",title:"The Ambassador",blurb:"Brought more guests out to play than anyone.",board:top("guests","desc",p=>p.guests>0).slice(0,5).map(p=>({name:p.name,detail:p.guests+" guest round"+(p.guests===1?"":"s")+((p.guestPeople&&p.guestPeople!==p.guests)?(" · "+p.guestPeople+" different guests"):"")}))},
    {id:"improved",src:"full",icon:"📉",title:"Most Improved",blurb:"Handicap dropped further than anyone\u2019s. The work is showing.",board:top("hcpMove","asc",p=>p.hcpMove!=null&&p.hcpMove<0).slice(0,5).map(p=>({name:p.name,detail:p.hcpFirst+" → "+p.hcpLast+" ("+p.hcpMove+")"}))},
    {id:"wrongway",src:"full",icon:"📈",title:"Going the Wrong Way",blurb:"Handicap climbed all season. It happens to the best of us. Allegedly.",board:top("hcpMove","desc",p=>p.hcpMove!=null&&p.hcpMove>0).slice(0,5).map(p=>({name:p.name,detail:p.hcpFirst+" → "+p.hcpLast+" (+"+p.hcpMove+")"}))},
    {id:"firstoff",src:"full",icon:"🌄",title:"Always First Off",blurb:"Asks for the first tee time more than anyone. Somewhere to be.",board:top("firstTee","desc",p=>p.firstTee>0).slice(0,5).map(p=>({name:p.name,detail:p.firstTee+" request"+(p.firstTee===1?"":"s")+(p.firstPct!=null?(" · "+p.firstPct+"% of his rounds"):"")}))},
    {id:"lastoff",src:"full",icon:"🌆",title:"Always Last Off",blurb:"Never in a hurry. Wants the last group, every time.",board:top("lastTee","desc",p=>p.lastTee>0).slice(0,5).map(p=>({name:p.name,detail:p.lastTee+" request"+(p.lastTee===1?"":"s")+(p.lastPct!=null?(" · "+p.lastPct+"% of his rounds"):"")}))},
    {id:"bestfront",src:"full",icon:"🌅",title:"Best Front Nine",blurb:"The lowest front nine any team posted all season.",board:teamTop("f","asc").slice(0,5).map(x=>({name:nameList(x),detail:rel(x.f)+" · "+x.date}))},
    {id:"bestback",src:"full",icon:"🌇",title:"Best Back Nine",blurb:"The lowest back nine of the year.",board:teamTop("b","asc").slice(0,5).map(x=>({name:nameList(x),detail:rel(x.b)+" · "+x.date}))},
    {id:"bestday",src:"full",icon:"👑",title:"Round of the Year",blurb:"The best eighteen anybody played together.",board:teamTop("tot","asc").slice(0,5).map(x=>({name:nameList(x),detail:rel(x.tot)+" · "+x.date}))},
    {id:"worstfront",src:"full",icon:"🧨",title:"Worst Front Nine",blurb:"It happens to everyone. It happened most to these two.",board:teamTop("f","desc").slice(0,5).map(x=>({name:nameList(x),detail:rel(x.f)+" · "+x.date}))},
    {id:"worstback",src:"full",icon:"🕳️",title:"Worst Back Nine",blurb:"The wheels came off after the turn.",board:teamTop("b","desc").slice(0,5).map(x=>({name:nameList(x),detail:rel(x.b)+" · "+x.date}))},
    {id:"worstday",src:"full",icon:"🔥",title:"Round Best Forgotten",blurb:"Eighteen holes nobody wants to relive.",board:teamTop("tot","desc").slice(0,5).map(x=>({name:nameList(x),detail:rel(x.tot)+" · "+x.date}))},
  ];

  const val=(id,field,dflt)=>{const e=edits[id]||{};if(e[field]!=null)return e[field];const sv=saved&&saved[year]&&saved[year].items&&saved[year].items[id];if(sv&&sv[field]!=null)return sv[field];return dflt;};
  const setVal=(id,field,v)=>setEdits(d=>({...d,[id]:{...(d[id]||{}),[field]:v}}));
  const winnerOf=a=>val(a.id,"winner",(a.board[0]&&a.board[0].name)||"");
  const detailOf=a=>val(a.id,"detail",(a.board[0]&&a.board[0].detail)||"");
  const included=a=>val(a.id,"on",a.board.length>0&&a.src!=="new")!==false;

  const allItems=()=>{
    const items={};
    AWARDS.filter(included).filter(a=>winnerOf(a)).forEach(a=>{items[a.id]={icon:val(a.id,"icon",a.icon),title:val(a.id,"title",a.title),blurb:val(a.id,"blurb",a.blurb),winner:winnerOf(a),detail:detailOf(a)};});
    customs.forEach((c,i2)=>{if(c.title&&c.winner)items["custom"+i2]={icon:c.icon||"🏅",title:c.title,blurb:c.blurb||"",winner:c.winner,detail:c.detail||""};});
    return items;
  };
  const saveDraft=()=>{wr("awards/"+year,{year:year,published:published,items:allItems(),updatedAt:Date.now(),by:(user&&user.email)||"master"});showToast("Draft saved ✓");};
  const publish=(on)=>{const items=allItems();wr("awards/"+year,{year:year,published:on,items:items,updatedAt:Date.now(),by:(user&&user.email)||"master"});showToast(on?"Awards published to the app ✓":"Saved — not visible to members");};
  const copyEmail=()=>{
    const items=allItems();
    const L=[];L.push("CLARK GOLF GROUP — "+year+" SEASON AWARDS");L.push("");
    Object.values(items).forEach(it=>{L.push(it.icon+"  "+it.title.toUpperCase());L.push("    "+it.winner+(it.detail?("  ("+it.detail+")"):""));if(it.blurb)L.push("    "+it.blurb);L.push("");});
    navigator.clipboard.writeText(L.join("\n")).then(()=>showToast("Awards copied — paste into the email ✓"));
  };

  return(
    <div className="main">
      <Toast msg={toast.msg} type={toast.type}/>
      <div className="pg-eyebrow">Season</div>
      <div className="pg-title">Awards</div>
      <div className="pg-sub">Every board below is computed from this season&rsquo;s rounds. Edit the titles, override a winner, add your own — then publish to the app or copy for the email.</div>

      <div className="card" style={{marginBottom:16,borderColor:published?"rgba(16,185,129,0.35)":"rgba(255,255,255,0.08)"}}>
        <div className="card-hdr"><span className="card-title">{published?"🟢 Published — members can see the Awards page":"🔒 Draft — nobody but you can see this"}</span></div>
        <div style={{padding:"12px 14px",display:"flex",gap:8,flexWrap:"wrap"}}>
          <button className="btn btn-sm" onClick={saveDraft}>💾 Save draft</button>
          <button className="btn btn-g btn-sm" onClick={()=>publish(true)}>{published?"Update published awards":"🏆 Publish to the app"}</button>
          {published&&<button className="btn btn-gh btn-sm" onClick={()=>publish(false)}>Unpublish</button>}
          <button className="btn btn-sm" onClick={copyEmail}>📋 Copy for email</button>
          <span style={{fontSize:11,color:"rgba(255,255,255,0.35)",alignSelf:"center"}}>{S.players.length} players · {S.weeks} weeks scored</span>
        </div>
      </div>

      {(()=>{
        const nFull=AWARDS.filter(x=>x.src==="full").length, nNew=AWARDS.filter(x=>x.src==="new").length;
        const logStart=(()=>{const all=Object.values(signupLog||{}).map(x=>x&&x.ts).filter(Boolean);if(!all.length)return null;const d=new Date(Math.min.apply(null,all));return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});})();
        return (
          <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center",marginBottom:14}}>
            <span style={{fontSize:9.5,fontWeight:800,color:"rgba(255,255,255,0.3)",textTransform:"uppercase",letterSpacing:"0.06em"}}>Show</span>
            {[["all","Everything",AWARDS.length],["full","✅ Full season data",nFull],["new","🌱 Tracking just started",nNew]].map(([v,label,n])=>(
              <button key={v} onClick={()=>setSrcFilter(v)} style={{padding:"6px 12px",borderRadius:9,border:"1px solid",borderColor:srcFilter===v?"#10b981":"rgba(255,255,255,0.12)",background:srcFilter===v?"rgba(16,185,129,0.12)":"transparent",color:srcFilter===v?"#4ade80":"rgba(255,255,255,0.5)",fontWeight:800,fontSize:11.5,cursor:"pointer"}}>{label} ({n})</button>
            ))}
            <div style={{flexBasis:"100%",fontSize:11,color:"rgba(255,255,255,0.4)",lineHeight:1.6,marginTop:2}}>
              <b style={{color:"rgba(255,255,255,0.7)"}}>✅ Full season</b> — every scored round and attendance day this season. <b style={{color:"rgba(255,255,255,0.7)"}}>🌱 Just started</b> — sign-up order and guests only began recording {logStart?("on "+logStart):"very recently"}, so they are partial and are left out by default. Turn them on next season.
            </div>
          </div>
        );
      })()}
      {AWARDS.filter(x=>srcFilter==="all"||x.src===srcFilter).map(a=>{
        const isOpen=openId===a.id;
        const w=winnerOf(a), d=detailOf(a);
        return (
        <div key={a.id} className="card" style={{marginBottom:10,opacity:included(a)?1:0.45,borderColor:isOpen?"rgba(16,185,129,0.35)":"rgba(255,255,255,0.08)"}}>
          <div onClick={()=>setOpenId(isOpen?null:a.id)} style={{display:"flex",alignItems:"center",gap:12,padding:"14px 16px",cursor:"pointer"}}>
            <span style={{fontSize:26,lineHeight:1,flexShrink:0}}>{val(a.id,"icon",a.icon)}</span>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:"flex",alignItems:"center",gap:7,flexWrap:"wrap"}}>
                <span style={{fontSize:14.5,fontWeight:800,color:"#e2e8f0"}}>{val(a.id,"title",a.title)}</span>
                {a.src==="new"&&<span style={{fontSize:8.5,fontWeight:800,padding:"2px 6px",borderRadius:20,background:"rgba(251,191,36,0.14)",color:"#fbbf24",whiteSpace:"nowrap"}}>JUST STARTED</span>}
                {!included(a)&&<span style={{fontSize:8.5,fontWeight:800,padding:"2px 6px",borderRadius:20,background:"rgba(255,255,255,0.06)",color:"rgba(255,255,255,0.4)"}}>NOT INCLUDED</span>}
              </div>
              {w?(
                <div style={{marginTop:3,display:"flex",alignItems:"baseline",gap:8,flexWrap:"wrap"}}>
                  <span style={{fontSize:17,fontWeight:900,color:"#4ade80",letterSpacing:"-0.01em"}}>{w}</span>
                  {d&&<span style={{fontSize:12.5,color:"rgba(255,255,255,0.45)"}}>{d}</span>}
                </div>
              ):(
                <div style={{marginTop:3,fontSize:12.5,color:"rgba(255,255,255,0.3)"}}>{a.board.length?"No winner picked yet":"No data yet"}</div>
              )}
            </div>
            <span style={{fontSize:16,color:"rgba(255,255,255,0.3)",flexShrink:0}}>{isOpen?"▴":"▾"}</span>
          </div>
          {isOpen&&(
            <div style={{padding:"0 16px 16px",borderTop:"1px solid rgba(255,255,255,0.06)"}}>
              <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",margin:"12px 0"}}>
                <input className="inp" style={{width:60,textAlign:"center",fontSize:19,padding:"6px"}} value={val(a.id,"icon",a.icon)} onChange={e=>setVal(a.id,"icon",e.target.value)}/>
                <input className="inp" style={{flex:"1 1 220px",fontWeight:800,fontSize:14,padding:"8px 10px"}} value={val(a.id,"title",a.title)} onChange={e=>setVal(a.id,"title",e.target.value)}/>
                <label style={{fontSize:12.5,fontWeight:700,color:included(a)?"#4ade80":"rgba(255,255,255,0.35)",display:"flex",alignItems:"center",gap:6,cursor:"pointer",whiteSpace:"nowrap"}}>
                  <input type="checkbox" checked={included(a)} onChange={e=>setVal(a.id,"on",e.target.checked)} style={{width:17,height:17}}/>include
                </label>
              </div>
              <input className="inp" style={{width:"100%",fontSize:13,padding:"8px 10px",marginBottom:12}} value={val(a.id,"blurb",a.blurb)} onChange={e=>setVal(a.id,"blurb",e.target.value)} placeholder="One line of trash talk…"/>
              {a.board.length===0?(
                <div style={{fontSize:13,color:"rgba(255,255,255,0.3)"}}>No data for this one yet — it fills in as rounds are scored.</div>
              ):(
                <div>
                  <div style={{fontSize:10,fontWeight:800,color:"rgba(255,255,255,0.3)",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:6}}>Leaderboard — tap to crown</div>
                  {a.board.map((b2,bi)=>{
                    const on=w===b2.name;
                    return (
                    <div key={bi} onClick={()=>{setVal(a.id,"winner",b2.name);setVal(a.id,"detail",b2.detail);}} style={{display:"flex",gap:10,alignItems:"center",padding:"8px 10px",borderRadius:9,cursor:"pointer",marginBottom:3,background:on?"rgba(16,185,129,0.12)":"rgba(255,255,255,0.02)",border:"1px solid "+(on?"rgba(16,185,129,0.3)":"transparent")}}>
                      <span style={{fontSize:11,fontWeight:800,color:on?"#4ade80":"rgba(255,255,255,0.25)",width:18}}>{bi+1}</span>
                      <span style={{flex:1,fontSize:14,color:on?"#4ade80":"rgba(255,255,255,0.8)",fontWeight:on?800:600}}>{b2.name}</span>
                      <span style={{fontSize:12.5,color:"rgba(255,255,255,0.45)",textAlign:"right"}}>{b2.detail}</span>
                    </div>);
                  })}
                  <div style={{display:"flex",gap:8,marginTop:10,flexWrap:"wrap"}}>
                    <input className="inp" style={{flex:"1 1 170px",fontSize:13,padding:"8px 10px"}} value={w} onChange={e=>setVal(a.id,"winner",e.target.value)} placeholder="Winner"/>
                    <input className="inp" style={{flex:"1 1 140px",fontSize:13,padding:"8px 10px"}} value={d} onChange={e=>setVal(a.id,"detail",e.target.value)} placeholder="Detail"/>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>);
      })}

      <div className="card" style={{marginBottom:24}}>
        <div className="card-hdr"><span className="card-title">🏅 Your own awards</span><button className="btn btn-g btn-sm" onClick={()=>setCustoms(c=>[...c,{icon:"🏅",title:"",blurb:"",winner:"",detail:""}])}>+ Add award</button></div>
        <div style={{padding:"10px 14px"}}>
          {customs.length===0?<div style={{fontSize:12,color:"rgba(255,255,255,0.3)"}}>For the ones only you two would think of.</div>:customs.map((c,ci)=>(
            <div key={ci} style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:8,paddingBottom:8,borderBottom:"1px solid rgba(255,255,255,0.05)"}}>
              <input className="inp" style={{width:52,textAlign:"center",fontSize:15,padding:"5px"}} value={c.icon} onChange={e=>setCustoms(l=>l.map((x,i2)=>i2===ci?{...x,icon:e.target.value}:x))}/>
              <input className="inp" style={{flex:"1 1 150px",fontSize:12,padding:"5px 8px"}} placeholder="Award name" value={c.title} onChange={e=>setCustoms(l=>l.map((x,i2)=>i2===ci?{...x,title:e.target.value}:x))}/>
              <input className="inp" style={{flex:"1 1 130px",fontSize:12,padding:"5px 8px"}} placeholder="Winner" value={c.winner} onChange={e=>setCustoms(l=>l.map((x,i2)=>i2===ci?{...x,winner:e.target.value}:x))}/>
              <input className="inp" style={{flex:"1 1 100%",fontSize:12,padding:"5px 8px"}} placeholder="Why he won it…" value={c.blurb} onChange={e=>setCustoms(l=>l.map((x,i2)=>i2===ci?{...x,blurb:e.target.value}:x))}/>
              <button className="btn btn-r btn-sm" onClick={()=>setCustoms(l=>l.filter((_,i2)=>i2!==ci))}>Remove</button>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function AttendTab({user}){
  const rosterEdits=useDB("rosterEdits");
  const extra=useDB("extraPlayers");
  const rawRounds=useDB("attendance/rounds");
  const [section,setSection]=useState("history");
  const [toast,showToast]=useToast();
  const [openRound,setOpenRound]=useState(null);
  const [logModal,setLogModal]=useState(false);
  const [editRound,setEditRound]=useState(null); // {index, data}
  const [confirmDel,setConfirmDel]=useState(null);
  const [delTyped,setDelTyped]=useState("");
  const [search,setSearch]=useState("");

  // Normalize: Firebase may store as array or object
  const rounds=useMemo(()=>{
    if(!rawRounds)return[];
    const arr=Array.isArray(rawRounds)?rawRounds:Object.values(rawRounds);
    return arr.filter(r=>r&&r.date).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  },[rawRounds]);

  const allPlayers=useMemo(()=>{
    const base=ROSTER.map(p=>({...p,name:(rosterEdits&&rosterEdits[p.id])||p.name}));
    const ex=Object.values(extra||{});
    return[...base,...ex].sort((a,b)=>a.name.localeCompare(b.name));
  },[extra,rosterEdits]);

  // Standings data
  const standings=useMemo(()=>{
    const p={};
    rounds.forEach(r=>{(r.players||[]).forEach(raw=>{
      const name=normName(raw);
      if(!p[name])p[name]={name,rounds:0,dates:[]};
      p[name].rounds++;p[name].dates.push(r.date);
    });});
    return Object.values(p).sort((a,b)=>b.rounds-a.rounds);
  },[rounds]);

  const totalEntries=rounds.reduce((s,r)=>s+(r.players||[]).length,0);

  function saveRounds(newRounds){
    const sorted=[...newRounds].sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    wr("attendance/rounds",sorted);
  }

  function deleteRound(index){
    if(delTyped!=="DELETE"){showToast('Type "DELETE" to confirm',"err");return;}
    const updated=rounds.filter((_,i)=>i!==index);
    saveRounds(updated);
    setConfirmDel(null);setDelTyped("");setOpenRound(null);
    showToast("Round deleted ✓");
  }

  // ── LOG/EDIT MODAL (multi-select players, matches main app exactly) ──
  function LogModal({editData,onSave,onClose}){
    const[date,setDate]=useState(editData?editData.date:new Date().toISOString().split("T")[0]);
    const[selected,setSelected]=useState(new Set(editData?editData.players:[]));
    const[q,setQ]=useState("");
    const[guestName,setGuestName]=useState("");
    const allNames=allPlayers.map(r=>r.name).sort((a,b)=>a.localeCompare(b));
    const extraGuests=[...selected].filter(n=>!allNames.includes(n));
    const filtered=allNames.filter(n=>n.toLowerCase().includes(q.toLowerCase()));
    function toggle(name){const s=new Set(selected);if(s.has(name))s.delete(name);else s.add(name);setSelected(s);}
    function addGuest(){if(!guestName.trim())return;const s=new Set(selected);s.add(guestName.trim());setSelected(s);setGuestName("");}
    return(
      <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
        <div className="modal">
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
            <div style={{fontSize:16,fontWeight:700,color:"#e2e8f0"}}>{editData?"Edit Round":"Log a Round"}</div>
            <button onClick={onClose} style={{width:28,height:28,borderRadius:"50%",border:"1px solid rgba(255,255,255,0.15)",background:"rgba(255,255,255,0.06)",cursor:"pointer",color:"rgba(255,255,255,0.5)",fontSize:16,lineHeight:1}}>✕</button>
          </div>
          <div style={{marginBottom:12}}>
            <div className="lbl">Date</div>
            <input className="inp" type="date" value={date} onChange={e=>setDate(e.target.value)}/>
          </div>
          <div style={{marginBottom:12}}>
            <div className="lbl">Players ({selected.size} selected)</div>
            <div style={{position:"relative",marginBottom:6}}>
              <input className="inp" style={{paddingLeft:12,fontSize:13}} placeholder="Search roster..." value={q} onChange={e=>setQ(e.target.value)}/>
            </div>
            <div style={{maxHeight:240,overflowY:"auto",border:"1px solid rgba(255,255,255,0.08)",borderRadius:8,marginBottom:8}}>
              {/* Extra guests (names not in roster) */}
              {extraGuests.map(name=>(
                <div key={name} onClick={()=>toggle(name)} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 11px",borderBottom:"1px solid rgba(255,255,255,0.04)",cursor:"pointer",background:"rgba(16,185,129,0.12)"}}>
                  <div style={{width:16,height:16,borderRadius:4,background:"#10b981",border:"2px solid #10b981",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg></div>
                  <span style={{fontSize:12,fontWeight:500,flex:1,color:"#e2e8f0"}}>{name}</span>
                  <span style={{fontSize:10,color:"rgba(255,255,255,0.3)",background:"rgba(255,255,255,0.06)",padding:"1px 6px",borderRadius:10}}>Guest</span>
                </div>
              ))}
              {/* Roster players */}
              {filtered.map(name=>{const on=selected.has(name);return(
                <div key={name} onClick={()=>toggle(name)} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 11px",borderBottom:"1px solid rgba(255,255,255,0.04)",cursor:"pointer",background:on?"rgba(16,185,129,0.08)":"transparent"}}>
                  <div style={{width:16,height:16,borderRadius:4,border:"2px solid",borderColor:on?"#10b981":"rgba(255,255,255,0.2)",background:on?"#10b981":"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{on&&<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg>}</div>
                  <span style={{fontSize:12,fontWeight:500,color:"#e2e8f0"}}>{name}</span>
                </div>
              );})}
            </div>
            <div style={{display:"flex",gap:6}}>
              <input className="inp" style={{flex:1,fontSize:12}} placeholder="Add guest name..." value={guestName} onChange={e=>setGuestName(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addGuest();}}/>
              <button className="btn btn-gh btn-sm" onClick={addGuest} disabled={!guestName.trim()}>+ Guest</button>
            </div>
          </div>
          <button className="btn btn-g btn-full" style={{opacity:(!date||selected.size===0)?0.4:1,marginTop:8}} disabled={!date||selected.size===0}
            onClick={()=>{if(!date||selected.size===0)return;onSave({date,players:[...selected].sort()});onClose();}}>
            {editData?"Save Changes":"Log Round ("+selected.size+" players)"}
          </button>
        </div>
      </div>
    );
  }

  return(<div>
    <Toast msg={toast.msg} type={toast.type}/>
    <div className="pg-eyebrow">Tracking</div>
    <div className="pg-title">Attendance</div>
    <div className="pg-sub">{rounds.length} round{rounds.length!==1?"s":""} · {standings.length} unique players · ${totalEntries} to tournament fund</div>

    <div className="sec-tabs">
      {[["standings","📊 Standings"],["history","📋 History"]].map(([id,label])=>(
        <button key={id} className={`mtab${section===id?" on":""}`} style={{fontSize:12}} onClick={()=>setSection(id)}>{label}</button>
      ))}
    </div>

    {/* ── STANDINGS ── */}
    {section==="standings"&&(
      <div>
        <div className="stat-grid sg-4" style={{marginBottom:14}}>
          <div className="stat"><div className="stat-v" style={{color:"#10b981"}}>{standings.length}</div><div className="stat-l">Players</div></div>
          <div className="stat"><div className="stat-v" style={{color:"#60a5fa"}}>{rounds.length}</div><div className="stat-l">Rounds</div></div>
          <div className="stat"><div className="stat-v" style={{color:"#a78bfa"}}>{standings.length>0?standings[0].rounds:0}</div><div className="stat-l">Top Played</div></div>
          <div className="stat"><div className="stat-v" style={{color:"#fbbf24"}}>${totalEntries}</div><div className="stat-l">Tourn Fund</div></div>
        </div>

        <div className="card">
          <div className="srch"><input className="inp" placeholder="🔍 Search players..." value={search} onChange={e=>setSearch(e.target.value)}/></div>
          {standings.filter(p=>!search||p.name.toLowerCase().includes(search.toLowerCase())).length===0&&(
            <div style={{padding:"20px 16px",fontSize:12,color:"rgba(255,255,255,0.3)",textAlign:"center"}}>No attendance data yet. Rounds are logged when weeks are closed out.</div>
          )}
          {standings.filter(p=>!search||p.name.toLowerCase().includes(search.toLowerCase())).map((p,i)=>{
            const maxR=standings[0]?.rounds||1;
            return(
              <div key={p.name} className="s-row">
                <div style={{width:22,height:22,borderRadius:"50%",background:i<3?"#f59e0b":"rgba(255,255,255,0.08)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:800,color:i<3?"#1e293b":"rgba(255,255,255,0.4)",flexShrink:0,fontFamily:"Barlow Condensed,sans-serif"}}>{i+1}</div>
                <span style={{flex:1,fontSize:13,fontWeight:600,color:"#e2e8f0"}}>{p.name}</span>
                <div style={{width:50,height:5,background:"rgba(255,255,255,0.07)",borderRadius:3,overflow:"hidden",flexShrink:0}}>
                  <div style={{height:5,background:"#10b981",borderRadius:3,width:Math.round((p.rounds/maxR)*100)+"%"}}/>
                </div>
                <span style={{fontFamily:"Barlow Condensed,sans-serif",fontSize:18,fontWeight:700,color:"#a78bfa",width:28,textAlign:"right",flexShrink:0}}>{p.rounds}</span>
              </div>
            );
          })}
        </div>
      </div>
    )}

    {/* ── HISTORY (rounds list — matches main app) ── */}
    {section==="history"&&(
      <div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <div className="lbl" style={{marginBottom:0}}>{rounds.length} round{rounds.length!==1?"s":""}</div>
          <button className="btn btn-g btn-sm" onClick={()=>{setEditRound(null);setLogModal(true);}}>+ Log Round</button>
        </div>

        {rounds.length===0&&<div className="info-box"><strong>No rounds logged yet.</strong> Rounds are added automatically when you close out a week, or you can log one manually.</div>}

        {rounds.map((r,ri)=>{
          const players=r.players||[];
          const isOpen=openRound===ri;
          return(
            <div key={r.date+"-"+ri} className="card" style={{marginBottom:8}}>
              <div onClick={()=>setOpenRound(isOpen?null:ri)} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"11px 16px",cursor:"pointer"}}>
                <div>
                  <div style={{fontSize:14,fontWeight:700,color:"#e2e8f0"}}>{fmtD(r.date)}</div>
                  <div style={{fontSize:11,color:"rgba(255,255,255,0.3)",marginTop:1}}>{players.length} player{players.length!==1?"s":""} · ${players.length} to pot</div>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:5}}>
                  <span style={{fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:20,background:"#10b981",color:"#fff"}}>{players.length}</span>
                  <span style={{fontSize:12,color:"rgba(255,255,255,0.2)",transform:isOpen?"rotate(180deg)":"none",transition:"transform 0.2s",display:"inline-block"}}>▾</span>
                </div>
              </div>
              {isOpen&&(
                <div style={{borderTop:"1px solid rgba(255,255,255,0.05)"}}>
                  <div style={{padding:"8px 16px"}}>
                    {players.map((name,pi)=>(
                      <div key={name} style={{display:"flex",alignItems:"center",gap:7,padding:"5px 0",borderBottom:pi<players.length-1?"1px solid rgba(255,255,255,0.04)":"none",fontSize:13,fontWeight:500,color:"#e2e8f0"}}>
                        <span style={{width:18,height:18,borderRadius:"50%",background:"rgba(255,255,255,0.06)",color:"rgba(255,255,255,0.4)",fontSize:9,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontFamily:"Barlow Condensed,sans-serif"}}>{pi+1}</span>
                        {name}
                      </div>
                    ))}
                  </div>
                  <div style={{borderTop:"1px solid rgba(255,255,255,0.05)",padding:"8px 16px",display:"flex",gap:6,justifyContent:"flex-end"}}>
                    <button className="btn btn-gh btn-xs" onClick={e=>{e.stopPropagation();setEditRound({index:ri,data:r});setLogModal(true);}}>Edit</button>
                    <button className="btn btn-r btn-xs" onClick={e=>{e.stopPropagation();setConfirmDel({index:ri,round:r});setDelTyped("");}}>Delete</button>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    )}

    {/* ── LOG/EDIT MODAL ── */}
    {logModal&&<LogModal
      editData={editRound?editRound.data:null}
      onSave={data=>{
        if(editRound){
          const updated=[...rounds];
          updated[editRound.index]=data;
          saveRounds(updated);
          showToast("Round updated ✓");
        }else{
          saveRounds([...rounds,data]);
          showToast("Round logged — "+data.players.length+" players ✓");
        }
        setEditRound(null);
      }}
      onClose={()=>{setLogModal(false);setEditRound(null);}}
    />}

    {/* ── DELETE CONFIRM ── */}
    {confirmDel&&(
      <div className="overlay">
        <div className="modal">
          <div style={{fontSize:14,fontWeight:700,marginBottom:5,color:"#f87171"}}>Delete Attendance Round</div>
          <div style={{fontSize:13,fontWeight:600,marginBottom:2}}>{fmtD(confirmDel.round.date)}</div>
          <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginBottom:16}}>{(confirmDel.round.players||[]).length} players</div>
          <div style={{fontSize:12,color:"rgba(255,255,255,0.45)",marginBottom:8}}>Type <strong style={{color:"#fca5a5"}}>DELETE</strong> to confirm:</div>
          <input className="inp" value={delTyped} onChange={e=>setDelTyped(e.target.value)} placeholder='Type "DELETE"' style={{marginBottom:14}} autoFocus/>
          <div style={{display:"flex",gap:8}}>
            <button className="btn btn-r" style={{flex:1}} onClick={()=>deleteRound(confirmDel.index)} disabled={delTyped!=="DELETE"}>Delete Forever</button>
            <button className="btn btn-gh" style={{flex:1}} onClick={()=>{setConfirmDel(null);setDelTyped("");}}>Cancel</button>
          </div>
        </div>
      </div>
    )}
  </div>);
}

// ── APP SETTINGS TAB (global app behavior) ──────────────────────────────
function AppSettingsTab({user}){
  const gameRules=useDB("settings/gameRules");
  const settings=useDB("settings");
  const [toast,showToast]=useToast();
  const sr=gameRules?.signupRules||{};
  const pushTrig=useDB("settings/pushTriggers")||{};
  const pushTmpl=useDB("settings/pushTemplates")||{};
  const [tmplOpen,setTmplOpen]=React.useState(null);
  const [tmplT,setTmplT]=React.useState("");
  const [tmplB,setTmplB]=React.useState("");
  const [msT,setMsT]=React.useState("");
  const [msB,setMsB]=React.useState("");
  const [msA,setMsA]=React.useState("admins");
  const [msSent,setMsSent]=React.useState("");
  const PUSH_DEFAULTS={publish:{title:"Teams/Groups for {day} are out!",body:"See your team or group and tee-off order."},results:{title:"\u26f3 {day} results are in!",body:"Payouts and the leaderboard are posted — tap to see how you did."},cancel:{title:"\ud83c\udf27 {day} is cancelled",body:"{reason} — sign-ups for {day} have been cleared."},join:{title:"New join request",body:"{name} wants to join Clark Golf Group."},drops:{title:"⚠ Post-publish drop",body:"{name} dropped {day} after teams were published."},waitlist:{title:"\u23f3 Waitlist: {name}",body:"{name} joined the {day} waitlist."},weekready:{title:"\u26f3 New week is up — sign-ups open!",body:"This week: {day}. Tap to sign up."},teetime:{title:"\ud83d\udd50 {day} tee time is set!",body:"{day} tees off at {time}."}};
  const maxGuests=settings?.maxGuests??3;
  function toggleRule(key){
    const cur=sr[key]!==false;
    wr("settings/gameRules/signupRules/"+key,!cur);
    showToast(!cur?"Enabled ✓":"Disabled ✓");
  }
  return(<div>
    <Toast msg={toast.msg} type={toast.type}/>
    <div className="pg-eyebrow">Configuration</div>
    <div className="pg-title">App Settings</div>
    <div className="pg-sub">Global settings that apply to every day and every week. More settings will land here as the app grows.</div>
    {user&&user.role==="master"&&(()=>{
      const [codeDraft,setCodeDraft]=React.useState(null);
      const cur=(settings&&settings.guestCode)||"";
      const val=codeDraft==null?cur:codeDraft;
      return (
        <div className="card">
          <div className="card-hdr"><span className="card-title">👀 Preview (view-only) code</span><span style={{fontSize:10,color:"rgba(255,255,255,0.35)",marginLeft:10}}>Master only</span></div>
          <div style={{padding:"12px 14px"}}>
            <div style={{fontSize:11.5,color:"rgba(255,255,255,0.5)",lineHeight:1.6,marginBottom:10}}>Lets someone tour the real app without a login. They tap <strong>Preview the app</strong> on the sign-in screen and enter this code. Preview mode is read-only at the plumbing — every save, sign-up, RSVP and push is disabled, and a banner says so. Clear the code to switch the option off entirely. Each preview sign-in is noted in the activity log.</div>
            <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
              <input className="inp" style={{width:180,fontFamily:"monospace",letterSpacing:"0.08em"}} placeholder="e.g. TOUR2026" value={val} onChange={e=>setCodeDraft(e.target.value)}/>
              <button className="btn btn-sm" disabled={codeDraft==null||codeDraft.trim()===cur} onClick={()=>{wr("settings/guestCode",codeDraft.trim()||null);setCodeDraft(null);showToast(codeDraft.trim()?"Preview code saved ✓":"Preview option turned off");}}>Save</button>
              {cur&&<button className="btn btn-sm btn-ghost" onClick={()=>{if(window.confirm("Turn off the preview option? The code stops working immediately."))wr("settings/guestCode",null);setCodeDraft(null);}}>Turn off</button>}
              <span style={{fontSize:11,color:cur?"#4ade80":"rgba(255,255,255,0.3)",fontWeight:700}}>{cur?"● On":"○ Off"}</span>
            </div>
          </div>
        </div>
      );
    })()}
    <div className="card">
      <div className="card-hdr"><span className="card-title">🔔 Automatic Push Notifications</span></div>
      <div className="info-box"><strong>Control which events buzz phones automatically.</strong> Applies to everyone with notifications on. Manual pushes and checked announcements always send.</div>
      <div className="card">
        {(()=>{const pt=pushTrig;return [
          {key:"publish",label:"Teams / groups published",sub:"Sent to everyone"},
          {key:"results",label:"Results posted",sub:"Sent to everyone"},
          {key:"cancel",label:"Day cancelled",sub:"Sent to everyone"},
          {key:"join",label:"New join request",sub:"Sent to admins"},
          {key:"drops",label:"Post-publish drop-out",sub:"Sent to admins"},
          {key:"waitlist",label:"Waitlist join",sub:"Sent to admins"},
          {key:"weekready",label:"Week announced (manual button in app)",sub:"Sent to everyone"},
          {key:"teetime",label:"Tee time set (lottery \u2192 actual only)",sub:"Sent to everyone"},
        ].map(({key,label,sub})=>{
          const on=pt[key]!==false;
          return(
            <div key={key} className="s-row" style={{gap:12}}>
              <div onClick={()=>wr("settings/pushTriggers/"+key,on?false:null)} style={{width:36,height:20,borderRadius:20,background:on?"#10b981":"rgba(255,255,255,0.15)",position:"relative",cursor:"pointer",flexShrink:0,transition:"background 0.2s"}}>
                <div style={{position:"absolute",top:2,left:on?18:2,width:16,height:16,borderRadius:"50%",background:"#fff",transition:"left 0.2s"}}/>
              </div>
              <div style={{flex:1}}>
                <div style={{fontSize:13.5,fontWeight:600,color:"#e2e8f0"}}>{label}</div>
                <div style={{fontSize:11,color:"rgba(255,255,255,0.4)"}}>{sub}</div>
              </div>
              {on&&(
                <select value={(pt[key]==="all"||pt[key]==="admins")?pt[key]:""} onChange={e=>wr("settings/pushTriggers/"+key,e.target.value||null)}
                  style={{background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.12)",borderRadius:8,padding:"5px 8px",color:"#e2e8f0",fontFamily:"inherit",fontSize:11,outline:"none"}}>
                  <option value="">Default</option>
                  <option value="all">Everyone</option>
                  <option value="admins">Admins only</option>
                </select>
              )}
              <button className="btn btn-sm btn-ghost" style={{fontSize:11}} onClick={()=>{if(tmplOpen===key){setTmplOpen(null);}else{setTmplOpen(key);const t=pushTmpl[key]||{};const d=PUSH_DEFAULTS[key]||{};setTmplT(t.title||d.title||"");setTmplB(t.body||d.body||"");}}}>{tmplOpen===key?"Close":"\u270f\ufe0f Edit text"}</button>
            </div>
          );
        });})()}
        {tmplOpen&&(()=>{const def=({publish:{title:"Teams/Groups for {day} are out!",body:"See your team or group and tee-off order."},results:{title:"\u26f3 {day} results are in!",body:"Payouts and the leaderboard are posted — tap to see how you did."},cancel:{title:"\ud83c\udf27 {day} is cancelled",body:"{reason} — sign-ups for {day} have been cleared."},join:{title:"New join request",body:"{name} wants to join Clark Golf Group."},drops:{title:"⚠ Post-publish drop",body:"{name} dropped {day} after teams were published."},waitlist:{title:"\u23f3 Waitlist: {name}",body:"{name} joined the {day} waitlist."},weekready:{title:"\u26f3 New week is up — sign-ups open!",body:"This week: {day}. Tap to sign up."},teetime:{title:"\ud83d\udd50 {day} tee time is set!",body:"{day} tees off at {time}."}})[tmplOpen]||{};return(
          <div style={{margin:"10px 0",padding:"12px",background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:10}}>
            <div style={{fontSize:11,fontWeight:700,color:"rgba(255,255,255,0.6)",marginBottom:8}}>\u270f\ufe0f Custom text — blank fields use the default. Tokens: <code style={{color:"#4ade80"}}>{"{day}"}</code> <code style={{color:"#4ade80"}}>{"{name}"}</code> <code style={{color:"#4ade80"}}>{"{reason}"}</code> <code style={{color:"#4ade80"}}>{"{time}"}</code></div>
            <div className="lbl">Title</div>
            <input className="inp" placeholder={def.title} value={tmplT} onChange={e=>setTmplT(e.target.value)} style={{marginBottom:8}}/>
            <div className="lbl">Message</div>
            <input className="inp" placeholder={def.body} value={tmplB} onChange={e=>setTmplB(e.target.value)} style={{marginBottom:10}}/>
            <div style={{fontSize:10.5,color:"rgba(255,255,255,0.35)",marginBottom:10}}>Keep the {"{curly}"} tokens where you want live values — {"{day}"}, {"{time}"}, {"{name}"}, {"{reason}"} fill in automatically when the push sends.</div>
            <div style={{display:"flex",gap:8}}>
              <button className="btn btn-sm btn-ghost" onClick={()=>{wr("settings/pushTemplates/"+tmplOpen,null);setTmplT(def.title||"");setTmplB(def.body||"");}}>↺ Reset to default</button>
              <button className="btn btn-sm" style={{flex:1}} onClick={()=>{const t=tmplT.trim(),b=tmplB.trim();const ct=(t&&t!==def.title)?t:null;const cb=(b&&b!==def.body)?b:null;wr("settings/pushTemplates/"+tmplOpen,(ct||cb)?{title:ct,body:cb}:null);setTmplOpen(null);}}>Save text</button>
            </div>
          </div>
        );})()}
        {/* portal manual sender */}
        <div style={{marginTop:14,padding:"12px",background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:10}}>
          <div style={{fontSize:11,fontWeight:700,color:"rgba(255,255,255,0.6)",marginBottom:8}}>📤 Send a push notification</div>
          <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",lineHeight:1.6,marginBottom:8}}>Sends a buzz straight to members’ phones — nothing is posted inside the app. Good for quick heads-ups like frost delays, reminders, or “spots open Saturday.” Pick who receives it below; “Admins only” is your safe test channel.</div>
          <input className="inp" placeholder="Title (short!)" maxLength={50} value={msT} onChange={e=>{setMsT(e.target.value);setMsSent("");}} style={{marginBottom:8}}/>
          <input className="inp" placeholder="Message" maxLength={140} value={msB} onChange={e=>{setMsB(e.target.value);setMsSent("");}} style={{marginBottom:10}}/>
          <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
            <select className="inp" style={{maxWidth:160}} value={msA} onChange={e=>setMsA(e.target.value)}>
              <option value="admins">Admins only (test)</option>
              <option value="all">Everyone</option>
            </select>
            <button className="btn btn-sm" disabled={!msT.trim()||!msB.trim()} onClick={()=>{
              fetch("/api/notify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key:"cgg-notify-2026",project:IS_PROD_HOST?"prod":"test",audience:msA,title:msT.trim(),body:msB.trim(),url:"/",tag:"manual-"+Date.now()})}).catch(()=>{});
              setMsSent("Sent to "+(msA==="admins"?"admins":"everyone")+" with notifications on.");setMsT("");setMsB("");
            }}>Send push</button>
            {msSent&&<span style={{fontSize:11,color:"#4ade80",fontWeight:600}}>{msSent}</span>}
          </div>
        </div>
      </div>
    </div>
    <div className="card">
      <div className="card-hdr"><span className="card-title">Sign-up Rules</span></div>
