          <div style={{fontSize:12,color:"rgba(255,255,255,0.45)",marginBottom:14,lineHeight:1.6}}>Enter a new PIN (4+ digits). The player can then log into the main app with it.</div>
          <input className="inp" type="text" inputMode="numeric" value={newPinVal} onChange={e=>setNewPinVal(e.target.value.replace(/[^0-9]/g,""))} placeholder="New PIN" autoFocus style={{marginBottom:14,fontSize:18,textAlign:"center",letterSpacing:"0.2em"}}/>
          <div style={{display:"flex",gap:8}}>
            <button className="btn btn-g" style={{flex:1}} onClick={()=>setPin(confirmSetPin.id,newPinVal)} disabled={!newPinVal||newPinVal.length<4}>Set PIN</button>
            <button className="btn btn-gh" style={{flex:1}} onClick={()=>{setConfirmSetPin(null);setNewPinVal("");}}>Cancel</button>
          </div>
        </div>
      </div>
    )}
  </div>);
}

// ── ACCESS TAB (role management + portal users) ──────────────────────────────
function AccessTab({user}){
  const extra=useDB("extraPlayers");
  const rosterEdits=useDB("rosterEdits");
  const rosterAdmins=useDB("rosterAdmins");
  const portalUsers=useDB("settings/portalUsers");
  const portalPasswords=useDB("settings/portalPasswords");
  const [adminQ,setAdminQ]=useState("");
  const [section,setSection]=useState("app");
  const [newPU,setNewPU]=useState({name:"",email:"",role:"superadmin",password:""});
  const [addingPU,setAddingPU]=useState(false);
  const [confirmRemoveAdmin,setConfirmRemoveAdmin]=useState(null);
  const [confirmRemovePU,setConfirmRemovePU]=useState(null);
  const [editPwId,setEditPwId]=useState(null);
  const [editPwVal,setEditPwVal]=useState("");
  const [toast,showToast]=useToast();

  const all=useMemo(()=>{
    const base=ROSTER.map(p=>({...p,name:(rosterEdits&&rosterEdits[p.id])||p.name}));
    const ex=Object.values(extra||{});
    return[...base,...ex].sort((a,b)=>a.name.localeCompare(b.name));
  },[extra,rosterEdits]);

  const admins=all.filter(p=>rosterAdmins&&rosterAdmins[p.id]).map(p=>({...p,role:rosterAdmins[p.id]})).sort((a,b)=>(ROLE_LEVELS[b.role]||0)-(ROLE_LEVELS[a.role]||0));
  const adminSearch=all.filter(p=>adminQ&&p.name.toLowerCase().includes(adminQ.toLowerCase())&&!(rosterAdmins&&rosterAdmins[p.id])).slice(0,6);
  const portalUserList=Object.entries(portalUsers||{}).map(([k,v])=>({...v,_key:k}));

  function changeRole(id,newRole){
    wr("rosterAdmins/"+id,newRole);
    // If downgrading from admin to scoring, remove portal password
    if(newRole==="scoring"){dl("settings/portalPasswords/"+id);}
    showToast("Role updated ✓");
  }
  function removeAdmin(p){
    if(p.role==="master"){showToast("Can't remove master","err");return;}
    dl("rosterAdmins/"+p.id);
    dl("settings/portalPasswords/"+p.id);
    setConfirmRemoveAdmin(null);
    showToast("Admin removed ✓");
  }
  function savePortalPw(id){
    if(editPwVal.length<6){showToast("Password must be 6+ characters","err");return;}
    wr("settings/portalPasswords/"+id,editPwVal);
    setEditPwId(null);setEditPwVal("");
    showToast("Portal password set ✓");
  }
  function clearPortalPw(id){
    dl("settings/portalPasswords/"+id);
    showToast("Portal password removed ✓");
  }
  function grantAdmin(id){
    wr("rosterAdmins/"+id,"scoring");
    setAdminQ("");
    showToast("Added as Scoring Admin — change role above if needed ✓");
  }
  function addPortalUser(){
    if(!newPU.name||!newPU.password){showToast("Name and password required","err");return;}
    if(newPU.password.length<4){showToast("Password must be 4+ characters","err");return;}
    ps("settings/portalUsers",newPU);
    setNewPU({name:"",email:"",role:"superadmin",password:""});
    setAddingPU(false);
    showToast("Portal user added ✓");
  }
  function removePortalUser(pu){
    dl("settings/portalUsers/"+pu._key);
    setConfirmRemovePU(null);
    showToast("Portal user removed ✓");
  }

  return(<div>
    <Toast msg={toast.msg} type={toast.type}/>
    <div className="pg-eyebrow">Admin</div>
    <div className="pg-title">Access Management</div>
    <div className="pg-sub">Designate admin roles — easy on/off</div>

    <div className="info-box"><strong>Player PINs are managed in the Roster tab.</strong> Use this page to control who has admin access and what level.</div>

    {/* ── ROLE LEGEND ── */}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:16}}>
      {[
        {role:"master",emoji:"⭐",title:"Master",desc:"Full access everywhere",count:admins.filter(a=>a.role==="master").length},
        {role:"admin",emoji:"🛡️",title:"Super Admin",desc:"Manage days, teams, roster",count:admins.filter(a=>a.role==="admin").length},
        {role:"scoring",emoji:"📊",title:"Scoring",desc:"Enter scores, publish results",count:admins.filter(a=>a.role==="scoring").length},
      ].map(({role,emoji,title,desc,count})=>{
        const c=ROLE_COLORS[role];
        return(
          <div key={role} style={{background:c.bg,border:"1px solid "+c.border,borderRadius:10,padding:"12px 10px",textAlign:"center"}}>
            <div style={{fontSize:20,marginBottom:4}}>{emoji}</div>
            <div style={{fontFamily:"Barlow Condensed,sans-serif",fontSize:22,fontWeight:800,color:c.color}}>{count}</div>
            <div style={{fontSize:11,fontWeight:700,color:c.color}}>{title}</div>
            <div style={{fontSize:9,color:"rgba(255,255,255,0.35)",marginTop:2,lineHeight:1.4}}>{desc}</div>
          </div>
        );
      })}
    </div>

    {isMaster(user.role)&&(
      <div className="sec-tabs">
        {[["app","🛡️ App Admins"],["portal","🔑 Portal Users"]].map(([id,label])=>(
          <button key={id} className={`mtab${section===id?" on":""}`} style={{fontSize:12}} onClick={()=>setSection(id)}>{label}</button>
        ))}
      </div>
    )}

    {section==="app"&&(<div>
      {/* ── ADD AN ADMIN ── */}
      <div className="card">
        <div className="card-hdr"><span className="card-title">+ Add Admin</span></div>
        <div className="card-body">
          <div className="lbl">Search player to add</div>
          <input className="inp" placeholder="Type a name…" value={adminQ} onChange={e=>setAdminQ(e.target.value)}/>
          {adminSearch.length>0&&(
            <div style={{marginTop:8,border:"1px solid rgba(255,255,255,0.08)",borderRadius:8}}>
              {adminSearch.map(p=>(
                <div key={p.id} style={{display:"flex",alignItems:"center",padding:"9px 12px",gap:8,borderBottom:"1px solid rgba(255,255,255,0.04)"}}>
                  <span style={{flex:1,fontSize:13,fontWeight:500,color:"#e2e8f0"}}>{p.name}</span>
                  <button className="btn btn-g btn-sm" onClick={()=>grantAdmin(p.id)}>+ Add as Scoring Admin</button>
                </div>
              ))}
            </div>
          )}
          {adminQ&&adminSearch.length===0&&<div style={{marginTop:6,fontSize:12,color:"rgba(255,255,255,0.3)"}}>No matches (or already an admin)</div>}
          <div style={{fontSize:10,color:"rgba(255,255,255,0.25)",marginTop:8,lineHeight:1.6}}>New admins are added as Scoring Admin by default. Change their role to Super Admin in the list above.</div>
        </div>
      </div>

      {/* ── CURRENT ADMINS — each with independent role dropdown ── */}
      <div className="card" style={{marginTop:12}}>
        <div className="card-hdr"><span className="card-title">Current Admins ({admins.length})</span></div>
        {admins.length===0&&<div style={{padding:"14px 16px",fontSize:12,color:"rgba(255,255,255,0.3)"}}>No admins yet. Use the search above to add someone.</div>}
        {admins.map(p=>{
          const isMasterP=p.role==="master";
          const isSuperAdmin=p.role==="admin";
          const c=ROLE_COLORS[p.role]||ROLE_COLORS.scoring;
          const hasPw=!!(portalPasswords&&portalPasswords[p.id]);
          const isEditingPw=editPwId===p.id;
          return(
            <div key={p.id} style={{borderBottom:"1px solid rgba(255,255,255,0.04)"}}>
              <div style={{display:"flex",alignItems:"center",gap:10,padding:"12px 16px"}}>
                {/* Name */}
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:14,fontWeight:600,color:"#e2e8f0",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</div>
                </div>
                {/* Independent role selector per person */}
                {isMasterP?(
                  <span style={{fontSize:11,fontWeight:700,padding:"5px 12px",borderRadius:20,background:c.bg,border:"1px solid "+c.border,color:c.color,whiteSpace:"nowrap"}}>⭐ Master</span>
                ):(
                  <select value={p.role} onChange={e=>changeRole(p.id,e.target.value)}
                    style={{padding:"6px 10px",borderRadius:8,border:"1.5px solid "+c.border,background:c.bg,color:c.color,fontSize:12,fontWeight:700,fontFamily:"DM Sans,sans-serif",cursor:"pointer",outline:"none",minWidth:145}}>
                    <option value="admin">🛡️ Super Admin</option>
                    <option value="scoring">📊 Scoring Admin</option>
                  </select>
                )}
                {/* Remove */}
                {!isMasterP&&(
                  <button onClick={()=>setConfirmRemoveAdmin(p)} style={{background:"none",border:"1px solid rgba(239,68,68,0.2)",borderRadius:6,padding:"5px 9px",color:"#f87171",fontSize:10,fontWeight:700,cursor:"pointer",fontFamily:"DM Sans,sans-serif",flexShrink:0}}>✕ Remove</button>
                )}
              </div>
              {/* Portal password — Super Admins only */}
              {isSuperAdmin&&(
                <div style={{padding:"0 16px 12px"}}>
                  {isEditingPw?(
                    <div style={{display:"flex",gap:6,alignItems:"center"}}>
                      <input className="inp" type="password" placeholder="6+ characters" value={editPwVal} onChange={e=>setEditPwVal(e.target.value)} onKeyDown={e=>e.key==="Enter"&&savePortalPw(p.id)} style={{flex:1,fontSize:12,padding:"7px 10px"}} autoFocus/>
                      <button className="btn btn-g btn-sm" onClick={()=>savePortalPw(p.id)} disabled={editPwVal.length<6} style={{opacity:editPwVal.length<6?0.4:1}}>Save</button>
                      <button className="btn btn-gh btn-sm" onClick={()=>{setEditPwId(null);setEditPwVal("");}}>Cancel</button>
                    </div>
                  ):(
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      {hasPw?(
                        <>
                          <span style={{fontSize:11,fontWeight:600,color:"#34d399",display:"flex",alignItems:"center",gap:4}}>
                            <span style={{width:6,height:6,borderRadius:"50%",background:"#34d399",display:"inline-block"}}></span>
                            Portal password set
                          </span>
                          <button onClick={()=>{setEditPwId(p.id);setEditPwVal("");}} style={{fontSize:10,fontWeight:600,color:"rgba(255,255,255,0.4)",background:"none",border:"none",cursor:"pointer",fontFamily:"DM Sans,sans-serif"}}>Change</button>
                          <button onClick={()=>clearPortalPw(p.id)} style={{fontSize:10,fontWeight:600,color:"#f87171",background:"none",border:"none",cursor:"pointer",fontFamily:"DM Sans,sans-serif"}}>Remove</button>
                        </>
                      ):(
                        <button onClick={()=>{setEditPwId(p.id);setEditPwVal("");}} style={{fontSize:11,fontWeight:600,color:"#60a5fa",background:"rgba(59,130,246,0.08)",border:"1px solid rgba(59,130,246,0.2)",borderRadius:6,padding:"5px 12px",cursor:"pointer",fontFamily:"DM Sans,sans-serif"}}>🔑 Set portal password</button>
                      )}
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>)}

    {section==="portal"&&isMaster(user.role)&&(<div>
      <div className="info-box"><strong>Portal Users</strong> can sign into this portal with a password. Master has full access; Super Admins manage games and rosters.</div>
      <div className="card">
        <div className="card-hdr">
          <span className="card-title">Portal Users ({portalUserList.length})</span>
          <button className="btn btn-g btn-sm" onClick={()=>setAddingPU(v=>!v)}>{addingPU?"Cancel":"+ Add User"}</button>
        </div>
        {addingPU&&(
          <div style={{padding:"12px 14px",background:"rgba(16,185,129,0.04)",borderBottom:"1px solid rgba(255,255,255,0.05)"}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
              <input className="inp" placeholder="Name" value={newPU.name} onChange={e=>setNewPU(p=>({...p,name:e.target.value}))}/>
              <input className="inp" placeholder="Email (optional)" value={newPU.email} onChange={e=>setNewPU(p=>({...p,email:e.target.value}))}/>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr auto auto",gap:8}}>
              <input className="inp" type="password" placeholder="Portal password (4+ chars)" value={newPU.password} onChange={e=>setNewPU(p=>({...p,password:e.target.value}))}/>
              <select className="inp" style={{width:"auto"}} value={newPU.role} onChange={e=>setNewPU(p=>({...p,role:e.target.value}))}>
                <option value="superadmin">Super Admin</option>
                <option value="master">Master</option>
              </select>
              <button className="btn btn-g btn-sm" onClick={addPortalUser}>Add</button>
            </div>
          </div>
        )}
        {portalUserList.length===0&&<div style={{padding:"14px 16px",fontSize:12,color:"rgba(255,255,255,0.3)"}}>No portal users added yet. You access via master password.</div>}
        {portalUserList.map(pu=>(
          <div key={pu._key} className="p-row">
            <div style={{flex:1}}>
              <div className="p-name">{pu.name}</div>
              {pu.email&&<div className="p-sub">{pu.email}</div>}
            </div>
            <span className={pu.role==="master"?"b b-a":"b b-b"}>{pu.role==="master"?"⭐ Master":"Super Admin"}</span>
            <button className="btn btn-r btn-sm" onClick={()=>setConfirmRemovePU(pu)}>Remove</button>
          </div>
        ))}
      </div>
    </div>)}

    {confirmRemoveAdmin&&(
      <div className="overlay">
        <div className="modal">
          <div style={{fontSize:14,fontWeight:700,marginBottom:6}}>Remove {confirmRemoveAdmin.name}?</div>
          <div style={{fontSize:12,color:"rgba(255,255,255,0.45)",marginBottom:16,lineHeight:1.6}}>They'll lose all admin access. PIN and roster entry are unaffected.</div>
          <div style={{display:"flex",gap:8}}>
            <button className="btn btn-r" style={{flex:1}} onClick={()=>removeAdmin(confirmRemoveAdmin)}>Remove Admin</button>
            <button className="btn btn-gh" style={{flex:1}} onClick={()=>setConfirmRemoveAdmin(null)}>Cancel</button>
          </div>
        </div>
      </div>
    )}

    {confirmRemovePU&&(
      <div className="overlay">
        <div className="modal">
          <div style={{fontSize:14,fontWeight:700,marginBottom:6,color:"#f87171"}}>Remove portal user {confirmRemovePU.name}?</div>
          <div style={{fontSize:12,color:"rgba(255,255,255,0.45)",marginBottom:16,lineHeight:1.6}}>They will no longer be able to sign into the portal.</div>
          <div style={{display:"flex",gap:8}}>
            <button className="btn btn-r" style={{flex:1}} onClick={()=>removePortalUser(confirmRemovePU)}>Remove</button>
            <button className="btn btn-gh" style={{flex:1}} onClick={()=>setConfirmRemovePU(null)}>Cancel</button>
          </div>
        </div>
      </div>
    )}
  </div>);
}

// ── HISTORY TAB ───────────────────────────────────────────────────────────────
function HistoryTab({user}){
  const history=useDB("history");
  const [open,setOpen]=useState(null);
  const [confirmDel,setConfirmDel]=useState(null);
  const [delTyped,setDelTyped]=useState("");
  const [toast,showToast]=useToast();
  const rounds=useMemo(()=>Object.entries(history||{}).sort((a,b)=>(b[1].date||"").localeCompare(a[1].date||"")),[history]);
  const pc=r=>r.playerCount||safeArr(r.teams).reduce((s,t)=>s+Object.values(t.players||{}).length,0);

  function deleteRound(key){
    if(delTyped!=="DELETE"){showToast('Type "DELETE" to confirm',"err");return;}
    wr("historyTrash/"+key,{...history[key],deletedAt:Date.now(),deletedBy:"portal"});
    dl("history/"+key);
    showToast("Moved to trash ✓");
    setConfirmDel(null);setDelTyped("");setOpen(null);
  }

  return(<div>
    <Toast msg={toast.msg} type={toast.type}/>
    <div className="pg-eyebrow">Archive</div>
    <div className="pg-title">Round History</div>
    <div className="pg-sub">{rounds.length} rounds on record</div>
    {isMaster(user.role)&&<div className="warn"><strong>Caution:</strong> Deleting a round moves it to trash — recoverable from the main app History tab. Every delete requires typing "DELETE" to confirm.</div>}
    {rounds.length===0&&<div className="info-box">No history yet. End Week archives current week sign-ups here.</div>}
    {rounds.map(([key,r])=>{
      const count=pc(r);
      const isOpen=open===key;
      return(
        <div key={key} style={{background:"#1e293b",border:"1px solid rgba(255,255,255,0.07)",borderRadius:12,marginBottom:8,overflow:"hidden"}}>
          <div style={{display:"flex",alignItems:"center",gap:10,padding:"11px 16px",cursor:"pointer"}} onClick={()=>setOpen(isOpen?null:key)}>
            <div style={{flex:1}}>
              <div style={{fontSize:14,fontWeight:700,color:"#e2e8f0"}}>{r.day} — {fmtD(r.date)}</div>
              <div style={{fontSize:11,color:"rgba(255,255,255,0.3)",marginTop:1}}>{count} players{r.scores?` · Front:${r.scores.frontPlaces||1}pl Back:${r.scores.backPlaces||1}pl`:""}</div>
            </div>
            <div style={{display:"flex",gap:4,alignItems:"center"}}>
              {isMaster(user.role)&&<button className="btn btn-r btn-xs" onClick={e=>{e.stopPropagation();setConfirmDel({key,round:r});setDelTyped("");}}>Delete</button>}
              <span style={{fontSize:12,color:"rgba(255,255,255,0.2)",transform:isOpen?"rotate(180deg)":"none",transition:"transform 0.2s",display:"inline-block"}}>▾</span>
            </div>
          </div>
          {isOpen&&(
            <div style={{padding:"12px 16px",borderTop:"1px solid rgba(255,255,255,0.05)",background:"rgba(0,0,0,0.1)"}}>
              {safeArr(r.teams).map((t,ti)=>(
                <div key={ti} style={{marginBottom:8}}>
                  <div style={{fontSize:10,fontWeight:700,color:"#10b981",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:3}}>{t.name} HCP {t.totalHcp}</div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:3}}>
                    {Object.values(t.players||{}).map((p,pi)=>(
                      <span key={pi} style={{fontSize:11,background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:6,padding:"2px 8px"}}>
                        <span style={{fontSize:9,color:"#60a5fa",fontWeight:700,marginRight:3}}>{p.slot}</span>{p.name}
                      </span>
                    ))}
                  </div>
                </div>
              ))}
              {r.scores&&(
                <div style={{marginTop:10,paddingTop:10,borderTop:"1px solid rgba(255,255,255,0.06)"}}>
                  <div className="lbl">Score Splits Stored</div>
                  {[
                    {s:"Front",c1:r.scores.f1,c2:r.scores.f2,pl:r.scores.frontPlaces||1,pot:r.scores.frontPot},
                    {s:"Back",c1:r.scores.b1,c2:r.scores.b2,pl:r.scores.backPlaces||1,pot:r.scores.backPot},
                    {s:"Overall",c1:r.scores.o1,c2:r.scores.o2,pl:r.scores.overallPlaces||1,pot:r.scores.overallPot}
                  ].map(({s,c1,c2,pl,pot})=>(
                    <div key={s} style={{fontSize:12,color:"rgba(255,255,255,0.5)",marginBottom:2}}>{s}: {c1>0?`${f$(c1)} / ${f$(c2||0)}`:`${f$(Math.floor((pot||0)*(pl===1?1:0.6)))} / ${f$(Math.floor((pot||0)*0.4))}`} ({pl} place{pl>1?"s":""})</div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      );
    })}

    {confirmDel&&(
      <div className="overlay">
        <div className="modal">
          <div style={{fontSize:14,fontWeight:700,marginBottom:6,color:"#f87171"}}>Delete Round</div>
          <div style={{fontSize:13,fontWeight:600,marginBottom:2}}>{confirmDel.round.day} — {fmtD(confirmDel.round.date)}</div>
          <div style={{fontSize:11,color:"rgba(255,255,255,0.3)",marginBottom:14}}>Moved to trash — recoverable from main app History tab.</div>
          <div style={{fontSize:12,color:"rgba(255,255,255,0.45)",marginBottom:8}}>Type <strong style={{color:"#fca5a5"}}>DELETE</strong> to confirm:</div>
          <input className="inp" value={delTyped} onChange={e=>setDelTyped(e.target.value)} placeholder='Type "DELETE"' style={{marginBottom:14}} autoFocus/>
          <div style={{display:"flex",gap:8}}>
            <button className="btn btn-r" style={{flex:1}} onClick={()=>deleteRound(confirmDel.key)} disabled={delTyped!=="DELETE"}>Move to Trash</button>
            <button className="btn btn-gh" style={{flex:1}} onClick={()=>{setConfirmDel(null);setDelTyped("");}}>Cancel</button>
          </div>
        </div>
      </div>
    )}
  </div>);
}

// ── ATTEND TAB (matches main app: attendance/rounds = array of {date, players[]}) ──
function AttendTab({user}){
  const rosterEdits=useDB("rosterEdits");
  const extra=useDB("extraPlayers");
  const rawRounds=useDB("attendance/rounds");
  const [section,setSection]=useState("history");
  const [toast,showToast]=useToast();
  const [openRound,setOpenRound]=useState(null);
  const [logModal,setLogModal]=useState(false);
  const [editRound,setEditRound]=useState(null); // {index, data}
  const [confirmDel,setConfirmDel]=useState(null);
  const [delTyped,setDelTyped]=useState("");
  const [search,setSearch]=useState("");

  // Normalize: Firebase may store as array or object
  const rounds=useMemo(()=>{
    if(!rawRounds)return[];
    const arr=Array.isArray(rawRounds)?rawRounds:Object.values(rawRounds);
    return arr.filter(r=>r&&r.date).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  },[rawRounds]);

  const allPlayers=useMemo(()=>{
    const base=ROSTER.map(p=>({...p,name:(rosterEdits&&rosterEdits[p.id])||p.name}));
    const ex=Object.values(extra||{});
    return[...base,...ex].sort((a,b)=>a.name.localeCompare(b.name));
  },[extra,rosterEdits]);

  // Standings data
  const standings=useMemo(()=>{
    const p={};
    rounds.forEach(r=>{(r.players||[]).forEach(raw=>{
      const name=normName(raw);
      if(!p[name])p[name]={name,rounds:0,dates:[]};
      p[name].rounds++;p[name].dates.push(r.date);
    });});
    return Object.values(p).sort((a,b)=>b.rounds-a.rounds);
  },[rounds]);

  const totalEntries=rounds.reduce((s,r)=>s+(r.players||[]).length,0);

  function saveRounds(newRounds){
    const sorted=[...newRounds].sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    wr("attendance/rounds",sorted);
  }

  function deleteRound(index){
    if(delTyped!=="DELETE"){showToast('Type "DELETE" to confirm',"err");return;}
    const updated=rounds.filter((_,i)=>i!==index);
    saveRounds(updated);
    setConfirmDel(null);setDelTyped("");setOpenRound(null);
    showToast("Round deleted ✓");
  }

  // ── LOG/EDIT MODAL (multi-select players, matches main app exactly) ──
  function LogModal({editData,onSave,onClose}){
    const[date,setDate]=useState(editData?editData.date:new Date().toISOString().split("T")[0]);
    const[selected,setSelected]=useState(new Set(editData?editData.players:[]));
    const[q,setQ]=useState("");
    const[guestName,setGuestName]=useState("");
    const allNames=allPlayers.map(r=>r.name).sort((a,b)=>a.localeCompare(b));
    const extraGuests=[...selected].filter(n=>!allNames.includes(n));
    const filtered=allNames.filter(n=>n.toLowerCase().includes(q.toLowerCase()));
    function toggle(name){const s=new Set(selected);if(s.has(name))s.delete(name);else s.add(name);setSelected(s);}
    function addGuest(){if(!guestName.trim())return;const s=new Set(selected);s.add(guestName.trim());setSelected(s);setGuestName("");}
    return(
      <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
        <div className="modal">
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
            <div style={{fontSize:16,fontWeight:700,color:"#e2e8f0"}}>{editData?"Edit Round":"Log a Round"}</div>
            <button onClick={onClose} style={{width:28,height:28,borderRadius:"50%",border:"1px solid rgba(255,255,255,0.15)",background:"rgba(255,255,255,0.06)",cursor:"pointer",color:"rgba(255,255,255,0.5)",fontSize:16,lineHeight:1}}>✕</button>
          </div>
          <div style={{marginBottom:12}}>
            <div className="lbl">Date</div>
            <input className="inp" type="date" value={date} onChange={e=>setDate(e.target.value)}/>
          </div>
          <div style={{marginBottom:12}}>
            <div className="lbl">Players ({selected.size} selected)</div>
            <div style={{position:"relative",marginBottom:6}}>
              <input className="inp" style={{paddingLeft:12,fontSize:13}} placeholder="Search roster..." value={q} onChange={e=>setQ(e.target.value)}/>
            </div>
            <div style={{maxHeight:240,overflowY:"auto",border:"1px solid rgba(255,255,255,0.08)",borderRadius:8,marginBottom:8}}>
              {/* Extra guests (names not in roster) */}
              {extraGuests.map(name=>(
                <div key={name} onClick={()=>toggle(name)} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 11px",borderBottom:"1px solid rgba(255,255,255,0.04)",cursor:"pointer",background:"rgba(16,185,129,0.12)"}}>
                  <div style={{width:16,height:16,borderRadius:4,background:"#10b981",border:"2px solid #10b981",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg></div>
                  <span style={{fontSize:12,fontWeight:500,flex:1,color:"#e2e8f0"}}>{name}</span>
                  <span style={{fontSize:10,color:"rgba(255,255,255,0.3)",background:"rgba(255,255,255,0.06)",padding:"1px 6px",borderRadius:10}}>Guest</span>
                </div>
              ))}
              {/* Roster players */}
              {filtered.map(name=>{const on=selected.has(name);return(
                <div key={name} onClick={()=>toggle(name)} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 11px",borderBottom:"1px solid rgba(255,255,255,0.04)",cursor:"pointer",background:on?"rgba(16,185,129,0.08)":"transparent"}}>
                  <div style={{width:16,height:16,borderRadius:4,border:"2px solid",borderColor:on?"#10b981":"rgba(255,255,255,0.2)",background:on?"#10b981":"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{on&&<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg>}</div>
                  <span style={{fontSize:12,fontWeight:500,color:"#e2e8f0"}}>{name}</span>
                </div>
              );})}
            </div>
            <div style={{display:"flex",gap:6}}>
              <input className="inp" style={{flex:1,fontSize:12}} placeholder="Add guest name..." value={guestName} onChange={e=>setGuestName(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addGuest();}}/>
              <button className="btn btn-gh btn-sm" onClick={addGuest} disabled={!guestName.trim()}>+ Guest</button>
            </div>
          </div>
          <button className="btn btn-g btn-full" style={{opacity:(!date||selected.size===0)?0.4:1,marginTop:8}} disabled={!date||selected.size===0}
            onClick={()=>{if(!date||selected.size===0)return;onSave({date,players:[...selected].sort()});onClose();}}>
            {editData?"Save Changes":"Log Round ("+selected.size+" players)"}
          </button>
        </div>
      </div>
    );
  }

  return(<div>
    <Toast msg={toast.msg} type={toast.type}/>
    <div className="pg-eyebrow">Tracking</div>
    <div className="pg-title">Attendance</div>
    <div className="pg-sub">{rounds.length} round{rounds.length!==1?"s":""} · {standings.length} unique players · ${totalEntries} to tournament fund</div>

    <div className="sec-tabs">
      {[["standings","📊 Standings"],["history","📋 History"]].map(([id,label])=>(
        <button key={id} className={`mtab${section===id?" on":""}`} style={{fontSize:12}} onClick={()=>setSection(id)}>{label}</button>
      ))}
    </div>

    {/* ── STANDINGS ── */}
    {section==="standings"&&(
      <div>
        <div className="stat-grid sg-4" style={{marginBottom:14}}>
          <div className="stat"><div className="stat-v" style={{color:"#10b981"}}>{standings.length}</div><div className="stat-l">Players</div></div>
          <div className="stat"><div className="stat-v" style={{color:"#60a5fa"}}>{rounds.length}</div><div className="stat-l">Rounds</div></div>
          <div className="stat"><div className="stat-v" style={{color:"#a78bfa"}}>{standings.length>0?standings[0].rounds:0}</div><div className="stat-l">Top Played</div></div>
          <div className="stat"><div className="stat-v" style={{color:"#fbbf24"}}>${totalEntries}</div><div className="stat-l">Tourn Fund</div></div>
        </div>

        <div className="card">
          <div className="srch"><input className="inp" placeholder="🔍 Search players..." value={search} onChange={e=>setSearch(e.target.value)}/></div>
          {standings.filter(p=>!search||p.name.toLowerCase().includes(search.toLowerCase())).length===0&&(
            <div style={{padding:"20px 16px",fontSize:12,color:"rgba(255,255,255,0.3)",textAlign:"center"}}>No attendance data yet. Rounds are logged when weeks are closed out.</div>
          )}
          {standings.filter(p=>!search||p.name.toLowerCase().includes(search.toLowerCase())).map((p,i)=>{
            const maxR=standings[0]?.rounds||1;
            return(
              <div key={p.name} className="s-row">
                <div style={{width:22,height:22,borderRadius:"50%",background:i<3?"#f59e0b":"rgba(255,255,255,0.08)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:800,color:i<3?"#1e293b":"rgba(255,255,255,0.4)",flexShrink:0,fontFamily:"Barlow Condensed,sans-serif"}}>{i+1}</div>
                <span style={{flex:1,fontSize:13,fontWeight:600,color:"#e2e8f0"}}>{p.name}</span>
                <div style={{width:50,height:5,background:"rgba(255,255,255,0.07)",borderRadius:3,overflow:"hidden",flexShrink:0}}>
                  <div style={{height:5,background:"#10b981",borderRadius:3,width:Math.round((p.rounds/maxR)*100)+"%"}}/>
                </div>
                <span style={{fontFamily:"Barlow Condensed,sans-serif",fontSize:18,fontWeight:700,color:"#a78bfa",width:28,textAlign:"right",flexShrink:0}}>{p.rounds}</span>
              </div>
            );
          })}
        </div>
      </div>
    )}

    {/* ── HISTORY (rounds list — matches main app) ── */}
    {section==="history"&&(
      <div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <div className="lbl" style={{marginBottom:0}}>{rounds.length} round{rounds.length!==1?"s":""}</div>
          <button className="btn btn-g btn-sm" onClick={()=>{setEditRound(null);setLogModal(true);}}>+ Log Round</button>
        </div>

        {rounds.length===0&&<div className="info-box"><strong>No rounds logged yet.</strong> Rounds are added automatically when you close out a week, or you can log one manually.</div>}

        {rounds.map((r,ri)=>{
          const players=r.players||[];
          const isOpen=openRound===ri;
          return(
            <div key={r.date+"-"+ri} className="card" style={{marginBottom:8}}>
              <div onClick={()=>setOpenRound(isOpen?null:ri)} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"11px 16px",cursor:"pointer"}}>
                <div>
                  <div style={{fontSize:14,fontWeight:700,color:"#e2e8f0"}}>{fmtD(r.date)}</div>
                  <div style={{fontSize:11,color:"rgba(255,255,255,0.3)",marginTop:1}}>{players.length} player{players.length!==1?"s":""} · ${players.length} to pot</div>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:5}}>
                  <span style={{fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:20,background:"#10b981",color:"#fff"}}>{players.length}</span>
                  <span style={{fontSize:12,color:"rgba(255,255,255,0.2)",transform:isOpen?"rotate(180deg)":"none",transition:"transform 0.2s",display:"inline-block"}}>▾</span>
                </div>
              </div>
              {isOpen&&(
                <div style={{borderTop:"1px solid rgba(255,255,255,0.05)"}}>
                  <div style={{padding:"8px 16px"}}>
                    {players.map((name,pi)=>(
                      <div key={name} style={{display:"flex",alignItems:"center",gap:7,padding:"5px 0",borderBottom:pi<players.length-1?"1px solid rgba(255,255,255,0.04)":"none",fontSize:13,fontWeight:500,color:"#e2e8f0"}}>
                        <span style={{width:18,height:18,borderRadius:"50%",background:"rgba(255,255,255,0.06)",color:"rgba(255,255,255,0.4)",fontSize:9,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontFamily:"Barlow Condensed,sans-serif"}}>{pi+1}</span>
                        {name}
                      </div>
                    ))}
                  </div>
                  <div style={{borderTop:"1px solid rgba(255,255,255,0.05)",padding:"8px 16px",display:"flex",gap:6,justifyContent:"flex-end"}}>
                    <button className="btn btn-gh btn-xs" onClick={e=>{e.stopPropagation();setEditRound({index:ri,data:r});setLogModal(true);}}>Edit</button>
                    <button className="btn btn-r btn-xs" onClick={e=>{e.stopPropagation();setConfirmDel({index:ri,round:r});setDelTyped("");}}>Delete</button>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    )}

    {/* ── LOG/EDIT MODAL ── */}
    {logModal&&<LogModal
      editData={editRound?editRound.data:null}
      onSave={data=>{
        if(editRound){
          const updated=[...rounds];
          updated[editRound.index]=data;
          saveRounds(updated);
          showToast("Round updated ✓");
        }else{
          saveRounds([...rounds,data]);
          showToast("Round logged — "+data.players.length+" players ✓");
        }
        setEditRound(null);
      }}
      onClose={()=>{setLogModal(false);setEditRound(null);}}
    />}

    {/* ── DELETE CONFIRM ── */}
    {confirmDel&&(
      <div className="overlay">
        <div className="modal">
          <div style={{fontSize:14,fontWeight:700,marginBottom:5,color:"#f87171"}}>Delete Attendance Round</div>
          <div style={{fontSize:13,fontWeight:600,marginBottom:2}}>{fmtD(confirmDel.round.date)}</div>
          <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginBottom:16}}>{(confirmDel.round.players||[]).length} players</div>
          <div style={{fontSize:12,color:"rgba(255,255,255,0.45)",marginBottom:8}}>Type <strong style={{color:"#fca5a5"}}>DELETE</strong> to confirm:</div>
          <input className="inp" value={delTyped} onChange={e=>setDelTyped(e.target.value)} placeholder='Type "DELETE"' style={{marginBottom:14}} autoFocus/>
          <div style={{display:"flex",gap:8}}>
            <button className="btn btn-r" style={{flex:1}} onClick={()=>deleteRound(confirmDel.index)} disabled={delTyped!=="DELETE"}>Delete Forever</button>
            <button className="btn btn-gh" style={{flex:1}} onClick={()=>{setConfirmDel(null);setDelTyped("");}}>Cancel</button>
          </div>
        </div>
      </div>
    )}
  </div>);
}

// ── SEASON TAB ────────────────────────────────────────────────────────────────

function ClarkEmailTab(){
  const [entries, setEntries] = React.useState([]);
  const [loaded, setLoaded] = React.useState(false);
  const [pasteModal, setPasteModal] = React.useState(false);
  const [pasteText, setPasteText] = React.useState('');
  const [addModal, setAddModal] = React.useState(false);
  const [addName, setAddName] = React.useState('');
  const [addEmail, setAddEmail] = React.useState('');
  const [editEntry, setEditEntry] = React.useState(null); // {_key, name, email}
  const [editName, setEditName] = React.useState('');
  const [editEmail, setEditEmail] = React.useState('');
  const [removeEntry, setRemoveEntry] = React.useState(null); // {_key, name}
  const [search, setSearch] = React.useState('');
  const [copied, setCopied] = React.useState(false);
  const [toast, setToast] = React.useState(null);
  const [selected, setSelected] = React.useState(new Set());

  React.useEffect(()=>{
    if(typeof firebase==='undefined')return;
    const ref = firebase.database().ref('clarkEmailList');
    ref.on('value', snap=>{
      const val = snap.val();
      if(val){
        const arr = Object.entries(val).map(([k,v])=>({...v,_key:k})).sort((a,b)=>a.name.localeCompare(b.name));
        setEntries(arr);
        setSelected(prev=>{
          // Keep existing selections, auto-select new entries
          const newKeys = new Set(arr.map(e=>e._key));
          const merged = new Set([...prev].filter(k=>newKeys.has(k)));
          arr.forEach(e=>{ if(!prev.size) merged.add(e._key); });
          return merged.size===0 ? new Set(arr.map(e=>e._key)) : merged;
        });
      } else {
        setEntries([]);
        setSelected(new Set());
      }
      setLoaded(true);
    });
    return()=>ref.off();
  },[]);

  function showToast(msg){setToast(msg);setTimeout(()=>setToast(null),2500);}

  function toggleSelect(key){
    setSelected(prev=>{const n=new Set(prev);n.has(key)?n.delete(key):n.add(key);return n;});
  }
  function selectAll(){setSelected(new Set(entries.map(e=>e._key)));}
  function deselectAll(){setSelected(new Set());}

  function copySelected(){
    const sel = entries.filter(e=>selected.has(e._key));
    const text = sel.map(e=>`${e.name} <${e.email}>`).join(', ');
    navigator.clipboard.writeText(text).then(()=>{
      setCopied(true);
      showToast(`✓ Copied ${sel.length} recipients to clipboard`);
      setTimeout(()=>setCopied(false),2000);
    });
  }

  function confirmRemove(){
    if(!removeEntry)return;
    firebase.database().ref('clarkEmailList/'+removeEntry._key).remove();
    setRemoveEntry(null);
    showToast('Removed from list');
  }

  function openEdit(e){
    setEditEntry(e);
    setEditName(e.name);
    setEditEmail(e.email);
  }

  function saveEdit(){
    if(!editName.trim()||!editEmail.trim())return;
    firebase.database().ref('clarkEmailList/'+editEntry._key).update({name:editName.trim(),email:editEmail.trim().toLowerCase()});
    setEditEntry(null);
    showToast('Updated');
  }

  function addEntry(){
    if(!addName.trim()||!addEmail.trim())return;
    firebase.database().ref('clarkEmailList').push({name:addName.trim(),email:addEmail.trim().toLowerCase()});
    setAddName('');setAddEmail('');setAddModal(false);
    showToast('Added');
  }

  function parsePaste(){
    const lines = pasteText.split(/[,\n\r]+/).map(l=>l.trim()).filter(Boolean);
    let added = 0;
    const ref = firebase.database().ref('clarkEmailList');
    lines.forEach(line=>{
      const m1 = line.match(/^(.+?)\s*<([^>]+)>/);
      if(m1){ref.push({name:m1[1].trim(),email:m1[2].trim().toLowerCase()});added++;return;}
      const m2 = line.match(/^[\w.+\-]+@[\w.\-]+\.\w+$/i);
      if(m2){ref.push({name:line.split('@')[0],email:line.trim().toLowerCase()});added++;return;}
    });
    setPasteText('');setPasteModal(false);
    showToast(`Imported ${added} contacts`);
  }

  const filtered = entries.filter(e=>
    !search||e.name.toLowerCase().includes(search.toLowerCase())||e.email.toLowerCase().includes(search.toLowerCase())
  );
  const selCount = entries.filter(e=>selected.has(e._key)).length;

  return(
    <div className="main">
      <div className="pg-eyebrow">Communications</div>
      <div className="pg-title">Clark Email List</div>
      <div className="pg-sub">Manage recipients for Clark's group emails. Check who to include, then copy all in Gmail format.</div>

      <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:16,alignItems:'center'}}>
        <button className="btn btn-g" onClick={copySelected} disabled={selCount===0}>
          {copied?'✓ Copied!':`📋 Copy ${selCount} to Gmail`}
        </button>
        <button className="btn btn-gh btn-sm" onClick={()=>setPasteModal(true)}>⬆️ Import</button>
        <button className="btn btn-gh btn-sm" onClick={()=>setAddModal(true)}>+ Add</button>
        <div style={{marginLeft:'auto',display:'flex',gap:6}}>
          <button className="btn btn-gh btn-sm" onClick={selectAll}>All</button>
          <button className="btn btn-gh btn-sm" onClick={deselectAll}>None</button>
        </div>
      </div>

      <div style={{fontSize:12,color:'rgba(255,255,255,0.35)',marginBottom:10}}>
        {entries.length} people · {selCount} selected
      </div>

      <input className="inp" placeholder="Search name or email..." value={search} onChange={e=>setSearch(e.target.value)} style={{marginBottom:12,width:'100%',boxSizing:'border-box'}}/>

      <div className="card">
        {!loaded&&<div style={{padding:'20px 16px',color:'rgba(255,255,255,0.3)',fontSize:13}}>Loading...</div>}
        {loaded&&filtered.length===0&&<div style={{padding:'20px 16px',color:'rgba(255,255,255,0.3)',fontSize:13,textAlign:'center'}}>No contacts yet.</div>}
        {filtered.map((e,i)=>(
          <div key={e._key} style={{display:'flex',alignItems:'center',gap:10,padding:'9px 14px',borderBottom:i<filtered.length-1?'1px solid rgba(255,255,255,0.06)':'none',background:selected.has(e._key)?'rgba(16,185,129,0.05)':'transparent'}}>
            {/* Checkbox */}
            <div onClick={()=>toggleSelect(e._key)} style={{width:17,height:17,borderRadius:3,border:'1.5px solid',borderColor:selected.has(e._key)?'#10b981':'rgba(255,255,255,0.2)',background:selected.has(e._key)?'#10b981':'transparent',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,cursor:'pointer'}}>
              {selected.has(e._key)&&<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3" strokeLinecap="round"><polyline points="20 6 9 17 4 12"/></svg>}
            </div>
            {/* Initials */}
            <div style={{width:30,height:30,borderRadius:'50%',background:'rgba(16,185,129,0.12)',color:'#10b981',fontSize:10,fontWeight:800,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              {e.name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)}
            </div>
            {/* Name · email on one line */}
            <div style={{flex:1,minWidth:0,display:'flex',alignItems:'baseline',gap:8,overflow:'hidden'}}>
              <span style={{fontSize:13,fontWeight:600,color:'#e2e8f0',whiteSpace:'nowrap',flexShrink:0}}>{e.name}</span>
              <span style={{fontSize:11,color:'rgba(255,255,255,0.3)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>· {e.email}</span>
            </div>
            {/* Edit */}
            <button onClick={()=>openEdit(e)} style={{background:'none',border:'1px solid rgba(255,255,255,0.15)',borderRadius:5,cursor:'pointer',color:'rgba(255,255,255,0.5)',fontSize:11,padding:'3px 8px',flexShrink:0,fontFamily:'inherit'}}>Edit</button>
            {/* Remove */}
            <button onClick={()=>setRemoveEntry(e)} style={{background:'none',border:'1px solid rgba(239,68,68,0.3)',borderRadius:5,cursor:'pointer',color:'rgba(239,68,68,0.6)',fontSize:11,padding:'3px 8px',flexShrink:0,fontFamily:'inherit'}}>Remove</button>
          </div>
        ))}
      </div>

      {/* Remove confirmation modal */}
      {removeEntry&&(
        <div onClick={e=>{if(e.target===e.currentTarget)setRemoveEntry(null);}} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.75)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:20}}>
          <div className="modal" style={{width:'100%',maxWidth:380}}>
            <div style={{fontSize:16,fontWeight:700,color:'#fff',marginBottom:8}}>Remove from list?</div>
            <div style={{fontSize:13,color:'rgba(255,255,255,0.5)',marginBottom:20,lineHeight:1.5}}>
              <strong style={{color:'#e2e8f0'}}>{removeEntry.name}</strong> will be removed from the Clark email list. This does not affect their app account.
            </div>
            <div style={{display:'flex',gap:8}}>
              <button className="btn btn-full" style={{background:'#ef4444',color:'#fff',border:'none'}} onClick={confirmRemove}>Yes, Remove</button>
              <button className="btn btn-gh" onClick={()=>setRemoveEntry(null)}>Cancel</button>
            </div>
          </div>
        </div>
      )}

      {/* Edit modal */}
      {editEntry&&(
        <div onClick={e=>{if(e.target===e.currentTarget)setEditEntry(null);}} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.75)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:20}}>
          <div className="modal" style={{width:'100%',maxWidth:420}}>
            <div style={{fontSize:16,fontWeight:700,color:'#fff',marginBottom:16}}>Edit Contact</div>
            <div className="lbl" style={{marginBottom:4}}>Name</div>
            <input className="inp" value={editName} onChange={e=>setEditName(e.target.value)} style={{marginBottom:12}}/>
            <div className="lbl" style={{marginBottom:4}}>Email</div>
            <input className="inp" type="email" value={editEmail} onChange={e=>setEditEmail(e.target.value)} style={{marginBottom:20}}
              onKeyDown={e=>{if(e.key==='Enter')saveEdit();}}/>
            <div style={{display:'flex',gap:8}}>
              <button className="btn btn-g btn-full" onClick={saveEdit} disabled={!editName.trim()||!editEmail.trim()}>Save Changes</button>
              <button className="btn btn-gh" onClick={()=>setEditEntry(null)}>Cancel</button>
            </div>
          </div>
        </div>
      )}

      {/* Add modal */}
      {addModal&&(
        <div onClick={e=>{if(e.target===e.currentTarget)setAddModal(false);}} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.75)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:20}}>
          <div className="modal" style={{width:'100%',maxWidth:400}}>
            <div style={{fontSize:16,fontWeight:700,color:'#fff',marginBottom:16}}>Add Person</div>
            <div className="lbl" style={{marginBottom:4}}>Name</div>
            <input className="inp" placeholder="Full name" value={addName} onChange={e=>setAddName(e.target.value)} style={{marginBottom:10}}/>
            <div className="lbl" style={{marginBottom:4}}>Email</div>
            <input className="inp" type="email" placeholder="email@example.com" value={addEmail} onChange={e=>setAddEmail(e.target.value)} style={{marginBottom:16}}
              onKeyDown={e=>{if(e.key==='Enter')addEntry();}}/>
            <div style={{display:'flex',gap:8}}>
              <button className="btn btn-g btn-full" onClick={addEntry} disabled={!addName.trim()||!addEmail.trim()}>Add</button>
              <button className="btn btn-gh" onClick={()=>setAddModal(false)}>Cancel</button>
            </div>
          </div>
        </div>
      )}

      {/* Import modal */}
      {pasteModal&&(
        <div onClick={e=>{if(e.target===e.currentTarget)setPasteModal(false);}} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.75)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:20}}>
          <div className="modal" style={{width:'100%',maxWidth:520}}>
            <div style={{fontSize:16,fontWeight:700,color:'#fff',marginBottom:6}}>Import Email List</div>
            <div style={{fontSize:12,color:'rgba(255,255,255,0.4)',marginBottom:12,lineHeight:1.6}}>
              Paste contacts in Gmail format: <code style={{color:'rgba(255,255,255,0.55)'}}>Name &lt;email@x.com&gt;</code>
            </div>
            <textarea className="inp" rows={8} placeholder="Paste contacts here..." value={pasteText} onChange={e=>setPasteText(e.target.value)} style={{marginBottom:12,fontFamily:'monospace',fontSize:12}}/>
            <div style={{display:'flex',gap:8}}>
              <button className="btn btn-g btn-full" onClick={parsePaste} disabled={!pasteText.trim()}>Import</button>
              <button className="btn btn-gh" onClick={()=>{setPasteModal(false);setPasteText('');}}>Cancel</button>
            </div>
          </div>
        </div>
      )}

      {toast&&<div className="toast toast-ok">{toast}</div>}
    </div>
  );
}


function LoginCardsTab(){
  const rosterPins=useDB("rosterPins");
  const rosterEdits=useDB("rosterEdits");
  const extra=useDB("extraPlayers");

  const allPlayers=React.useMemo(()=>{
    if(!rosterPins) return [];
    // Only show players who have registered (have a PIN)
    const base=ROSTER
      .filter(p=>rosterPins[p.id])
      .map(p=>({...p,name:(rosterEdits&&rosterEdits[p.id])||p.name,isExtra:false}));
    // Include extra players who have PINs
    const extras=Object.values(extra||{})
      .filter(p=>rosterPins[p.id])
      .map(p=>({...p,isExtra:true}));
    return [...base,...extras].sort((a,b)=>a.name.localeCompare(b.name));
  },[rosterPins,rosterEdits,extra]);

  const [cards,setCards]=React.useState({});
  const [q,setQ]=React.useState('');
  const [editing,setEditing]=React.useState(null); // player obj
  const [editMsg,setEditMsg]=React.useState('');
  const [editLogo,setEditLogo]=React.useState(''); // base64 data url
  const [editTheme,setEditTheme]=React.useState('default');
  const [uploading,setUploading]=React.useState(false);
  const [toast,setToast]=React.useState(null);
  const fileRef=React.useRef();
  const cropCanvasRef=React.useRef();
  const [cropModal,setCropModal]=React.useState(false);
  const [cropImg,setCropImg]=React.useState(null); // raw data url
  const [cropImgEl,setCropImgEl]=React.useState(null); // Image element
  const [cropOffset,setCropOffset]=React.useState({x:0,y:0}); // pan offset
  const [cropScale,setCropScale]=React.useState(1); // zoom
  const [cropDragging,setCropDragging]=React.useState(false);
  const [cropDragStart,setCropDragStart]=React.useState({x:0,y:0});
  const CROP_SIZE=240; // display size of crop modal canvas

  // Load all player cards from Firebase
  React.useEffect(()=>{
    if(typeof firebase==='undefined')return;
    const ref=firebase.database().ref('settings/playerCards');
    ref.on('value',snap=>{setCards(snap.val()||{});});
    return()=>ref.off();
  },[]);

  function showToast(msg){setToast(msg);setTimeout(()=>setToast(null),2500);}

  function openEdit(p){
    const card=cards[p.id]||{};
    setEditing(p);
    setEditMsg(card.message||'');
    setEditLogo(card.logo||'');
    setEditTheme(card.theme||'default');
  }

  function handleImageUpload(e){
    const file=e.target.files?.[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      const img=new window.Image();
      img.onload=()=>{
        setCropImgEl(img);
        setCropImg(ev.target.result);
        // Center the image initially
        const scale=Math.max(CROP_SIZE/img.width, CROP_SIZE/img.height);
        setCropScale(scale);
        setCropOffset({x:(CROP_SIZE-img.width*scale)/2, y:(CROP_SIZE-img.height*scale)/2});
        setCropModal(true);
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
    e.target.value=''; // reset so same file can be re-uploaded
  }

  function drawCrop(){
    const canvas=cropCanvasRef.current;
    if(!canvas||!cropImgEl)return;
    const ctx=canvas.getContext('2d');
    ctx.clearRect(0,0,CROP_SIZE,CROP_SIZE);
    ctx.drawImage(cropImgEl, cropOffset.x, cropOffset.y, cropImgEl.width*cropScale, cropImgEl.height*cropScale);
  }
  React.useEffect(()=>{if(cropModal)drawCrop();},[cropModal,cropOffset,cropScale,cropImgEl]);

  function confirmCrop(){
    const canvas=cropCanvasRef.current;
    if(!canvas)return;
    // Export at 128×128
    const out=document.createElement('canvas');
    out.width=128;out.height=128;
    const ctx=out.getContext('2d');
    const ratio=128/CROP_SIZE;
    ctx.drawImage(cropImgEl,
      cropOffset.x*ratio, cropOffset.y*ratio,
      cropImgEl.width*cropScale*ratio, cropImgEl.height*cropScale*ratio
    );
    setEditLogo(out.toDataURL('image/jpeg',0.85));
    setCropModal(false);
  }

  function onCropMouseDown(e){
    setCropDragging(true);
    const rect=e.currentTarget.getBoundingClientRect();
    setCropDragStart({x:(e.clientX||e.touches?.[0]?.clientX||0)-cropOffset.x, y:(e.clientY||e.touches?.[0]?.clientY||0)-cropOffset.y});
  }
  function onCropMouseMove(e){
    if(!cropDragging)return;
    const cx=e.clientX||e.touches?.[0]?.clientX||0;
    const cy=e.clientY||e.touches?.[0]?.clientY||0;
    setCropOffset({x:cx-cropDragStart.x, y:cy-cropDragStart.y});
  }
  function onCropMouseUp(){setCropDragging(false);}

  function saveCard(){
    if(!editing)return;
    const card={};
    if(editMsg.trim()) card.message=editMsg.trim();
    if(editLogo) card.logo=editLogo;
    if(editTheme&&editTheme!=='default') card.theme=editTheme;
    firebase.database().ref('settings/playerCards/'+editing.id).set(Object.keys(card).length>0?card:null);
    setEditing(null);
    showToast('Saved!');
  }

  function clearCard(){
    if(!editing)return;
    firebase.database().ref('settings/playerCards/'+editing.id).remove();
    setEditing(null);
    showToast('Card cleared');
  }

  const filtered=allPlayers.filter(p=>!q||p.name.toLowerCase().includes(q.toLowerCase()));
  const THEMES=[
    {id:'default',label:'Default',bg:'rgba(15,23,42,0.85)'},
    {id:'gold',label:'Gold',bg:'rgba(10,14,26,0.92)'},
    {id:'green',label:'Green',bg:'rgba(0,20,10,0.92)'},
    {id:'purple',label:'Purple',bg:'rgba(15,10,30,0.92)'},
  ];

  return(
    <div className="main">
      <div className="pg-eyebrow">Master Admin</div>
      <div className="pg-title">Login Cards</div>
      <div className="pg-sub">Set a custom logo and welcome message for each player. Shows on their flash card at login. Leave blank to use default initials.</div>

      <input className="inp" placeholder="Search players..." value={q} onChange={e=>setQ(e.target.value)} style={{marginBottom:16,width:'100%',boxSizing:'border-box'}}/>

      <div className="card">
        {filtered.map((p,i)=>{
          const card=cards[p.id]||{};
          const hasCard=card.message||card.logo;
          return(
            <div key={p.id} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 16px',borderBottom:i<filtered.length-1?'1px solid rgba(255,255,255,0.06)':'none'}}>
              {/* Avatar preview */}
              <div style={{width:36,height:36,borderRadius:'50%',overflow:'hidden',flexShrink:0,background:'rgba(16,185,129,0.12)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:800,color:'#10b981'}}>
                {card.logo
                  ? <img src={card.logo} style={{width:36,height:36,objectFit:'cover'}}/>
                  : p.name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)
                }
              </div>
              {/* Name + status */}
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13,fontWeight:600,color:'#e2e8f0'}}>{p.name}</div>
                {card.message&&<div style={{fontSize:11,color:'rgba(255,255,255,0.35)',marginTop:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>"{card.message}"</div>}
              </div>
              {hasCard&&<span style={{fontSize:10,color:'#10b981',fontWeight:700,padding:'2px 6px',borderRadius:10,background:'rgba(16,185,129,0.1)',flexShrink:0}}>✓ Custom</span>}
              <button className="btn btn-gh btn-sm" onClick={()=>openEdit(p)} style={{flexShrink:0}}>Edit</button>
            </div>
          );
        })}
      </div>

      {/* Edit modal */}
      {editing&&(
        <div onClick={e=>{if(e.target===e.currentTarget)setEditing(null);}} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.8)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:20}}>
          <div className="modal" style={{width:'100%',maxWidth:480,maxHeight:'90vh',display:'flex',flexDirection:'column'}}>
            {/* Header */}
            <div style={{padding:'18px 20px 14px',borderBottom:'1px solid rgba(255,255,255,0.08)',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
              <div style={{fontSize:16,fontWeight:700,color:'#fff'}}>Login Card — {editing.name}</div>
              <button onClick={()=>setEditing(null)} style={{background:'none',border:'none',color:'rgba(255,255,255,0.4)',fontSize:20,cursor:'pointer',lineHeight:1}}>✕</button>
            </div>
            <div style={{overflowY:'auto',flex:1,padding:'18px 20px'}}>
              {/* Preview */}
              <div style={{marginBottom:18,padding:'20px',borderRadius:14,background:THEMES.find(t=>t.id===editTheme)?.bg||'rgba(15,23,42,0.85)',border:'1px solid rgba(255,255,255,0.08)',textAlign:'center'}}>
                <div style={{fontSize:10,color:'rgba(255,255,255,0.3)',letterSpacing:'0.1em',marginBottom:10,textTransform:'uppercase'}}>Preview</div>
                <div style={{display:'flex',justifyContent:'center',marginBottom:10}}>
                  {editLogo
                    ? <img src={editLogo} style={{width:64,height:64,borderRadius:'50%',objectFit:'cover',border:'2px solid rgba(16,185,129,0.5)'}}/>
                    : <div style={{width:64,height:64,borderRadius:'50%',background:'rgba(16,185,129,0.15)',color:'#10b981',display:'flex',alignItems:'center',justifyContent:'center',fontSize:20,fontWeight:800}}>{editing.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}</div>
                  }
                </div>
                <div style={{fontSize:22,fontWeight:800,color:'#fff',fontFamily:'Barlow Condensed,sans-serif'}}>{editing.name}</div>
                {editMsg&&<div style={{fontSize:12,color:'rgba(255,255,255,0.5)',marginTop:6,fontStyle:'italic'}}>"{editMsg}"</div>}
              </div>

              {/* Logo upload */}
              <div className="lbl" style={{marginBottom:6}}>Player Logo / Photo</div>
              <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',marginBottom:14}}>
                {editLogo&&<img src={editLogo} style={{width:44,height:44,borderRadius:'50%',objectFit:'cover',border:'2px solid rgba(16,185,129,0.4)'}}/>}
                <button className="btn btn-gh btn-sm" onClick={()=>fileRef.current?.click()} disabled={uploading}>
                  {uploading?'Processing...':editLogo?'Change photo':'Upload photo'}
                </button>
                {editLogo&&<button className="btn btn-gh btn-sm" onClick={()=>{
                  const img=new window.Image();
                  img.onload=()=>{
                    setCropImgEl(img);
                    setCropImg(editLogo);
                    const scale=Math.max(CROP_SIZE/img.width,CROP_SIZE/img.height);
                    setCropScale(scale);
                    setCropOffset({x:(CROP_SIZE-img.width*scale)/2,y:(CROP_SIZE-img.height*scale)/2});
                    setCropModal(true);
                  };
                  img.src=editLogo;
                }}>✂️ Adjust crop</button>}
                {editLogo&&<button className="btn btn-sm" style={{color:'#ef4444',borderColor:'rgba(239,68,68,0.3)',background:'none'}} onClick={()=>setEditLogo('')}>Remove</button>}
                <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={handleImageUpload}/>
              </div>
              <div style={{fontSize:10,color:'rgba(255,255,255,0.25)',marginBottom:16}}>Any format. Drag to reposition after upload.</div>

              {/* Message */}
              <div className="lbl" style={{marginBottom:6}}>Welcome Message</div>
              <input className="inp" placeholder='e.g. "Welcome back Cory! 🔥"' value={editMsg} onChange={e=>setEditMsg(e.target.value)} style={{marginBottom:6}}/>
              <div style={{fontSize:10,color:'rgba(255,255,255,0.25)',marginBottom:16}}>Shows below their name every time they log in. Leave blank for no message.</div>

              {/* Theme */}
              <div className="lbl" style={{marginBottom:8}}>Card Theme</div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6,marginBottom:20}}>
                {THEMES.map(t=>(
                  <button key={t.id} onClick={()=>setEditTheme(t.id)}
                    style={{padding:'8px 12px',borderRadius:8,border:'1.5px solid',borderColor:editTheme===t.id?'#10b981':'rgba(255,255,255,0.1)',background:t.bg,color:'#fff',fontSize:12,fontWeight:editTheme===t.id?700:400,cursor:'pointer',fontFamily:'inherit'}}>
                    {t.label}
                  </button>
                ))}
              </div>
            </div>

            {/* Footer */}
            <div style={{padding:'14px 20px',borderTop:'1px solid rgba(255,255,255,0.08)',display:'flex',gap:8,flexShrink:0}}>
              <button className="btn btn-g" style={{flex:1}} onClick={saveCard}>Save</button>
              {(cards[editing.id]?.message||cards[editing.id]?.logo)&&(
                <button className="btn" style={{color:'#ef4444',borderColor:'rgba(239,68,68,0.3)',background:'none'}} onClick={clearCard}>Clear</button>
              )}
              <button className="btn btn-gh" onClick={()=>setEditing(null)}>Cancel</button>
            </div>
          </div>
        </div>
      )}

      {/* Crop modal */}
      {cropModal&&cropImgEl&&(
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.85)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1100,padding:20}}>
          <div style={{background:'#1e293b',borderRadius:20,padding:'24px',width:'100%',maxWidth:340,textAlign:'center'}}>
            <div style={{fontSize:16,fontWeight:700,color:'#fff',marginBottom:4}}>Adjust photo</div>
            <div style={{fontSize:12,color:'rgba(255,255,255,0.4)',marginBottom:16}}>Drag to reposition · Pinch or scroll to zoom</div>
            {/* Canvas with circular clip */}
            <div style={{position:'relative',width:CROP_SIZE,height:CROP_SIZE,margin:'0 auto 16px',borderRadius:'50%',overflow:'hidden',border:'3px solid rgba(16,185,129,0.6)',cursor:'grab',userSelect:'none',touchAction:'none'}}
              onMouseDown={onCropMouseDown} onMouseMove={onCropMouseMove} onMouseUp={onCropMouseUp} onMouseLeave={onCropMouseUp}
              onTouchStart={onCropMouseDown} onTouchMove={onCropMouseMove} onTouchEnd={onCropMouseUp}
              onWheel={e=>{e.preventDefault();const delta=e.deltaY>0?0.9:1.1;setCropScale(s=>Math.max(0.3,Math.min(5,s*delta)));}}>

              <canvas ref={cropCanvasRef} width={CROP_SIZE} height={CROP_SIZE} style={{display:'block'}}/>
            </div>
            {/* Zoom controls */}
            <div style={{display:'flex',alignItems:'center',gap:8,justifyContent:'center',marginBottom:16}}>
              <button onClick={()=>setCropScale(s=>Math.max(0.3,s*0.85))} style={{background:'rgba(255,255,255,0.1)',border:'none',color:'#fff',width:32,height:32,borderRadius:'50%',fontSize:18,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>−</button>
              <span style={{fontSize:11,color:'rgba(255,255,255,0.4)',minWidth:40}}>Zoom</span>
              <button onClick={()=>setCropScale(s=>Math.min(5,s*1.15))} style={{background:'rgba(255,255,255,0.1)',border:'none',color:'#fff',width:32,height:32,borderRadius:'50%',fontSize:18,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>+</button>
            </div>
            <div style={{display:'flex',gap:8}}>
              <button className="btn btn-g" style={{flex:1}} onClick={confirmCrop}>Use this photo</button>
              <button className="btn btn-gh" onClick={()=>{setCropModal(false);setCropImg(null);}}>Cancel</button>
            </div>
          </div>
        </div>
      )}
      {toast&&<div className="toast toast-ok">{toast}</div>}
    </div>
  );
}

function SeasonTab(){
  const FEATURES=[
    {icon:"📅",title:"Season End Date",desc:"Set and display the official end date of the current season. Automatically highlights when the season is approaching its end. All players and admins can see the countdown in the main app."},
    {icon:"🗄️",title:"Archive Season",desc:"Snapshot the entire season — all rounds, scores, standings, and tournament fund — into a permanent archive. Start fresh for the next season without losing any historical data."},
    {icon:"📊",title:"Stats by Season",desc:"Break down attendance, winnings, and handicap trends by season. Players will eventually see season-specific stats in the Standings tab of the main app, with a season selector dropdown."},
    {icon:"💰",title:"Reset Tournament Fund",desc:"Safely zero out the tournament fund at season start after the payout. Keeps a full audit trail — previous fund total is recorded before reset. Requires master confirmation."},
    {icon:"🏆",title:"Season Awards",desc:"Generate end-of-season award summaries: most rounds played, most skins won, best net score average, biggest single-round winner, most improved handicap. Shareable as a formatted email."},
  ];

  return(<div>
    <div className="pg-eyebrow">Master Only</div>
    <div className="pg-title">Season Management</div>
    <div className="pg-sub">Planned features for end-of-season and multi-season tools</div>
    <div className="info-box">
      <strong>These features are coming soon.</strong> Building these in the portal means we can manage seasons without touching the main application. Nothing here is live yet.
    </div>
    {FEATURES.map((f,i)=>(
      <div key={i} className="card">
        <div className="card-hdr">
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <span style={{fontSize:20}}>{f.icon}</span>
            <span style={{fontSize:14,fontWeight:700,color:"#e2e8f0"}}>{f.title}</span>
          </div>
          <span style={{fontSize:9,fontWeight:800,padding:"3px 9px",borderRadius:20,background:"rgba(245,158,11,0.1)",color:"#fbbf24",border:"1px solid rgba(245,158,11,0.15)",textTransform:"uppercase",letterSpacing:"0.08em",whiteSpace:"nowrap"}}>Coming Soon</span>
        </div>
        <div className="card-body">
          <div style={{fontSize:13,color:"rgba(255,255,255,0.5)",lineHeight:1.75}}>{f.desc}</div>
        </div>
      </div>
    ))}
    <div style={{textAlign:"center",padding:"16px 0 8px",fontSize:11,color:"rgba(255,255,255,0.2)",lineHeight:1.8}}>Season Management · Master Only</div>
  </div>);
}

// ── ANNOUNCEMENTS TAB ────────────────────────────────────────────────────────
const ANNOUNCEMENT_CATEGORIES=[
  {id:"tournament",label:"Tournament",icon:"🏆",color:"#fbbf24",soft:"rgba(251,191,36,0.12)",border:"rgba(251,191,36,0.35)"},
  {id:"feature",   label:"New Feature",icon:"🎉",color:"#10b981",soft:"rgba(16,185,129,0.12)",border:"rgba(16,185,129,0.35)"},
  {id:"schedule",  label:"Schedule",icon:"📅",color:"#60a5fa",soft:"rgba(96,165,250,0.12)",border:"rgba(96,165,250,0.35)"},
  {id:"important", label:"Important",icon:"⚠️",color:"#f87171",soft:"rgba(248,113,113,0.12)",border:"rgba(248,113,113,0.35)"},
  {id:"general",   label:"General",icon:"💬",color:"#94a3b8",soft:"rgba(148,163,184,0.12)",border:"rgba(148,163,184,0.35)"},
];
function getAnnCategory(id){return ANNOUNCEMENT_CATEGORIES.find(c=>c.id===id)||ANNOUNCEMENT_CATEGORIES[4];}

function AnnounceTab({user}){
  const announcements=useDB("announcements");
  const [toast,showToast]=useToast();
  const [editing,setEditing]=useState(null); // null = closed, true = new, object = editing existing

  // Compose form state
  const [category,setCategory]=useState("general");
  const [title,setTitle]=useState("");
  const [body,setBody]=useState("");
  const [display,setDisplay]=useState("banner");
  const [dismissal,setDismissal]=useState("user");
  const [autoExpireDays,setAutoExpireDays]=useState(7);
  const [resetDismissals,setResetDismissals]=useState(false);
  const [saving,setSaving]=useState(false);
  const [err,setErr]=useState("");

  const TITLE_MAX=60;
  const BODY_MAX=400;
  const cat=getAnnCategory(category);

  // Open editing
  function openNew(){
    setCategory("general");setTitle("");setBody("");setDisplay("banner");
    setDismissal("user");setAutoExpireDays(7);setResetDismissals(false);
    setErr("");setEditing(true);
  }
  function openEdit(a){
    setCategory(a.category||"general");
    setTitle(a.title||"");setBody(a.body||"");
    setDisplay(a.display||"banner");
    setDismissal(a.dismissal||"user");
    setAutoExpireDays(7);
    setResetDismissals(false);
    setErr("");setEditing(a);
  }
  function closeEdit(){setEditing(null);}

  async function publish(){
    if(!title.trim()){setErr("Add a title");return;}
    if(title.length>TITLE_MAX){setErr(`Title too long (${TITLE_MAX} max)`);return;}
    if(body.length>BODY_MAX){setErr(`Message too long (${BODY_MAX} max)`);return;}
    setSaving(true);setErr("");
    const now=Date.now();
    const isEdit=editing&&typeof editing==="object";
    const data={
      category,title:title.trim(),body:body.trim(),
      display,dismissal,
      autoExpireAt:dismissal==="auto"?now+(autoExpireDays*24*60*60*1000):null,
      active:isEdit?(editing.active!==false):true,
      createdAt:isEdit?(editing.createdAt||now):now,
      createdBy:isEdit?(editing.createdBy||user?.email||"Admin"):(user?.email||"Admin"),
      updatedAt:isEdit?now:null,
    };
    try{
      if(isEdit){
        await wr("announcements/"+editing.key,data);
        if(resetDismissals){await dl("announcementDismissals/"+editing.key);}
        showToast("Announcement updated");
      }else{
        await ps("announcements",data);
        showToast("Announcement published");
      }
      closeEdit();
    }catch(e){setErr("Failed to save");setSaving(false);}
    setSaving(false);
  }

  async function togglePause(key,active){
    await wr("announcements/"+key+"/active",active);
    showToast(active?"Resumed":"Paused");
  }
  async function remove(key){
    if(!window.confirm("Delete this announcement?"))return;
    await dl("announcements/"+key);
    await dl("announcementDismissals/"+key);
    showToast("Deleted");
  }

  const all=Object.entries(announcements||{}).map(([k,a])=>({...a,key:k})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const now=Date.now();
  const active=all.filter(a=>a.active!==false&&(!a.autoExpireAt||a.autoExpireAt>now));
  const inactive=all.filter(a=>a.active===false||(a.autoExpireAt&&a.autoExpireAt<=now));

  return(<div className="main">
    <Toast {...toast}/>
    <div className="pg-eyebrow">Admin</div>
    <div className="pg-title">Announcements</div>
    <div className="pg-sub">Post messages to all members. Banner or modal display, with three dismissal modes. Members see new announcements in real-time.</div>

    {/* New announcement button */}
    {!editing&&(
      <button className="btn btn-g btn-full" onClick={openNew} style={{marginBottom:16,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New announcement
      </button>
    )}

    {/* Compose form (inline) */}
    {editing&&(
      <div className="card" style={{marginBottom:18,borderColor:"rgba(16,185,129,0.3)"}}>
        <div className="card-hdr">
          <div className="card-title">{typeof editing==="object"?"Edit Announcement":"New Announcement"}</div>
          <button className="btn btn-gh btn-xs" onClick={closeEdit}>Cancel</button>
        </div>
        <div className="card-body">
          {/* Category */}
          <div className="lbl">Category</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:6,marginBottom:14}}>
            {ANNOUNCEMENT_CATEGORIES.map(c=>(
              <button key={c.id} onClick={()=>setCategory(c.id)}
                style={{padding:"10px 4px",borderRadius:8,border:"1.5px solid",borderColor:category===c.id?c.border:"rgba(255,255,255,0.1)",background:category===c.id?c.soft:"rgba(255,255,255,0.04)",color:category===c.id?c.color:"rgba(255,255,255,0.5)",fontSize:10,fontWeight:700,cursor:"pointer",fontFamily:"inherit",display:"flex",flexDirection:"column",alignItems:"center",gap:3,transition:"all 0.15s"}}>
                <span style={{fontSize:18,lineHeight:1}}>{c.icon}</span>
                <span>{c.label}</span>
              </button>
            ))}
          </div>

          {/* Title */}
          <div className="lbl">Title</div>
          <input className="inp" type="text" placeholder="e.g. Tournament this Saturday" value={title} onChange={e=>{setTitle(e.target.value);setErr("");}} maxLength={TITLE_MAX+10} style={{marginBottom:4}}/>
          <div style={{fontSize:10,color:title.length>TITLE_MAX?"#ef4444":"rgba(255,255,255,0.3)",textAlign:"right",marginBottom:14}}>{title.length}/{TITLE_MAX}</div>

          {/* Body */}
          <div className="lbl">Message (optional)</div>
          <textarea className="inp" placeholder="Add details..." value={body} maxLength={BODY_MAX+20}
            onChange={e=>{
              setBody(e.target.value);
              setErr("");
              e.target.style.height="auto";
              e.target.style.height=Math.max(120, Math.min(420, e.target.scrollHeight))+"px";
            }}
            ref={el=>{
              if(el){
                requestAnimationFrame(()=>{
                  el.style.height="auto";
                  el.style.height=Math.max(120, Math.min(420, el.scrollHeight))+"px";
                });
              }
            }}
            style={{marginBottom:4,minHeight:120,resize:"none",overflow:"hidden",lineHeight:1.5,fontSize:14}}/>
          <div style={{fontSize:10,color:body.length>BODY_MAX?"#ef4444":"rgba(255,255,255,0.3)",textAlign:"right",marginBottom:14}}>{body.length}/{BODY_MAX}</div>

          {/* Display style */}
          <div className="lbl">Display style</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
            {[{id:"banner",icon:"📌",label:"Banner",sub:"Top of app, dismissable"},{id:"modal",icon:"📢",label:"Modal",sub:"Full popup, forces attention"}].map(d=>(
              <button key={d.id} onClick={()=>setDisplay(d.id)}
                style={{padding:"14px 10px",borderRadius:8,border:"1.5px solid",borderColor:display===d.id?"rgba(16,185,129,0.4)":"rgba(255,255,255,0.1)",background:display===d.id?"rgba(16,185,129,0.1)":"rgba(255,255,255,0.04)",color:display===d.id?"#10b981":"rgba(255,255,255,0.5)",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
                <span style={{fontSize:18}}>{d.icon}</span>{d.label}
                <span style={{fontSize:9,opacity:0.8,fontWeight:500}}>{d.sub}</span>
              </button>
            ))}
          </div>

          {/* Dismissal */}
          <div className="lbl">When dismissed</div>
          <div style={{display:"flex",flexDirection:"column",gap:5,marginBottom:14}}>
            {[
              {id:"user",label:"Stays until each user dismisses it",sub:"No expiration — each person dismisses when ready"},
              {id:"session",label:"Resets every time the app opens",sub:"Even if dismissed, comes back next session"},
              {id:"auto",label:"Auto-removes for everyone after X days",sub:"Users can still dismiss early — the date is just a cutoff"},
            ].map(d=>(
              <button key={d.id} onClick={()=>setDismissal(d.id)}
                style={{padding:"10px 12px",borderRadius:8,border:"1.5px solid",borderColor:dismissal===d.id?"rgba(16,185,129,0.4)":"rgba(255,255,255,0.1)",background:dismissal===d.id?"rgba(16,185,129,0.1)":"rgba(255,255,255,0.04)",cursor:"pointer",fontFamily:"inherit",textAlign:"left",display:"flex",alignItems:"center",gap:8}}>
                <div style={{width:14,height:14,borderRadius:"50%",border:"2px solid",borderColor:dismissal===d.id?"#10b981":"rgba(255,255,255,0.2)",background:dismissal===d.id?"#10b981":"transparent",flexShrink:0}}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12,fontWeight:700,color:dismissal===d.id?"#10b981":"#e2e8f0"}}>{d.label}</div>
                  <div style={{fontSize:10,color:"rgba(255,255,255,0.4)",marginTop:1}}>{d.sub}</div>
                </div>
              </button>
            ))}
          </div>
          {dismissal==="auto"&&(
            <div style={{display:"flex",alignItems:"center",gap:8,padding:"10px 12px",background:"rgba(255,255,255,0.04)",borderRadius:8,marginBottom:14}}>
              <span style={{fontSize:12,color:"rgba(255,255,255,0.7)"}}>Auto-remove after</span>
              <input type="number" className="inp" value={autoExpireDays} min={1} max={365} onChange={e=>setAutoExpireDays(parseInt(e.target.value)||7)} style={{width:70,padding:"6px 8px"}}/>
              <span style={{fontSize:12,color:"rgba(255,255,255,0.7)"}}>days</span>
            </div>
          )}

          {/* Reset dismissals (edit only) */}
          {editing&&typeof editing==="object"&&(
            <div onClick={()=>setResetDismissals(v=>!v)} style={{display:"flex",alignItems:"center",gap:8,padding:"10px 12px",borderRadius:8,border:"1.5px solid",borderColor:resetDismissals?"rgba(245,158,11,0.4)":"rgba(255,255,255,0.1)",background:resetDismissals?"rgba(245,158,11,0.1)":"rgba(255,255,255,0.04)",cursor:"pointer",marginBottom:14}}>
