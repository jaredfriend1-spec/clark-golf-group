<title>Clark Golf — Portal</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:"DM Sans",sans-serif;background:#0A1614;color:#e2e8f0;-webkit-font-smoothing:antialiased}
.shell{display:flex;min-height:100vh;flex-direction:column}

/* ── Topbar ── */
.topbar{background:#0A1614;background-image:radial-gradient(ellipse at 0% 0%,rgba(16,185,129,0.18) 0%,transparent 60%);border-bottom:1px solid rgba(255,255,255,0.07);padding:env(safe-area-inset-top) 14px 0;height:calc(env(safe-area-inset-top) + 56px);display:flex;align-items:center;gap:10px;flex-shrink:0;position:sticky;top:0;z-index:100;flex-wrap:nowrap;overflow:hidden}
.logo{font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:800;color:#fff;letter-spacing:-0.01em}
.logo em{color:#10b981;font-style:normal}
.logo-sub{font-size:10px;font-weight:700;color:rgba(255,255,255,0.25);letter-spacing:0.1em;text-transform:uppercase;margin-left:2px;margin-top:2px}
.role-badge{font-size:9px;font-weight:800;padding:3px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:0.08em;flex-shrink:0}
.rb-master{background:linear-gradient(135deg,#f59e0b,#d97706);color:#1e293b}
.rb-superadmin{background:rgba(16,185,129,0.15);color:#34d399;border:1px solid rgba(16,185,129,0.25)}

/* ── Body / Sidebar / Main ── */
.body{display:flex;flex:1;overflow:hidden}
.sidebar{width:210px;background:#0d1c18;border-right:1px solid rgba(255,255,255,0.06);padding:14px 10px;flex-shrink:0;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
@media(max-width:680px){.sidebar{display:none}.mob-nav{display:flex!important}}
.mob-nav{display:none;position:sticky;top:calc(env(safe-area-inset-top) + 56px);left:0;right:0;background:#0d1c18;border-bottom:1px solid rgba(255,255,255,0.08);z-index:99;padding:5px 8px;flex-wrap:wrap;justify-content:center;gap:2px}
.mob-btn{min-width:50px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 5px;border:none;background:none;color:rgba(255,255,255,0.3);font-size:9px;font-weight:700;cursor:pointer;font-family:"DM Sans",sans-serif;text-transform:uppercase;letter-spacing:0.04em;transition:all 0.15s;border-radius:7px}
.mob-btn.on{color:#10b981;background:rgba(16,185,129,0.12)}
.mob-btn svg{width:18px;height:18px}
.nav-sep{font-size:9px;font-weight:700;color:rgba(255,255,255,0.15);text-transform:uppercase;letter-spacing:0.1em;padding:12px 8px 4px;margin-top:4px}
.ni{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:8px;border:none;background:none;color:rgba(255,255,255,0.38);font-size:12px;font-weight:600;cursor:pointer;font-family:"DM Sans",sans-serif;width:100%;text-align:left;transition:all 0.12s}
.ni:hover{background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.75)}
.ni.on{background:rgba(16,185,129,0.12);color:#10b981}
.ni svg{width:15px;height:15px;flex-shrink:0}
.ni-foot{margin-top:auto;padding-top:10px;border-top:1px solid rgba(255,255,255,0.06)}
.main{flex:1;padding:22px 24px;overflow-y:auto;padding-bottom:80px;max-width:880px;background:#0c1a15}
@media(max-width:680px){.main{padding:14px 12px;padding-bottom:32px}}

/* ── Cards ── */
.card{background:#132318;border:1px solid rgba(255,255,255,0.09);border-radius:14px;margin-bottom:14px;overflow:hidden}
.card-hdr{padding:13px 16px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-title{font-size:11px;font-weight:700;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:0.09em}
.card-body{padding:14px 16px}

/* ── Stat grid ── */
.stat-grid{display:grid;gap:10px;margin-bottom:14px}
.sg-3{grid-template-columns:repeat(3,1fr)}
.sg-4{grid-template-columns:repeat(4,1fr)}
.sg-2{grid-template-columns:repeat(2,1fr)}
@media(max-width:500px){.sg-3,.sg-4{grid-template-columns:1fr 1fr}}
.stat{background:#132318;border:1px solid rgba(255,255,255,0.09);border-radius:12px;padding:14px 16px}
.stat-v{font-family:"Barlow Condensed",sans-serif;font-size:30px;font-weight:800;line-height:1}
.stat-l{font-size:9px;font-weight:700;color:rgba(255,255,255,0.28);text-transform:uppercase;letter-spacing:0.07em;margin-top:4px}

/* ── Day cards ── */
.day-card{background:#132318;border:1px solid rgba(255,255,255,0.09);border-radius:14px;margin-bottom:10px;overflow:hidden}
.day-hdr{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;transition:background 0.12s}
.day-hdr:hover{background:rgba(255,255,255,0.04)}
.day-name{font-family:"Barlow Condensed",sans-serif;font-size:18px;font-weight:800;color:#fff}
.day-date{font-size:11px;color:rgba(255,255,255,0.3);margin-top:1px}
.day-body{padding:14px 16px;border-top:1px solid rgba(255,255,255,0.07);background:#0e1d19}

/* ── Status dots ── */
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot-g{background:#10b981;box-shadow:0 0 6px rgba(16,185,129,0.5)}
.dot-a{background:#f59e0b;box-shadow:0 0 6px rgba(245,158,11,0.4)}
.dot-r{background:#ef4444;box-shadow:0 0 6px rgba(239,68,68,0.4)}
.dot-gray{background:rgba(255,255,255,0.2)}

/* ── Rows ── */
.s-row{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid rgba(255,255,255,0.07)}
.s-row:last-child{border-bottom:none}
.p-row{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid rgba(255,255,255,0.07)}
.p-row:last-child{border-bottom:none}
.p-name{font-size:13px;font-weight:600;color:#e2e8f0;flex:1}
.p-sub{font-size:11px;color:rgba(255,255,255,0.3);margin-top:1px}

/* ── Badges ── */
.b{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:0.03em;margin:2px 2px 2px 0}
.b-g{background:rgba(16,185,129,0.12);color:#34d399;border:1px solid rgba(16,185,129,0.18)}
.b-r{background:rgba(239,68,68,0.1);color:#f87171;border:1px solid rgba(239,68,68,0.14)}
.b-b{background:rgba(59,130,246,0.1);color:#60a5fa;border:1px solid rgba(59,130,246,0.14)}
.b-a{background:rgba(245,158,11,0.1);color:#fbbf24;border:1px solid rgba(245,158,11,0.14)}
.b-p{background:rgba(139,92,246,0.1);color:#a78bfa;border:1px solid rgba(139,92,246,0.14)}
.b-gray{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.35);border:1px solid rgba(255,255,255,0.1)}

/* ── Buttons ── */
.btn{padding:7px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:"DM Sans",sans-serif;border:none;transition:all 0.12s;white-space:nowrap}
.btn:active{transform:scale(0.97)}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.btn-g{background:#10b981;color:#fff}.btn-g:hover{background:#059669}
.btn-r{background:#ef4444;color:#fff}.btn-r:hover{background:#dc2626}
.btn-b{background:#3b82f6;color:#fff}
.btn-a{background:#f59e0b;color:#1e293b}
.btn-gh{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.55);border:1px solid rgba(255,255,255,0.1)}.btn-gh:hover{background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.8)}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-xs{padding:3px 8px;font-size:10px}
.btn-full{width:100%;padding:11px 14px;font-size:13px}

/* ── Inputs ── */
.inp{width:100%;padding:10px 13px;border-radius:9px;border:1.5px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.08);color:#e2e8f0;font-size:13px;font-family:"DM Sans",sans-serif;outline:none;transition:border-color 0.15s}
.inp:focus{border-color:#10b981}
.inp::placeholder{color:rgba(255,255,255,0.2)}
textarea.inp{resize:vertical;min-height:80px;line-height:1.6}
select.inp{cursor:pointer}
select.inp option{background:#0d1c18;color:#e2e8f0;padding:8px}
select.inp option:checked{background:#10b981;color:#fff}

/* ── Toast ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:10px;font-size:12px;font-weight:700;z-index:9999;pointer-events:none;font-family:"DM Sans",sans-serif;white-space:nowrap;box-shadow:0 4px 24px rgba(0,0,0,0.5)}
.toast-ok{background:#10b981;color:#fff}
.toast-err{background:#ef4444;color:#fff}
.toast-info{background:#3b82f6;color:#fff}

/* ── Modal / Overlay ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px;backdrop-filter:blur(6px)}
.modal{background:#173020;border:1px solid rgba(255,255,255,0.12);border-radius:16px;width:100%;max-width:380px;padding:24px;max-height:90vh;overflow-y:auto}

/* ── Gate ── */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#0A1614;background-image:radial-gradient(ellipse at 20% 0%,rgba(16,185,129,0.18) 0%,transparent 55%)}
.gate-box{width:100%;max-width:390px}
.gate-logo{font-family:"Barlow Condensed",sans-serif;font-size:42px;font-weight:800;color:#fff;text-align:center;margin-bottom:4px;letter-spacing:-0.01em}
.gate-logo em{color:#10b981;font-style:normal}
.gate-sub{text-align:center;font-size:11px;color:rgba(255,255,255,0.28);margin-bottom:28px;letter-spacing:0.08em;text-transform:uppercase;font-weight:600}
.gate-card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:18px;padding:26px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.gate-lbl{font-size:10px;font-weight:700;color:rgba(255,255,255,0.35);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:5px}

/* ── Section tabs (within tabs) ── */
.mtab{flex:1;padding:7px;text-align:center;border:none;background:none;color:rgba(255,255,255,0.35);font-size:11px;font-weight:700;cursor:pointer;border-radius:7px;font-family:"DM Sans",sans-serif;transition:all 0.12s}
.mtab.on{background:rgba(16,185,129,0.12);color:#10b981}
.sec-tabs{display:flex;gap:4px;background:rgba(255,255,255,0.06);border-radius:10px;padding:3px;margin-bottom:16px;border:1px solid rgba(255,255,255,0.09)}
@media(max-width:540px){.sec-tabs{flex-direction:column}.sec-tabs .mtab{text-align:left;padding:9px 12px}}
.srch{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,0.06)}

/* ── Page headers ── */
.pg-eyebrow{font-size:10px;font-weight:700;color:#10b981;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:4px}
.pg-title{font-family:"Barlow Condensed",sans-serif;font-size:26px;font-weight:800;color:#fff;margin-bottom:2px}
.pg-sub{font-size:12px;color:rgba(255,255,255,0.35);margin-bottom:18px}

/* ── Misc ── */
.chk-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
.chk-item:last-child{border-bottom:none}
.chk-box{width:18px;height:18px;border-radius:5px;border:1.5px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.15s}
.chk-box.checked{background:#10b981;border-color:#10b981}
.warn{background:rgba(239,68,68,0.07);border:1px solid rgba(239,68,68,0.15);border-radius:10px;padding:12px 14px;font-size:12px;color:rgba(255,255,255,0.5);line-height:1.7;margin-bottom:12px}
.warn strong{color:#fca5a5}
.info-box{background:rgba(59,130,246,0.07);border:1px solid rgba(59,130,246,0.15);border-radius:10px;padding:12px 14px;font-size:12px;color:rgba(255,255,255,0.5);line-height:1.7;margin-bottom:12px}
.info-box strong{color:#93c5fd}
.email-preview{background:#fff;border-radius:12px;padding:24px;color:#0f172a;font-family:"DM Sans",sans-serif;font-size:13px;line-height:1.8}
.email-preview h2{font-size:16px;font-weight:700;border-bottom:2px solid #e2e8f0;padding-bottom:6px;margin-bottom:12px;margin-top:14px}
.email-preview h2:first-child{margin-top:0}
.email-preview h3{font-size:13px;font-weight:700;margin:12px 0 4px;color:#0f172a}
.email-preview p{margin-bottom:8px}
.email-preview strong{font-weight:700;color:#0f172a}
.lbl{font-size:10px;font-weight:700;color:rgba(255,255,255,0.35);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:5px}

/* ── Desktop ── */
@media(min-width:900px){
  html{font-size:15px}

  /* Topbar */
  .topbar{height:66px;padding:0 36px;gap:16px}
  .logo{font-size:28px}
  .logo-sub{font-size:11px;margin-top:3px}
  .role-badge{font-size:10px;padding:4px 12px}

  /* Sidebar — wider, more readable */
  .sidebar{width:240px;padding:20px 14px;gap:3px}
  .ni{font-size:13px;padding:11px 13px;gap:11px;border-radius:9px}
  .ni svg{width:17px;height:17px}
  .nav-sep{font-size:10px;padding:14px 10px 5px}

  /* Main content — full desktop width */
  .main{padding:36px 48px;max-width:none;background:#0c1a15}

  /* Page headers */
  .pg-eyebrow{font-size:11px;margin-bottom:5px}
  .pg-title{font-family:"Barlow Condensed",sans-serif;font-size:38px;margin-bottom:4px}
  .pg-sub{font-size:14px;margin-bottom:24px}

  /* Cards */
  .card{border-radius:16px;margin-bottom:18px}
  .card-hdr{padding:16px 24px}
  .card-title{font-size:12px;letter-spacing:0.1em}
  .card-body{padding:22px 24px}

  /* Stat cards */
  .stat{padding:20px 22px;border-radius:14px}
  .stat-v{font-size:40px}
  .stat-l{font-size:10px;margin-top:6px}
  .sg-3{gap:14px}
  .sg-4{gap:14px}

  /* Day cards */
  .day-card{border-radius:14px;margin-bottom:14px}
  .day-hdr{padding:18px 24px}
  .day-name{font-size:22px}
  .day-date{font-size:12px}
  .day-body{padding:18px 24px}

  /* Rows */
  .p-row{padding:14px 24px}
  .p-name{font-size:15px}
  .p-sub{font-size:12px}
  .s-row{padding:13px 24px}

  /* Buttons */
  .btn{font-size:13px;padding:10px 18px;border-radius:9px}
  .btn-sm{font-size:12px;padding:8px 14px}
  .btn-xs{padding:5px 10px;font-size:11px}
  .btn-full{font-size:14px;padding:13px 18px}

  /* Inputs */
  .inp{font-size:14px;padding:12px 16px;border-radius:10px}
  textarea.inp{min-height:100px}

  /* Info/warn */
  .info-box,.warn{font-size:13px;padding:16px 20px;border-radius:12px}

  /* Misc */
  .chk-item{padding:11px 0}
  .chk-box{width:20px;height:20px}
  .toast{font-size:14px;padding:12px 24px}
  .modal{max-width:500px;padding:32px;border-radius:20px}
  .email-preview{font-size:14px;padding:32px;border-radius:14px}
  .srch{padding:14px 20px}
  .sec-tabs{margin-bottom:20px}
  .mtab{font-size:12px;padding:9px}
  .lbl{font-size:11px;margin-bottom:6px}
}

/* Extra wide — use more space */
@media(min-width:1200px){
  .sidebar{width:260px}
  .main{padding:40px 60px}
  .pg-title{font-size:42px}
  .stat-v{font-size:44px}
}
@media(min-width:1600px){
  .main{padding:48px 80px;max-width:1400px}
}

</style>

function Gate({onAuth}){
  const [method,setMethod]=useState("email");
  const [email,setEmail]=useState("");
  const [pw,setPw]=useState("");
  const [pw2,setPw2]=useState("");
  const [info,setInfo]=useState("");
  const [createMode,setCreateMode]=useState(false);
  const [err,setErr]=useState("");
  const [loading,setLoading]=useState(false);
  const [dbOk,setDbOk]=useState(null);
  const settings=useDB("settings");
  const portalUsers=useDB("settings/portalUsers");
  const portalPasswords=useDB("settings/portalPasswords");
  const rosterAdmins=useDB("rosterAdmins");
  const rosterEdits=useDB("rosterEdits");

  useEffect(()=>{
    fetch(FB.databaseURL+"/settings/tournFundStartingBalance.json")
      .then(r=>r.json()).then(()=>setDbOk(true)).catch(()=>setDbOk(false));
  },[]);

  function resolveRole(emailAddr){
    if(!emailAddr)return null;
    const pu=Object.values(portalUsers||{});
    const match=pu.find(u=>u.email&&u.email.toLowerCase()===emailAddr.toLowerCase());
    return match?(match.role||"superadmin"):null;
  }

  async function signInEmail(){
    if(!email.trim()||!pw.trim()){setErr("Enter email and password");return;}
    setLoading(true);setErr("");
    try{
      const cred=await auth.signInWithEmailAndPassword(email.trim(),pw);
      const role=resolveRole(cred.user.email);
      if(!role){await auth.signOut();setErr("This email signed in, but it isn’t authorized for the portal. Ask the master to add it under Settings → Portal Users.");setLoading(false);return;}
      ps("activityLog",{action:"portal_login",name:cred.user.email,role,method:"email",ts:Date.now()});
      onAuth({email:cred.user.email,role,method:"firebase"});
    }catch(e){
      if(e.code==="auth/configuration-not-found"||e.code==="auth/operation-not-allowed"){
        setErr("Firebase Auth not enabled. Enable Email/Password in Firebase Console → Authentication, or use the Password tab.");
      }else if(e.code==="auth/wrong-password"||e.code==="auth/user-not-found"||e.code==="auth/invalid-credential"){
        setErr("Incorrect email or password.");
      }else{setErr("Sign in failed: "+e.message);}
      setLoading(false);
    }
  }

  async function createAccount(){
    if(!email.trim()||!pw.trim()){setErr("Enter email and a new password");return;}
    if(pw.length<6){setErr("Password must be at least 6 characters (Firebase minimum).");return;}
    if(pw!==pw2){setErr("Passwords don’t match.");return;}
    if(!resolveRole(email.trim())){setErr("That email isn’t on the authorized list — the master must add it under Settings → Portal Users first.");return;}
    setLoading(true);setErr("");
    try{
      const cred=await auth.createUserWithEmailAndPassword(email.trim(),pw);
      const role=resolveRole(cred.user.email);
      ps("activityLog",{action:"portal_account_created",name:cred.user.email,role,ts:Date.now()});
      onAuth({email:cred.user.email,role,method:"firebase"});
    }catch(e){
      if(e.code==="auth/email-already-in-use")setErr("An account already exists for that email — use Sign In (or Forgot password).");
      else if(e.code==="auth/weak-password")setErr("Password too weak — use at least 6 characters.");
      else setErr("Could not create account: "+e.message);
      setLoading(false);
    }
  }
  async function forgotPassword(){
    if(!email.trim()){setErr("Type your email above first, then tap Forgot password.");return;}
    try{await auth.sendPasswordResetEmail(email.trim());setErr("");setInfo("Reset link sent to "+email.trim()+" — check your inbox (and spam).");}
    catch(e){setErr("Could not send reset: "+e.message);}
  }

  return(
    <div className="gate">
      <div className="gate-box">
        <div className="gate-logo">Clark <em>Golf</em> Portal</div>
        <div className="gate-sub">Admin access only</div>
        <div className="gate-card">
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16,padding:"8px 10px",background:"rgba(255,255,255,0.03)",borderRadius:8}}>
            <div className={`dot ${dbOk===null?"dot-a":dbOk?"dot-g":"dot-r"}`}/>
            <span style={{fontSize:11,color:"rgba(255,255,255,0.4)"}}>{dbOk===null?"Checking database…":dbOk?"Database connected · Main app unaffected":"Database unreachable"}</span>
          </div>
          <div style={{display:"flex",gap:3,background:"rgba(255,255,255,0.04)",borderRadius:9,padding:3,marginBottom:18}}>
          </div>
          {err&&<div style={{background:"rgba(239,68,68,0.08)",border:"1px solid rgba(239,68,68,0.15)",borderRadius:8,padding:"9px 12px",fontSize:12,color:"#fca5a5",marginBottom:14,lineHeight:1.5}}>{err}</div>}
          {info&&<div style={{background:"rgba(54,165,111,0.08)",border:"1px solid rgba(54,165,111,0.2)",borderRadius:8,padding:"9px 12px",fontSize:12,color:"#4ade80",marginBottom:14,lineHeight:1.5}}>{info}</div>}
          
            <div>
              <div className="gate-lbl">Email</div>
              <input className="inp" type="email" value={email} onChange={e=>{setEmail(e.target.value);setInfo("");}} placeholder="your@email.com" style={{marginBottom:10}} autoFocus/>
              <div className="gate-lbl">{createMode?"Choose a password (6+ chars)":"Password"}</div>
              <input className="inp" type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&(createMode?null:signInEmail())} placeholder="Password" style={{marginBottom:10}}/>
              {createMode&&(<React.Fragment>
                <div className="gate-lbl">Confirm password</div>
                <input className="inp" type="password" value={pw2} onChange={e=>setPw2(e.target.value)} onKeyDown={e=>e.key==="Enter"&&createAccount()} placeholder="Same password again" style={{marginBottom:10}}/>
              </React.Fragment>)}
              {createMode
                ? <button className="btn btn-g btn-full" onClick={createAccount} disabled={loading}>{loading?"Creating…":"Create My Account →"}</button>
                : <button className="btn btn-g btn-full" onClick={signInEmail} disabled={loading}>{loading?"Signing in…":"Sign In →"}</button>}
              <div style={{display:"flex",justifyContent:"space-between",marginTop:12}}>
                <button onClick={()=>{setCreateMode(m=>!m);setErr("");setInfo("");}} style={{background:"none",border:"none",cursor:"pointer",color:"rgba(255,255,255,0.45)",fontSize:11.5,fontFamily:"inherit",textDecoration:"underline"}}>{createMode?"‹ Back to sign in":"First time? Create your password"}</button>
                {!createMode&&<button onClick={forgotPassword} style={{background:"none",border:"none",cursor:"pointer",color:"rgba(255,255,255,0.45)",fontSize:11.5,fontFamily:"inherit",textDecoration:"underline"}}>Forgot password?</button>}
              </div>
              <div style={{fontSize:10,color:"rgba(255,255,255,0.2)",textAlign:"center",marginTop:12,lineHeight:1.7}}>Only emails the master has listed under Settings → Portal Users can create accounts or sign in.</div>
            </div>

        </div>
        <div style={{textAlign:"center",marginTop:16}}>
          <a href="index.html" style={{display:"inline-block",fontSize:11,fontWeight:600,color:"rgba(255,255,255,0.22)",letterSpacing:"0.04em",textDecoration:"none",padding:"6px 14px",borderRadius:20,border:"1px solid rgba(255,255,255,0.1)"}}>← Back to App</a>
        </div>
        <div style={{textAlign:"center",marginTop:10,fontSize:10,color:"rgba(255,255,255,0.15)",letterSpacing:"0.03em"}}>App by <strong style={{color:"rgba(255,255,255,0.25)"}}>Jared Friend</strong></div>
      </div>
    </div>
  );
}

// ── CLEAR LOGIN LOG BUTTON (typed confirm) ────────────────────────────────────
function ClearLoginLogBtn({logEntries}){
  const [clearing,setClearing]=useState(false);
  const [typed,setTyped]=useState("");
  function doClear(){
    if(typed!=="DELETE")return;
    logEntries.forEach(e=>{if(e.key)dl("activityLog/"+e.key);});
    setClearing(false);setTyped("");
  }
  return(
    <div style={{padding:"12px 16px",borderTop:"1px solid rgba(255,255,255,0.05)"}}>
      {!clearing?(
        <button onClick={()=>setClearing(true)} style={{fontSize:11,color:"#f87171",background:"rgba(239,68,68,0.08)",border:"1px solid rgba(239,68,68,0.15)",borderRadius:8,padding:"7px 14px",cursor:"pointer",fontFamily:"DM Sans,sans-serif",fontWeight:600}}>🗑 Clear Login History ({logEntries.length})</button>
      ):(
        <div>
          <div style={{fontSize:12,color:"#f87171",fontWeight:600,marginBottom:6}}>Type DELETE to confirm clearing {logEntries.length} login entries</div>
          <div style={{display:"flex",gap:6}}>
            <input className="inp" style={{flex:1,fontSize:12}} placeholder="DELETE" value={typed} onChange={e=>setTyped(e.target.value)}/>
            <button className="btn btn-r btn-sm" disabled={typed!=="DELETE"} onClick={doClear}>Clear</button>
            <button className="btn btn-gh btn-sm" onClick={()=>{setClearing(false);setTyped("");}}>Cancel</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ONE formula for the tournament fund everywhere: $1 × every recorded attendance player-round (season window if locked). No surplus, no starting balance.
const seasonBound=(season)=>((season&&season.endDate)?{closedAt:String(season.endDate)}:null);   // rounds ON the end date are IN season
const tournFundFromAttendance=(roundsNode,lock)=>{const rs=roundsNode?(Array.isArray(roundsNode)?roundsNode:Object.values(roundsNode)):[];return rs.reduce((s,r)=>{if(!r)return s;if(lock&&lock.closedAt&&String(r.date||"")>lock.closedAt)return s;return s+((r.players)||[]).length;},0);};

  useEffect(()=>{
    fetch("https://clark-golf-group-two.vercel.app/",{mode:"no-cors"}).then(()=>setAppOk(true)).catch(()=>setAppOk(false));
  },[]);

  // Master-only Firebase Inspector — lists every top-level key with record count
  useEffect(()=>{
    if(!isMaster(user.role)||!db||!showInspect)return;
    db.ref().once("value").then(snap=>{
      const v=snap.val()||{};
      const items=Object.keys(v).map(k=>{
        const node=v[k];
        let count="—";
        if(node&&typeof node==="object"){
          // Try a couple common nesting patterns
          if(Object.keys(node).length>0){
            const first=Object.values(node)[0];
            if(first&&typeof first==="object"&&!Array.isArray(first)){
              count=Object.keys(node).length;
            }else{
              count=Object.keys(node).length+" fields";
            }
          }else{count=0;}
        }else{count=String(node).slice(0,30);}
        return{key:k,count};
      }).sort((a,b)=>a.key.localeCompare(b.key));
      setFbInspect(items);
    }).catch(e=>setFbInspect([{key:"(error)",count:e.message}]));
  },[user.role,showInspect]);

  const activeDays=safeArr(week?.activeDays).filter(d=>GOLF_DAYS.includes(d));

      </div>

      <div className="card">
        <div className="card-hdr"><span className="card-title">Players Each Day</span></div>
        {playersByDay.length===0&&<div style={{padding:"14px 16px",fontSize:12,color:"rgba(255,255,255,0.3)"}}>No active days this week.</div>}

        const loginEntries=logEntries.filter(e=>["login","self_register","portal_login"].includes(e.action));
        const relTime=ts=>{const d=Date.now()-ts;return d<60000?"just now":d<3600000?Math.round(d/60000)+"m ago":d<86400000?Math.round(d/3600000)+"h ago":Math.round(d/86400000)+"d ago";};
        const ACFG={signup:{label:"Signed up",color:"#34d399",icon:"👤"},remove_signup:{label:"Removed",color:"#f87171",icon:"✕"},teams_published:{label:"Teams published",color:"#60a5fa",icon:"✓"},day_setup:{label:"Day activated",color:"#a78bfa",icon:"📅"},week_started:{label:"New week",color:"#e2e8f0",icon:"🗓"},roster_add:{label:"Added to roster",color:"#34d399",icon:"➕"},roster_remove:{label:"Removed",color:"#f87171",icon:"−"},match_request:{label:"Match request",color:"#60a5fa",icon:"⚡"},waitlist_join:{label:"Joined waitlist",color:"#fbbf24",icon:"⏳"},waitlist_remove:{label:"Left waitlist",color:"rgba(255,255,255,0.4)",icon:"↩"},portal_login:{label:"Portal login",color:"#818cf8",icon:"🛡️"}};

        return(<>
          <div className="card">
            <div className="card-hdr" style={{cursor:"pointer"}} onClick={()=>setShowActivityLog(v=>!v)}>

                {activityEntries.length>0&&<span style={{fontSize:10,fontWeight:700,background:"rgba(255,255,255,0.08)",color:"rgba(255,255,255,0.4)",padding:"2px 7px",borderRadius:20}}>{activityEntries.length}</span>}

            {showActivityLog&&(
              <div>
                {activityEntries.length===0&&<div style={{padding:"14px 16px",fontSize:12,color:"rgba(255,255,255,0.3)"}}>No activity recorded yet.</div>}
                <div style={{maxHeight:400,overflowY:"auto"}}>
                  {activityEntries.slice(0,50).map((e,i)=>{
                    const c=ACFG[e.action]||{label:e.action?.replace(/_/g," ")||"?",color:"rgba(255,255,255,0.5)",icon:"•"};
                    return(
                      <div key={e.key||i} className="s-row" style={{gap:10}}>
                        <span style={{fontSize:14,flexShrink:0,width:18,textAlign:"center"}}>{c.icon}</span>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                            <span style={{fontSize:11,fontWeight:700,color:c.color}}>{c.label}</span>
                            {e.name&&<span style={{fontSize:12,fontWeight:600,color:"#e2e8f0"}}>{e.name}</span>}
                            {e.day&&<span style={{fontSize:11,color:"rgba(255,255,255,0.35)"}}>— {e.day}</span>}
                          </div>
                          <div style={{fontSize:10,color:"rgba(255,255,255,0.25)",marginTop:1}}>
                            {e.by&&e.by!=="admin"&&e.by!=="player"?e.by+" · ":""}{relTime(e.ts||0)}
                            {e.byRole&&<span style={{fontSize:9,fontWeight:700,padding:"1px 5px",borderRadius:20,marginLeft:6,background:e.byRole==="admin"?"rgba(245,158,11,0.15)":"rgba(16,185,129,0.15)",color:e.byRole==="admin"?"#fbbf24":"#34d399"}}>{e.byRole}</span>}
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
                {activityEntries.length>50&&<div style={{padding:"8px 16px",fontSize:10,color:"rgba(255,255,255,0.25)",textAlign:"center"}}>Showing 50 of {activityEntries.length}</div>}
              </div>
            )}
          </div>

          <div className="card">
            <div className="card-hdr" style={{cursor:"pointer"}} onClick={()=>setShowLoginLog(v=>!v)}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span className="card-title">🔑 Login Log</span>
                {loginEntries.length>0&&<span style={{fontSize:10,fontWeight:700,background:"rgba(255,255,255,0.08)",color:"rgba(255,255,255,0.4)",padding:"2px 7px",borderRadius:20}}>{loginEntries.length}</span>}
              </div>
              <span style={{fontSize:11,color:"rgba(255,255,255,0.4)"}}>{showLoginLog?"▲":"▼"}</span>
            </div>
            {showLoginLog&&(
              <div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,padding:"14px 16px",borderBottom:"1px solid rgba(255,255,255,0.05)"}}>
                  <div style={{background:"rgba(99,102,241,0.12)",borderRadius:8,padding:"8px",textAlign:"center"}}>
                    <div style={{fontFamily:"Barlow Condensed,sans-serif",fontSize:22,fontWeight:800,color:"#818cf8"}}>{loginEntries.filter(e=>e.action==="login"&&e.byRole!=="admin").length}</div>
                    <div style={{fontSize:9,fontWeight:700,color:"rgba(255,255,255,0.4)",textTransform:"uppercase",letterSpacing:"0.06em"}}>Member Logins</div>
                  </div>
                  <div style={{background:"rgba(245,158,11,0.12)",borderRadius:8,padding:"8px",textAlign:"center"}}>
                    <div style={{fontFamily:"Barlow Condensed,sans-serif",fontSize:22,fontWeight:800,color:"#fbbf24"}}>{loginEntries.filter(e=>e.action==="login"&&e.byRole==="admin").length}</div>
                    <div style={{fontSize:9,fontWeight:700,color:"rgba(255,255,255,0.4)",textTransform:"uppercase",letterSpacing:"0.06em"}}>Admin Logins</div>
                  </div>
                </div>
                {loginEntries.length===0&&<div style={{padding:"14px 16px",fontSize:12,color:"rgba(255,255,255,0.3)"}}>No login events recorded.</div>}
                <div style={{maxHeight:300,overflowY:"auto"}}>
                  {loginEntries.slice(0,30).map((e,i)=>(
                    <div key={e.key||i} className="s-row" style={{gap:10}}>
                      <span style={{fontSize:14,flexShrink:0,width:18,textAlign:"center"}}>{e.action==="portal_login"?"🛡️":e.action==="self_register"?"📱":"🔑"}</span>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:12,fontWeight:600,color:"#e2e8f0"}}>{e.name||"Unknown"}</div>
                        <div style={{fontSize:10,color:"rgba(255,255,255,0.25)"}}>
                          {e.action==="portal_login"?"Portal login":e.action==="self_register"?"Registered PIN":e.byRole==="admin"?"Admin login":"Member login"} · {relTime(e.ts||0)}
                        </div>
                      </div>
                      {e.action==="portal_login"?<span style={{fontSize:9,fontWeight:700,padding:"1px 5px",borderRadius:20,background:"rgba(129,140,248,0.15)",color:"#818cf8"}}>portal</span>:e.byRole&&<span style={{fontSize:9,fontWeight:700,padding:"1px 5px",borderRadius:20,background:e.byRole==="admin"?"rgba(245,158,11,0.15)":"rgba(16,185,129,0.15)",color:e.byRole==="admin"?"#fbbf24":"#34d399"}}>{e.byRole}</span>}
                    </div>
                  ))}
                </div>
                {isMaster(user.role)&&loginEntries.length>0&&(
                  <ClearLoginLogBtn logEntries={loginEntries}/>
                )}
              </div>
            )}
          </div>
        </>);
      })()}

      <div className="card">
        <div className="card-hdr"><span className="card-title">Quick Links</span></div>
        <div className="card-body" style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <a href="https://clark-golf-group-two.vercel.app/" target="_blank" className="btn btn-gh" style={{textDecoration:"none",fontSize:12}}>🏌️ Main App</a>
          {isMaster(user.role)&&<>
            <a href="https://console.firebase.google.com/project/clark-group-dd15e/database" target="_blank" className="btn btn-gh" style={{textDecoration:"none",fontSize:12}}>🔥 Firebase DB</a>
            <a href="https://console.firebase.google.com/project/clark-group-dd15e/authentication/users" target="_blank" className="btn btn-gh" style={{textDecoration:"none",fontSize:12}}>🔐 Auth Users</a>
          </>}
        </div>
      </div>
    </div>
  );
}

// ── WEEK TAB ──────────────────────────────────────────────────────────────────
function WeekTab({user}){
  const pushTriggersDB=useDB("settings/pushTriggers");
  const week=useDB("week");
  const gameRules=useDB("settings/gameRules");
  const extra=useDB("extraPlayers");
  const rosterEdits=useDB("rosterEdits");
  // Default: all days expanded. Track CLOSED days instead.
  const [closedDays,setClosedDays]=useState({});
  const [openSection,setOpenSection]=useState("days");
  const [teeModal,setTeeModal]=useState(null);
  const [teeVal,setTeeVal]=useState("");
  const [teeLottery,setTeeLottery]=useState(false);
  const [addSignupDay,setAddSignupDay]=useState(null);
  const [addQ,setAddQ]=useState("");
  const [addHcp,setAddHcp]=useState("");
  const [addTee,setAddTee]=useState("Whites");
  const [endConfirm,setEndConfirm]=useState("");
  const [confirmRemoveSignup,setConfirmRemoveSignup]=useState(null);
  const [toast,showToast]=useToast();
  const noteDebounce=useRef({});

  const activeDays=useMemo(()=>{
    const ad=safeArr(week?.activeDays);
    return DAYS.filter(d=>ad.includes(d));
  },[week?.activeDays]);

  const allPlayers=useMemo(()=>{
    const base=ROSTER.map(p=>({...p,name:(rosterEdits&&rosterEdits[p.id])||p.name}));
    const ex=Object.values(extra||{});
    return[...base,...ex].sort((a,b)=>a.name.localeCompare(b.name));
  },[extra,rosterEdits]);

  const signupsForDay=d=>Object.entries(week?.signups||{}).filter(([,s])=>s.day===d).sort((a,b)=>(a[1].signedUpAt||0)-(b[1].signedUpAt||0));
  const getWeekDates=()=>{const now=new Date();const day=now.getDay();const mon=new Date(now);mon.setDate(now.getDate()-(day===0?6:day-1));const dates={};DAYS.forEach((d,i)=>{const dt=new Date(mon);dt.setDate(mon.getDate()+i);dates[d]=dt.toISOString().split("T")[0];});return dates;};
  const dates={...getWeekDates(),...(week?.dates||{})};

  function toggleDay(day){
    const ad=safeArr(week?.activeDays);
    const newAd=ad.includes(day)?ad.filter(d=>d!==day):[...ad,day];
    const newWeek={...(week||{}),activeDays:newAd};
    if(!newWeek.dates)newWeek.dates={};
    if(!ad.includes(day))newWeek.dates[day]=newWeek.dates[day]||dates[day]||"";
    wr("week",newWeek);
    showToast(ad.includes(day)?`${day} removed`:`${day} set up ✓`);
  }

  function removeSignup(key,signup){
    dl("week/signups/"+key);
    setConfirmRemoveSignup(null);
    showToast(`${signup.name} removed ✓`);
  }

  function addSignup(day){
    const q=addQ.toLowerCase();
    const match=allPlayers.find(p=>p.name.toLowerCase()===q||p.name.toLowerCase().includes(q));
    if(!match){showToast("Player not found","err");return;}
    const signup={name:match.name,playerId:String(match.id),tee:addTee||match.tee||"Whites",handicap:parseFloat(addHcp)||match.hcp||0,day,signedUpAt:Date.now(),isGuest:false};
    ps("week/signups",signup);
    setAddQ("");setAddHcp("");setAddTee("Whites");setAddSignupDay(null);
    showToast(`${match.name} added to ${day} ✓`);
  }

  function saveTee(day){
    const obj={time:teeVal,lottery:teeLottery};
    const prevTee=week?.teeTimes?.[day];
    const wasLottery=!!(prevTee&&typeof prevTee==="object"&&prevTee.lottery&&!prevTee.time);
    const nowTime=obj&&obj.time&&!obj.lottery?obj.time:null;
    wr("week/teeTimes/"+day,obj);
    if(wasLottery&&nowTime&&!(pushTriggersDB&&pushTriggersDB.teetime===false)){
      fetch("/api/notify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key:"cgg-notify-2026",project:IS_PROD_HOST?"prod":"test",audience:"all",title:"🕐 "+day+" tee time is set!",body:day+" tees off at "+nowTime+".",url:"/",tag:"teetime-"+day})}).catch(()=>{});
      setTeeModal(null);showToast("Tee time saved ✓ — members pinged");
    } else {
      setTeeModal(null);showToast("Tee time saved ✓");
    }
  }

  function toggleLock(day){
    const locked=week?.locked?.[day];
    wr("week/locked/"+day,!locked);
    showToast(locked?"Unlocked ✓":"Locked ✓");
  }

  function saveNote(day,val){
    if(noteDebounce.current[day])clearTimeout(noteDebounce.current[day]);
    noteDebounce.current[day]=setTimeout(()=>wr("week/emailNotes/"+day,val),600);
  }

  async function endWeek(){
    if(endConfirm!=="END"){showToast("Type END to confirm","err");return;}
    // Mirrors the FIXED main-app endWeek:
    //  - archives any day with real played data (scores, teams, OR signups) — never signups alone
    //  - archives the FULL round (teams + scores), not just a signup list
    //  - atomically replaces history entries for days under Edit (week.editingKeys)
    //  - pushes attendance (replace-by-date, no duplicates)
    //  - rolls dates to next week; all writes in ONE atomic multi-path update
    const signups=week?.signups||{};
    const updates={};
    const attendancePushes=[];
    let idx=0;
    activeDays.forEach(day=>{
      const daySups=Object.values(signups).filter(s=>s.day===day);
      const dayTeams=safeArr(week?.teams?.[day]);
      const dayScores=(week?.scores&&week.scores[day])||null;
      const teamPlayers=dayTeams.flatMap(t=>safeArr(t&&t.players));
      const hasScores=!!dayScores&&Object.keys(dayScores).some(k=>k!=="payoutsCalculated"&&k!=="playerCount");
      if(daySups.length>0||teamPlayers.length>0||hasScores){
        const playerCount=daySups.length||teamPlayers.length||(dayScores&&dayScores.playerCount)||0;
        updates["history/dr_"+Date.now()+"_"+(idx++)]={day,date:dates[day]||"",teams:dayTeams,scores:dayScores,playerCount,archivedAt:Date.now()};
        // Day pulled from history via Edit in the main app? Delete the superseded
        // old entry in the SAME atomic update that writes the new one.
        const oldKey=week?.editingKeys&&week.editingKeys[day];
        if(oldKey)updates["history/"+oldKey]=null;
        const names=(teamPlayers.length?teamPlayers.map(p=>p&&p.name).filter(Boolean):daySups.map(s=>s.name)).map(normName).filter(Boolean);
        if(names.length&&dates[day])attendancePushes.push({date:dates[day],players:[...new Set(names)].sort()});
      }
    });
    // Attendance: replace-by-date so re-pushing the same date never duplicates.
    if(attendancePushes.length){
      try{
        const snap=await db.ref("attendance/rounds").once("value");
        const raw=snap.val();
        const existing=(Array.isArray(raw)?raw:raw?Object.values(raw):[]).filter(r=>r&&r.date);
        const pushDates=new Set(attendancePushes.map(a=>a.date));
        updates["attendance/rounds"]=[...existing.filter(r=>!pushDates.has(r.date)),...attendancePushes].sort((a,b)=>(b.date||"").localeCompare(a.date||""));
      }catch(e){/* attendance read failed — history archive still proceeds */}
    }
    // Roll to next week's dates (Fri–Mon), matching the main app.
    const nwDates={};
    GOLF_DAYS.forEach(d=>{const cur=dates[d];if(cur){const dt=new Date(cur+"T12:00:00");dt.setDate(dt.getDate()+7);nwDates[d]=dt.toISOString().split("T")[0];}});
    updates["week"]={activeDays:[],dates:nwDates,signups:{},teams:{},scores:{},complete:{},teeTimes:{},teamsPublished:{},locked:{},paid:{},emailNotes:null,emailSubject:null,emailEvents:week?.emailEvents||null};
    upd(updates);
    setEndConfirm("");
    showToast("Week ended ✓");
  }

  // Read-only checklist — mirrors main app's DayChecklist exactly
  function getChecklistForDay(day){
    const signups=Object.values(week?.signups||{}).filter(s=>s.day===day).length;
    const locked=!!(week?.locked?.[day]);
    const teeSet=!!(week?.teeTimes?.[day]);
    const published=!!(week?.teamsPublished?.[day]);
    return[
      {key:"signups",label:"Sign-ups open",sub:signups+" player"+(signups!==1?"s":"")+" signed up",done:signups>0},
      {key:"locked",label:"Lock sign-ups",sub:"Prevent new additions",done:locked},
      {key:"teeSet",label:"Set tee time",sub:teeSet?"Tee time confirmed":"Not yet set",done:teeSet},
      {key:"published",label:"Publish teams",sub:published?"Teams are live":"Generate and publish",done:published},
    ];
  }

  return(
    <div>
      <Toast msg={toast.msg} type={toast.type}/>
      <div className="pg-eyebrow">Week</div>
      <div className="pg-title">Week Management</div>
      <div className="pg-sub">Manage days, sign-ups, tee times, and notes</div>

      <div className="sec-tabs">
        {[["days","📅 Days & Sign-ups"],["manage","⚙️ Set Up Days"],["end",isMaster(user.role)?"🔚 End Week":""]].filter(x=>x[1]).map(([id,label])=>(
          <button key={id} className={`mtab${openSection===id?" on":""}`} style={{fontSize:12}} onClick={()=>setOpenSection(id)}>{label}</button>
        ))}
      </div>

      {/* ── DAYS & SIGN-UPS ── (default expanded) */}
      {openSection==="days"&&(<div>
        {activeDays.length===0&&<div className="info-box"><strong>No active days this week.</strong> Use "Set Up Days" to choose which days have games.</div>}
        {activeDays.map(day=>{
          const sups=signupsForDay(day);
          const locked=!!(week?.locked?.[day]);
          const teeInfo=week?.teeTimes?.[day];
          const note=week?.emailNotes?.[day]||"";
          const complete=!!(week?.complete?.[day]);
          const isOpen=!closedDays[day]; // default open
          const checks=getChecklistForDay(day);
          return(
            <div key={day} className="day-card">
              <div className="day-hdr" onClick={()=>setClosedDays(c=>({...c,[day]:!c[day]}))}>
                <div style={{flex:1}}>
                  <div className="day-name">{day}</div>
                  <div className="day-date">{fmtD(dates[day]||"")}</div>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",justifyContent:"flex-end"}}>
                  <span style={{fontFamily:"Barlow Condensed,sans-serif",fontSize:20,fontWeight:800,color:"#10b981"}}>{sups.length}</span>
                  {(()=>{const mid=week?.modes?.[day]||gameRules?.defaultModeId;const m=mid&&gameRules?.modes&&gameRules.modes[mid];return m?<span className={m.type==="individual"?"b b-b":"b b-g"}>{m.name}</span>:null;})()}
                  {locked&&<span className="b b-a">🔒 Locked</span>}
                  {teeInfo&&<span className="b b-b">{teeInfo.lottery?"Lottery":teeInfo.time}</span>}
                  {complete&&<span className="b b-g">Complete</span>}
                  <span style={{fontSize:12,color:"rgba(255,255,255,0.2)",marginLeft:4}}>{isOpen?"▲":"▼"}</span>
                </div>
              </div>
              {isOpen&&(
                <div className="day-body">
                  {/* Tee time */}
                  <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:14}}>
                    <div style={{flex:1}}>
                      <div className="lbl">Tee Time</div>
                      <div style={{fontSize:13,color:"#e2e8f0"}}>{teeInfo?(teeInfo.lottery?"Lottery Draw":teeInfo.time||"—"):"Not set"}</div>
                    </div>
                    <button className="btn btn-gh btn-sm" onClick={()=>{setTeeModal(day);setTeeVal(teeInfo?.time||"");setTeeLottery(teeInfo?.lottery||false);}}>
                      {teeInfo?"Edit":"+ Set"}
                    </button>
                  </div>

                  {/* Weekly Notes & Announcements (per day) */}
                  <div style={{marginBottom:14}}>
                    <div className="lbl">Weekly Notes & Announcements</div>
                    <textarea className="inp" defaultValue={note} onChange={e=>saveNote(day,e.target.value)} placeholder={`Game format, notes, announcements for ${day}…`} rows={3}/>
                    <div style={{fontSize:10,color:"rgba(255,255,255,0.25)",marginTop:4}}>Same notes used in the Email tab — edit either place.</div>
                  </div>

                  {/* READ-ONLY Checklist */}
                  <div style={{marginBottom:14}}>
                    <div className="lbl">Checklist (read-only — updated by actions)</div>
                    <div style={{background:"#0e1d19",borderRadius:8,padding:"8px 14px"}}>
                      {checks.map(c=>(
                        <div key={c.key} className="chk-item">
                          <div className={`chk-box${c.done?" checked":""}`}>
                            {c.done&&<svg viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3" style={{width:10,height:10}}><polyline points="20 6 9 17 4 12"/></svg>}
                          </div>
                          <div style={{flex:1}}>
                            <span style={{fontSize:12,fontWeight:600,color:c.done?"#10b981":"rgba(255,255,255,0.4)"}}>{c.label}</span>
                            {c.sub&&<div style={{fontSize:10,color:"rgba(255,255,255,0.25)",marginTop:1}}>{c.sub}</div>}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Signups */}
                  <div>
                    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
                      <div className="lbl" style={{marginBottom:0}}>Sign-ups ({sups.length})</div>
                      <div style={{display:"flex",gap:4}}>
                        {!locked&&<button className="btn btn-gh btn-xs" onClick={()=>setAddSignupDay(addSignupDay===day?null:day)}>+ Add</button>}
                        <button className={`btn btn-xs ${locked?"btn-g":"btn-gh"}`} onClick={()=>toggleLock(day)}>{locked?"🔒 Unlock":"Lock"}</button>
                      </div>
                    </div>
                    {addSignupDay===day&&(
                      <div style={{background:"rgba(255,255,255,0.05)",borderRadius:8,padding:10,marginBottom:8,display:"flex",gap:6,flexWrap:"wrap"}}>
                        <input className="inp" style={{flex:2,minWidth:120}} placeholder="Player name" value={addQ} onChange={e=>setAddQ(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addSignup(day)}/>
                        <input className="inp" style={{width:64}} type="number" placeholder="HCP" value={addHcp} onChange={e=>setAddHcp(e.target.value)}/>
                        <select className="inp" style={{width:"auto"}} value={addTee} onChange={e=>setAddTee(e.target.value)}>{TEES.map(t=><option key={t}>{t}</option>)}</select>
                        <button className="btn btn-g btn-xs" onClick={()=>addSignup(day)}>Add</button>
                        <button className="btn btn-gh btn-xs" onClick={()=>setAddSignupDay(null)}>✕</button>
                      </div>
                    )}
                    <div style={{background:"#0e1d19",borderRadius:8}}>
                      {sups.length===0&&<div style={{padding:"10px 12px",fontSize:12,color:"rgba(255,255,255,0.25)",textAlign:"center"}}>No sign-ups yet</div>}
                      {sups.map(([key,s],i)=>(
                        <div key={key} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 12px",borderBottom:i<sups.length-1?"1px solid rgba(255,255,255,0.04)":"none"}}>
                          <span style={{width:18,height:18,background:"rgba(255,255,255,0.06)",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:700,color:"rgba(255,255,255,0.4)",flexShrink:0}}>{i+1}</span>
                          <span style={{flex:1,fontSize:12,fontWeight:600,color:"#e2e8f0"}}>{s.name}</span>
                          <span className="b b-gray">{s.tee}</span>
                          <span className="b b-gray">HCP {s.handicap}</span>
                          {s.isGuest&&<span className="b b-p">Guest</span>}
                          {!locked&&<button className="btn btn-gh btn-xs" onClick={()=>setConfirmRemoveSignup({key,signup:s})}>✕</button>}
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>)}

      {/* ── SET UP DAYS (Fri/Sat/Sun/Mon only) ── */}
      {openSection==="manage"&&(<div>
        <div className="info-box"><strong>Set up the games for this week.</strong> Tap "Set Up [Day]" to activate. This is the same as the "Set Up Saturday" action in the main app.</div>
        <div className="card">
          <div className="card-hdr"><span className="card-title">Golf Days</span></div>
          {GOLF_DAYS.map(day=>{
            const active=safeArr(week?.activeDays).includes(day);
            const count=signupsForDay(day).length;
            return(
              <div key={day} style={{display:"flex",alignItems:"center",gap:12,padding:"13px 16px",borderBottom:"1px solid rgba(255,255,255,0.04)"}}>
                <div style={{flex:1}}>
                  <div style={{fontSize:14,fontWeight:700,color:active?"#e2e8f0":"rgba(255,255,255,0.4)"}}>{day}</div>
                  <div style={{fontSize:11,color:"rgba(255,255,255,0.3)",marginTop:1}}>{fmtD(dates[day]||"")}{active&&` · ${count} ${count===1?"player":"players"}`}</div>
                </div>
                {active?(
                  <>
                    {(()=>{const modes=Object.entries(gameRules?.modes||{}).map(([id,m])=>({id,...m}));if(!modes.length)return null;const dayHasScores=!!(week?.scores&&week.scores[day]);const cur=week?.modes?.[day]||gameRules?.defaultModeId||"";return(
                      <select className="inp" style={{width:"auto",fontSize:11,padding:"6px 8px",opacity:dayHasScores?0.5:1}} disabled={dayHasScores} title={dayHasScores?"Mode locked — scores exist for this day":"Game mode for "+day} value={cur} onChange={e=>{wr("week/modes/"+day,e.target.value);wr("week/teams/"+day,null);wr("week/teamsPublished/"+day,null);showToast(day+" mode set ✓ (built teams cleared)");}}>
                        {!cur&&<option value="">— mode —</option>}
                        {modes.map(m=><option key={m.id} value={m.id}>{m.name}</option>)}
                      </select>
                    );})()}
                    <span className="b b-g">✓ Active</span>
                    <button className="btn btn-gh btn-sm" onClick={()=>toggleDay(day)}>Remove</button>
                  </>
                ):(
                  <button className="btn btn-g btn-sm" onClick={()=>toggleDay(day)}>Set Up {day}</button>
                )}
              </div>
            );
          })}
        </div>
        <div style={{fontSize:11,color:"rgba(255,255,255,0.25)",padding:"6px 4px",lineHeight:1.6}}>Note: Only Fri/Sat/Sun/Mon are shown — these are the regular golf days for the group.</div>
      </div>)}

      {/* ── END WEEK (master only) ── */}
      {openSection==="end"&&isMaster(user.role)&&(<div>
        <div className="warn"><strong>End Week rolls the board to next week.</strong> Rounds finalized from the main app are already in History. Any scored-but-unfinalized day is swept into History (with full teams and scores) before the reset — but the normal habit is to Finalize each round from the main app’s Score tab. This cannot be undone.</div>
        <div className="card">
          <div className="card-hdr"><span className="card-title">Current Week Summary</span></div>
          <div className="card-body">
            {activeDays.map(day=>(
              <div key={day} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid rgba(255,255,255,0.04)",fontSize:13}}>
                <span style={{fontWeight:600}}>{day}</span>
                <span style={{color:"rgba(255,255,255,0.4)"}}>{signupsForDay(day).length} players</span>
              </div>
            ))}
            {activeDays.length===0&&<div style={{fontSize:12,color:"rgba(255,255,255,0.3)"}}>No active days</div>}
          </div>
        </div>
        <div className="card">
          <div className="card-hdr"><span className="card-title">Confirm End Week</span></div>
          <div className="card-body">
            <div style={{fontSize:12,color:"rgba(255,255,255,0.45)",marginBottom:12}}>Type <strong style={{color:"#fca5a5"}}>END</strong> to confirm:</div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <input className="inp" value={endConfirm} onChange={e=>setEndConfirm(e.target.value)} placeholder='Type "END"' style={{flex:1,minWidth:140}}/>
              <button className="btn btn-r" onClick={endWeek} disabled={endConfirm!=="END"}>End Week</button>
            </div>

      </div>)}

      {/* TEE TIME MODAL */}
      {teeModal&&(
        <div className="overlay">
          <div className="modal">
            <div style={{fontSize:15,fontWeight:700,marginBottom:14}}>Tee Time — {teeModal}</div>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
              <input type="checkbox" checked={teeLottery} onChange={e=>setTeeLottery(e.target.checked)} id="lot"/>
              <label htmlFor="lot" style={{fontSize:13,color:"rgba(255,255,255,0.6)"}}>Lottery draw</label>
            </div>
            {!teeLottery&&<input className="inp" value={teeVal} onChange={e=>setTeeVal(e.target.value)} placeholder="e.g. 10:15 AM" style={{marginBottom:14}}/>}
            <div style={{display:"flex",gap:8}}>
              <button className="btn btn-g" style={{flex:1}} onClick={()=>saveTee(teeModal)}>Save</button>
              <button className="btn btn-gh" style={{flex:1}} onClick={()=>setTeeModal(null)}>Cancel</button>
            </div>

      {/* CONFIRM REMOVE SIGNUP */}
      {confirmRemoveSignup&&(
        <div className="overlay">

            <div style={{fontSize:14,fontWeight:700,marginBottom:6}}>Remove {confirmRemoveSignup.signup.name}?</div>
            <div style={{fontSize:12,color:"rgba(255,255,255,0.4)",marginBottom:16,lineHeight:1.6}}>This removes their sign-up for {confirmRemoveSignup.signup.day}.</div>
            <div style={{display:"flex",gap:8}}>
              <button className="btn btn-r" style={{flex:1}} onClick={()=>removeSignup(confirmRemoveSignup.key,confirmRemoveSignup.signup)}>Remove</button>
              <button className="btn btn-gh" style={{flex:1}} onClick={()=>setConfirmRemoveSignup(null)}>Cancel</button>
            </div>

        </div>
      )}
    </div>
  );
}

// ── EMAIL TAB ─────────────────────────────────────────────────────────────────
function EmailTab(){
  const week=useDB("week");
  const [preview,setPreview]=useState(false);
  const [toast,showToast]=useToast();
  const [localNotes,setLocalNotes]=useState({});
  const [localEvents,setLocalEvents]=useState("");
  const debounce=useRef({});
  const eventsRef=useRef(null);

  function applyFormat(tag){
    const ta=eventsRef.current;if(!ta)return;
    const start=ta.selectionStart;const end=ta.selectionEnd;
    const sel=localEvents.substring(start,end);
    if(!sel)return;
    const wrap=tag==="b"?"**":tag==="i"?"*":"__";
    const nv=localEvents.substring(0,start)+wrap+sel+wrap+localEvents.substring(end);
    setLocalEvents(nv);saveEvents(nv);
    setTimeout(()=>{ta.focus();ta.selectionStart=start;ta.selectionEnd=end+wrap.length*2;},10);
  }

  const activeDays=useMemo(()=>{const ad=safeArr(week?.activeDays);return DAYS.filter(d=>ad.includes(d));},[week?.activeDays]);

  useEffect(()=>{if(week?.emailNotes)setLocalNotes(week.emailNotes);},[week?.emailNotes]);
  useEffect(()=>{if(week?.emailEvents!==undefined&&week?.emailEvents!==null)setLocalEvents(week.emailEvents||"");},[week?.emailEvents]);

  function saveNote(day,val){
    setLocalNotes(n=>({...n,[day]:val}));
    if(debounce.current[day])clearTimeout(debounce.current[day]);
    debounce.current[day]=setTimeout(()=>wr("week/emailNotes/"+day,val),600);
  }

  function saveEvents(val){
    setLocalEvents(val);
    if(debounce.current.events)clearTimeout(debounce.current.events);
    debounce.current.events=setTimeout(()=>wr("week/emailEvents",val),600);
  }

  function buildHtml(){
    let html='<div style="font-family:Arial,sans-serif;max-width:600px;color:#0f172a;line-height:1.6">';
    html+='<h1 style="font-size:22px;font-weight:700;margin-bottom:14px;border-bottom:3px solid #10b981;padding-bottom:8px">Clark Golf Group</h1>';
    activeDays.forEach(day=>{
      const note=localNotes[day]||"";
      const sups=Object.values(week?.signups||{}).filter(s=>s.day===day);
      const tee=week?.teeTimes?.[day];
      html+=`<h2 style="font-size:17px;font-weight:700;margin:18px 0 8px;color:#0f172a">${day}</h2>`;
      if(tee)html+=`<p style="margin:4px 0"><strong>Tee time:</strong> ${tee.lottery?"Lottery draw":tee.time||""}</p>`;
      html+=`<p style="margin:4px 0"><strong>Players (${sups.length}):</strong> ${sups.map(s=>s.name).join(", ")||"None yet"}</p>`;
      if(note)html+=`<p style="margin:8px 0">${note.replace(/\n/g,"<br/>")}</p>`;
    });
    if(localEvents){
      html+='<h2 style="font-size:17px;font-weight:700;margin:18px 0 8px;color:#0f172a">Upcoming Events & Announcements</h2>';
      html+=`<p style="margin:4px 0">${localEvents.replace(/\n/g,"<br/>").replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")}</p>`;
    }
    html+="</div>";
    return html;
  }

  function buildPlainText(){
    let txt="CLARK GOLF GROUP\n";
    txt+="=".repeat(40)+"\n\n";
    activeDays.forEach(day=>{
      const note=localNotes[day]||"";
      const sups=Object.values(week?.signups||{}).filter(s=>s.day===day);
      const tee=week?.teeTimes?.[day];
      txt+=day.toUpperCase()+"\n";
      txt+="-".repeat(20)+"\n";
      if(tee)txt+=`Tee time: ${tee.lottery?"Lottery draw":tee.time||""}\n`;
      txt+=`Players (${sups.length}): ${sups.map(s=>s.name).join(", ")||"None yet"}\n`;
      if(note)txt+=note+"\n";
      txt+="\n";
    });
    if(localEvents)txt+="UPCOMING EVENTS\n"+"-".repeat(20)+"\n"+localEvents.replace(/\*\*(.+?)\*\*/g,"$1")+"\n";
    return txt;
  }

  function copyFormatted(){
    const html=buildHtml();
    const txt=buildPlainText();
    if(navigator.clipboard&&window.ClipboardItem){
      const item=new ClipboardItem({"text/html":new Blob([html],{type:"text/html"}),"text/plain":new Blob([txt],{type:"text/plain"})});
      navigator.clipboard.write([item]).then(()=>showToast("Formatted email copied ✓")).catch(()=>{
        navigator.clipboard.writeText(html).then(()=>showToast("HTML copied (paste into rich editor) ✓")).catch(()=>showToast("Copy failed","err"));
      });
    }else{
      navigator.clipboard.writeText(html).then(()=>showToast("HTML copied ✓")).catch(()=>showToast("Copy failed","err"));
    }
  }

  function copyPlain(){
    navigator.clipboard.writeText(buildPlainText()).then(()=>showToast("Plain text copied ✓")).catch(()=>showToast("Copy failed","err"));
  }

  // Auto-expand events textarea based on content lines
  const eventsRows=Math.max(8,Math.min(20,(localEvents||"").split("\n").length+2));

  return(
    <div>
      <Toast msg={toast.msg} type={toast.type}/>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4,flexWrap:"wrap",gap:8}}>
        <div>
          <div className="pg-eyebrow">Communications</div>
          <div className="pg-title">Day Notes and Upcoming Events &amp; Announcements</div>
          <div className="pg-sub">Draft the notes and events members see in the weekly email</div>
        </div>

      </div>

      {activeDays.length===0&&<div className="info-box"><strong>No active days set up.</strong> Go to Week → Set Up Days to activate days first.</div>}

      {activeDays.map(day=>(
        <div key={day} className="card">
          <div className="card-hdr">
            <span className="card-title">{day} Note</span>
            <span style={{fontSize:11,color:"rgba(255,255,255,0.25)"}}>{Object.values(week?.signups||{}).filter(s=>s.day===day).length} players</span>
          </div>
          <div className="card-body">
            <textarea className="inp" rows={4} value={localNotes[day]||""} onChange={e=>saveNote(day,e.target.value)} placeholder={`Game format, special instructions, notes for ${day}…`}/>
          </div>
        </div>
      ))}

      <div className="card">
        <div className="card-hdr"><span className="card-title">Upcoming Events & Announcements</span></div>
        <div className="card-body">
          <div style={{fontSize:11,color:"rgba(255,255,255,0.3)",marginBottom:8}}>Select text then tap a button to format. This section appears at the bottom of the email.</div>
          <div style={{display:"flex",alignItems:"center",gap:3,marginBottom:8}}>
            <button onClick={()=>applyFormat("b")} style={{width:30,height:30,border:"1px solid rgba(255,255,255,0.12)",borderRadius:6,background:"rgba(255,255,255,0.06)",cursor:"pointer",fontWeight:800,fontSize:14,fontFamily:"serif",color:"#e2e8f0",display:"flex",alignItems:"center",justifyContent:"center"}}>B</button>
            <button onClick={()=>applyFormat("i")} style={{width:30,height:30,border:"1px solid rgba(255,255,255,0.12)",borderRadius:6,background:"rgba(255,255,255,0.06)",cursor:"pointer",fontStyle:"italic",fontSize:14,fontFamily:"serif",color:"#e2e8f0",display:"flex",alignItems:"center",justifyContent:"center"}}>I</button>
            <button onClick={()=>applyFormat("u")} style={{width:30,height:30,border:"1px solid rgba(255,255,255,0.12)",borderRadius:6,background:"rgba(255,255,255,0.06)",cursor:"pointer",textDecoration:"underline",fontSize:14,fontFamily:"serif",color:"#e2e8f0",display:"flex",alignItems:"center",justifyContent:"center"}}>U</button>
            <span style={{flex:1}}></span>
            <span style={{fontSize:10,color:"rgba(255,255,255,0.2)"}}>**bold** · *italic* · __underline__</span>
          </div>
          <textarea ref={eventsRef} className="inp" rows={eventsRows} value={localEvents} onChange={e=>saveEvents(e.target.value)} placeholder="MGA items, club events, tournament announcements, season updates…" style={{minHeight:160,fontSize:13}}/>
        </div>
      </div>

      {/* FORMATTED EMAIL PREVIEW (with close button) */}
      {preview&&(
        <div className="overlay" onClick={()=>setPreview(false)}>
          <div className="modal" style={{maxWidth:"min(960px,92vw)",width:"100%",maxHeight:"90vh",display:"flex",flexDirection:"column",padding:0}} onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 18px",borderBottom:"1px solid rgba(255,255,255,0.07)"}}>
              <div style={{fontSize:14,fontWeight:700,color:"#e2e8f0"}}>📧 Email Preview</div>
              <div style={{display:"flex",gap:6}}>
                <button className="btn btn-b btn-xs" onClick={copyFormatted}>Copy Formatted</button>
                <button className="btn btn-g btn-xs" onClick={copyPlain}>Copy Plain</button>
                <button className="btn btn-gh btn-xs" onClick={()=>setPreview(false)}>✕ Close</button>
              </div>
            </div>
            <div style={{padding:24,overflowY:"auto",flex:1}}>
              <div className="email-preview" dangerouslySetInnerHTML={{__html:buildHtml()}}/>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── ROSTER TAB (segmented + full PIN management) ──────────────────────────────
function RosterTab(){
  const extra=useDB("extraPlayers");
  const joinRequests=useDB("joinRequests");
  const [aprModal,setAprModal]=React.useState(null);
  const [apr,setApr]=React.useState({tee:"Whites",hcp:"",pin:"",email:""});
  const portalUser=useDB("_portalSession"); // not real — use localStorage
  const isMasterUser=()=>{try{const u=JSON.parse(localStorage.getItem("portal_user")||"{}");return u.role==="master";}catch{return false;}};
  const rosterEdits=useDB("rosterEdits");
  const rosterHidden=useDB("rosterHidden");
  const rosterPins=useDB("rosterPins");
  const rosterEmails=useDB("rosterEmails");
  const rosterAdmins=useDB("rosterAdmins");
  const rosterHcp=useDB("rosterHcp");
  const rosterTee=useDB("rosterTee");
  const attendanceR=useDB("attendance/rounds");
  const roundsByName=React.useMemo(()=>{const m={};const rs=attendanceR?(Array.isArray(attendanceR)?attendanceR:Object.values(attendanceR)):[];rs.forEach(r=>{((r&&r.players)||[]).forEach(n=>{const k=String(n).toLowerCase().trim();m[k]=(m[k]||0)+1;});});return m;},[attendanceR]);
  const roundsOf=p=>roundsByName[String(p.name||"").toLowerCase().trim()]||0;
  const [seg,setSeg]=useState("active"); // active | inactive
  const [q,setQ]=useState("");
  const [clFilter,setClFilter]=useState("all");
  const clarkList=useDB("clarkEmailList");
  const onClarkList=p=>{const e=String((rosterEmails&&rosterEmails[p.id])||"").toLowerCase().trim();if(!e)return false;return Object.values(clarkList||{}).some(x=>String(x.email||"").toLowerCase().trim()===e);};
  const [editing,setEditing]=useState(null);
  const [adding,setAdding]=useState(false);
  const [revealPin,setRevealPin]=useState(null); // player id whose PIN is shown
  const [newP,setNewP]=useState({name:"",tee:"Whites",hcp:"",phone:"",email:""});
  const [confirmDel,setConfirmDel]=useState(null);
  const [confirmResetPin,setConfirmResetPin]=useState(null);
  const [confirmSetPin,setConfirmSetPin]=useState(null);
  const [newPinVal,setNewPinVal]=useState("");
  const [toast,showToast]=useToast();

  const all=useMemo(()=>{
    const base=ROSTER.map(p=>({...p,name:(rosterEdits&&rosterEdits[p.id])||p.name,handicap:(rosterHcp&&rosterHcp[p.id]!=null)?rosterHcp[p.id]:p.hcp,hcp:(rosterHcp&&rosterHcp[p.id]!=null)?rosterHcp[p.id]:p.hcp,tee:(rosterTee&&rosterTee[p.id])||p.tee||"Whites",isExtra:false}));
    const ex=Object.values(extra||{}).map(p=>({...p,isExtra:true}));
    return[...base,...ex];
  },[extra,rosterEdits,rosterHcp,rosterTee]);

  const rosterDeleted=useDB("rosterDeleted");
  const isDeletedP=p=>!!((rosterDeleted&&rosterDeleted[p.id])||(rosterHidden&&rosterHidden[p.id]));   // legacy hidden = deleted
  const live=all.filter(p=>!isDeletedP(p));
  const deletedList=all.filter(isDeletedP).sort((x,y)=>x.name.localeCompare(y.name));
  const visible=live;   // "live" already excludes deleted (incl. legacy hidden)
  const activeList=visible.filter(p=>!!(rosterPins&&rosterPins[p.id]));
  const inactiveList=visible.filter(p=>!(rosterPins&&rosterPins[p.id]));

  const currentList=seg==="active"?activeList:inactiveList;
  const filtered=currentList.filter(p=>!q||p.name.toLowerCase().includes(q.toLowerCase())).filter(p=>clFilter==="all"?true:(clFilter==="on"?onClarkList(p):!onClarkList(p))).sort((a,b)=>a.name.localeCompare(b.name));

  function saveEdit(){
    if(!editing)return;
    const{id,name,tee,hcp,email}=editing;
    const base=ROSTER.find(p=>p.id===id);
    if(base){
      if(name!==base.name)wr("rosterEdits/"+id,name);
      if(hcp!==''&&hcp!=null)wr("rosterHcp/"+id,parseFloat(hcp)||0);
      if(tee)wr("rosterTee/"+id,tee);
    }else{
      const entry=Object.entries(extra||{}).find(([,p])=>String(p.id)===String(id));
      if(entry){const[k,p]=entry;wr("extraPlayers/"+k,{...p,name,tee,hcp:parseFloat(hcp)||0});}
    }
    if(email!==undefined){email.trim()?wr("rosterEmails/"+id,email.trim()):dl("rosterEmails/"+id);}
    setEditing(null);showToast("Saved ✓");
  }

  function addPlayer(){
    if(!newP.name.trim()){showToast("Name required","err");return;}
    if(!newP.email||!newP.email.trim()||newP.email.indexOf("@")<1){showToast("Email required — keeps the email list in sync","err");return;}
    const newId=Date.now();
    ps("extraPlayers",{id:newId,name:normName(newP.name),tee:newP.tee,hcp:parseFloat(newP.hcp)||0});
    // Phone → collision-aware PIN (last 4/5/6); email saved separately below
    if(newP.phone.trim()){
      const digits=newP.phone.replace(/\D/g,"");
      if(digits.length>=4){
        const pin=derivePin(digits,rosterPins,null).pin;
        wr("rosterPins/"+newId,pin);
      }
    }
    wr("rosterEmails/"+newId,newP.email.trim());
    firebase.database().ref("clarkEmailList").push({name:normName(newP.name),email:newP.email.trim()});
    setNewP({name:"",tee:"Whites",hcp:"",phone:"",email:""});setAdding(false);
    showToast(newP.phone.trim()?"Player added with PIN ✓":"Player added ✓");
  }

  function deletePlayer(id){
    const entry=Object.entries(extra||{}).find(([,p])=>String(p.id)===String(id));
    if(entry){
      dl("extraPlayers/"+entry[0]);
      dl("rosterPins/"+id);dl("rosterEmails/"+id);dl("rosterAdmins/"+id);dl("rosterHidden/"+id);dl("rosterDeleted/"+id);
      showToast("Deleted ✓");
    } else {
      // Base roster player: lives in the app's source, so we flag it. Same effect everywhere; restorable.
      wr("rosterDeleted/"+id,{at:Date.now()});
      dl("rosterPins/"+id);dl("rosterEmails/"+id);dl("rosterAdmins/"+id);dl("rosterHidden/"+id);
      showToast("Deleted ✓ — restore from Deleted list");
    }
    setConfirmDel(null);
  }
  function restoreDeleted(id){dl("rosterDeleted/"+id);dl("rosterHidden/"+id);showToast("Restored ✓");}

  function resetPin(id){
    dl("rosterPins/"+id);
    setConfirmResetPin(null);
    showToast("PIN reset — player must re-register ✓");
  }

  function setPin(id,pin){
    if(!pin||pin.length<4){showToast("PIN must be at least 4 digits","err");return;}
    wr("rosterPins/"+id,derivePin(pin,rosterPins,id).pin);
    setConfirmSetPin(null);setNewPinVal("");
    showToast("PIN set ✓");
  }

  return(<div>
    <Toast msg={toast.msg} type={toast.type}/>
    {(()=>{const pend=Object.entries(joinRequests||{}).filter(([,r])=>r&&r.status==="pending");if(!pend.length)return null;return(
      <div className="card" style={{marginBottom:14,border:"1.5px solid #fca5a5"}}>
        <div style={{fontSize:13,fontWeight:800,color:"#b91c1c",marginBottom:8}}>Join Requests ({pend.length})</div>
        {pend.map(([k2,r])=>(
