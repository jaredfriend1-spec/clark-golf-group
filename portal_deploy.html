  }
  function onCropMouseUp(){setCropDragging(false);}

  function saveCard(){
    if(!editing)return;
    const card={};
    if(editMsg.trim()) card.message=editMsg.trim();
    if(editLogo) card.logo=editLogo;
    if(editTheme&&editTheme!=='default') card.theme=editTheme;
    firebase.database().ref('settings/playerCards/'+editing.id).set(Object.keys(card).length>0?card:null);
    setEditing(null);
    showToast('Saved!');
  }

  function clearCard(){
    if(!editing)return;
    firebase.database().ref('settings/playerCards/'+editing.id).remove();
    setEditing(null);
    showToast('Card cleared');
  }

  const filtered=allPlayers.filter(p=>!q||p.name.toLowerCase().includes(q.toLowerCase()));
  const THEMES=[
    {id:'default',label:'Default',bg:'rgba(15,23,42,0.85)'},
    {id:'gold',label:'Gold',bg:'rgba(10,14,26,0.92)'},
    {id:'green',label:'Green',bg:'rgba(0,20,10,0.92)'},
    {id:'purple',label:'Purple',bg:'rgba(15,10,30,0.92)'},
  ];

  return(
    <div className="main">
      <div className="pg-eyebrow">Master Admin</div>
      <div className="pg-title">Login Cards</div>
      <div className="pg-sub">Set a custom logo and welcome message for each player. Shows on their flash card at login. Leave blank to use default initials.</div>

      <input className="inp" placeholder="Search players..." value={q} onChange={e=>setQ(e.target.value)} style={{marginBottom:16,width:'100%',boxSizing:'border-box'}}/>

      <div className="card">
        {filtered.map((p,i)=>{
          const card=cards[p.id]||{};
          const hasCard=card.message||card.logo;
          return(
            <div key={p.id} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 16px',borderBottom:i<filtered.length-1?'1px solid rgba(255,255,255,0.06)':'none'}}>
              {/* Avatar preview */}
              <div style={{width:36,height:36,borderRadius:'50%',overflow:'hidden',flexShrink:0,background:'rgba(16,185,129,0.12)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:800,color:'#10b981'}}>
                {card.logo
                  ? <img src={card.logo} style={{width:36,height:36,objectFit:'cover'}}/>
                  : p.name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)
                }
              </div>
              {/* Name + status */}
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13,fontWeight:600,color:'#e2e8f0'}}>{p.name}</div>
                {card.message&&<div style={{fontSize:11,color:'rgba(255,255,255,0.35)',marginTop:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>"{card.message}"</div>}
              </div>
              {hasCard&&<span style={{fontSize:10,color:'#10b981',fontWeight:700,padding:'2px 6px',borderRadius:10,background:'rgba(16,185,129,0.1)',flexShrink:0}}>✓ Custom</span>}
              <button className="btn btn-gh btn-sm" onClick={()=>openEdit(p)} style={{flexShrink:0}}>Edit</button>
            </div>
          );
        })}
      </div>

      {/* Edit modal */}
      {editing&&(
        <div onClick={e=>{if(e.target===e.currentTarget)setEditing(null);}} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.8)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:20}}>
          <div className="modal" style={{width:'100%',maxWidth:480,maxHeight:'90vh',display:'flex',flexDirection:'column'}}>
            {/* Header */}
            <div style={{padding:'18px 20px 14px',borderBottom:'1px solid rgba(255,255,255,0.08)',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
              <div style={{fontSize:16,fontWeight:700,color:'#fff'}}>Login Card — {editing.name}</div>
              <button onClick={()=>setEditing(null)} style={{background:'none',border:'none',color:'rgba(255,255,255,0.4)',fontSize:20,cursor:'pointer',lineHeight:1}}>✕</button>
            </div>
            <div style={{overflowY:'auto',flex:1,padding:'18px 20px'}}>
              {/* Preview */}
              <div style={{marginBottom:18,padding:'20px',borderRadius:14,background:THEMES.find(t=>t.id===editTheme)?.bg||'rgba(15,23,42,0.85)',border:'1px solid rgba(255,255,255,0.08)',textAlign:'center'}}>
                <div style={{fontSize:10,color:'rgba(255,255,255,0.3)',letterSpacing:'0.1em',marginBottom:10,textTransform:'uppercase'}}>Preview</div>
                <div style={{display:'flex',justifyContent:'center',marginBottom:10}}>
                  {editLogo
                    ? <img src={editLogo} style={{width:64,height:64,borderRadius:'50%',objectFit:'cover',border:'2px solid rgba(16,185,129,0.5)'}}/>
                    : <div style={{width:64,height:64,borderRadius:'50%',background:'rgba(16,185,129,0.15)',color:'#10b981',display:'flex',alignItems:'center',justifyContent:'center',fontSize:20,fontWeight:800}}>{editing.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}</div>
                  }
                </div>
                <div style={{fontSize:22,fontWeight:800,color:'#fff',fontFamily:'Barlow Condensed,sans-serif'}}>{editing.name}</div>
                {editMsg&&<div style={{fontSize:12,color:'rgba(255,255,255,0.5)',marginTop:6,fontStyle:'italic'}}>"{editMsg}"</div>}
              </div>

              {/* Logo upload */}
              <div className="lbl" style={{marginBottom:6}}>Player Logo / Photo</div>
              <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',marginBottom:14}}>
                {editLogo&&<img src={editLogo} style={{width:44,height:44,borderRadius:'50%',objectFit:'cover',border:'2px solid rgba(16,185,129,0.4)'}}/>}
                <button className="btn btn-gh btn-sm" onClick={()=>fileRef.current?.click()} disabled={uploading}>
                  {uploading?'Processing...':editLogo?'Change photo':'Upload photo'}
                </button>
                {editLogo&&<button className="btn btn-gh btn-sm" onClick={()=>{
                  const img=new window.Image();
                  img.onload=()=>{
                    setCropImgEl(img);
                    setCropImg(editLogo);
                    const scale=Math.max(CROP_SIZE/img.width,CROP_SIZE/img.height);
                    setCropScale(scale);
                    setCropOffset({x:(CROP_SIZE-img.width*scale)/2,y:(CROP_SIZE-img.height*scale)/2});
                    setCropModal(true);
                  };
                  img.src=editLogo;
                }}>✂️ Adjust crop</button>}
                {editLogo&&<button className="btn btn-sm" style={{color:'#ef4444',borderColor:'rgba(239,68,68,0.3)',background:'none'}} onClick={()=>setEditLogo('')}>Remove</button>}
                <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={handleImageUpload}/>
              </div>
              <div style={{fontSize:10,color:'rgba(255,255,255,0.25)',marginBottom:16}}>Any format. Drag to reposition after upload.</div>

              {/* Message */}
              <div className="lbl" style={{marginBottom:6}}>Welcome Message</div>
              <input className="inp" placeholder='e.g. "Welcome back Cory! 🔥"' value={editMsg} onChange={e=>setEditMsg(e.target.value)} style={{marginBottom:6}}/>
              <div style={{fontSize:10,color:'rgba(255,255,255,0.25)',marginBottom:16}}>Shows below their name every time they log in. Leave blank for no message.</div>

              {/* Theme */}
              <div className="lbl" style={{marginBottom:8}}>Card Theme</div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6,marginBottom:20}}>
                {THEMES.map(t=>(
                  <button key={t.id} onClick={()=>setEditTheme(t.id)}
                    style={{padding:'8px 12px',borderRadius:8,border:'1.5px solid',borderColor:editTheme===t.id?'#10b981':'rgba(255,255,255,0.1)',background:t.bg,color:'#fff',fontSize:12,fontWeight:editTheme===t.id?700:400,cursor:'pointer',fontFamily:'inherit'}}>
                    {t.label}
                  </button>
                ))}
              </div>
            </div>

            {/* Footer */}
            <div style={{padding:'14px 20px',borderTop:'1px solid rgba(255,255,255,0.08)',display:'flex',gap:8,flexShrink:0}}>
              <button className="btn btn-g" style={{flex:1}} onClick={saveCard}>Save</button>
              {(cards[editing.id]?.message||cards[editing.id]?.logo)&&(
                <button className="btn" style={{color:'#ef4444',borderColor:'rgba(239,68,68,0.3)',background:'none'}} onClick={clearCard}>Clear</button>
              )}
              <button className="btn btn-gh" onClick={()=>setEditing(null)}>Cancel</button>
            </div>
          </div>
        </div>
      )}

      {/* Crop modal */}
      {cropModal&&cropImgEl&&(
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.85)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1100,padding:20}}>
          <div style={{background:'#1e293b',borderRadius:20,padding:'24px',width:'100%',maxWidth:340,textAlign:'center'}}>
            <div style={{fontSize:16,fontWeight:700,color:'#fff',marginBottom:4}}>Adjust photo</div>
            <div style={{fontSize:12,color:'rgba(255,255,255,0.4)',marginBottom:16}}>Drag to reposition · Pinch or scroll to zoom</div>
            {/* Canvas with circular clip */}
            <div style={{position:'relative',width:CROP_SIZE,height:CROP_SIZE,margin:'0 auto 16px',borderRadius:'50%',overflow:'hidden',border:'3px solid rgba(16,185,129,0.6)',cursor:'grab',userSelect:'none',touchAction:'none'}}
              onMouseDown={onCropMouseDown} onMouseMove={onCropMouseMove} onMouseUp={onCropMouseUp} onMouseLeave={onCropMouseUp}
              onTouchStart={onCropMouseDown} onTouchMove={onCropMouseMove} onTouchEnd={onCropMouseUp}
              onWheel={e=>{e.preventDefault();const delta=e.deltaY>0?0.9:1.1;setCropScale(s=>Math.max(0.3,Math.min(5,s*delta)));}}>

              <canvas ref={cropCanvasRef} width={CROP_SIZE} height={CROP_SIZE} style={{display:'block'}}/>
            </div>
            {/* Zoom controls */}
            <div style={{display:'flex',alignItems:'center',gap:8,justifyContent:'center',marginBottom:16}}>
              <button onClick={()=>setCropScale(s=>Math.max(0.3,s*0.85))} style={{background:'rgba(255,255,255,0.1)',border:'none',color:'#fff',width:32,height:32,borderRadius:'50%',fontSize:18,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>−</button>
              <span style={{fontSize:11,color:'rgba(255,255,255,0.4)',minWidth:40}}>Zoom</span>
              <button onClick={()=>setCropScale(s=>Math.min(5,s*1.15))} style={{background:'rgba(255,255,255,0.1)',border:'none',color:'#fff',width:32,height:32,borderRadius:'50%',fontSize:18,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>+</button>
            </div>
            <div style={{display:'flex',gap:8}}>
              <button className="btn btn-g" style={{flex:1}} onClick={confirmCrop}>Use this photo</button>
              <button className="btn btn-gh" onClick={()=>{setCropModal(false);setCropImg(null);}}>Cancel</button>
            </div>
          </div>
        </div>
      )}
      {toast&&<div className="toast toast-ok">{toast}</div>}
    </div>
  );
}

function SeasonTab(){
  const season=useDB("settings/season");
  const history=useDB("history");
  const attendance=useDB("attendance");
  const seasons=useDB("seasons");
  const isMaster=(()=>{try{const u=JSON.parse(localStorage.getItem("portal_user")||"{}");return u.role==="master";}catch(e){return false;}})();
  const me=(()=>{try{return JSON.parse(localStorage.getItem("portal_user")||"{}").name||"master";}catch(e){return "master";}})();
  const [nm,setNm]=React.useState("");
  const [ed,setEd]=React.useState("");
  const [typed,setTyped]=React.useState("");
  const [busy,setBusy]=React.useState(false);
  const [log,setLog]=React.useState("");
  const [backedUp,setBackedUp]=React.useState({});
  React.useEffect(()=>{setNm((season&&season.name)||String(new Date().getFullYear()));setEd((season&&season.endDate)||"");},[season]);
  const liveRounds=Object.keys(history||{}).length;
  const liveFund=tournFundFromAttendance(attendance&&attendance.rounds,seasonBound(season));
  const attCount=(attendance&&attendance.rounds)?(Array.isArray(attendance.rounds)?attendance.rounds.length:Object.keys(attendance.rounds).length):0;
  const daysLeft=(()=>{if(!ed)return null;const d=Math.ceil((new Date(ed+"T23:59:59")-new Date())/86400000);return d;})();

  async function archiveSeason(){
    if(typed.trim().toUpperCase()!=="ARCHIVE"||busy)return;
    setBusy(true);setLog("Snapshotting live season…");
    try{
      const dbr=db;
      const hist=(await dbr.ref("history").once("value")).val()||{};
      const att=(await dbr.ref("attendance").once("value")).val()||null;
      const rc=Object.keys(hist).length;
      if(!rc){setLog("Nothing to archive — live history is empty.");setBusy(false);return;}
      const fund=Math.round(Object.values(hist).reduce((s,r)=>s+((r&&r.scores&&parseFloat(r.scores.tournFund))||0),0));
      const sname=(season&&season.name)||String(new Date().getFullYear());
      const id=(sname+"_"+Date.now()).replace(/[^A-Za-z0-9_-]/g,"_");
      await dbr.ref("seasons/"+id).set({meta:{name:sname,endDate:(season&&season.endDate)||null,startedAt:(season&&season.startedAt)||null,archivedAt:Date.now(),by:me,roundCount:rc,attRounds:att&&att.rounds?(Array.isArray(att.rounds)?att.rounds.length:Object.keys(att.rounds).length):0,fundTotal:fund},history:hist,attendance:att});
      setLog("Verifying snapshot…");
      const back=(await dbr.ref("seasons/"+id+"/history").once("value")).val()||{};
      if(Object.keys(back).length!==rc){setLog("⚠ VERIFY FAILED — live data NOT touched. Snapshot kept at seasons/"+id+" — tell Claude.");setBusy(false);return;}
      await dbr.ref("fundAudit").push({action:"season_archive",season:sname,fundTotalAtArchive:fund,rounds:rc,by:me,ts:Date.now()});
      setLog("Snapshot verified ("+rc+" rounds). Clearing live season…");
      await dbr.ref("history").set(null);
      await dbr.ref("attendance").set(null);
      const nextName=String((parseInt(sname,10)||new Date().getFullYear())+1);
      await dbr.ref("settings/season").set({name:nextName,startedAt:Date.now()});
      setTyped("");
      setLog("✅ Season "+sname+" archived — "+rc+" rounds, $"+fund+" fund recorded. Live data is fresh for "+nextName+". Roster, PINs, settings and game templates untouched.");
    }catch(e){setLog("⚠ Error: "+e.message+" — live data was not cleared unless the log above says so.");}
    setBusy(false);
  }

  async function restoreSeason(id,meta){
    if(busy)return;
    if(liveRounds>0){window.alert("Live history is not empty ("+liveRounds+" rounds) — restore is blocked to avoid overwriting. Archive or clear the live season first.");return;}
    if(!window.confirm("Restore season \""+(meta&&meta.name)+"\" ("+(meta&&meta.roundCount)+" rounds) back to LIVE?"))return;
    setBusy(true);setLog("Restoring…");
    try{
      const snap=(await db.ref("seasons/"+id).once("value")).val();
      if(!snap||!snap.history){setLog("Archive unreadable.");setBusy(false);return;}
      await db.ref("history").set(snap.history);
      if(snap.attendance)await db.ref("attendance").set(snap.attendance);
      if(snap.meta&&snap.meta.name)await db.ref("settings/season").set({name:snap.meta.name,endDate:snap.meta.endDate||null,startedAt:snap.meta.startedAt||Date.now()});
      setLog("✅ Restored \""+(snap.meta&&snap.meta.name)+"\" to live ("+Object.keys(snap.history).length+" rounds). The archive copy is kept.");
    }catch(e){setLog("⚠ Restore error: "+e.message);}
    setBusy(false);
  }

  if(!isMaster)return(<div><div className="pg-eyebrow">Master Only</div><div className="pg-title">Season Management</div><div className="info-box">Only the master account can manage seasons.</div></div>);

  const archList=Object.entries(seasons||{}).sort((a,b)=>((b[1].meta&&b[1].meta.archivedAt)||0)-((a[1].meta&&a[1].meta.archivedAt)||0));
  const inp={width:"100%",boxSizing:"border-box",background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.12)",borderRadius:8,padding:"9px 11px",color:"#e2e8f0",fontFamily:"inherit",fontSize:13,outline:"none"};
  const lbl={fontSize:10,fontWeight:800,textTransform:"uppercase",letterSpacing:"0.07em",color:"rgba(255,255,255,0.35)",marginBottom:5};

  return(<div>
    <div className="pg-eyebrow">Master Only</div>
    <div className="pg-title">Season Management</div>
    <div className="pg-sub">End the season safely — archive everything, start fresh, restore if needed</div>

    {/* CURRENT SEASON */}
    <div className="card">
      <div className="card-hdr"><div style={{display:"flex",alignItems:"center",gap:10}}><span style={{fontSize:20}}>📅</span><span style={{fontSize:14,fontWeight:700,color:"#e2e8f0"}}>Current Season</span></div>
        {daysLeft!=null&&<span style={{fontSize:10,fontWeight:800,padding:"3px 9px",borderRadius:20,background:daysLeft<=35?"rgba(245,158,11,0.12)":"rgba(255,255,255,0.06)",color:daysLeft<=35?"#fbbf24":"rgba(255,255,255,0.4)"}}>{daysLeft>=0?(daysLeft+" days left"):"ended "+(-daysLeft)+"d ago"}</span>}
      </div>
      <div className="card-body">
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
          <div><div style={lbl}>Season name</div><input style={inp} value={nm} onChange={e=>setNm(e.target.value)}/></div>
          <div><div style={lbl}>End date</div><input style={inp} type="date" value={ed} onChange={e=>setEd(e.target.value)}/></div>
        </div>
        <button className="btn btn-sm" onClick={()=>{wr("settings/season",{name:nm.trim()||String(new Date().getFullYear()),endDate:ed||null,startedAt:(season&&season.startedAt)||Date.now()});setLog("Season settings saved.");}}>Save season settings</button>
      </div>
    </div>

    {/* ARCHIVE */}
    <div className="card">
      <div className="card-hdr"><div style={{display:"flex",alignItems:"center",gap:10}}><span style={{fontSize:20}}>🗄️</span><span style={{fontSize:14,fontWeight:700,color:"#e2e8f0"}}>Archive Season &amp; Start Fresh</span></div></div>
      <div className="card-body">
        <div style={{fontSize:13,color:"rgba(255,255,255,0.55)",lineHeight:1.7,marginBottom:10}}>
          Live right now: <b style={{color:"#e2e8f0"}}>{liveRounds} rounds</b> · <b style={{color:"#e2e8f0"}}>{attCount} attendance rounds</b> · tournament fund <b style={{color:"#e2e8f0"}}>${Math.round(liveFund)}</b>.<br/>
          Archiving copies ALL of it into a permanent snapshot first, <b>verifies the copy</b>, logs the fund total to the audit trail, and only then clears live history + attendance and rolls the season name. Roster, PINs, settings and game templates are never touched.
        </div>
        {(()=>{if(!season||!season.endDate)return null;const d=Math.ceil((new Date(season.endDate+"T23:59:59")-new Date())/86400000);if(d<=0)return null;return(
          <div style={{fontSize:12.5,color:"#fbbf24",background:"rgba(245,158,11,0.08)",border:"1px solid rgba(245,158,11,0.15)",borderRadius:8,padding:"8px 11px",marginBottom:10,lineHeight:1.6}}>
            ⚠ The season end date is <b>{season.endDate}</b> — <b>{d} day{d!==1?"s":""} away</b>. Archiving now ends the season early. That’s allowed (weather happens), just make sure it’s intentional.
          </div>);})()}
        <div style={lbl}>Type ARCHIVE to confirm</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <input style={{...inp,maxWidth:160,letterSpacing:"0.15em",fontWeight:700}} value={typed} onChange={e=>setTyped(e.target.value)}/>
          <button className="btn btn-sm" disabled={typed.trim().toUpperCase()!=="ARCHIVE"||busy} style={{background:typed.trim().toUpperCase()==="ARCHIVE"?"#b91c1c":"rgba(255,255,255,0.08)",color:"#fff",opacity:busy?0.6:1}} onClick={archiveSeason}>{busy?"Working…":"Archive season"}</button>
        </div>
        {log&&<div style={{marginTop:10,fontSize:12.5,color:"#fbbf24",lineHeight:1.6}}>{log}</div>}
      </div>
    </div>

    {/* ARCHIVED SEASONS */}
    <div className="card">
      <div className="card-hdr"><div style={{display:"flex",alignItems:"center",gap:10}}><span style={{fontSize:20}}>📚</span><span style={{fontSize:14,fontWeight:700,color:"#e2e8f0"}}>Archived Seasons</span></div></div>
      <div className="card-body">
        {archList.length===0?<div style={{fontSize:13,color:"rgba(255,255,255,0.35)"}}>No archived seasons yet.</div>:
          archList.map(([id,s])=>{const m=s.meta||{};return(
            <div key={id} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 0",borderTop:"1px solid rgba(255,255,255,0.06)",flexWrap:"wrap"}}>
              <div style={{flex:1,minWidth:180}}>
                <div style={{fontSize:13.5,fontWeight:700,color:"#e2e8f0"}}>{m.name||id}</div>
                <div style={{fontSize:11,color:"rgba(255,255,255,0.4)"}}>{m.roundCount||0} rounds · fund ${m.fundTotal||0} · archived {m.archivedAt?new Date(m.archivedAt).toLocaleString([], {month:"numeric",day:"numeric",hour:"numeric",minute:"2-digit"}):""} by {m.by||""}</div>
              </div>
              <button className="btn btn-sm btn-ghost" disabled={busy} onClick={()=>restoreSeason(id,m)}>Restore to live</button>
              <button className="btn btn-sm btn-ghost" disabled={busy} onClick={async()=>{
                try{
                  const snap=(await db.ref("seasons/"+id).once("value")).val();
                  if(!snap){window.alert("Could not read archive.");return;}
                  const blob=new Blob([JSON.stringify(snap,null,2)],{type:"application/json"});
                  const a=document.createElement("a");
                  a.href=URL.createObjectURL(blob);
                  a.download="clark-season-"+(m.name||id)+"-backup-"+new Date().toISOString().slice(0,10)+".json";
                  document.body.appendChild(a);a.click();a.remove();
                  setBackedUp(b=>({...b,[id]:true}));
                  setLog("Backup of \""+(m.name||id)+"\" downloaded — keep that file safe. Delete is now enabled for this archive.");
                }catch(e){window.alert("Backup failed: "+e.message);}
              }}>💾 Download backup</button>
              <button className="btn btn-sm btn-ghost" disabled={busy||!backedUp[id]} title={backedUp[id]?"Permanently delete (backup downloaded)":"Download a backup first to enable Delete"} style={{color:backedUp[id]?"#f87171":"rgba(255,255,255,0.25)",cursor:backedUp[id]?"pointer":"not-allowed"}} onClick={()=>{
                if(!backedUp[id])return;
                const t=window.prompt("Permanently delete this archive? Type the season name (\""+(m.name||id)+"\") to confirm:");
                if(t==null)return;
                if(String(t).trim()!==(m.name||id)){window.alert("Name did not match — nothing deleted.");return;}
                db.ref("seasons/"+id).remove().then(()=>setLog("Archive \""+(m.name||id)+"\" ("+(m.roundCount||0)+" rounds) permanently deleted. Your downloaded backup file is now the only copy."));
              }}>Delete</button>
            </div>
          );})}
        <div style={{fontSize:10.5,color:"rgba(255,255,255,0.3)",marginTop:10}}>Restore is blocked unless live history is empty. Delete is disabled until you download that archive’s backup file — then requires typing the season name. A season can never be erased without a copy existing on your computer first.</div>
      </div>
    </div>

    <div className="card">
      <div className="card-hdr"><div style={{display:"flex",alignItems:"center",gap:10}}><span style={{fontSize:20}}>💾</span><span style={{fontSize:14,fontWeight:700,color:"#e2e8f0"}}>Full Database Backup</span></div></div>
      <div className="card-body">
        <div style={{fontSize:13,color:"rgba(255,255,255,0.5)",lineHeight:1.7,marginBottom:10}}>Downloads <b style={{color:"#e2e8f0"}}>everything</b> — roster, history, attendance, settings, archived seasons, the works — as one JSON file to your computer. Do this every few weeks (and before anything big). If the database were ever damaged, this file is the way back.</div>
        <button className="btn btn-sm" onClick={async()=>{
          try{
            const snap=(await db.ref("/").once("value")).val();
            const blob=new Blob([JSON.stringify(snap,null,2)],{type:"application/json"});
            const a=document.createElement("a");
            a.href=URL.createObjectURL(blob);
            a.download="clark-golf-FULL-backup-"+new Date().toISOString().slice(0,10)+".json";
            document.body.appendChild(a);a.click();a.remove();
          }catch(e){window.alert("Backup failed: "+e.message);}
        }}>💾 Download full backup</button>
      </div>
    </div>
    {/* STILL COMING */}
    {/* Stats by Season — LIVE in the app */}
    <div className="card"><div className="card-hdr"><div style={{display:"flex",alignItems:"center",gap:10}}><span style={{fontSize:20}}>📊</span><span style={{fontSize:14,fontWeight:700,color:"#e2e8f0"}}>Stats by Season</span></div><span style={{fontSize:9,fontWeight:800,padding:"3px 9px",borderRadius:20,background:"rgba(54,165,111,0.12)",color:"#4ade80",border:"1px solid rgba(54,165,111,0.2)",textTransform:"uppercase",letterSpacing:"0.08em",whiteSpace:"nowrap"}}>Live</span></div><div className="card-body"><div style={{fontSize:13,color:"rgba(255,255,255,0.5)",lineHeight:1.75}}>Done — in the main app, the History, Standings and Stats tabs have a <b style={{color:"#e2e8f0"}}>Season selector</b>. Everyone can browse any archived season’s rounds, money and analytics exactly like the current one.</div></div></div>
    <div className="card"><div className="card-hdr"><div style={{display:"flex",alignItems:"center",gap:10}}><span style={{fontSize:20}}>🏆</span><span style={{fontSize:14,fontWeight:700,color:"#e2e8f0"}}>Season Awards</span></div><span style={{fontSize:9,fontWeight:800,padding:"3px 9px",borderRadius:20,background:"rgba(245,158,11,0.1)",color:"#fbbf24",border:"1px solid rgba(245,158,11,0.15)",textTransform:"uppercase",letterSpacing:"0.08em",whiteSpace:"nowrap"}}>Coming Soon</span></div><div className="card-body"><div style={{fontSize:13,color:"rgba(255,255,255,0.5)",lineHeight:1.75}}>Auto-generated award summaries from an archived season — most rounds, most skins, best net average, biggest single-round win — shareable as a formatted email. Next up after launch.</div></div></div>
    <div style={{textAlign:"center",padding:"16px 0 8px",fontSize:11,color:"rgba(255,255,255,0.2)",lineHeight:1.8}}>Season Management · Master Only · Fund reset is handled by Archive (audit-logged)</div>
  </div>);
}
const ANNOUNCEMENT_CATEGORIES=[
  {id:"tournament",label:"Tournament",icon:"🏆",color:"#fbbf24",soft:"rgba(251,191,36,0.12)",border:"rgba(251,191,36,0.35)"},
  {id:"feature",   label:"New Feature",icon:"🎉",color:"#10b981",soft:"rgba(16,185,129,0.12)",border:"rgba(16,185,129,0.35)"},
  {id:"schedule",  label:"Schedule",icon:"📅",color:"#60a5fa",soft:"rgba(96,165,250,0.12)",border:"rgba(96,165,250,0.35)"},
  {id:"important", label:"Important",icon:"⚠️",color:"#f87171",soft:"rgba(248,113,113,0.12)",border:"rgba(248,113,113,0.35)"},
  {id:"general",   label:"General",icon:"💬",color:"#94a3b8",soft:"rgba(148,163,184,0.12)",border:"rgba(148,163,184,0.35)"},
];
function getAnnCategory(id){return ANNOUNCEMENT_CATEGORIES.find(c=>c.id===id)||ANNOUNCEMENT_CATEGORIES[4];}

function AnnounceTab({user}){
  const announcements=useDB("announcements");
  const [toast,showToast]=useToast();
  const [editing,setEditing]=useState(null); // null = closed, true = new, object = editing existing

  // Compose form state
  const [category,setCategory]=useState("general");
  const [title,setTitle]=useState("");
  const [body,setBody]=useState("");
  const [display,setDisplay]=useState("banner");
  const [dismissal,setDismissal]=useState("user");
  const [autoExpireDays,setAutoExpireDays]=useState(7);
  const [resetDismissals,setResetDismissals]=useState(false);
  const [saving,setSaving]=useState(false);
  const [err,setErr]=useState("");

  const TITLE_MAX=60;
  const BODY_MAX=400;
  const cat=getAnnCategory(category);

  // Open editing
  function openNew(){
    setCategory("general");setTitle("");setBody("");setDisplay("banner");
    setDismissal("user");setAutoExpireDays(7);setResetDismissals(false);
    setErr("");setEditing(true);
  }
  function openEdit(a){
    setCategory(a.category||"general");
    setTitle(a.title||"");setBody(a.body||"");
    setDisplay(a.display||"banner");
    setDismissal(a.dismissal||"user");
    setAutoExpireDays(7);
    setResetDismissals(false);
    setErr("");setEditing(a);
  }
  function closeEdit(){setEditing(null);}

  async function publish(){
    if(!title.trim()){setErr("Add a title");return;}
    if(title.length>TITLE_MAX){setErr(`Title too long (${TITLE_MAX} max)`);return;}
    if(body.length>BODY_MAX){setErr(`Message too long (${BODY_MAX} max)`);return;}
    setSaving(true);setErr("");
    const now=Date.now();
    const isEdit=editing&&typeof editing==="object";
    const data={
      category,title:title.trim(),body:body.trim(),
      display,dismissal,
      autoExpireAt:dismissal==="auto"?now+(autoExpireDays*24*60*60*1000):null,
      active:isEdit?(editing.active!==false):true,
      createdAt:isEdit?(editing.createdAt||now):now,
      createdBy:isEdit?(editing.createdBy||user?.email||"Admin"):(user?.email||"Admin"),
      updatedAt:isEdit?now:null,
    };
    try{
      if(isEdit){
        await wr("announcements/"+editing.key,data);
        if(resetDismissals){await dl("announcementDismissals/"+editing.key);}
        showToast("Announcement updated");
      }else{
        await ps("announcements",data);
        showToast("Announcement published");
      }
      closeEdit();
    }catch(e){setErr("Failed to save");setSaving(false);}
    setSaving(false);
  }

  async function togglePause(key,active){
    await wr("announcements/"+key+"/active",active);
    showToast(active?"Resumed":"Paused");
  }
  async function remove(key){
    if(!window.confirm("Delete this announcement?"))return;
    await dl("announcements/"+key);
    await dl("announcementDismissals/"+key);
    showToast("Deleted");
  }

  const all=Object.entries(announcements||{}).map(([k,a])=>({...a,key:k})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const now=Date.now();
  const active=all.filter(a=>a.active!==false&&(!a.autoExpireAt||a.autoExpireAt>now));
  const inactive=all.filter(a=>a.active===false||(a.autoExpireAt&&a.autoExpireAt<=now));

  return(<div className="main">
    <Toast {...toast}/>
    <div className="pg-eyebrow">Admin</div>
    <div className="pg-title">Announcements</div>
    <div className="pg-sub">Post messages to all members. Banner or modal display, with three dismissal modes. Members see new announcements in real-time.</div>

    {/* New announcement button */}
    {!editing&&(
      <button className="btn btn-g btn-full" onClick={openNew} style={{marginBottom:16,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New announcement
      </button>
    )}

    {/* Compose form (inline) */}
    {editing&&(
      <div className="card" style={{marginBottom:18,borderColor:"rgba(16,185,129,0.3)"}}>
        <div className="card-hdr">
          <div className="card-title">{typeof editing==="object"?"Edit Announcement":"New Announcement"}</div>
          <button className="btn btn-gh btn-xs" onClick={closeEdit}>Cancel</button>
        </div>
        <div className="card-body">
          {/* Category */}
          <div className="lbl">Category</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:6,marginBottom:14}}>
            {ANNOUNCEMENT_CATEGORIES.map(c=>(
              <button key={c.id} onClick={()=>setCategory(c.id)}
                style={{padding:"10px 4px",borderRadius:8,border:"1.5px solid",borderColor:category===c.id?c.border:"rgba(255,255,255,0.1)",background:category===c.id?c.soft:"rgba(255,255,255,0.04)",color:category===c.id?c.color:"rgba(255,255,255,0.5)",fontSize:10,fontWeight:700,cursor:"pointer",fontFamily:"inherit",display:"flex",flexDirection:"column",alignItems:"center",gap:3,transition:"all 0.15s"}}>
                <span style={{fontSize:18,lineHeight:1}}>{c.icon}</span>
                <span>{c.label}</span>
              </button>
            ))}
          </div>

          {/* Title */}
          <div className="lbl">Title</div>
          <input className="inp" type="text" placeholder="e.g. Tournament this Saturday" value={title} onChange={e=>{setTitle(e.target.value);setErr("");}} maxLength={TITLE_MAX+10} style={{marginBottom:4}}/>
          <div style={{fontSize:10,color:title.length>TITLE_MAX?"#ef4444":"rgba(255,255,255,0.3)",textAlign:"right",marginBottom:14}}>{title.length}/{TITLE_MAX}</div>

          {/* Body */}
          <div className="lbl">Message (optional)</div>
          <textarea className="inp" placeholder="Add details..." value={body} maxLength={BODY_MAX+20}
            onChange={e=>{
              setBody(e.target.value);
              setErr("");
              e.target.style.height="auto";
              e.target.style.height=Math.max(120, Math.min(420, e.target.scrollHeight))+"px";
            }}
            ref={el=>{
              if(el){
                requestAnimationFrame(()=>{
                  el.style.height="auto";
                  el.style.height=Math.max(120, Math.min(420, el.scrollHeight))+"px";
                });
              }
            }}
            style={{marginBottom:4,minHeight:120,resize:"none",overflow:"hidden",lineHeight:1.5,fontSize:14}}/>
          <div style={{fontSize:10,color:body.length>BODY_MAX?"#ef4444":"rgba(255,255,255,0.3)",textAlign:"right",marginBottom:14}}>{body.length}/{BODY_MAX}</div>

          {/* Display style */}
          <div className="lbl">Display style</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
            {[{id:"banner",icon:"📌",label:"Banner",sub:"Top of app, dismissable"},{id:"modal",icon:"📢",label:"Modal",sub:"Full popup, forces attention"}].map(d=>(
              <button key={d.id} onClick={()=>setDisplay(d.id)}
                style={{padding:"14px 10px",borderRadius:8,border:"1.5px solid",borderColor:display===d.id?"rgba(16,185,129,0.4)":"rgba(255,255,255,0.1)",background:display===d.id?"rgba(16,185,129,0.1)":"rgba(255,255,255,0.04)",color:display===d.id?"#10b981":"rgba(255,255,255,0.5)",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
                <span style={{fontSize:18}}>{d.icon}</span>{d.label}
                <span style={{fontSize:9,opacity:0.8,fontWeight:500}}>{d.sub}</span>
              </button>
            ))}
          </div>

          {/* Dismissal */}
          <div className="lbl">When dismissed</div>
          <div style={{display:"flex",flexDirection:"column",gap:5,marginBottom:14}}>
            {[
              {id:"user",label:"Stays until each user dismisses it",sub:"No expiration — each person dismisses when ready"},
              {id:"session",label:"Resets every time the app opens",sub:"Even if dismissed, comes back next session"},
              {id:"auto",label:"Auto-removes for everyone after X days",sub:"Users can still dismiss early — the date is just a cutoff"},
            ].map(d=>(
              <button key={d.id} onClick={()=>setDismissal(d.id)}
                style={{padding:"10px 12px",borderRadius:8,border:"1.5px solid",borderColor:dismissal===d.id?"rgba(16,185,129,0.4)":"rgba(255,255,255,0.1)",background:dismissal===d.id?"rgba(16,185,129,0.1)":"rgba(255,255,255,0.04)",cursor:"pointer",fontFamily:"inherit",textAlign:"left",display:"flex",alignItems:"center",gap:8}}>
                <div style={{width:14,height:14,borderRadius:"50%",border:"2px solid",borderColor:dismissal===d.id?"#10b981":"rgba(255,255,255,0.2)",background:dismissal===d.id?"#10b981":"transparent",flexShrink:0}}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12,fontWeight:700,color:dismissal===d.id?"#10b981":"#e2e8f0"}}>{d.label}</div>
                  <div style={{fontSize:10,color:"rgba(255,255,255,0.4)",marginTop:1}}>{d.sub}</div>
                </div>
              </button>
            ))}
          </div>
          {dismissal==="auto"&&(
            <div style={{display:"flex",alignItems:"center",gap:8,padding:"10px 12px",background:"rgba(255,255,255,0.04)",borderRadius:8,marginBottom:14}}>
              <span style={{fontSize:12,color:"rgba(255,255,255,0.7)"}}>Auto-remove after</span>
              <input type="number" className="inp" value={autoExpireDays} min={1} max={365} onChange={e=>setAutoExpireDays(parseInt(e.target.value)||7)} style={{width:70,padding:"6px 8px"}}/>
              <span style={{fontSize:12,color:"rgba(255,255,255,0.7)"}}>days</span>
            </div>
          )}

          {/* Reset dismissals (edit only) */}
          {editing&&typeof editing==="object"&&(
            <div onClick={()=>setResetDismissals(v=>!v)} style={{display:"flex",alignItems:"center",gap:8,padding:"10px 12px",borderRadius:8,border:"1.5px solid",borderColor:resetDismissals?"rgba(245,158,11,0.4)":"rgba(255,255,255,0.1)",background:resetDismissals?"rgba(245,158,11,0.1)":"rgba(255,255,255,0.04)",cursor:"pointer",marginBottom:14}}>
              <div style={{width:16,height:16,borderRadius:3,border:"2px solid",borderColor:resetDismissals?"#f59e0b":"rgba(255,255,255,0.2)",background:resetDismissals?"#f59e0b":"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                {resetDismissals&&<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg>}
              </div>
              <div style={{flex:1}}>
                <div style={{fontSize:12,fontWeight:700,color:resetDismissals?"#fbbf24":"#e2e8f0"}}>Re-notify everyone</div>
                <div style={{fontSize:10,color:"rgba(255,255,255,0.4)",marginTop:1}}>Resets dismissals so everyone sees this update</div>
              </div>
            </div>
          )}

          {/* Preview */}
          <div className="lbl">Preview</div>
          {display==="banner"?(
            <div style={{background:cat.soft,border:"1px solid "+cat.border,borderRadius:10,padding:"10px 14px",display:"flex",alignItems:"flex-start",gap:10,marginBottom:14}}>
              <div style={{fontSize:18,lineHeight:1,flexShrink:0,marginTop:1}}>{cat.icon}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13,fontWeight:700,color:cat.color,lineHeight:1.3}}>{title||"Your title here"}</div>
                {body&&<div style={{fontSize:12,color:"rgba(255,255,255,0.7)",marginTop:2,lineHeight:1.4}}>{body}</div>}
              </div>
            </div>
          ):(
            <div style={{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:14,padding:"18px 16px",textAlign:"center",borderTop:"4px solid "+cat.color,marginBottom:14}}>
              <div style={{fontSize:32,marginBottom:6}}>{cat.icon}</div>
              <div style={{fontSize:10,fontWeight:700,color:cat.color,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:4}}>{cat.label}</div>
              <div style={{fontSize:15,fontWeight:800,color:"#fff",marginBottom:body?8:0}}>{title||"Your title here"}</div>
              {body&&<div style={{fontSize:12,color:"rgba(255,255,255,0.7)",lineHeight:1.4,whiteSpace:"pre-wrap"}}>{body}</div>}
            </div>
          )}

          {err&&<div style={{padding:"8px 12px",background:"rgba(239,68,68,0.1)",border:"1px solid rgba(239,68,68,0.3)",borderRadius:8,color:"#fca5a5",fontSize:12,marginBottom:10}}>{err}</div>}

          <div style={{display:"flex",gap:8}}>
            <button className="btn btn-gh" style={{flex:1}} onClick={closeEdit} disabled={saving}>Cancel</button>
            <button className="btn btn-g" style={{flex:2}} onClick={publish} disabled={saving}>
              {saving?"Saving…":(typeof editing==="object"?"Save changes":"Publish")}
            </button>
          </div>
        </div>
      </div>
    )}

    {/* Active list */}
    {active.length>0&&(
      <div className="card">
        <div className="card-hdr">
          <div className="card-title">Active ({active.length})</div>
        </div>
        <div className="card-body" style={{padding:0}}>
          {active.map((a,i)=>{
            const cat=getAnnCategory(a.category);
            const expiresIn=a.autoExpireAt?Math.ceil((a.autoExpireAt-now)/(24*60*60*1000)):null;
            return(
              <div key={a.key} style={{padding:"14px 16px",borderBottom:i<active.length-1?"1px solid rgba(255,255,255,0.06)":"none"}}>
                <div style={{display:"flex",alignItems:"flex-start",gap:10,marginBottom:8}}>
                  <span style={{fontSize:20,lineHeight:1,marginTop:2,flexShrink:0}}>{cat.icon}</span>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:700,color:cat.color,marginBottom:2}}>{a.title}</div>
                    {a.body&&<div style={{fontSize:12,color:"rgba(255,255,255,0.6)",lineHeight:1.4}}>{a.body.length>120?a.body.slice(0,120)+"…":a.body}</div>}
                  </div>
                </div>
                <div style={{fontSize:10,color:"rgba(255,255,255,0.35)",display:"flex",gap:8,flexWrap:"wrap",marginBottom:10}}>
                  <span>{a.display==="modal"?"📢 Modal":"📌 Banner"}</span>
                  <span>·</span>
                  <span>{a.dismissal==="auto"?`Expires in ${expiresIn}d`:a.dismissal==="session"?"Per session":"Once dismissed"}</span>
                  {a.createdAt&&<><span>·</span><span>{new Date(a.createdAt).toLocaleDateString()}</span></>}
                  {a.createdBy&&<><span>·</span><span>by {a.createdBy.split("@")[0]}</span></>}
                </div>
                <div style={{display:"flex",gap:6}}>
                  <button className="btn btn-gh btn-sm" onClick={()=>togglePause(a.key,false)}>Pause</button>
                  <button className="btn btn-gh btn-sm" onClick={()=>openEdit(a)}>Edit</button>
                  <button className="btn btn-r btn-sm" onClick={()=>remove(a.key)}>Delete</button>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    )}

    {/* Paused / Expired list */}
    {inactive.length>0&&(
      <div className="card">
        <div className="card-hdr">
          <div className="card-title">Paused / Expired ({inactive.length})</div>
        </div>
        <div className="card-body" style={{padding:0}}>
          {inactive.map((a,i)=>{
            const cat=getAnnCategory(a.category);
            const isExpired=a.autoExpireAt&&a.autoExpireAt<=now;
            return(
              <div key={a.key} style={{padding:"14px 16px",borderBottom:i<inactive.length-1?"1px solid rgba(255,255,255,0.06)":"none",opacity:0.65}}>
                <div style={{display:"flex",alignItems:"flex-start",gap:10,marginBottom:8}}>
                  <span style={{fontSize:20,lineHeight:1,marginTop:2,flexShrink:0,opacity:0.6}}>{cat.icon}</span>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:700,color:"rgba(255,255,255,0.7)",marginBottom:2}}>{a.title}</div>
                    {a.body&&<div style={{fontSize:12,color:"rgba(255,255,255,0.4)",lineHeight:1.4}}>{a.body.length>120?a.body.slice(0,120)+"…":a.body}</div>}
                  </div>
                </div>
                <div style={{fontSize:10,color:"rgba(255,255,255,0.35)",marginBottom:10}}>
                  {isExpired?"Expired":"Paused"}
                  {a.createdAt&&" · "+new Date(a.createdAt).toLocaleDateString()}
                </div>
                <div style={{display:"flex",gap:6}}>
                  {!isExpired&&<button className="btn btn-g btn-sm" onClick={()=>togglePause(a.key,true)}>Resume</button>}
                  <button className="btn btn-gh btn-sm" onClick={()=>openEdit(a)}>Edit</button>
                  <button className="btn btn-r btn-sm" onClick={()=>remove(a.key)}>Delete</button>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    )}

    {all.length===0&&!editing&&(
      <div className="card">
        <div className="card-body" style={{padding:"32px 20px",textAlign:"center",color:"rgba(255,255,255,0.5)",fontSize:13}}>
          <div style={{fontSize:32,marginBottom:8}}>📢</div>
          <div style={{fontWeight:700,marginBottom:4,color:"#e2e8f0"}}>No announcements yet</div>
          <div style={{fontSize:12}}>Create one to notify members.</div>
        </div>
      </div>
    )}
  </div>);
}

// ── SETTINGS TAB (Master Only) ────────────────────────────────────────────────
function SettingsTab({user,onSignOut}){
  const settings=useDB("settings");
  const doNotPair=useDB("settings/doNotPair");
  const rosterEdits=useDB("rosterEdits");
  const extra=useDB("extraPlayers");
  const [tfBal,setTfBal]=useState("");
  const [pairA,setPairA]=useState("");
  const [pairB,setPairB]=useState("");
  const [pairErr,setPairErr]=useState("");
  const [newPw,setNewPw]=useState("");
  const [confirmPw,setConfirmPw]=useState("");
  const [pwMsg,setPwMsg]=useState("");
  const [toast,showToast]=useToast();

  useEffect(()=>{if(settings)setTfBal(String(settings.tournFundStartingBalance||0));},[settings?.tournFundStartingBalance]);

  function saveTF(){wr("settings/tournFundStartingBalance",parseFloat(tfBal)||0);showToast("Saved ✓");}
  function savePw(){
    if(newPw!==confirmPw){setPwMsg("Passwords do not match");return;}
    if(newPw.length<4){setPwMsg("Minimum 4 characters");return;}
    wr("settings/masterPassword",newPw);
    setNewPw("");setConfirmPw("");setPwMsg("");
    showToast("Password updated ✓");
  }

  return(<div>
    <Toast msg={toast.msg} type={toast.type}/>
    <div className="pg-eyebrow">Master Only</div>
    <div className="pg-title">Settings</div>
    <div className="pg-sub">Master-only system configuration</div>

    {/* ═══ Pairing Rules (Master only, silent in app) ═══ */}
    <div className="card">
      <div className="card-hdr"><span className="card-title">Pairing Rules</span></div>
      <div className="card-body">
        <div style={{fontSize:12,color:"rgba(255,255,255,0.4)",marginBottom:14,lineHeight:1.6}}>
          Players who should never end up on the same team during auto-build. Silent — never shown anywhere in the main app. Match requests override these rules. Admin can always manually move players after build.
        </div>

        {/* Add new pair */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr auto",gap:8,marginBottom:6}}>
          <div>
            <div className="lbl" style={{marginBottom:4}}>Player A</div>
            <select className="inp" value={pairA} onChange={e=>{setPairA(e.target.value);setPairErr("");}}>
              <option value="">— Select —</option>
              {(()=>{
                const allP=[...ROSTER.map(p=>({id:p.id,name:(rosterEdits&&rosterEdits[p.id])||p.name})),
                  ...Object.values(extra||{}).map(p=>({id:p.id,name:p.name}))];
                return allP.sort((a,b)=>a.name.localeCompare(b.name)).map(p=>(
                  <option key={p.id} value={String(p.id)}>{p.name}</option>
                ));
              })()}
            </select>
          </div>
          <div>
            <div className="lbl" style={{marginBottom:4}}>Player B</div>
            <select className="inp" value={pairB} onChange={e=>{setPairB(e.target.value);setPairErr("");}}>
              <option value="">— Select —</option>
              {(()=>{
                const allP=[...ROSTER.map(p=>({id:p.id,name:(rosterEdits&&rosterEdits[p.id])||p.name})),
                  ...Object.values(extra||{}).map(p=>({id:p.id,name:p.name}))];
                return allP.sort((a,b)=>a.name.localeCompare(b.name)).map(p=>(
                  <option key={p.id} value={String(p.id)}>{p.name}</option>
                ));
              })()}
            </select>
          </div>
          <button className="btn btn-g btn-sm" style={{alignSelf:"flex-end"}}
            onClick={()=>{
              if(!pairA||!pairB){setPairErr("Pick both players");return;}
              if(pairA===pairB){setPairErr("Pick two different players");return;}
              // check duplicate
              const exists=Object.values(doNotPair||{}).some(r=>
                (String(r.playerA_id)===pairA&&String(r.playerB_id)===pairB)||
                (String(r.playerA_id)===pairB&&String(r.playerB_id)===pairA)
              );
              if(exists){setPairErr("Pair already exists");return;}
              const nameOf=id=>{
                const baseP=ROSTER.find(p=>String(p.id)===id);
                if(baseP)return (rosterEdits&&rosterEdits[baseP.id])||baseP.name;
                const ex=Object.values(extra||{}).find(p=>String(p.id)===id);
                return ex?ex.name:"Unknown";
              };
              ps("settings/doNotPair",{
                playerA_id:Number(pairA),
                playerA_name:nameOf(pairA),
                playerB_id:Number(pairB),
                playerB_name:nameOf(pairB),
                active:true,
                addedAt:Date.now()
              });
              setPairA("");setPairB("");setPairErr("");
            }}>+ Add</button>
        </div>
        {pairErr&&<div style={{fontSize:11,color:"#ef4444",marginTop:6}}>{pairErr}</div>}

        {/* Active rules */}
        <div style={{marginTop:18,fontSize:11,fontWeight:700,color:"rgba(255,255,255,0.45)",letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:8}}>
          Rules ({Object.keys(doNotPair||{}).length})
        </div>
        {Object.keys(doNotPair||{}).length===0&&(
          <div style={{padding:"16px 12px",textAlign:"center",fontSize:12,color:"rgba(255,255,255,0.3)",background:"rgba(255,255,255,0.02)",borderRadius:8}}>No rules set.</div>
        )}
        {Object.entries(doNotPair||{}).map(([k,r])=>(
          <div key={k} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",background:r.active?"rgba(239,68,68,0.06)":"rgba(255,255,255,0.02)",border:"1px solid "+(r.active?"rgba(239,68,68,0.15)":"rgba(255,255,255,0.05)"),borderRadius:8,marginBottom:6}}>
            {/* Toggle */}
            <div onClick={()=>wr("settings/doNotPair/"+k+"/active",!r.active)}
              style={{width:36,height:20,borderRadius:20,background:r.active?"#10b981":"rgba(255,255,255,0.15)",position:"relative",cursor:"pointer",flexShrink:0,transition:"background 0.2s"}}>
              <div style={{position:"absolute",top:2,left:r.active?18:2,width:16,height:16,borderRadius:"50%",background:"#fff",transition:"left 0.2s"}}/>
            </div>
            {/* Names */}
            <div style={{flex:1,minWidth:0,fontSize:13,fontWeight:600,color:"#e2e8f0",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
              {r.playerA_name} <span style={{color:"rgba(255,255,255,0.3)",margin:"0 4px"}}>↔</span> {r.playerB_name}
            </div>
            {/* Status label */}
            <span style={{fontSize:10,fontWeight:700,color:r.active?"#10b981":"rgba(255,255,255,0.3)",letterSpacing:"0.06em",textTransform:"uppercase",flexShrink:0}}>
              {r.active?"Active":"Paused"}
            </span>
            {/* Remove */}
            <button onClick={()=>{if(window.confirm("Remove this pairing rule permanently?"))dl("settings/doNotPair/"+k);}}
              style={{background:"none",border:"1px solid rgba(239,68,68,0.25)",color:"rgba(239,68,68,0.7)",borderRadius:5,fontSize:10,padding:"3px 8px",cursor:"pointer",fontFamily:"inherit",fontWeight:600,flexShrink:0}}>
              Remove
            </button>
          </div>
        ))}
      </div>
    </div>

    <div className="card">
      <div className="card-hdr"><span className="card-title">🔐 Set Up Firebase Email Login</span></div>
      <div className="card-body">
        <div style={{fontSize:12,color:"rgba(255,255,255,0.4)",marginBottom:12,lineHeight:1.8}}>Replace the password fallback with proper Firebase email authentication. No effect on the main app.</div>
        <div style={{background:"#0e1d19",border:"1px solid rgba(255,255,255,0.08)",borderRadius:10,padding:"12px 14px",fontSize:12,color:"rgba(255,255,255,0.45)",lineHeight:2}}>
          <div><strong style={{color:"#60a5fa"}}>1.</strong> <a href="https://console.firebase.google.com/project/clark-group-dd15e/authentication" target="_blank" style={{color:"#10b981"}}>Firebase Console → Authentication</a></div>
          <div><strong style={{color:"#60a5fa"}}>2.</strong> Sign-in method → Enable <strong style={{color:"#e2e8f0"}}>Email/Password</strong></div>
          <div><strong style={{color:"#60a5fa"}}>3.</strong> Users tab → Add user (your email + password)</div>
          <div><strong style={{color:"#60a5fa"}}>4.</strong> Use Email Login tab on the portal gate</div>
        </div>
      </div>
    </div>

    <div className="card">
      <div className="card-hdr"><span className="card-title">Tournament Fund Starting Balance</span><span style={{fontSize:10,color:"rgba(255,255,255,0.35)",marginLeft:10}}>historical note only — NOT added. The fund is $1 × every recorded attendance player-round (already includes the backfilled rounds).</span></div>
      <div className="card-body">
        <div style={{fontSize:11,color:"rgba(255,255,255,0.35)",marginBottom:8}}>Balance from before rounds were tracked in the app:</div>
        <div style={{display:"flex",gap:8}}>
          <input className="inp" type="number" value={tfBal} onChange={e=>setTfBal(e.target.value)} style={{flex:1}}/>
          <button className="btn btn-g" onClick={saveTF}>Save</button>
        </div>
      </div>
    </div>

    <div className="card">
      <div className="card-hdr"><span className="card-title">Fallback Master Password</span></div>
      <div className="card-body">
        {pwMsg&&<div style={{fontSize:11,color:"#f87171",marginBottom:8}}>{pwMsg}</div>}
        <input className="inp" type="password" value={newPw} onChange={e=>setNewPw(e.target.value)} placeholder="New password" style={{marginBottom:7}}/>
        <input className="inp" type="password" value={confirmPw} onChange={e=>setConfirmPw(e.target.value)} placeholder="Confirm password" style={{marginBottom:10}}/>
        <button className="btn btn-a btn-full" onClick={savePw}>Update Password</button>
      </div>
    </div>

    <div className="card">
      <div className="card-hdr"><span className="card-title">Firebase Links</span></div>
      <div className="card-body" style={{display:"flex",flexDirection:"column",gap:6}}>
        <a href="https://console.firebase.google.com/project/clark-group-dd15e/database" target="_blank" className="btn btn-gh" style={{textDecoration:"none",textAlign:"center",fontSize:12}}>🔥 Firebase Realtime Database</a>
        <a href="https://console.firebase.google.com/project/clark-group-dd15e/authentication/users" target="_blank" className="btn btn-gh" style={{textDecoration:"none",textAlign:"center",fontSize:12}}>🔐 Auth Users</a>
      </div>
    </div>

    <div className="card">
      <div className="card-hdr"><span className="card-title">Session</span></div>
      <div className="card-body"><button className="btn btn-gh btn-full" onClick={onSignOut}>🔒 Lock Portal & Sign Out</button></div>
    </div>
  </div>);
}

// ── MAIN ──────────────────────────────────────────────────────────────────────

  {id:"tournament",label:"Tournament",master:false,icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0V4z"/><path d="M7 6H4a1 1 0 0 0-1 1c0 2.5 1.5 4 4 4M17 6h3a1 1 0 0 1 1 1c0 2.5-1.5 4-4 4"/></svg>},
  {id:"email",label:"Communications",master:false,icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>},
  {id:"awards",label:"Awards",master:false,icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><circle cx="12" cy="8" r="6"/><path d="M15.5 13.5L17 22l-5-3-5 3 1.5-8.5"/></svg>},
  {id:"attend",label:"Attend",master:false,icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>},
  {id:"season",label:"Season",master:true,icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/><path d="M3.6 9h16.8M3.6 15h16.8"/></svg>},
  {id:"logincards",label:"Login Cards",master:true,icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="9" cy="12" r="3"/><line x1="15" y1="10" x2="19" y2="10"/><line x1="15" y1="14" x2="17" y2="14"/></svg>},
  {id:"settings",label:"Settings",master:true,icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>},
];

function Portal(){
  const [user,setUser]=useState(()=>{try{const s=localStorage.getItem("portal_user");return s?JSON.parse(s):null;}catch{return null;}});
  const [tab,setTab]=useState("dash");

  useEffect(()=>{
    if(!auth)return;
    const unsub=auth.onAuthStateChanged(u=>{
      if(!u)return;
      const em=String(u.email||"").toLowerCase().trim();
      firebase.database().ref("settings/portalUsers").once("value").then(snap=>{
        const reg=snap.val()||{};
        let role="superadmin";
        Object.values(reg).forEach(v=>{if(v&&String(v.email||"").toLowerCase().trim()===em&&v.role)role=v.role;});
        if(MASTER_EMAILS.indexOf(em)>=0)role="master";
        const ud={email:u.email,role,method:"firebase"};
        localStorage.setItem("portal_user",JSON.stringify(ud));
        setUser(prev=>(!prev||prev.role!==role||prev.email!==u.email)?ud:prev);
      });
    });
    return()=>unsub();
  },[]);

  // Redirect if non-master lands on master-only tab
  useEffect(()=>{
    if(user&&!tabAllowed(tab)){setTab("dash");}
  },[user,tab]);

  function onAuth(u){localStorage.setItem("portal_user",JSON.stringify(u));setUser(u);}
  function signOut(){localStorage.removeItem("portal_user");try{if(auth&&auth.currentUser)auth.signOut();}catch(e){}setUser(null);}

  if(!user)return<Gate onAuth={onAuth}/>;

  // Filter nav based on role + Master-granted menu permissions
  const navPerms=useDB("settings/portalPerms");
  const tabAllowed=id=>{const n=ALL_NAV_ITEMS.find(x=>x.id===id);if(!n||!n.master)return true;return isMaster(user.role)||((navPerms&&navPerms[id])===true);};
  const NAV_ITEMS=ALL_NAV_ITEMS.filter(n=>!n.master||isMaster(user.role)||((navPerms&&navPerms[n.id])===true));

  const ini=(user.email&&user.email!=="master")?user.email.charAt(0).toUpperCase():(user.name?user.name.charAt(0).toUpperCase():"J");

  return(
    <div className="shell">
      <div className="topbar">
        <div className="logo" style={{whiteSpace:"nowrap"}}>Admin <em>Portal</em></div>
        <span className={`role-badge ${isMaster(user.role)?"rb-master":"rb-superadmin"}`}>{isMaster(user.role)?"Master Admin":"Super Admin"}</span>
        <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:10}}>
          <div style={{display:"flex",alignItems:"center",gap:8,padding:"5px 12px 5px 7px",background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:24}}>
            <div style={{width:26,height:26,borderRadius:"50%",background:"#10b981",color:"#fff",fontSize:11,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"Barlow Condensed,sans-serif",flexShrink:0}}>{ini}</div>
            <span style={{fontSize:12,fontWeight:600,color:"rgba(255,255,255,0.65)",maxWidth:120,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{user.name||user.email||"Admin"}</span>
          </div>
          <a href="/" style={{fontSize:12.5,fontWeight:800,color:"#0b1f17",background:"#4ade80",textDecoration:"none",padding:"8px 14px",borderRadius:20,whiteSpace:"nowrap",boxShadow:"0 2px 10px rgba(74,222,128,0.35)"}}>← Back to App</a>
        </div>
      </div>
      <a href="/" className="mob-back" style={{position:"fixed",left:12,bottom:"calc(env(safe-area-inset-bottom) + 66px)",zIndex:50,background:"#4ade80",color:"#0b1f17",fontWeight:800,fontSize:12.5,padding:"10px 14px",borderRadius:22,textDecoration:"none",boxShadow:"0 6px 18px rgba(0,0,0,0.35)"}}>← App</a>
      <div className="mob-nav">
        {NAV_ITEMS.map(n=>(
          <button key={n.id} className={`mob-btn${tab===n.id?" on":""}`} onClick={()=>setTab(n.id)}>{n.icon}<span>{n.label}</span></button>
        ))}
        <button className="mob-btn" onClick={signOut} style={{marginLeft:4,borderLeft:"1px solid rgba(255,255,255,0.08)",paddingLeft:8}}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" style={{width:18,height:18}}><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          <span>Sign Out</span>
        </button>
      </div>
      <div className="body">
        <div className="sidebar">
          {NAV_ITEMS.filter(n=>!n.master).map(n=>(
            <button key={n.id} className={`ni${tab===n.id?" on":""}`} onClick={()=>setTab(n.id)}>{n.icon}{n.label}</button>
          ))}
          {NAV_ITEMS.some(n=>n.master)&&(
            <>
              <div className="nav-sep">{isMaster(user.role)?"Master Only":"Granted by Master"}</div>
              {NAV_ITEMS.filter(n=>n.master).map(n=>(
                <button key={n.id} className={`ni${tab===n.id?" on":""}`} onClick={()=>setTab(n.id)}>{n.icon}{n.label}</button>
              ))}
            </>
          )}
          <div className="ni-foot">
            <button className="ni" onClick={signOut} style={{color:"rgba(255,255,255,0.25)"}}>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" style={{width:15,height:15}}><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>Sign Out
            </button>
          </div>
        </div>
        <div className="main">
          {tab==="dash"&&<DashTab user={user}/>}
          {tab==="gamerules"&&<GameRulesTab user={user}/>}
          {tab==="appsettings"&&<AppSettingsTab user={user}/>}
          {tab==="week"&&<WeekTab user={user}/>}
          {tab==="email"&&<EmailTab/>}
          {tab==="roster"&&<RosterTab/>}
          {tab==="access"&&<AccessTab user={user}/>}
          {tab==="history"&&<HistoryTab user={user}/>}
          {tab==="announce"&&<AnnounceTab user={user}/>}
          {tab==="tournament"&&<TournamentTab/>}
          {tab==="clarkemail"&&<ClarkEmailTab/>}
          {tab==="awards"&&<AwardsTab user={user}/>}
          {tab==="attend"&&<AttendTab user={user}/>}
          {tab==="logincards"&&tabAllowed("logincards")&&<LoginCardsTab/>}
          {tab==="season"&&tabAllowed("season")&&<SeasonTab/>}
          {tab==="settings"&&tabAllowed("settings")&&<SettingsTab user={user} onSignOut={signOut}/>}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Portal/>);
</script>
</body>
</html>
