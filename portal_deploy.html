      <div className="info-box"><strong>Turn request types on or off for the whole group.</strong> When off, the option disappears from the sign-up form. Existing sign-ups are unaffected.</div>
      <div className="card">
        {[
          {key:"allowGuests",label:"Allow guests",sub:"Members can bring up to 3 guests"},
          {key:"allowPairings",label:"Allow guest pairing requests",sub:"“Pair with me on a team” toggle on guests"},
          {key:"allowMatches",label:"Allow match play requests",sub:"Formal head-to-head match sign-ups"},
          {key:"allowTeePrefs",label:"Allow tee time preferences",sub:"First tee / last tee requests"},
        ].map(({key,label,sub})=>{
          const on=sr[key]!==false;
          return(
            <div key={key} className="s-row" style={{gap:12}}>
              <div onClick={()=>toggleRule(key)} style={{width:36,height:20,borderRadius:20,background:on?"#10b981":"rgba(255,255,255,0.15)",position:"relative",cursor:"pointer",flexShrink:0,transition:"background 0.2s"}}>
                <div style={{position:"absolute",top:2,left:on?18:2,width:16,height:16,borderRadius:"50%",background:"#fff",transition:"left 0.2s"}}/>
              </div>
              <div style={{flex:1}}>
                <div style={{fontSize:13,fontWeight:600,color:on?"#e2e8f0":"rgba(255,255,255,0.4)"}}>{label}</div>
                <div style={{fontSize:11,color:"rgba(255,255,255,0.3)",marginTop:1}}>{sub}</div>
              </div>
              <span style={{fontSize:10,fontWeight:700,color:on?"#10b981":"rgba(255,255,255,0.3)",textTransform:"uppercase",letterSpacing:"0.06em"}}>{on?"On":"Off"}</span>
            </div>
          );
        })}
      </div>
    </div>
    <div className="card">
      <div className="card-hdr"><span className="card-title">Guests per member</span></div>
      <div className="card-body">
        <div style={{fontSize:12,color:"rgba(255,255,255,0.4)",marginBottom:8}}>Maximum guests one member can bring (0–3). Ignored when guests are disabled above.</div>
        <select className="inp" value={maxGuests} onChange={e=>{wr("settings/maxGuests",parseInt(e.target.value));showToast("Saved ✓");}} style={{maxWidth:120}}>
          {[0,1,2,3].map(n=><option key={n} value={n}>{n}</option>)}
        </select>
      </div>
    </div>
  </div>);
}

// ── GAME RULES TAB (mode templates + sign-up rules) ──────────────────────────
function GameRulesTab({user}){
  const gameRules=useDB("settings/gameRules");

  const [toast,showToast]=useToast();
  const [editing,setEditing]=useState(null); // null | {id?, draft}
  const [confirmDel,setConfirmDel]=useState(null);

  const modes=Object.entries(gameRules?.modes||{}).map(([id,m])=>({id,...m}));
  const defaultModeId=gameRules?.defaultModeId||null;
  const sr=gameRules?.signupRules||{};

  const BLANK_TEAM={name:"",type:"team",buyIn:25,fundEnabled:true,fundPerPlayer:1,potFront:5,potBack:5,potOverall:5,potSkins:9,skinsMode:"team",skinsSource:"buyin",roundDown:true};
  const BLANK_IND={name:"",type:"individual",buyIn:25,fundEnabled:true,fundPerPlayer:1,ranking:"net",paidSpots:3,tieRule:"split",skinsEnabled:false,skinsMode:"individual",skinsPerPlayer:0,roundDown:true};

  // ── Money-in = money-out engine (per-player dollars) ──
  function balance(d){
    const buyIn=parseFloat(d.buyIn)||0;
    const fund=d.fundEnabled?(parseFloat(d.fundPerPlayer)||0):0;
    if(d.type==="team"){
      const pots=(parseFloat(d.potFront)||0)+(parseFloat(d.potBack)||0)+(parseFloat(d.potOverall)||0)+(parseFloat(d.potSkins)||0);
      return {allocated:fund+pots,buyIn,diff:buyIn-(fund+pots)};
    }
    // individual: skins (if separate per-player carve) + fund allocated; remainder feeds the paid-spots pool set at scoring
    const skins=d.skinsEnabled?(parseFloat(d.skinsPerPlayer)||0):0;
    const allocated=fund+skins;
    return {allocated,buyIn,diff:buyIn-allocated,poolPerPlayer:buyIn-allocated};
  }

  function openNew(type){setEditing({id:null,draft:type==="team"?{...BLANK_TEAM}:{...BLANK_IND}});}
  function openEdit(m){const{id,...rest}=m;setEditing({id,draft:{...rest}});}

  function save(){
    const d=editing.draft;
    if(!d.name||!d.name.trim()){showToast("Name the mode","err");return;}
    const b=balance(d);
    if(d.type==="team"&&Math.abs(b.diff)>0.001){showToast("Money in must equal money out","err");return;}
    if(d.type==="individual"&&b.diff<-0.001){showToast("Fund + skins exceed the buy-in","err");return;}
    if(d.type==="individual"&&(parseInt(d.paidSpots)||0)<1){showToast("At least 1 paid spot","err");return;}
    const clean={...d,name:d.name.trim(),buyIn:parseFloat(d.buyIn)||0,fundPerPlayer:parseFloat(d.fundPerPlayer)||0,updatedAt:Date.now(),updatedBy:user?.name||user?.email||"admin"};
    if(editing.id){wr("settings/gameRules/modes/"+editing.id,clean);}
    else{ps("settings/gameRules/modes",{...clean,createdAt:Date.now()});}
    setEditing(null);showToast("Mode saved ✓");
  }
  function removeMode(m){
    dl("settings/gameRules/modes/"+m.id);
    if(defaultModeId===m.id)dl("settings/gameRules/defaultModeId");
    setConfirmDel(null);showToast("Mode deleted ✓");
  }
  function setDefault(id){wr("settings/gameRules/defaultModeId",id);showToast("Default mode set ✓");}
  function toggleRule(key){
    const cur=sr[key]!==false; // default true
    wr("settings/gameRules/signupRules/"+key,!cur);
    showToast(!cur?"Enabled ✓":"Disabled ✓");
  }

  const num=(v,cb)=>e=>cb(e.target.value);
  const upd_=(patch)=>setEditing(ed=>({...ed,draft:{...ed.draft,...patch}}));

  return(<div>
    <Toast msg={toast.msg} type={toast.type}/>
    <div className="pg-eyebrow">Configuration</div>
    <div className="pg-title">Game Modes</div>
    <div className="pg-sub">Templates for how rounds are played and paid. Each day picks its own mode at day setup — Friday can be team while Saturday runs individual. Config applies to FUTURE rounds only — finalized history is never rewritten.</div>

    {(<div>
      {!editing&&(<div style={{display:"flex",gap:8,marginBottom:14}}>
        <button className="btn btn-g btn-sm" onClick={()=>openNew("team")}>+ Team mode</button>
        <button className="btn btn-b btn-sm" onClick={()=>openNew("individual")}>+ Individual mode</button>
      </div>)}

      {editing&&(()=>{
        const d=editing.draft;const b=balance(d);
        const balanced=d.type==="team"?Math.abs(b.diff)<0.001:b.diff>=-0.001;
        return(
        <div className="card" style={{marginBottom:16,borderColor:"rgba(16,185,129,0.3)"}}>
          <div className="card-hdr">
            <span className="card-title">{editing.id?"Edit Mode":"New "+(d.type==="team"?"Team":"Individual")+" Mode"}</span>
            <button className="btn btn-gh btn-xs" onClick={()=>setEditing(null)}>Cancel</button>
          </div>
          <div className="card-body">
            <div className="lbl">Mode name</div>
            <input className="inp" placeholder={d.type==="team"?"e.g. Saturday Best Ball":"e.g. Individual Stableford"} value={d.name} onChange={num(0,v=>upd_({name:v}))} style={{marginBottom:12}}/>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
              <div><div className="lbl">Buy-in ($/player)</div><input className="inp" type="number" value={d.buyIn} onChange={num(0,v=>upd_({buyIn:v}))}/></div>
              <div><div className="lbl">Tournament fund</div>
                <div style={{display:"flex",gap:6,alignItems:"center"}}>
                  <div onClick={()=>upd_({fundEnabled:!d.fundEnabled})} style={{width:36,height:20,borderRadius:20,background:d.fundEnabled?"#10b981":"rgba(255,255,255,0.15)",position:"relative",cursor:"pointer",flexShrink:0}}><div style={{position:"absolute",top:2,left:d.fundEnabled?18:2,width:16,height:16,borderRadius:"50%",background:"#fff",transition:"left 0.2s"}}/></div>
                  <input className="inp" type="number" disabled={!d.fundEnabled} value={d.fundPerPlayer} onChange={num(0,v=>upd_({fundPerPlayer:v}))} style={{opacity:d.fundEnabled?1:0.4}}/>
                </div>
              </div>
            </div>

            {d.type==="team"&&(<div>
              <div className="lbl">Pots ($/player — must total the buy-in with fund)</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:8,marginBottom:10}}>
                {[["potFront","Front 9"],["potBack","Back 9"],["potOverall","Overall"],["potSkins","Skins"]].map(([k,l])=>(
                  <div key={k}><div className="lbl" style={{fontSize:9}}>{l}</div><input className="inp" type="number" value={d[k]} onChange={num(0,v=>upd_({[k]:v}))}/></div>
                ))}
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
                <div><div className="lbl">Skins mode</div>
                  <select className="inp" value={d.skinsMode} onChange={num(0,v=>upd_({skinsMode:v}))}><option value="team">Team skins</option><option value="individual">Individual skins</option></select>
                </div>
                <div><div className="lbl">Skins money source</div>
                  <select className="inp" value={d.skinsSource} onChange={num(0,v=>upd_({skinsSource:v}))}><option value="buyin">From buy-in</option><option value="separate">Separate pot</option></select>
                </div>
              </div>
            </div>)}

            {d.type==="individual"&&(<div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
                <div><div className="lbl">Ranking</div>
                  <select className="inp" value={d.ranking} onChange={num(0,v=>upd_({ranking:v}))}><option value="net">Net to target (points − target)</option><option value="raw">Raw Stableford total</option></select>
                </div>
                <div><div className="lbl">Paid spots</div><input className="inp" type="number" min="1" max="20" value={d.paidSpots} onChange={num(0,v=>upd_({paidSpots:v}))}/></div>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
                <div><div className="lbl">Tie for a paid spot</div>
                  <select className="inp" value={d.tieRule} onChange={num(0,v=>upd_({tieRule:v}))}><option value="split">Split pooled $ evenly</option><option value="admin">Admin resolves</option></select>
                </div>
                <div><div className="lbl">Individual skins</div>
                  <div style={{display:"flex",gap:6,alignItems:"center"}}>
                    <div onClick={()=>upd_({skinsEnabled:!d.skinsEnabled})} style={{width:36,height:20,borderRadius:20,background:d.skinsEnabled?"#10b981":"rgba(255,255,255,0.15)",position:"relative",cursor:"pointer",flexShrink:0}}><div style={{position:"absolute",top:2,left:d.skinsEnabled?18:2,width:16,height:16,borderRadius:"50%",background:"#fff",transition:"left 0.2s"}}/></div>
                    <input className="inp" type="number" disabled={!d.skinsEnabled} placeholder="$/player" value={d.skinsPerPlayer} onChange={num(0,v=>upd_({skinsPerPlayer:v}))} style={{opacity:d.skinsEnabled?1:0.4}}/>
                  </div>
                </div>
              </div>
              <div style={{fontSize:11,color:"rgba(255,255,255,0.35)",marginBottom:10,lineHeight:1.6}}>Per-spot dollar amounts are set at scoring time from the collected pool ({b.poolPerPlayer>=0?("$"+b.poolPerPlayer.toFixed(0)+"/player after fund"+(d.skinsEnabled?" + skins":"")):"—"}) with a true-up to $0 before finalize.</div>
            </div>)}

            {/* Money balance strip */}
            <div style={{padding:"10px 14px",borderRadius:8,marginBottom:12,background:balanced?"rgba(16,185,129,0.08)":"rgba(239,68,68,0.08)",border:"1px solid "+(balanced?"rgba(16,185,129,0.25)":"rgba(239,68,68,0.25)")}}>
              <span style={{fontSize:12,fontWeight:700,color:balanced?"#34d399":"#f87171"}}>
                {d.type==="team"
                  ?(balanced?"✓ Balanced: $"+b.buyIn+" in = $"+b.allocated+" out":"✗ Off by $"+Math.abs(b.diff).toFixed(2)+" — pots + fund must equal the buy-in")
                  :(balanced?"✓ $"+b.buyIn+" in — $"+b.allocated+" reserved, $"+(b.poolPerPlayer||0).toFixed(0)+"/player to the payout pool":"✗ Fund + skins exceed the buy-in")}
              </span>
            </div>
            {d.type==="individual"&&(<>
              <div style={{marginTop:12}}>
                <div className="lbl">Stableford points (optional — shown to players as a note)</div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginTop:6}}>
                  {[["alb","Albatross"],["hio","Hole-in-1"],["eag","Eagle"],["bird","Birdie"],["par","Par"],["bog","Bogey"],["dbl","Double+"]].map(([k,l])=>(
                    <div key={k}><div className="lbl" style={{fontSize:9}}>{l}</div><input className="inp" inputMode="decimal" value={(d.pointsTable&&d.pointsTable[k])||""} onChange={e=>upd_({pointsTable:{...(d.pointsTable||{}),[k]:e.target.value}})}/></div>
                  ))}
                </div>
              </div>
            </>)}
            <div style={{fontSize:10,color:"rgba(255,255,255,0.25)",marginBottom:12}}>All payouts round down to whole dollars; surplus goes to the tournament fund.</div>
            <button className="btn btn-g btn-full" onClick={save} disabled={!balanced}>{editing.id?"Save changes":"Create mode"}</button>
          </div>
        </div>);})()}

      {!editing&&modes.length===0&&(
        <div className="info-box"><strong>No modes yet.</strong> Create a Team mode matching today’s game ($25: $1 fund, $5/$5/$5 pots, $9 skins) and an Individual Stableford mode. Day setup will pick from these.</div>
      )}
      {!editing&&modes.map(m=>{
        const b=balance(m);
        return(
        <div key={m.id} className="card" style={{marginBottom:8}}>
          <div style={{display:"flex",alignItems:"center",gap:10,padding:"12px 16px"}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                <span style={{fontSize:14,fontWeight:700,color:"#e2e8f0"}}>{m.name}</span>
                <span className={m.type==="team"?"b b-g":"b b-b"}>{m.type==="team"?"Team":"Individual"}</span>
                {defaultModeId===m.id&&<span className="b b-a">★ Default</span>}
              </div>
              <div style={{fontSize:11,color:"rgba(255,255,255,0.35)",marginTop:3}}>
                ${m.buyIn}/player{m.fundEnabled?" · $"+m.fundPerPlayer+" fund":" · no fund"}
                {m.type==="team"
                  ?" · F$"+m.potFront+" B$"+m.potBack+" O$"+m.potOverall+" Sk$"+m.potSkins+" · "+(m.skinsMode==="individual"?"ind.":"team")+" skins"
                  :" · "+(m.ranking==="raw"?"raw total":"net-to-target")+" · "+m.paidSpots+" spots · "+(m.tieRule==="admin"?"admin ties":"split ties")+(m.skinsEnabled?" · skins $"+m.skinsPerPlayer:"")}
              </div>
            </div>
            {defaultModeId!==m.id&&<button className="btn btn-gh btn-xs" onClick={()=>setDefault(m.id)}>Set default</button>}
            <button className="btn btn-gh btn-xs" onClick={()=>openEdit(m)}>Edit</button>
            <button className="btn btn-r btn-xs" onClick={()=>setConfirmDel(m)}>Del</button>
          </div>
        </div>);})}
    </div>)}

    {confirmDel&&(
      <div className="overlay">
        <div className="modal">
          <div style={{fontSize:14,fontWeight:700,marginBottom:6,color:"#f87171"}}>Delete mode “{confirmDel.name}”?</div>
          <div style={{fontSize:12,color:"rgba(255,255,255,0.45)",marginBottom:16,lineHeight:1.6}}>Future day setups can’t pick it. Already-finalized rounds are untouched — they snapshot their rules at finalize.</div>
          <div style={{display:"flex",gap:8}}>
            <button className="btn btn-r" style={{flex:1}} onClick={()=>removeMode(confirmDel)}>Delete</button>
            <button className="btn btn-gh" style={{flex:1}} onClick={()=>setConfirmDel(null)}>Cancel</button>
          </div>
        </div>
      </div>
    )}
  </div>);
}

// ── SEASON TAB ────────────────────────────────────────────────────────────────

function TournamentTab(){
  const t=useDB("tournament")||{};
  const cfg=t.config||{};
  const tp=t.players||{};
  const attendance=useDB("attendance")||{};
  const rosterEdits=useDB("rosterEdits");
  const rosterHidden=useDB("rosterHidden");
  const rosterDeletedT=useDB("rosterDeleted");
  const extra=useDB("extraPlayers");
  const rounds=Object.values(attendance.rounds||{});
  const all=React.useMemo(()=>{
    const base=ROSTER.map(p=>({...p,name:(rosterEdits&&rosterEdits[p.id])||p.name,isExtra:false}));
    const ex=Object.values(extra||{}).map(p=>({...p,isExtra:true}));
    return[...base,...ex].filter(p=>!((rosterHidden&&rosterHidden[p.id])||(rosterDeletedT&&rosterDeletedT[p.id])));
  },[extra,rosterEdits,rosterHidden,rosterDeletedT]);
  const seasonCfg=useDB("settings/season");
  const seasonLock=seasonBound(seasonCfg);
  const wdOf=d=>{try{return new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"short"});}catch(e){return d||"";}};
  const isMasterUser=(()=>{try{const u=JSON.parse(localStorage.getItem("portal_user"));return !!u&&u.role==="master";}catch(e){return false;}})();
  const rosterTeeT=useDB("rosterTee");
  const rosterHcpT=useDB("rosterHcp");
  const roundCounts=React.useMemo(()=>{
    const m={};rounds.forEach(r=>{if(seasonLock&&seasonLock.closedAt&&String(r.date||"")>seasonLock.closedAt)return;(r.players||[]).forEach(n=>{const k=String(n).toLowerCase().trim();m[k]=(m[k]||0)+1;});});return m;
  },[rounds,seasonLock]);
  const cnt=p=>roundCounts[String(p.name).toLowerCase().trim()]||0;
  const minRounds=cfg.minRounds!=null?cfg.minRounds:10;
  const autoBar=all.reduce((mx,p)=>Math.max(mx,cnt(p)),0);
  const bar=(cfg.feeBar&&cfg.feeBar>0)?cfg.feeBar:autoBar;
  const twoDay=cfg.date2!==""&&cfg.date2!==null;
  const inPlayers=all.filter(p=>tp[p.id]&&tp[p.id].in);
  const owedOf=p=>bar-cnt(p);
  const paidOf=p=>(tp[p.id]&&Number(tp[p.id].paid))||0;
  const cashOutstanding=inPlayers.reduce((s,p)=>s+Math.max(owedOf(p)-paidOf(p),0),0);
  const refundsDue=inPlayers.reduce((s,p)=>s+Math.max(-(owedOf(p)-paidOf(p)),0),0);
  const collected=inPlayers.reduce((s,p)=>s+cnt(p)+paidOf(p),0);
  const fundTotal=Object.values(roundCounts||{}).reduce((s,v)=>s+v,0);
  const payinsDue=inPlayers.reduce((s,p)=>s+Math.max(bar-cnt(p),0),0);
  const refundsOut=cfg.refundOverpaid===true?inPlayers.reduce((s,p)=>s+Math.max(cnt(p)-bar,0),0):0;
  const fullPot=fundTotal+payinsDue;
  const setCfg=(k,v)=>wr("tournament/config/"+k,v);
  const setP=(id,k,v)=>wr("tournament/players/"+id+"/"+k,v);
  const [copied,setCopied]=React.useState(false);
  const [emailOpen,setEmailOpen]=React.useState(false);
  const [emailCopied,setEmailCopied]=React.useState(false);
  const [goLiveOpen,setGoLiveOpen]=React.useState(false);
  const [pushToo,setPushToo]=React.useState(true);

  // ── payout config w/ defaults ──
  const payMode=cfg.payMode||(twoDay?"perday":"combined");   // perday | combined
  const teamSize=cfg.teamSize||4;
  const catF=cfg.catFront!=null?cfg.catFront:20, catB=cfg.catBack!=null?cfg.catBack:20, catO=cfg.catOverall!=null?cfg.catOverall:20;
  const skinsPct=cfg.skinsPct!=null?cfg.skinsPct:40;
  const catSum=catF+catB+catO+skinsPct;
  const placesCount=cfg.placesCount||3;
  const PLACE_DEFAULTS={1:[100],2:[60,40],3:[50,30,20]};
  const placeVals=[0,1,2].slice(0,placesCount).map(i=>{const v=cfg["place"+(i+1)];return v!=null?v:PLACE_DEFAULTS[placesCount][i];});
  const placeSum=placeVals.reduce((a,b)=>a+b,0);
  const skinsOn=true;
  const CTP_HOLES=[3,6,11,14];
  const ctpAmts=CTP_HOLES.map(h=>Number((cfg.ctpHoles&&cfg.ctpHoles["h"+h])||0));
  const ctpPerDayTotal=ctpAmts.reduce((a,b)=>a+b,0);
  const extraPrize=Number(cfg.extraPrize||0);
  const numDays=twoDay?2:1;
  const ctpTotal=ctpPerDayTotal*numDays;
  const available=fullPot+extraPrize;
  const prizePool=Math.max(available-ctpTotal,0);
  const teams=teamSize>0?Math.floor(inPlayers.length/teamSize):0;
  const pools=payMode==="perday"?Array.from({length:numDays},()=>Math.floor(prizePool/numDays)):[prizePool];
  const poolLabel=i=>payMode==="perday"?(i===0?"Saturday":"Sunday"):"Combined 2-Day";
  function simPool(pool){
    const cats=[["Front 9",catF],["Back 9",catB],["Overall",catO]];
    return cats.map(([label,pct])=>{
      const cat$=Math.floor(pool*pct/100);
      const places=placeVals.map((pp,i)=>[["1st","2nd","3rd"][i],pp]).filter(([,pp])=>pp>0).map(([pl,pp])=>{
        const team$=Math.floor(cat$*pp/100);
        return {pl,team$,per$:teamSize>0?Math.floor(team$/teamSize):team$};
      });
      return {label,cat$,places};
    });
  }
  const teamPayoutTotal=pools.reduce((s,pool)=>s+simPool(pool).reduce((s2,c)=>s2+c.places.reduce((s3,pl)=>s3+pl.team$,0),0),0);
  const leftover=available-ctpTotal-teamPayoutTotal;
  const skinsPot=skinsOn?Math.max(leftover,0):0;
  const overAllocated=leftover<0?-leftover:0;
  function buildEmail(){
    const L=[];
    L.push((cfg.name||"Clark Group Tournament").toUpperCase());
    L.push(twoDay?("Saturday "+(cfg.date1||"Oct 24")+" & Sunday "+(cfg.date2||"Oct 25")):(cfg.date1||"TBD"));
    L.push("");
    L.push("FORMAT");
    L.push("- "+(twoDay?(payMode==="perday"?"Two separate daily events — prize money awarded each day":"Two-day combined event — one set of payouts on 2-day totals"):"One-day event"));
    L.push("- "+(cfg.redrawTeams!==false?"Fresh random A/B/C/D team draw each day":"Same teams both days"));
    L.push("- Teams of "+teamSize+" — payouts split Front 9 ("+catF+"%), Back 9 ("+catB+"%), Overall ("+catO+"%), paying "+placesCount+" place"+(placesCount>1?"s":"")+" each");
    if(ctpPerDayTotal>0)L.push("- Closest to the pin"+(numDays>1?" (each day)":"")+": "+CTP_HOLES.map((h,i)=>ctpAmts[i]>0?"Hole "+h+" $"+ctpAmts[i]:null).filter(Boolean).join(", "));
    if(skinsOn)L.push("- Skins pot: $"+skinsPot+" ("+skinsPct+"% of the pot, plus rounding leftovers — same as Fridays)");
    L.push("");
    L.push("ENTRY & ELIGIBILITY");
    L.push("- Eligibility: "+minRounds+"+ rounds with the group this season");
    L.push("- Entry-fee bar: $"+bar+" (most rounds played). Your entry = $"+bar+" minus your rounds played — your weekly $1 contributions count toward it. Example: 10 rounds = $"+(bar-10)+" due."+(seasonCfg&&seasonCfg.endDate?" It keeps dropping for every round you play through "+seasonCfg.endDate+" — the season's last day.":""));
    L.push("- Entry covers "+(twoDay?"both days; play both or either day":"the event"));
    L.push("");
    L.push("HOW TO ANSWER (takes 20 seconds, in the app)");
    L.push("1. Open the app — you'll see a green \"You're invited\" banner on every screen until you answer. Tap it (or open the Tourney tab).");
    L.push(twoDay?"2. Tap "+wdOf(cfg.date1)+" only, "+wdOf(cfg.date2)+" only, or Both days — or Can't make it.":"2. Tap I'm in — or Can't make it.");
    L.push("3. Confirm your handicap and tees (pre-filled — fix them if they're off). That's it; the teams are drawn off those numbers.");
    L.push("4. Your amount due is shown on the board under Your entry. It's the SAME entry fee whether you play one day or both.");
    L.push("5. Payments are due to Clark BEFORE the tournament starts — cash at the club works; he'll mark you paid in the app."+(cfg.rsvpDeadline?" Please answer by "+cfg.rsvpDeadline+".":""));
    L.push("Change your mind? Tap your day again any time before the deadline. After the deadline the app locks — reach out to Clark directly for any changes.");
    L.push("");
    L.push("THE MONEY (as configured today, "+inPlayers.length+" players in)");
    L.push("- One buy-in covers the whole tournament — play one day or both."+"\n- The pot: $"+fundTotal+" already banked in the tournament fund + $"+payinsDue+" in opt-in entries"+(extraPrize>0?" + $"+extraPrize+" added prize money":"")+" = $"+available);
    pools.forEach((pool,i)=>{
      L.push("- "+poolLabel(i)+" pool: $"+pool);
      simPool(pool).forEach(c=>{
        L.push("    "+c.label+" ($"+c.cat$+"): "+c.places.map(pl=>pl.pl+" $"+pl.team$+" team ($"+pl.per$+"/player)").join(" · "));
      });
    });
    L.push("");
    if(cfg.inviteOpen===true)L.push("SAY YOU’RE IN: open the Clark Golf app \u2192 Week tab \u2192 tap “I’m in” on the tournament card. It shows your exact entry based on your rounds.");
    L.push("");
    L.push("Questions or think your rounds count is off? Reply and we’ll check the record.");
    return L.join("\n");
  }

  const lblH={minHeight:30,display:"flex",alignItems:"flex-end"};
  const numIn=(val,onCh,ph)=>(<input className="inp" inputMode="numeric" placeholder={ph||""} value={val!=null&&val!==""?val:""} onChange={onCh} style={{textAlign:"center",padding:"8px 6px",fontSize:13.5,height:38,boxSizing:"border-box",width:"100%",minWidth:0}}/>);

  return(
    <div>
      <div className="pg-head"><div><div className="pg-title">Tournament</div><div className="pg-sub">Plan the Clark tournament with live season data</div></div></div>
      {(()=>{
        const [openHow,setOpenHow]=React.useState(false);
        const H=({t,children})=>(<div style={{marginBottom:10}}><div style={{fontSize:11,fontWeight:800,color:"#4ade80",textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:3}}>{t}</div><div style={{fontSize:12.5,color:"rgba(255,255,255,0.7)",lineHeight:1.65}}>{children}</div></div>);
        return (
          <div className="card" style={{marginBottom:14}}>
            <div className="card-hdr" onClick={()=>setOpenHow(v=>!v)} style={{cursor:"pointer"}}><span className="card-title">📖 How the tournament works</span><span style={{fontSize:11,color:"rgba(255,255,255,0.35)",marginLeft:"auto"}}>{openHow?"hide ▲":"read ▼"}</span></div>
            {openHow&&(
              <div style={{padding:"12px 14px"}}>
                <H t="The fund — already banked">All season, $1 from every player every round goes into the tournament fund. It is the floor of the pot and it is already collected — the pot grows every Friday before a single invite goes out.</H>
                <H t="Invites & the season lock">When you hit GO LIVE, two things happen at once: every eligible player (rounds at or over the bar) sees a persistent invite in the app until they answer, and the season's books close — the fund, eligibility, and each player's buy-in lock as quoted. Fridays keep going as normal; those rounds and dollars count toward NEXT season and next year's fund.</H>
                <H t="Adding people below the bar">Numbers thin? Any admin can tap ✉ Invite on someone under the rounds bar (here or in the app's Field pill). They get the same banner and answer for themselves — they'll wear an EXCEPTION chip. The In/Out toggles remain the "I'm deciding for you" tool; SELF ✓ always means they chose.</H>
                <H t="Pay-ins">Each player owes the buy-in bar minus their rounds (their $1s already in the fund). Collect cash at the club, tap Paid in the app's 💵 Field pill or here — one shared ledger. The header always shows who's invited, answered, still deciding, and what's outstanding.</H>
                <H t="Answers & the deadline">Players confirm handicap and tees when they tap I'm in — the draw uses those numbers. They can change their answer freely until the response deadline (set above); after that, answers lock automatically and changes go through an admin.</H>
                <H t="Payouts">Fund + cash paid in = the pot, split in half across the two days. Each day’s half pays by share of the whole: front 9, back 9, overall, and skins (defaults 20 / 20 / 20 / 40 — a $500 day pays $100 / $100 / $100 and $200 to skins, exactly like Fridays). No CTP and no refunds — over-the-bar money stays in. All computed live on the Scores board.</H>
                <H t="Opt in per day">Players answer Day 1, Day 2, or Both — one buy-in either way, full amount. Each day’s teams draw only from the players in for that day; the Board shows who’s in for which.</H>
                <H t="What players see">Before GO LIVE: nothing (stage it to yourself or admins to rehearse). After: the Tourney tab — the board with the live pot and field, published teams, and live scoring. Their only control is their own answer. No config, no money, no toggles.</H>
                <H t="After the tournament">Results live on the Scores board per day. Closing out and archiving the whole event (frozen results + clean slate for next year) ships as the next build.</H>
              </div>
            )}
          </div>
        );
      })()}
      <div style={{background:"rgba(245,158,11,0.08)",border:"1px solid rgba(245,158,11,0.2)",borderRadius:10,padding:"10px 14px",fontSize:12,color:"#fbbf24",fontWeight:600,marginBottom:14}}>📋 DRAFT — planning workspace only. Numbers are live from real attendance; nothing appears in the member app until the tournament build is activated.</div>

      <div className="card">
        <div className="card-hdr"><span className="card-title">⚙ Configuration</span></div>
        <div className="card-body">
          {(()=>{
            const F={height:42,boxSizing:"border-box",width:"100%",minWidth:0,padding:"0 12px",fontSize:13.5};
            const CL=t=>(<div className="lbl" style={{height:16,fontSize:9.5,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{t}</div>);
            return(
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:10,marginBottom:12}}>
            <div>{CL("Tournament name")}<input className="inp" style={F} value={cfg.name||""} placeholder="Clark Group Tournament" onChange={e=>setCfg("name",e.target.value)}/></div>
            <div>{CL("Day 1")}<input className="inp" style={F} type="date" value={cfg.date1||""} onChange={e=>setCfg("date1",e.target.value||null)}/></div>
            <div>{CL("Day 2 (blank = 1-day)")}<input className="inp" style={F} type="date" value={cfg.date2||""} onChange={e=>setCfg("date2",e.target.value||null)}/></div>
            <div>{CL("Responses due by (auto-locks)")}<input className="inp" style={F} type="date" value={cfg.rsvpDeadline||""} onChange={e=>setCfg("rsvpDeadline",e.target.value||null)}/></div>
            <div>{CL("Min rounds")}<input className="inp" style={{...F,textAlign:"center"}} inputMode="numeric" value={cfg.minRounds!=null?cfg.minRounds:10} onChange={e=>setCfg("minRounds",parseInt(e.target.value||"0",10)||0)}/></div>
            <div>{CL("Entry-fee bar $")}<input className="inp" style={{...F,textAlign:"center"}} inputMode="numeric" placeholder={"auto ("+autoBar+")"} value={cfg.feeBar||""} onChange={e=>{const n=parseInt(e.target.value.replace(/\D/g,"")||"0",10);setCfg("feeBar",n>0?n:null);}}/></div>
            
          </div>
            );})()}
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(280px,1fr))",gap:"8px 18px",fontSize:12,color:"rgba(255,255,255,0.55)",marginTop:4}}>
            {[["redrawTeams","Fresh random A/B/C/D teams each day"],["excludeFund","No $1 fund skim on tournament days"],["excludeStats","Tournament stats kept separate from season"]].map(([k,label])=>(
              <label key={k} style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer"}}>
                <input type="checkbox" checked={cfg[k]!==false} onChange={e=>setCfg(k,e.target.checked)}/>{label}
              </label>
            ))}
            
          </div>
          <div style={{marginTop:14,padding:"13px 15px",background:cfg.inviteOpen===true?"rgba(16,185,129,0.06)":"rgba(212,175,55,0.05)",border:"1px solid "+(cfg.inviteOpen===true?"rgba(16,185,129,0.3)":"rgba(212,175,55,0.2)"),borderRadius:10}}>
            {!isMasterUser?(
              <div>
                <div style={{fontSize:13,fontWeight:800,color:cfg.inviteOpen===true?"#4ade80":"#fbbf24"}}>{cfg.inviteOpen===true?"🟢 LIVE — members can answer":"🔒 NOT LIVE — members see nothing"}</div>
                <div style={{fontSize:11.5,color:"rgba(255,255,255,0.45)",marginTop:6,lineHeight:1.6}}>Launching, the app-tab stager, RSVP lock, and Take offline are <strong>Master-only</strong>. Everything below — config, field, pay-ins, payouts — is yours to work.</div>
                    {(()=>{
                  const [closeText,setCloseText]=React.useState("");
                  const [busy,setBusy]=React.useState(false);
                  const todayIso=(()=>{const x=new Date();return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");})();
                  const lastDay=cfg.date2||cfg.date1||"";
                  const overYet=!!(lastDay&&todayIso>lastDay);
                  const days=cfg.date2?["day1","day2"]:["day1"];
                  const gaps=[];
                  days.forEach(dk=>{
                    const pubd=!!(t&&t.teamsPublished&&t.teamsPublished[dk]);
                    const tm=(t&&t.teams&&t.teams[dk])||[];
                    const arr=Array.isArray(tm)?tm:Object.values(tm||{});
                    if(!pubd||!arr.length){gaps.push((dk==="day1"?"Day 1":"Day 2")+": no published teams");return;}
                    const sc=(t&&t.scores&&t.scores[dk])||{};
                    const unscored=arr.filter((_,ii)=>{const s=sc[ii]||{};return s.f==null||s.b==null;}).length;
                    if(unscored)gaps.push((dk==="day1"?"Day 1":"Day 2")+": "+unscored+" team"+(unscored>1?"s":"")+" still unscored");
                  });
                  const readyToClose=overYet&&gaps.length===0;
                  const year=String((cfg.date1||todayIso).slice(0,4));
                  const doClose=()=>{
                    if(closeText.trim().toUpperCase()!=="CLOSE")return;
                    setBusy(true);
                    const snap={...(t||{}),closedAt:Date.now(),closedBy:(user&&user.email)||"master",year:year,name:cfg.name||("Tournament "+year),date1:cfg.date1||null,date2:cfg.date2||null};
                    const ref=firebase.database().ref("tournaments/"+year);
                    ref.set(snap).then(()=>ref.once("value")).then(s=>{
                      const back=s.val();
                      const okBack=back&&back.closedAt===snap.closedAt&&JSON.stringify(back.config||{})===JSON.stringify(snap.config||{});
                      if(!okBack){setBusy(false);showToast("Archive did not read back correctly — nothing was cleared","err");return null;}
                      try{const blob=new Blob([JSON.stringify(snap,null,2)],{type:"application/json"});const a2=document.createElement("a");a2.href=URL.createObjectURL(blob);a2.download="tournament-"+year+".json";a2.click();}catch(e){}
                      return firebase.database().ref("tournament").remove().then(()=>{
                        setBusy(false);setCloseText("");
                        showToast("Archived to "+year+" — the live slot is empty for next year");
                      });
                    }).catch(err=>{setBusy(false);showToast("Close-out failed: "+((err&&err.message)||err),"err");});
                  };
                  return (
                    <div style={{marginTop:4,paddingTop:12,borderTop:"1px solid rgba(255,255,255,0.08)"}}>
                      <div style={{fontSize:12.5,fontWeight:800,color:"#e2e8f0",marginBottom:5}}>🏁 Close out &amp; archive</div>
                      {!readyToClose?(
                        <div style={{fontSize:11.5,color:"rgba(255,255,255,0.45)",lineHeight:1.6}}>{!cfg.inviteOpen?("Available after the tournament is played — the button unlocks once every team is scored."):!overYet?("Available after the final day ("+(lastDay||"set the dates")+")."):("Finish scoring first — "+gaps.join(" · ")+".")}</div>
                      ):(
                        <div>
                          <div style={{fontSize:11.5,color:"rgba(255,255,255,0.5)",lineHeight:1.6,marginBottom:8}}>Saves everything — config, field, pay-ins, teams, scores and results — to <b style={{color:"#e2e8f0"}}>{year}</b>, downloads a JSON copy, then empties the live slot so next year starts fresh. The Tourney tab keeps showing {year} as Results. Nothing is deleted.</div>
                          <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
                            <input className="inp" style={{width:150,fontFamily:"monospace",letterSpacing:"0.1em"}} placeholder="type CLOSE" value={closeText} onChange={e=>setCloseText(e.target.value)}/>
                            <button className="btn btn-r btn-sm" disabled={busy||closeText.trim().toUpperCase()!=="CLOSE"} onClick={doClose}>{busy?"Archiving…":"🏁 Close out "+year}</button>
                          </div>
                        </div>
                      )}
                    </div>
                  );
                })()}
          </div>
            ):cfg.inviteOpen!==true?(
              <div>
                <div style={{fontSize:13,fontWeight:800,color:"#fbbf24"}}>🔒 NOT LIVE — members see nothing</div>
                <div style={{margin:"12px 0 0",padding:"10px 12px",background:"rgba(255,255,255,0.03)",borderRadius:10,border:"1px solid rgba(255,255,255,0.07)"}}>
                  <div style={{fontSize:11,fontWeight:800,color:"#60a5fa",textTransform:"uppercase",letterSpacing:"0.05em"}}>Step 1 · Preview safely (records nothing)</div>
                  <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",margin:"3px 0 2px"}}>Choose who gets the Tourney tab in the app. It wears a PREVIEW badge and records nothing until you go live.</div>
                <div style={{display:"flex",alignItems:"center",gap:8,marginTop:10,flexWrap:"wrap"}}>
                  <span style={{fontSize:11,fontWeight:800,color:"rgba(255,255,255,0.45)",textTransform:"uppercase",letterSpacing:"0.05em"}}>📱 App tournament tab:</span>
                  {[["off","Hidden"],["only","One person"],["admins","Admins only"],["all","Everyone"]].map(([v,label])=>(
                    <button key={v} className="btn btn-sm" onClick={()=>setCfg("appTab",v)} style={{fontWeight:700,fontSize:11,height:32,padding:"0 13px",border:"1px solid",borderColor:(cfg.appTab||"off")===v?"#10b981":"rgba(255,255,255,0.12)",background:(cfg.appTab||"off")===v?"rgba(16,185,129,0.12)":"transparent",color:(cfg.appTab||"off")===v?"#4ade80":"rgba(255,255,255,0.45)"}}>{label}</button>
                  ))}
                  {(cfg.appTab||"off")==="only"&&(
                    <select className="inp" style={{height:32,fontSize:12,padding:"0 10px",width:"auto"}} value={cfg.appTabOnlyId||""} onChange={e=>setCfg("appTabOnlyId",e.target.value||null)}>
                      <option value="">— pick who —</option>
                      {all.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=><option key={p.id} value={String(p.id)}>{p.name}</option>)}
                    </select>
                  )}
                  <span style={{fontSize:10,color:"rgba(255,255,255,0.3)",flexBasis:"100%"}}>Stage it: One person (you) → Admins only → Everyone at launch. Independent of the GO LIVE switch.</span>
                </div>
                </div>
                <div style={{margin:"10px 0 0",padding:"10px 12px",background:"rgba(255,255,255,0.03)",borderRadius:10,border:"1px solid rgba(255,255,255,0.07)"}}>
                <div style={{fontSize:11,fontWeight:800,color:"#4ade80",textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:6}}>Step 2 · The real launch</div>
                {!goLiveOpen?(
                  <button className="btn btn-g" style={{fontWeight:800,padding:"10px 22px"}} onClick={()=>setGoLiveOpen(true)}>🚀 GO LIVE</button>
                ):(
                  <div style={{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:10,padding:"11px 13px"}}>
                    <div style={{fontSize:12.5,fontWeight:700,color:"#e2e8f0",marginBottom:8}}>Go live now? Every member will see the tournament card and can tap I’m in / Can’t make it. The season keeps running: rounds played before the season end date keep growing the fund and keep lowering each player’s entry.</div>
                    <label style={{display:"flex",alignItems:"center",gap:7,cursor:"pointer",fontSize:12,color:"rgba(255,255,255,0.6)",marginBottom:10}}>
                      <input type="checkbox" checked={pushToo} onChange={e=>setPushToo(e.target.checked)}/>Also send a push notification to everyone now
                    </label>
                    <label style={{display:"flex",alignItems:"center",gap:7,cursor:"pointer",fontSize:12,color:"rgba(255,255,255,0.6)",marginBottom:10}}>
                      <input type="checkbox" checked={(cfg.appTab||"off")!=="all"} disabled={(cfg.appTab||"off")==="all"} onChange={()=>{}} readOnly/>Open the Tourney tab to everyone {(cfg.appTab||"off")==="all"?"(already open)":"(recommended)"}
                    </label>
                    <div style={{display:"flex",gap:8}}>
                      <button className="btn btn-g btn-sm" style={{fontWeight:800}} onClick={()=>{
                        setCfg("inviteOpen",true);
                        if((cfg.appTab||"off")!=="all")setCfg("appTab","all");
                        // Season boundary lives in settings/season.endDate (Season tab) — GO LIVE no longer touches it.
                        if(pushToo){
                          fetch("/api/notify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key:"cgg-notify-2026",project:IS_PROD_HOST?"prod":"test",audience:"all",title:"🏆 "+(cfg.name||"Clark Group Tournament"),body:"Tournament invites are open! Open the app and tap I’m in on the Week tab.",url:"/",tag:"manual-tourney-"+Date.now()})}).catch(()=>{});
                          setCfg("invitePushTs",Date.now());
                        }
                        setGoLiveOpen(false);
                      }}>✓ Yes — go live{pushToo?" + push":""}</button>
                      <button className="btn btn-gh btn-sm" onClick={()=>setGoLiveOpen(false)}>Cancel</button>
                    </div>
                  </div>
                )}
                </div>
              </div>
            ):(
              <div>
                <div style={{fontSize:13,fontWeight:800,color:"#4ade80"}}>🟢 LIVE — members can opt in and out on the Week tab</div>
                <div style={{fontSize:11.5,color:"rgba(255,255,255,0.45)",margin:"4px 0 10px"}}>Answers appear in the field list below with SELF ✓ / DECLINED chips.{cfg.invitePushTs?" Push sent "+new Date(cfg.invitePushTs).toLocaleDateString([], {month:"short",day:"numeric"})+" ✓":""}</div>
                <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <div onClick={()=>setCfg("rsvpLocked",cfg.rsvpLocked!==true)} style={{width:36,height:20,borderRadius:20,background:cfg.rsvpLocked===true?"#f87171":"rgba(255,255,255,0.15)",position:"relative",cursor:"pointer",flexShrink:0}}>
                      <div style={{position:"absolute",top:2,left:cfg.rsvpLocked===true?18:2,width:16,height:16,borderRadius:"50%",background:"#fff",transition:"left 0.15s"}}/>
                    </div>
                    <span style={{fontSize:11.5,fontWeight:700,color:cfg.rsvpLocked===true?"#f87171":"rgba(255,255,255,0.5)"}}>{cfg.rsvpLocked===true?"🔒 RSVPs locked (members view only — your toggles still work)":"RSVPs open — lock ~a week out for tee times"}</span>
                  </div>
                  <button className="btn btn-gh btn-sm" onClick={()=>{
                    fetch("/api/notify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key:"cgg-notify-2026",project:IS_PROD_HOST?"prod":"test",audience:"all",title:"🏆 "+(cfg.name||"Clark Group Tournament"),body:"Reminder: tournament invites are open — tap I’m in on the Week tab.",url:"/",tag:"manual-tourney-"+Date.now()})}).catch(()=>{});
                    setCfg("invitePushTs",Date.now());
                  }}>📣 Send reminder push</button>
                  <button className="btn btn-gh btn-sm" onClick={()=>{if(window.confirm("Take the tournament card away from members? Their answers are kept."))setCfg("inviteOpen",null);}}>Take offline</button>
                </div>

                <div style={{display:"flex",alignItems:"center",gap:8,marginTop:10,flexWrap:"wrap"}}>
                  <span style={{fontSize:11,fontWeight:800,color:"rgba(255,255,255,0.45)",textTransform:"uppercase",letterSpacing:"0.05em"}}>📱 App tournament tab:</span>
                  {[["off","Hidden"],["only","One person"],["admins","Admins only"],["all","Everyone"]].map(([v,label])=>(
                    <button key={v} className="btn btn-sm" onClick={()=>setCfg("appTab",v)} style={{fontWeight:700,fontSize:11,height:32,padding:"0 13px",border:"1px solid",borderColor:(cfg.appTab||"off")===v?"#10b981":"rgba(255,255,255,0.12)",background:(cfg.appTab||"off")===v?"rgba(16,185,129,0.12)":"transparent",color:(cfg.appTab||"off")===v?"#4ade80":"rgba(255,255,255,0.45)"}}>{label}</button>
                  ))}
                  {(cfg.appTab||"off")==="only"&&(
                    <select className="inp" style={{height:32,fontSize:12,padding:"0 10px",width:"auto"}} value={cfg.appTabOnlyId||""} onChange={e=>setCfg("appTabOnlyId",e.target.value||null)}>
                      <option value="">— pick who —</option>
                      {all.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=><option key={p.id} value={String(p.id)}>{p.name}</option>)}
                    </select>
                  )}
                  <span style={{fontSize:10,color:"rgba(255,255,255,0.3)",flexBasis:"100%"}}>Stage it: One person (you) → Admins only → Everyone at launch. Independent of the GO LIVE switch.</span>
                </div>
              </div>
            )}
          </div>
        </div>
      </div>

      <div className="card">
        <div className="card-hdr"><span className="card-title">🏆 Payout Structure</span></div>
        <div className="card-body">
          {twoDay&&(
            <div style={{display:"flex",gap:8,marginBottom:16}}>
              {[["perday","Separate payouts each day"],["combined","One combined 2-day payout"]].map(([m,label])=>(
                <button key={m} className="btn btn-sm" onClick={()=>setCfg("payMode",m)} style={{flex:1,height:38,fontWeight:700,fontSize:12.5,border:"1px solid",borderColor:payMode===m?"#10b981":"rgba(255,255,255,0.12)",background:payMode===m?"rgba(16,185,129,0.12)":"transparent",color:payMode===m?"#4ade80":"rgba(255,255,255,0.45)"}}>{label}</button>
              ))}
            </div>
          )}
          {(()=>{const sect={fontSize:10.5,fontWeight:800,color:"rgba(255,255,255,0.45)",textTransform:"uppercase",letterSpacing:"0.06em",width:96,flexShrink:0,paddingTop:26};
            const row={display:"flex",gap:10,alignItems:"flex-start",padding:"12px 0",borderBottom:"1px solid rgba(255,255,255,0.06)",flexWrap:"wrap"};
            const col=w=>({width:w||84,flexShrink:0});
            const L=t=>(<div className="lbl" style={{height:16,fontSize:9.5,whiteSpace:"nowrap"}}>{t}</div>);
            const okBadge=(sum,allowUnder)=>(<div style={col(120)}>{L("\u00a0")}<div style={{height:38,display:"flex",alignItems:"center"}}><span style={{fontSize:10,fontWeight:800,padding:"4px 9px",borderRadius:8,background:sum===100?"rgba(16,185,129,0.12)":(sum<100&&allowUnder?"rgba(96,165,250,0.12)":"rgba(245,158,11,0.12)"),color:sum===100?"#4ade80":(sum<100&&allowUnder?"#60a5fa":"#fbbf24"),whiteSpace:"nowrap"}}>{sum===100?"100% \u2713":(sum<100&&allowUnder?sum+"% \u2192 rest to skins":sum+"% — over!")}</span></div></div>);
            const chk=(label,checked,onCh)=>(<div style={{flexShrink:0}}>{L("\u00a0")}<label style={{height:38,display:"flex",alignItems:"center",gap:7,cursor:"pointer",fontSize:12.5,color:"rgba(255,255,255,0.6)",whiteSpace:"nowrap"}}><input type="checkbox" checked={checked} onChange={onCh}/>{label}</label></div>);
            return(<React.Fragment>
            <div style={row}>
              <div style={sect}>Teams</div>
              <div style={col()}>{L("Players / team")}{numIn(teamSize,e=>setCfg("teamSize",parseInt(e.target.value||"0",10)||null))}</div>
              <div style={{flexShrink:0}}>{L("\u00a0")}<div style={{height:38,display:"flex",alignItems:"center",fontSize:11.5,color:"rgba(255,255,255,0.4)"}}>{inPlayers.length} in → <b style={{color:"#e2e8f0"}}>{teams} teams</b>{inPlayers.length%teamSize?" (+"+(inPlayers.length%teamSize)+" extra)":""}</div></div>
            </div>
            <div style={row}>
              <div style={sect}>Pot split</div>
              <div style={col()}>{L("Skins %")}{numIn(skinsPct,e=>setCfg("skinsPct",parseInt(e.target.value||"0",10)))}</div>
              <div style={col()}>{L("Front 9 %")}{numIn(catF,e=>setCfg("catFront",parseInt(e.target.value||"0",10)))}</div>
              <div style={col()}>{L("Back 9 %")}{numIn(catB,e=>setCfg("catBack",parseInt(e.target.value||"0",10)))}</div>
              <div style={col()}>{L("Overall %")}{numIn(catO,e=>setCfg("catOverall",parseInt(e.target.value||"0",10)))}</div>
              {okBadge(catSum,false)}
            </div>
            <div style={row}>
              <div style={sect}>Places paid</div>
              <div style={{flexShrink:0}}>{L("How many")}<div style={{display:"flex",gap:5}}>
                {[1,2,3].map(n=>(
                  <button key={n} className="btn btn-sm" onClick={()=>setCfg("placesCount",n)} style={{width:38,height:38,padding:0,fontWeight:800,fontSize:13,border:"1px solid",borderColor:placesCount===n?"#10b981":"rgba(255,255,255,0.12)",background:placesCount===n?"rgba(16,185,129,0.12)":"transparent",color:placesCount===n?"#4ade80":"rgba(255,255,255,0.45)"}}>{n}</button>
                ))}
              </div></div>
              {placeVals.map((v,i)=>(
                <div key={i} style={col()}>{L(["1st %","2nd %","3rd %"][i])}{numIn(v,e=>setCfg("place"+(i+1),parseInt(e.target.value||"0",10)))}</div>
              ))}
              {okBadge(placeSum,false)}
            </div>
            <div style={{...row,borderBottom:"none"}}>
              <div style={sect}>Extras</div>
              
              
              {skinsOn&&<div style={{flexShrink:0}}>{L("\u00a0")}<div style={{height:38,display:"flex",alignItems:"center"}}><span style={{fontSize:11,fontWeight:800,padding:"5px 11px",borderRadius:8,background:"rgba(96,165,250,0.1)",border:"1px solid rgba(96,165,250,0.2)",color:"#60a5fa",whiteSpace:"nowrap"}}>pot = leftover: ${skinsPot}</span></div></div>}
            </div>

          {catSum!==100||placeSum!==100?(
            <div style={{marginTop:10,fontSize:11.5,fontWeight:600,color:"#fbbf24",background:"rgba(245,158,11,0.08)",border:"1px solid rgba(245,158,11,0.15)",borderRadius:8,padding:"7px 11px"}}>

      </div>

      <div className="card">
        <div className="card-hdr"><span className="card-title">📊 Simulated Payouts — live from today’s field</span></div>
        <div className="card-body">
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:10,marginBottom:14}}>
            {[["Players in",inPlayers.length],["Teams of "+teamSize,String(teams)],["Pot now","$"+(fundTotal+inPlayers.reduce((s,p)=>s+paidOf(p),0))],["Projected — opted in","$"+(fundTotal+payinsDue)],["Potential — everyone invited","$"+(fundTotal+all.filter(p=>cnt(p)>=minRounds||(tp[p.id]&&tp[p.id].invited===true)).reduce((s,p)=>s+Math.max(bar-cnt(p),0),0))],["Collected / due (opted in)","$"+inPlayers.reduce((s,p)=>s+paidOf(p),0)+" / $"+payinsDue],["Team payouts","$"+teamPayoutTotal],[skinsOn?"Skins pot (leftover)":"Unallocated leftover","$"+Math.max(leftover,0)]].map(([l,v])=>(
              <div key={l} style={{background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:10,padding:"10px 12px"}}>
                <div style={{fontSize:10,color:"rgba(255,255,255,0.4)",textTransform:"uppercase",letterSpacing:"0.05em",minHeight:24}}>{l}</div>

          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(280px,1fr))",gap:12}}>
            {pools.map((pool,i)=>(
              <div key={i} style={{background:"rgba(16,185,129,0.05)",border:"1px solid rgba(16,185,129,0.15)",borderRadius:12,padding:"12px 14px"}}>
                <div style={{fontSize:13,fontWeight:800,color:"#4ade80",marginBottom:8}}>{poolLabel(i)} — ${pool+(payMode==="perday"?ctpPerDayTotal:ctpTotal)} <span style={{fontWeight:600,color:"rgba(255,255,255,0.4)",fontSize:11}}>(${pool} payouts{(payMode==="perday"?ctpPerDayTotal:ctpTotal)>0?" + $"+(payMode==="perday"?ctpPerDayTotal:ctpTotal)+" CTP":""})</span></div>

      <div className="card">
        <div className="card-hdr"><span className="card-title">📄 Tournament Summary Email</span>

      </div>

      <div className="card">
        <div className="card-hdr"><span className="card-title">👥 Field Selection &amp; Pay-Ins <span style={{fontSize:11,fontWeight:600,color:"rgba(255,255,255,0.35)",marginLeft:8}}>{(()=>{const inv=all.filter(p=>cnt(p)>=minRounds||(tp[p.id]&&tp[p.id].invited===true));const ans=inv.filter(p=>tp[p.id]&&(tp[p.id].in===true||(tp[p.id].in===false&&tp[p.id].by))).length;return inv.length+" invited · "+ans+" answered · "+(inv.length-ans)+" deciding · ";})()}{inPlayers.filter(p=>(bar-cnt(p))-paidOf(p)<=0).length} / {inPlayers.length} settled</span></span>
          <div style={{display:"flex",gap:6}}>
            
            <button className="btn btn-gh btn-sm" onClick={()=>{Object.keys(tp).forEach(id=>{if(tp[id]&&tp[id].in)setP(id,"in",null);setP(id,"by",null);setP(id,"ts",null);setP(id,"days",null);});}}>Clear all</button>
            <button className="btn btn-gh btn-sm" onClick={()=>{const lines=all.slice().sort((a,b)=>cnt(b)-cnt(a)).map(p=>{const r=cnt(p);return p.name+" — "+r+" rounds ("+(r>=minRounds?"eligible":"needs "+(minRounds-r)+" more")+") — entry if playing: $"+Math.max(bar-r,0)+(cfg.refundOverpaid===true&&bar-r<0?" (refund $"+(r-bar)+")":"");});navigator.clipboard.writeText("CLARK TOURNAMENT — STANDINGS AS OF "+new Date().toLocaleDateString()+"\nEntry-fee bar: $"+bar+"\nEligibility: "+minRounds+"+ rounds\n\n"+lines.join("\n"));setCopied(true);setTimeout(()=>setCopied(false),2000);}}>{copied?"✓ Copied":"📋 Copy standings"}</button>
          </div>
        </div>
        <div className="card-body" style={{maxHeight:520,overflowY:"auto"}}>
          {all.slice().sort((a,b)=>cnt(b)-cnt(a)).map(p=>{
            const r=cnt(p);const isIn=!!(tp[p.id]&&tp[p.id].in);const eligible=r>=minRounds;
            const owed=bar-r;const paid=paidOf(p);const net=owed-paid;
            return(
              <div key={p.id} className="s-row" style={{gap:10,opacity:isIn?1:0.55}}>
                {!isIn&&!eligible&&!(tp[p.id]&&tp[p.id].invited===true)&&<button className="btn btn-sm" style={{fontSize:10,color:"#4ade80",borderColor:"rgba(16,185,129,0.35)",background:"transparent",fontWeight:800,padding:"3px 8px"}} onClick={()=>setP(p.id,"invited",true)}>✉ Invite</button>}
                {(()=>{const rec=tp[p.id]||{};const ans=rec.in===true?true:((rec.in===false&&rec.by)?false:null);
                  const twoDay=!!cfg.date2;
                  const clearAll=()=>{setP(p.id,"in",null);setP(p.id,"by",null);setP(p.id,"ts",null);setP(p.id,"days",null);};
                  const bs=(on,col)=>({padding:"3px 8px",borderRadius:7,border:"1px solid",borderColor:on?col:"rgba(255,255,255,0.15)",background:on?"rgba(16,185,129,0.12)":"transparent",color:on?col:"rgba(255,255,255,0.4)",fontWeight:800,fontSize:10.5,cursor:"pointer",flexShrink:0});
                  if(!twoDay){const setAns=v=>{if(ans===v)clearAll();else{setP(p.id,"in",v);setP(p.id,"by","admin");setP(p.id,"ts",Date.now());}};
                    return (<span style={{display:"inline-flex",gap:4,flexShrink:0}}><button style={bs(ans===true,"#4ade80")} onClick={()=>setAns(true)}>In</button><button style={bs(ans===false,"#f87171")} onClick={()=>setAns(false)}>Out</button></span>);}
                  const d1=ans===true&&(!rec.days||rec.days.day1===true), d2=ans===true&&(!rec.days||rec.days.day2===true);
                  const setDay=(dk,on)=>{const nd={day1:dk==="day1"?on:d1,day2:dk==="day2"?on:d2};if(!nd.day1&&!nd.day2){clearAll();return;}setP(p.id,"in",true);setP(p.id,"by","admin");setP(p.id,"ts",Date.now());setP(p.id,"days",nd);};
                  return (<span style={{display:"inline-flex",gap:4,flexShrink:0}}>
                    <button style={bs(d1,"#4ade80")} onClick={()=>setDay("day1",!d1)} title="Day 1">{wdOf(cfg.date1)}</button>
                    <button style={bs(d2,"#4ade80")} onClick={()=>setDay("day2",!d2)} title="Day 2">{wdOf(cfg.date2)}</button>
                    <button style={bs(ans===false,"#f87171")} onClick={()=>{if(ans===false)clearAll();else{setP(p.id,"in",false);setP(p.id,"by","admin");setP(p.id,"ts",Date.now());setP(p.id,"days",null);}}}>Out</button>
                  </span>);})()}
                <div style={{flex:1,minWidth:140}}>
                  <div style={{fontSize:13,fontWeight:600,color:"#e2e8f0"}}>{p.name} {isIn&&!eligible&&<span style={{fontSize:9.5,fontWeight:700,color:"#fbbf24",border:"1px solid rgba(245,158,11,0.3)",borderRadius:6,padding:"1px 6px",marginLeft:4}}>EXCEPTION</span>}{tp[p.id]&&tp[p.id].by==="member"&&tp[p.id].in===true&&<span style={{fontSize:9.5,fontWeight:700,color:"#4ade80",border:"1px solid rgba(16,185,129,0.3)",borderRadius:6,padding:"1px 6px",marginLeft:4}}>SELF ✓</span>}{tp[p.id]&&tp[p.id].by==="member"&&tp[p.id].in===false&&<span style={{fontSize:9.5,fontWeight:700,color:"#f87171",border:"1px solid rgba(248,113,113,0.3)",borderRadius:6,padding:"1px 6px",marginLeft:4}}>DECLINED</span>}{tp[p.id]&&tp[p.id].invited===true&&<span style={{fontSize:9.5,fontWeight:700,color:"#4ade80",border:"1px solid rgba(16,185,129,0.35)",borderRadius:5,padding:"1px 5px",marginLeft:4}}>✉ CLARK</span>}{(cnt(p)>=minRounds||(tp[p.id]&&tp[p.id].invited===true))&&!(tp[p.id]&&(tp[p.id].in===true||(tp[p.id].in===false&&tp[p.id].by)))&&<span style={{fontSize:9.5,fontWeight:700,color:"#fbbf24",border:"1px solid rgba(251,191,36,0.35)",borderRadius:5,padding:"1px 5px",marginLeft:4}}>INVITED · NO ANSWER</span>}</div>
                  <div style={{fontSize:10.5,color:"rgba(255,255,255,0.4)"}}>{r} rounds · {eligible?"eligible":"needs "+(minRounds-r)+" more"} · entry ${Math.max(owed,0)}{owed<0?" (refund $"+(-owed)+")":""}</div>
                </div>
                {isIn&&(<React.Fragment>
                  {owed>0&&(
                    <div style={{flexShrink:0}}>
                      <div className="lbl" style={{fontSize:9}}>Paid ✓</div>
                      <div style={{height:31,display:"flex",alignItems:"center",justifyContent:"center"}}>
                        <input type="checkbox" checked={net<=0} onChange={e=>setP(p.id,"paid",e.target.checked?owed:null)} style={{width:17,height:17,cursor:"pointer"}}/>
                      </div>
                    </div>
                  )}
                  <div style={{display:"flex",gap:10,alignItems:"flex-end",flexShrink:0}}>
                    {isIn&&<div><div className="lbl" style={{fontSize:9,marginBottom:2}}>Hcp</div><input className="inp" style={{width:54,padding:"5px 6px",fontSize:12,textAlign:"center"}} title="Handicap (draw uses this)" value={tp[p.id]&&tp[p.id].handicap!=null?tp[p.id].handicap:((rosterHcpT&&rosterHcpT[p.id]!=null)?rosterHcpT[p.id]:(p.hcp!=null?p.hcp:""))} onChange={e=>{const v=e.target.value.replace(/[^0-9.]/g,"");setP(p.id,"handicap",v===""?null:parseFloat(v));}}/></div>}
                    {isIn&&<div><div className="lbl" style={{fontSize:9,marginBottom:2}}>Tees</div><select className="inp" style={{width:"auto",padding:"5px 6px",fontSize:11.5}} value={(tp[p.id]&&tp[p.id].tee)||(rosterTeeT&&rosterTeeT[p.id])||p.tee||"Whites"} onChange={e=>setP(p.id,"tee",e.target.value)}>{["Blends","Whites","Golds","SGA"].map(x=><option key={x} value={x}>{x}</option>)}</select></div>}
                    <div><div className="lbl" style={{fontSize:9,marginBottom:2}}>Paid $</div><input className="inp" inputMode="numeric" value={tp[p.id]&&tp[p.id].paid!=null?tp[p.id].paid:""} placeholder="0" onChange={e=>{const n=parseInt(e.target.value.replace(/\D/g,"")||"0",10);setP(p.id,"paid",n||null);}} style={{width:64,padding:"5px 8px",fontSize:12}}/></div>
                  </div>
                  <span style={{fontSize:11,fontWeight:700,minWidth:86,textAlign:"right",color:net>0?"#fbbf24":(net<0?"#60a5fa":"#4ade80")}}>{net>0?"owes $"+net:(net<0?(cfg.refundOverpaid===true?"refund $"+(-net):"covered ✓"):"settled ✓")}</span>
                </React.Fragment>)}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}
function ClarkEmailTab(){
  const rosterEmailsDB=useDB("rosterEmails")||{};
  const rosterPinsDB=useDB("rosterPins")||{};
  const registeredEmails=React.useMemo(()=>{const s=new Set();Object.entries(rosterEmailsDB).forEach(([pid,em])=>{if(em&&String(em).indexOf("@")>0&&rosterPinsDB[pid])s.add(String(em).toLowerCase().trim());});return s;},[rosterEmailsDB,rosterPinsDB]);
  const [entries, setEntries] = React.useState([]);
  const [loaded, setLoaded] = React.useState(false);
  const [pasteModal, setPasteModal] = React.useState(false);
  const [pasteText, setPasteText] = React.useState('');
  const [addModal, setAddModal] = React.useState(false);
  const [addName, setAddName] = React.useState('');
  const [addEmail, setAddEmail] = React.useState('');
  const [editEntry, setEditEntry] = React.useState(null); // {_key, name, email}
  const [editName, setEditName] = React.useState('');
  const [editEmail, setEditEmail] = React.useState('');
  const [removeEntry, setRemoveEntry] = React.useState(null); // {_key, name}
  const [search, setSearch] = React.useState('');
  const [copied, setCopied] = React.useState(false);
  const [toast, setToast] = React.useState(null);
  const [selected, setSelected] = React.useState(new Set());

  React.useEffect(()=>{
    if(typeof firebase==='undefined')return;
    const ref = firebase.database().ref('clarkEmailList');
    ref.on('value', snap=>{
      const val = snap.val();
      if(val){
        const arr = Object.entries(val).map(([k,v])=>({...v,_key:k})).sort((a,b)=>a.name.localeCompare(b.name));
        setEntries(arr);
        setSelected(prev=>{
          // Keep existing selections, auto-select new entries
          const newKeys = new Set(arr.map(e=>e._key));
          const merged = new Set([...prev].filter(k=>newKeys.has(k)));
          arr.forEach(e=>{ if(!prev.size) merged.add(e._key); });
          return merged.size===0 ? new Set(arr.map(e=>e._key)) : merged;
        });
      } else {
        setEntries([]);
        setSelected(new Set());
      }
      setLoaded(true);
    });
    return()=>ref.off();
  },[]);

  function showToast(msg){setToast(msg);setTimeout(()=>setToast(null),2500);}

  function toggleSelect(key){
    setSelected(prev=>{const n=new Set(prev);n.has(key)?n.delete(key):n.add(key);return n;});
  }
  function selectAll(){setSelected(new Set(entries.map(e=>e._key)));}
  function deselectAll(){setSelected(new Set());}

  function copySelected(){
    const sel = entries.filter(e=>selected.has(e._key));
    const text = sel.map(e=>`${e.name} <${e.email}>`).join(', ');
    navigator.clipboard.writeText(text).then(()=>{
      setCopied(true);
      showToast(`✓ Copied ${sel.length} recipients to clipboard`);
      setTimeout(()=>setCopied(false),2000);
    });
  }

  function confirmRemove(){
    if(!removeEntry)return;
    firebase.database().ref('clarkEmailList/'+removeEntry._key).remove();
    setRemoveEntry(null);
    showToast('Removed from list');
  }

  function openEdit(e){
    setEditEntry(e);
    setEditName(e.name);
    setEditEmail(e.email);
  }

  function saveEdit(){
    if(!editName.trim()||!editEmail.trim())return;
    firebase.database().ref('clarkEmailList/'+editEntry._key).update({name:editName.trim(),email:editEmail.trim().toLowerCase()});
    setEditEntry(null);
    showToast('Updated');
  }

  function addEntry(){
    if(!addName.trim()||!addEmail.trim())return;
    firebase.database().ref('clarkEmailList').push({name:addName.trim(),email:addEmail.trim().toLowerCase()});
    setAddName('');setAddEmail('');setAddModal(false);
    showToast('Added');
  }

  function parsePaste(){
    const lines = pasteText.split(/[,\n\r]+/).map(l=>l.trim()).filter(Boolean);
    let added = 0;
    const ref = firebase.database().ref('clarkEmailList');
    lines.forEach(line=>{
      const m1 = line.match(/^(.+?)\s*<([^>]+)>/);
      if(m1){ref.push({name:m1[1].trim(),email:m1[2].trim().toLowerCase()});added++;return;}
      const m2 = line.match(/^[\w.+\-]+@[\w.\-]+\.\w+$/i);
      if(m2){ref.push({name:line.split('@')[0],email:line.trim().toLowerCase()});added++;return;}
    });
    setPasteText('');setPasteModal(false);
    showToast(`Imported ${added} contacts`);
  }

  const filtered = entries.filter(e=>
    !search||e.name.toLowerCase().includes(search.toLowerCase())||e.email.toLowerCase().includes(search.toLowerCase())
  );
  const selCount = entries.filter(e=>selected.has(e._key)).length;

  return(
    <div className="main">
      <div className="pg-eyebrow">Communications</div>
      <div className="pg-title">Clark Email List</div>
      <div className="pg-sub">Manage recipients for Clark's group emails. Check who to include, then copy all in Gmail format.</div>

      <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:16,alignItems:'center'}}>
        <button className="btn btn-g" onClick={copySelected} disabled={selCount===0}>
          {copied?'✓ Copied!':`📋 Copy ${selCount} to Gmail`}
        </button>
        <button className="btn btn-b btn-sm" onClick={()=>{
          const regs=entries.filter(e=>e.email&&registeredEmails.has(String(e.email).toLowerCase().trim()));
          if(!regs.length)return;
          navigator.clipboard.writeText(regs.map(e=>e.email).join(", "));
          setToast({msg:"Copied "+regs.length+" registered-member emails \u2713"});setTimeout(()=>setToast(null),2500);
        }}>📱 Copy registered only ({entries.filter(e=>e.email&&registeredEmails.has(String(e.email).toLowerCase().trim())).length})</button>
        <button className="btn btn-gh btn-sm" onClick={()=>setPasteModal(true)}>⬆️ Import</button>
        <button className="btn btn-gh btn-sm" onClick={()=>setAddModal(true)}>+ Add</button>
        <div style={{marginLeft:'auto',display:'flex',gap:6}}>
          <button className="btn btn-gh btn-sm" onClick={selectAll}>All</button>
          <button className="btn btn-gh btn-sm" onClick={deselectAll}>None</button>
        </div>
      </div>

      <div style={{fontSize:12,color:'rgba(255,255,255,0.35)',marginBottom:10}}>
        {entries.length} people · {selCount} selected
      </div>

      <input className="inp" placeholder="Search name or email..." value={search} onChange={e=>setSearch(e.target.value)} style={{marginBottom:12,width:'100%',boxSizing:'border-box'}}/>

      <div className="card">
        {!loaded&&<div style={{padding:'20px 16px',color:'rgba(255,255,255,0.3)',fontSize:13}}>Loading...</div>}
        {loaded&&filtered.length===0&&<div style={{padding:'20px 16px',color:'rgba(255,255,255,0.3)',fontSize:13,textAlign:'center'}}>No contacts yet.</div>}
        {filtered.map((e,i)=>(
          <div key={e._key} style={{display:'flex',alignItems:'center',gap:10,padding:'9px 14px',borderBottom:i<filtered.length-1?'1px solid rgba(255,255,255,0.06)':'none',background:selected.has(e._key)?'rgba(16,185,129,0.05)':'transparent'}}>
            {/* Checkbox */}
            <div onClick={()=>toggleSelect(e._key)} style={{width:17,height:17,borderRadius:3,border:'1.5px solid',borderColor:selected.has(e._key)?'#10b981':'rgba(255,255,255,0.2)',background:selected.has(e._key)?'#10b981':'transparent',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,cursor:'pointer'}}>
              {selected.has(e._key)&&<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3" strokeLinecap="round"><polyline points="20 6 9 17 4 12"/></svg>}
            </div>
            {/* Initials */}
            <div style={{width:30,height:30,borderRadius:'50%',background:'rgba(16,185,129,0.12)',color:'#10b981',fontSize:10,fontWeight:800,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              {e.name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)}
            </div>
            {/* Name · email on one line */}
            <div style={{flex:1,minWidth:0,display:'flex',alignItems:'baseline',gap:8,overflow:'hidden'}}>
              <span style={{fontSize:13,fontWeight:600,color:'#e2e8f0',whiteSpace:'nowrap',flexShrink:0}}>{e.name}</span>
              <span style={{fontSize:11,color:'rgba(255,255,255,0.3)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>· {e.email}</span>
            </div>
            {/* Edit */}
            <button onClick={()=>openEdit(e)} style={{background:'none',border:'1px solid rgba(255,255,255,0.15)',borderRadius:5,cursor:'pointer',color:'rgba(255,255,255,0.5)',fontSize:11,padding:'3px 8px',flexShrink:0,fontFamily:'inherit'}}>Edit</button>
            {/* Remove */}
            <button onClick={()=>setRemoveEntry(e)} style={{background:'none',border:'1px solid rgba(239,68,68,0.3)',borderRadius:5,cursor:'pointer',color:'rgba(239,68,68,0.6)',fontSize:11,padding:'3px 8px',flexShrink:0,fontFamily:'inherit'}}>Remove</button>
          </div>
        ))}
      </div>

      {/* Remove confirmation modal */}
      {removeEntry&&(
        <div onClick={e=>{if(e.target===e.currentTarget)setRemoveEntry(null);}} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.75)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:20}}>
          <div className="modal" style={{width:'100%',maxWidth:380}}>
            <div style={{fontSize:16,fontWeight:700,color:'#fff',marginBottom:8}}>Remove from list?</div>
            <div style={{fontSize:13,color:'rgba(255,255,255,0.5)',marginBottom:20,lineHeight:1.5}}>
              <strong style={{color:'#e2e8f0'}}>{removeEntry.name}</strong> will be removed from the Clark email list. This does not affect their app account.
            </div>
            <div style={{display:'flex',gap:8}}>
              <button className="btn btn-full" style={{background:'#ef4444',color:'#fff',border:'none'}} onClick={confirmRemove}>Yes, Remove</button>
              <button className="btn btn-gh" onClick={()=>setRemoveEntry(null)}>Cancel</button>
            </div>
          </div>
        </div>
      )}

      {/* Edit modal */}
      {editEntry&&(
        <div onClick={e=>{if(e.target===e.currentTarget)setEditEntry(null);}} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.75)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:20}}>
          <div className="modal" style={{width:'100%',maxWidth:420}}>
            <div style={{fontSize:16,fontWeight:700,color:'#fff',marginBottom:16}}>Edit Contact</div>
            <div className="lbl" style={{marginBottom:4}}>Name</div>
            <input className="inp" value={editName} onChange={e=>setEditName(e.target.value)} style={{marginBottom:12}}/>
            <div className="lbl" style={{marginBottom:4}}>Email</div>
            <input className="inp" type="email" value={editEmail} onChange={e=>setEditEmail(e.target.value)} style={{marginBottom:20}}
              onKeyDown={e=>{if(e.key==='Enter')saveEdit();}}/>
            <div style={{display:'flex',gap:8}}>
              <button className="btn btn-g btn-full" onClick={saveEdit} disabled={!editName.trim()||!editEmail.trim()}>Save Changes</button>
              <button className="btn btn-gh" onClick={()=>setEditEntry(null)}>Cancel</button>
            </div>
          </div>
        </div>
      )}

      {/* Add modal */}
      {addModal&&(
        <div onClick={e=>{if(e.target===e.currentTarget)setAddModal(false);}} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.75)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:20}}>
          <div className="modal" style={{width:'100%',maxWidth:400}}>
            <div style={{fontSize:16,fontWeight:700,color:'#fff',marginBottom:16}}>Add Person</div>
            <div className="lbl" style={{marginBottom:4}}>Name</div>
            <input className="inp" placeholder="Full name" value={addName} onChange={e=>setAddName(e.target.value)} style={{marginBottom:10}}/>
            <div className="lbl" style={{marginBottom:4}}>Email</div>
            <input className="inp" type="email" placeholder="email@example.com" value={addEmail} onChange={e=>setAddEmail(e.target.value)} style={{marginBottom:16}}
              onKeyDown={e=>{if(e.key==='Enter')addEntry();}}/>
            <div style={{display:'flex',gap:8}}>
              <button className="btn btn-g btn-full" onClick={addEntry} disabled={!addName.trim()||!addEmail.trim()}>Add</button>
              <button className="btn btn-gh" onClick={()=>setAddModal(false)}>Cancel</button>
            </div>
          </div>
        </div>
      )}

      {/* Import modal */}
      {pasteModal&&(
        <div onClick={e=>{if(e.target===e.currentTarget)setPasteModal(false);}} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.75)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:20}}>
          <div className="modal" style={{width:'100%',maxWidth:520}}>
            <div style={{fontSize:16,fontWeight:700,color:'#fff',marginBottom:6}}>Import Email List</div>
            <div style={{fontSize:12,color:'rgba(255,255,255,0.4)',marginBottom:12,lineHeight:1.6}}>
              Paste contacts in Gmail format: <code style={{color:'rgba(255,255,255,0.55)'}}>Name &lt;email@x.com&gt;</code>
            </div>
            <textarea className="inp" rows={8} placeholder="Paste contacts here..." value={pasteText} onChange={e=>setPasteText(e.target.value)} style={{marginBottom:12,fontFamily:'monospace',fontSize:12}}/>
            <div style={{display:'flex',gap:8}}>
              <button className="btn btn-g btn-full" onClick={parsePaste} disabled={!pasteText.trim()}>Import</button>
              <button className="btn btn-gh" onClick={()=>{setPasteModal(false);setPasteText('');}}>Cancel</button>
            </div>
          </div>
        </div>
      )}

      {toast&&<div className="toast toast-ok">{toast}</div>}
    </div>
  );
}


function LoginCardsTab(){
  const rosterPins=useDB("rosterPins");
  const rosterEdits=useDB("rosterEdits");
  const extra=useDB("extraPlayers");

  const allPlayers=React.useMemo(()=>{
    if(!rosterPins) return [];
    // Only show players who have registered (have a PIN)
    const base=ROSTER
      .filter(p=>rosterPins[p.id])
      .map(p=>({...p,name:(rosterEdits&&rosterEdits[p.id])||p.name,isExtra:false}));
    // Include extra players who have PINs
    const extras=Object.values(extra||{})
      .filter(p=>rosterPins[p.id])
      .map(p=>({...p,isExtra:true}));
    return [...base,...extras].sort((a,b)=>a.name.localeCompare(b.name));
  },[rosterPins,rosterEdits,extra]);

  const [cards,setCards]=React.useState({});
  const [q,setQ]=React.useState('');
  const [editing,setEditing]=React.useState(null); // player obj
  const [editMsg,setEditMsg]=React.useState('');
  const [editLogo,setEditLogo]=React.useState(''); // base64 data url
  const [editTheme,setEditTheme]=React.useState('default');
  const [uploading,setUploading]=React.useState(false);
  const [toast,setToast]=React.useState(null);
  const fileRef=React.useRef();
  const cropCanvasRef=React.useRef();
  const [cropModal,setCropModal]=React.useState(false);
  const [cropImg,setCropImg]=React.useState(null); // raw data url
  const [cropImgEl,setCropImgEl]=React.useState(null); // Image element
  const [cropOffset,setCropOffset]=React.useState({x:0,y:0}); // pan offset
  const [cropScale,setCropScale]=React.useState(1); // zoom
  const [cropDragging,setCropDragging]=React.useState(false);
  const [cropDragStart,setCropDragStart]=React.useState({x:0,y:0});
  const CROP_SIZE=240; // display size of crop modal canvas

  // Load all player cards from Firebase
  React.useEffect(()=>{
    if(typeof firebase==='undefined')return;
    const ref=firebase.database().ref('settings/playerCards');
    ref.on('value',snap=>{setCards(snap.val()||{});});
    return()=>ref.off();
  },[]);

  function showToast(msg){setToast(msg);setTimeout(()=>setToast(null),2500);}

  function openEdit(p){
    const card=cards[p.id]||{};
    setEditing(p);
    setEditMsg(card.message||'');
    setEditLogo(card.logo||'');
    setEditTheme(card.theme||'default');
  }

  function handleImageUpload(e){
    const file=e.target.files?.[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      const img=new window.Image();
      img.onload=()=>{
        setCropImgEl(img);
        setCropImg(ev.target.result);
        // Center the image initially
        const scale=Math.max(CROP_SIZE/img.width, CROP_SIZE/img.height);
        setCropScale(scale);
        setCropOffset({x:(CROP_SIZE-img.width*scale)/2, y:(CROP_SIZE-img.height*scale)/2});
        setCropModal(true);
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
    e.target.value=''; // reset so same file can be re-uploaded
  }

  function drawCrop(){
    const canvas=cropCanvasRef.current;
    if(!canvas||!cropImgEl)return;
    const ctx=canvas.getContext('2d');
    ctx.clearRect(0,0,CROP_SIZE,CROP_SIZE);
    ctx.drawImage(cropImgEl, cropOffset.x, cropOffset.y, cropImgEl.width*cropScale, cropImgEl.height*cropScale);
  }
  React.useEffect(()=>{if(cropModal)drawCrop();},[cropModal,cropOffset,cropScale,cropImgEl]);

  function confirmCrop(){
    const canvas=cropCanvasRef.current;
    if(!canvas)return;
    // Export at 128×128
    const out=document.createElement('canvas');
    out.width=128;out.height=128;
    const ctx=out.getContext('2d');
    const ratio=128/CROP_SIZE;
    ctx.drawImage(cropImgEl,
      cropOffset.x*ratio, cropOffset.y*ratio,
      cropImgEl.width*cropScale*ratio, cropImgEl.height*cropScale*ratio
    );
    setEditLogo(out.toDataURL('image/jpeg',0.85));
    setCropModal(false);
  }

  function onCropMouseDown(e){
    setCropDragging(true);
    const rect=e.currentTarget.getBoundingClientRect();
    setCropDragStart({x:(e.clientX||e.touches?.[0]?.clientX||0)-cropOffset.x, y:(e.clientY||e.touches?.[0]?.clientY||0)-cropOffset.y});
  }
  function onCropMouseMove(e){
    if(!cropDragging)return;
    const cx=e.clientX||e.touches?.[0]?.clientX||0;
    const cy=e.clientY||e.touches?.[0]?.clientY||0;
    setCropOffset({x:cx-cropDragStart.x, y:cy-cropDragStart.y});
