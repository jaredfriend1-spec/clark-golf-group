              <div style={{width:16,height:16,borderRadius:3,border:"2px solid",borderColor:resetDismissals?"#f59e0b":"rgba(255,255,255,0.2)",background:resetDismissals?"#f59e0b":"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                {resetDismissals&&<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg>}
              </div>
              <div style={{flex:1}}>
                <div style={{fontSize:12,fontWeight:700,color:resetDismissals?"#fbbf24":"#e2e8f0"}}>Re-notify everyone</div>
                <div style={{fontSize:10,color:"rgba(255,255,255,0.4)",marginTop:1}}>Resets dismissals so everyone sees this update</div>
              </div>
            </div>
          )}

          {/* Preview */}
          <div className="lbl">Preview</div>
          {display==="banner"?(
            <div style={{background:cat.soft,border:"1px solid "+cat.border,borderRadius:10,padding:"10px 14px",display:"flex",alignItems:"flex-start",gap:10,marginBottom:14}}>
              <div style={{fontSize:18,lineHeight:1,flexShrink:0,marginTop:1}}>{cat.icon}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13,fontWeight:700,color:cat.color,lineHeight:1.3}}>{title||"Your title here"}</div>
                {body&&<div style={{fontSize:12,color:"rgba(255,255,255,0.7)",marginTop:2,lineHeight:1.4}}>{body}</div>}
              </div>
            </div>
          ):(
            <div style={{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:14,padding:"18px 16px",textAlign:"center",borderTop:"4px solid "+cat.color,marginBottom:14}}>
              <div style={{fontSize:32,marginBottom:6}}>{cat.icon}</div>
              <div style={{fontSize:10,fontWeight:700,color:cat.color,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:4}}>{cat.label}</div>
              <div style={{fontSize:15,fontWeight:800,color:"#fff",marginBottom:body?8:0}}>{title||"Your title here"}</div>
              {body&&<div style={{fontSize:12,color:"rgba(255,255,255,0.7)",lineHeight:1.4,whiteSpace:"pre-wrap"}}>{body}</div>}
            </div>
          )}

          {err&&<div style={{padding:"8px 12px",background:"rgba(239,68,68,0.1)",border:"1px solid rgba(239,68,68,0.3)",borderRadius:8,color:"#fca5a5",fontSize:12,marginBottom:10}}>{err}</div>}

          <div style={{display:"flex",gap:8}}>
            <button className="btn btn-gh" style={{flex:1}} onClick={closeEdit} disabled={saving}>Cancel</button>
            <button className="btn btn-g" style={{flex:2}} onClick={publish} disabled={saving}>
              {saving?"Saving…":(typeof editing==="object"?"Save changes":"Publish")}
            </button>
          </div>
        </div>
      </div>
    )}

    {/* Active list */}
    {active.length>0&&(
      <div className="card">
        <div className="card-hdr">
          <div className="card-title">Active ({active.length})</div>
        </div>
        <div className="card-body" style={{padding:0}}>
          {active.map((a,i)=>{
            const cat=getAnnCategory(a.category);
            const expiresIn=a.autoExpireAt?Math.ceil((a.autoExpireAt-now)/(24*60*60*1000)):null;
            return(
              <div key={a.key} style={{padding:"14px 16px",borderBottom:i<active.length-1?"1px solid rgba(255,255,255,0.06)":"none"}}>
                <div style={{display:"flex",alignItems:"flex-start",gap:10,marginBottom:8}}>
                  <span style={{fontSize:20,lineHeight:1,marginTop:2,flexShrink:0}}>{cat.icon}</span>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:700,color:cat.color,marginBottom:2}}>{a.title}</div>
                    {a.body&&<div style={{fontSize:12,color:"rgba(255,255,255,0.6)",lineHeight:1.4}}>{a.body.length>120?a.body.slice(0,120)+"…":a.body}</div>}
                  </div>
                </div>
                <div style={{fontSize:10,color:"rgba(255,255,255,0.35)",display:"flex",gap:8,flexWrap:"wrap",marginBottom:10}}>
                  <span>{a.display==="modal"?"📢 Modal":"📌 Banner"}</span>
                  <span>·</span>
                  <span>{a.dismissal==="auto"?`Expires in ${expiresIn}d`:a.dismissal==="session"?"Per session":"Once dismissed"}</span>
                  {a.createdAt&&<><span>·</span><span>{new Date(a.createdAt).toLocaleDateString()}</span></>}
                  {a.createdBy&&<><span>·</span><span>by {a.createdBy.split("@")[0]}</span></>}
                </div>
                <div style={{display:"flex",gap:6}}>
                  <button className="btn btn-gh btn-sm" onClick={()=>togglePause(a.key,false)}>Pause</button>
                  <button className="btn btn-gh btn-sm" onClick={()=>openEdit(a)}>Edit</button>
                  <button className="btn btn-r btn-sm" onClick={()=>remove(a.key)}>Delete</button>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    )}

    {/* Paused / Expired list */}
    {inactive.length>0&&(
      <div className="card">
        <div className="card-hdr">
          <div className="card-title">Paused / Expired ({inactive.length})</div>
        </div>
        <div className="card-body" style={{padding:0}}>
          {inactive.map((a,i)=>{
            const cat=getAnnCategory(a.category);
            const isExpired=a.autoExpireAt&&a.autoExpireAt<=now;
            return(
              <div key={a.key} style={{padding:"14px 16px",borderBottom:i<inactive.length-1?"1px solid rgba(255,255,255,0.06)":"none",opacity:0.65}}>
                <div style={{display:"flex",alignItems:"flex-start",gap:10,marginBottom:8}}>
                  <span style={{fontSize:20,lineHeight:1,marginTop:2,flexShrink:0,opacity:0.6}}>{cat.icon}</span>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:700,color:"rgba(255,255,255,0.7)",marginBottom:2}}>{a.title}</div>
                    {a.body&&<div style={{fontSize:12,color:"rgba(255,255,255,0.4)",lineHeight:1.4}}>{a.body.length>120?a.body.slice(0,120)+"…":a.body}</div>}
                  </div>
                </div>
                <div style={{fontSize:10,color:"rgba(255,255,255,0.35)",marginBottom:10}}>
                  {isExpired?"Expired":"Paused"}
                  {a.createdAt&&" · "+new Date(a.createdAt).toLocaleDateString()}
                </div>
                <div style={{display:"flex",gap:6}}>
                  {!isExpired&&<button className="btn btn-g btn-sm" onClick={()=>togglePause(a.key,true)}>Resume</button>}
                  <button className="btn btn-gh btn-sm" onClick={()=>openEdit(a)}>Edit</button>
                  <button className="btn btn-r btn-sm" onClick={()=>remove(a.key)}>Delete</button>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    )}

    {all.length===0&&!editing&&(
      <div className="card">
        <div className="card-body" style={{padding:"32px 20px",textAlign:"center",color:"rgba(255,255,255,0.5)",fontSize:13}}>
          <div style={{fontSize:32,marginBottom:8}}>📢</div>
          <div style={{fontWeight:700,marginBottom:4,color:"#e2e8f0"}}>No announcements yet</div>
          <div style={{fontSize:12}}>Create one to notify members.</div>
        </div>
      </div>
    )}
  </div>);
}

// ── SETTINGS TAB (Master Only) ────────────────────────────────────────────────
function SettingsTab({user,onSignOut}){
  const settings=useDB("settings");
  const doNotPair=useDB("settings/doNotPair");
  const rosterEdits=useDB("rosterEdits");
  const extra=useDB("extraPlayers");
  const [tfBal,setTfBal]=useState("");
  const [pairA,setPairA]=useState("");
  const [pairB,setPairB]=useState("");
  const [pairErr,setPairErr]=useState("");
  const [newPw,setNewPw]=useState("");
  const [confirmPw,setConfirmPw]=useState("");
  const [pwMsg,setPwMsg]=useState("");
  const [toast,showToast]=useToast();

  useEffect(()=>{if(settings)setTfBal(String(settings.tournFundStartingBalance||0));},[settings?.tournFundStartingBalance]);

  function saveTF(){wr("settings/tournFundStartingBalance",parseFloat(tfBal)||0);showToast("Saved ✓");}
  function savePw(){
    if(newPw!==confirmPw){setPwMsg("Passwords do not match");return;}
    if(newPw.length<4){setPwMsg("Minimum 4 characters");return;}
    wr("settings/masterPassword",newPw);
    setNewPw("");setConfirmPw("");setPwMsg("");
    showToast("Password updated ✓");
  }

  return(<div>
    <Toast msg={toast.msg} type={toast.type}/>
    <div className="pg-eyebrow">Master Only</div>
    <div className="pg-title">Settings</div>
    <div className="pg-sub">Master-only system configuration</div>

    {/* ═══ Pairing Rules (Master only, silent in app) ═══ */}
    <div className="card">
      <div className="card-hdr"><span className="card-title">Pairing Rules</span></div>
      <div className="card-body">
        <div style={{fontSize:12,color:"rgba(255,255,255,0.4)",marginBottom:14,lineHeight:1.6}}>
          Players who should never end up on the same team during auto-build. Silent — never shown anywhere in the main app. Match requests override these rules. Admin can always manually move players after build.
        </div>

        {/* Add new pair */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr auto",gap:8,marginBottom:6}}>
          <div>
            <div className="lbl" style={{marginBottom:4}}>Player A</div>
            <select className="inp" value={pairA} onChange={e=>{setPairA(e.target.value);setPairErr("");}}>
              <option value="">— Select —</option>
              {(()=>{
                const allP=[...ROSTER.map(p=>({id:p.id,name:(rosterEdits&&rosterEdits[p.id])||p.name})),
                  ...Object.values(extra||{}).map(p=>({id:p.id,name:p.name}))];
                return allP.sort((a,b)=>a.name.localeCompare(b.name)).map(p=>(
                  <option key={p.id} value={String(p.id)}>{p.name}</option>
                ));
              })()}
            </select>
          </div>
          <div>
            <div className="lbl" style={{marginBottom:4}}>Player B</div>
            <select className="inp" value={pairB} onChange={e=>{setPairB(e.target.value);setPairErr("");}}>
              <option value="">— Select —</option>
              {(()=>{
                const allP=[...ROSTER.map(p=>({id:p.id,name:(rosterEdits&&rosterEdits[p.id])||p.name})),
                  ...Object.values(extra||{}).map(p=>({id:p.id,name:p.name}))];
                return allP.sort((a,b)=>a.name.localeCompare(b.name)).map(p=>(
                  <option key={p.id} value={String(p.id)}>{p.name}</option>
                ));
              })()}
            </select>
          </div>
          <button className="btn btn-g btn-sm" style={{alignSelf:"flex-end"}}
            onClick={()=>{
              if(!pairA||!pairB){setPairErr("Pick both players");return;}
              if(pairA===pairB){setPairErr("Pick two different players");return;}
              // check duplicate
              const exists=Object.values(doNotPair||{}).some(r=>
                (String(r.playerA_id)===pairA&&String(r.playerB_id)===pairB)||
                (String(r.playerA_id)===pairB&&String(r.playerB_id)===pairA)
              );
              if(exists){setPairErr("Pair already exists");return;}
              const nameOf=id=>{
                const baseP=ROSTER.find(p=>String(p.id)===id);
                if(baseP)return (rosterEdits&&rosterEdits[baseP.id])||baseP.name;
                const ex=Object.values(extra||{}).find(p=>String(p.id)===id);
                return ex?ex.name:"Unknown";
              };
              ps("settings/doNotPair",{
                playerA_id:Number(pairA),
                playerA_name:nameOf(pairA),
                playerB_id:Number(pairB),
                playerB_name:nameOf(pairB),
                active:true,
                addedAt:Date.now()
              });
              setPairA("");setPairB("");setPairErr("");
            }}>+ Add</button>
        </div>
        {pairErr&&<div style={{fontSize:11,color:"#ef4444",marginTop:6}}>{pairErr}</div>}

        {/* Active rules */}
        <div style={{marginTop:18,fontSize:11,fontWeight:700,color:"rgba(255,255,255,0.45)",letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:8}}>
          Rules ({Object.keys(doNotPair||{}).length})
        </div>
        {Object.keys(doNotPair||{}).length===0&&(
          <div style={{padding:"16px 12px",textAlign:"center",fontSize:12,color:"rgba(255,255,255,0.3)",background:"rgba(255,255,255,0.02)",borderRadius:8}}>No rules set.</div>
        )}
        {Object.entries(doNotPair||{}).map(([k,r])=>(
          <div key={k} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",background:r.active?"rgba(239,68,68,0.06)":"rgba(255,255,255,0.02)",border:"1px solid "+(r.active?"rgba(239,68,68,0.15)":"rgba(255,255,255,0.05)"),borderRadius:8,marginBottom:6}}>
            {/* Toggle */}
            <div onClick={()=>wr("settings/doNotPair/"+k+"/active",!r.active)}
              style={{width:36,height:20,borderRadius:20,background:r.active?"#10b981":"rgba(255,255,255,0.15)",position:"relative",cursor:"pointer",flexShrink:0,transition:"background 0.2s"}}>
              <div style={{position:"absolute",top:2,left:r.active?18:2,width:16,height:16,borderRadius:"50%",background:"#fff",transition:"left 0.2s"}}/>
            </div>
            {/* Names */}
            <div style={{flex:1,minWidth:0,fontSize:13,fontWeight:600,color:"#e2e8f0",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
              {r.playerA_name} <span style={{color:"rgba(255,255,255,0.3)",margin:"0 4px"}}>↔</span> {r.playerB_name}
            </div>
            {/* Status label */}
            <span style={{fontSize:10,fontWeight:700,color:r.active?"#10b981":"rgba(255,255,255,0.3)",letterSpacing:"0.06em",textTransform:"uppercase",flexShrink:0}}>
              {r.active?"Active":"Paused"}
            </span>
            {/* Remove */}
            <button onClick={()=>{if(window.confirm("Remove this pairing rule permanently?"))dl("settings/doNotPair/"+k);}}
              style={{background:"none",border:"1px solid rgba(239,68,68,0.25)",color:"rgba(239,68,68,0.7)",borderRadius:5,fontSize:10,padding:"3px 8px",cursor:"pointer",fontFamily:"inherit",fontWeight:600,flexShrink:0}}>
              Remove
            </button>
          </div>
        ))}
      </div>
    </div>

    <div className="card">
      <div className="card-hdr"><span className="card-title">🔐 Set Up Firebase Email Login</span></div>
      <div className="card-body">
        <div style={{fontSize:12,color:"rgba(255,255,255,0.4)",marginBottom:12,lineHeight:1.8}}>Replace the password fallback with proper Firebase email authentication. No effect on the main app.</div>
        <div style={{background:"#0e1d19",border:"1px solid rgba(255,255,255,0.08)",borderRadius:10,padding:"12px 14px",fontSize:12,color:"rgba(255,255,255,0.45)",lineHeight:2}}>
          <div><strong style={{color:"#60a5fa"}}>1.</strong> <a href="https://console.firebase.google.com/project/clark-group-dd15e/authentication" target="_blank" style={{color:"#10b981"}}>Firebase Console → Authentication</a></div>
          <div><strong style={{color:"#60a5fa"}}>2.</strong> Sign-in method → Enable <strong style={{color:"#e2e8f0"}}>Email/Password</strong></div>
          <div><strong style={{color:"#60a5fa"}}>3.</strong> Users tab → Add user (your email + password)</div>
          <div><strong style={{color:"#60a5fa"}}>4.</strong> Use Email Login tab on the portal gate</div>
        </div>
      </div>
    </div>

    <div className="card">
      <div className="card-hdr"><span className="card-title">Tournament Fund Starting Balance</span></div>
      <div className="card-body">
        <div style={{fontSize:11,color:"rgba(255,255,255,0.35)",marginBottom:8}}>Balance from before rounds were tracked in the app:</div>
        <div style={{display:"flex",gap:8}}>
          <input className="inp" type="number" value={tfBal} onChange={e=>setTfBal(e.target.value)} style={{flex:1}}/>
          <button className="btn btn-g" onClick={saveTF}>Save</button>
        </div>
      </div>
    </div>

    <div className="card">
      <div className="card-hdr"><span className="card-title">Fallback Master Password</span></div>
      <div className="card-body">
        {pwMsg&&<div style={{fontSize:11,color:"#f87171",marginBottom:8}}>{pwMsg}</div>}
        <input className="inp" type="password" value={newPw} onChange={e=>setNewPw(e.target.value)} placeholder="New password" style={{marginBottom:7}}/>
        <input className="inp" type="password" value={confirmPw} onChange={e=>setConfirmPw(e.target.value)} placeholder="Confirm password" style={{marginBottom:10}}/>
        <button className="btn btn-a btn-full" onClick={savePw}>Update Password</button>
      </div>
    </div>

    <div className="card">
      <div className="card-hdr"><span className="card-title">Firebase Links</span></div>
      <div className="card-body" style={{display:"flex",flexDirection:"column",gap:6}}>
        <a href="https://console.firebase.google.com/project/clark-group-dd15e/database" target="_blank" className="btn btn-gh" style={{textDecoration:"none",textAlign:"center",fontSize:12}}>🔥 Firebase Realtime Database</a>
        <a href="https://console.firebase.google.com/project/clark-group-dd15e/authentication/users" target="_blank" className="btn btn-gh" style={{textDecoration:"none",textAlign:"center",fontSize:12}}>🔐 Auth Users</a>
      </div>
    </div>

    <div className="card">
      <div className="card-hdr"><span className="card-title">Session</span></div>
      <div className="card-body"><button className="btn btn-gh btn-full" onClick={onSignOut}>🔒 Lock Portal & Sign Out</button></div>
    </div>
  </div>);
}

// ── MAIN ──────────────────────────────────────────────────────────────────────
const ALL_NAV_ITEMS=[
  {id:"dash",label:"Dashboard",master:false,icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>},
  {id:"access",label:"Access",master:false,icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>},
  {id:"week",label:"Week",master:false,icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>},
  {id:"email",label:"Email",master:false,icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>},
  {id:"roster",label:"Roster",master:false,icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>},
  {id:"history",label:"History",master:false,icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>},
  {id:"announce",label:"Announce",master:false,icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M3 11h3l8-7v18l-8-7H3z"/><path d="M19 5a7 7 0 010 14"/></svg>},
  {id:"clarkemail",label:"Clark Email",master:false,icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>},
  {id:"attend",label:"Attend",master:false,icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>},
  {id:"season",label:"Season",master:true,icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/><path d="M3.6 9h16.8M3.6 15h16.8"/></svg>},
  {id:"logincards",label:"Login Cards",master:true,icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="9" cy="12" r="3"/><line x1="15" y1="10" x2="19" y2="10"/><line x1="15" y1="14" x2="17" y2="14"/></svg>},
  {id:"settings",label:"Settings",master:true,icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>},
];

function Portal(){
  const [user,setUser]=useState(()=>{try{const s=sessionStorage.getItem("portal_user");return s?JSON.parse(s):null;}catch{return null;}});
  const [tab,setTab]=useState("dash");

  useEffect(()=>{
    if(!auth)return;
    const unsub=auth.onAuthStateChanged(u=>{
      if(u&&!user){const ud={email:u.email,role:"superadmin",method:"firebase"};sessionStorage.setItem("portal_user",JSON.stringify(ud));setUser(ud);}
    });
    return()=>unsub();
  },[]);

  // Redirect if non-master lands on master-only tab
  useEffect(()=>{
    if(user&&!isMaster(user.role)&&(tab==="settings"||tab==="season")){setTab("dash");}
  },[user,tab]);

  function onAuth(u){sessionStorage.setItem("portal_user",JSON.stringify(u));setUser(u);}
  function signOut(){sessionStorage.removeItem("portal_user");try{if(auth&&auth.currentUser)auth.signOut();}catch(e){}setUser(null);}

  if(!user)return<Gate onAuth={onAuth}/>;

  // Filter nav based on role
  const NAV_ITEMS=ALL_NAV_ITEMS.filter(n=>!n.master||isMaster(user.role));

  const ini=(user.email&&user.email!=="master")?user.email.charAt(0).toUpperCase():(user.name?user.name.charAt(0).toUpperCase():"J");

  return(
    <div className="shell">
      <div className="topbar">
        <div className="logo" style={{whiteSpace:"nowrap"}}>Admin <em>Portal</em></div>
        <span className={`role-badge ${isMaster(user.role)?"rb-master":"rb-superadmin"}`}>{isMaster(user.role)?"Master Admin":"Super Admin"}</span>
        <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:10}}>
          <div style={{display:"flex",alignItems:"center",gap:8,padding:"5px 12px 5px 7px",background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:24}}>
            <div style={{width:26,height:26,borderRadius:"50%",background:"#10b981",color:"#fff",fontSize:11,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"Barlow Condensed,sans-serif",flexShrink:0}}>{ini}</div>
            <span style={{fontSize:12,fontWeight:600,color:"rgba(255,255,255,0.65)",maxWidth:120,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{user.name||user.email||"Admin"}</span>
          </div>
          <a href="index.html" style={{fontSize:11,fontWeight:600,color:"rgba(255,255,255,0.2)",textDecoration:"none",padding:"5px 12px",borderRadius:20,border:"1px solid rgba(255,255,255,0.08)",transition:"all 0.2s",whiteSpace:"nowrap"}} onMouseEnter={e=>{e.currentTarget.style.color="rgba(255,255,255,0.5)";e.currentTarget.style.borderColor="rgba(255,255,255,0.18)";}} onMouseLeave={e=>{e.currentTarget.style.color="rgba(255,255,255,0.2)";e.currentTarget.style.borderColor="rgba(255,255,255,0.08)";}}>← App</a>
        </div>
      </div>
      <div className="mob-nav">
        {NAV_ITEMS.map(n=>(
          <button key={n.id} className={`mob-btn${tab===n.id?" on":""}`} onClick={()=>setTab(n.id)}>{n.icon}<span>{n.label}</span></button>
        ))}
        <button className="mob-btn" onClick={signOut} style={{marginLeft:4,borderLeft:"1px solid rgba(255,255,255,0.08)",paddingLeft:8}}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" style={{width:18,height:18}}><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          <span>Sign Out</span>
        </button>
      </div>
      <div className="body">
        <div className="sidebar">
          {NAV_ITEMS.filter(n=>!n.master).map(n=>(
            <button key={n.id} className={`ni${tab===n.id?" on":""}`} onClick={()=>setTab(n.id)}>{n.icon}{n.label}</button>
          ))}
          {isMaster(user.role)&&NAV_ITEMS.some(n=>n.master)&&(
            <>
              <div className="nav-sep">Master Only</div>
              {NAV_ITEMS.filter(n=>n.master).map(n=>(
                <button key={n.id} className={`ni${tab===n.id?" on":""}`} onClick={()=>setTab(n.id)}>{n.icon}{n.label}</button>
              ))}
            </>
          )}
          <div className="ni-foot">
            <button className="ni" onClick={signOut} style={{color:"rgba(255,255,255,0.25)"}}>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" style={{width:15,height:15}}><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>Sign Out
            </button>
          </div>
        </div>
        <div className="main">
          {tab==="dash"&&<DashTab user={user}/>}
          {tab==="week"&&<WeekTab user={user}/>}
          {tab==="email"&&<EmailTab/>}
          {tab==="roster"&&<RosterTab/>}
          {tab==="access"&&<AccessTab user={user}/>}
          {tab==="history"&&<HistoryTab user={user}/>}
          {tab==="announce"&&<AnnounceTab user={user}/>}
          {tab==="clarkemail"&&<ClarkEmailTab/>}
          {tab==="attend"&&<AttendTab user={user}/>}
          {tab==="logincards"&&isMaster(user.role)&&<LoginCardsTab/>}
          {tab==="season"&&isMaster(user.role)&&<SeasonTab/>}
          {tab==="settings"&&isMaster(user.role)&&<SettingsTab user={user} onSignOut={signOut}/>}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Portal/>);
</script>
</body>
</html>
