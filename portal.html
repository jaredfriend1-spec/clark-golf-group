// ── HISTORY TAB ───────────────────────────────────────────────────────────────
function HistoryTab({user}){
  const history=useDB("history");
  const [open,setOpen]=useState(null);
  const [confirmDel,setConfirmDel]=useState(null);
  const [delTyped,setDelTyped]=useState("");
  const [toast,showToast]=useToast();
  const rounds=useMemo(()=>Object.entries(history||{}).sort((a,b)=>(b[1].date||"").localeCompare(a[1].date||"")),[history]);
  const pc=r=>r.playerCount||safeArr(r.teams).reduce((s,t)=>s+Object.values(t.players||{}).length,0);

  function deleteRound(key){
    if(delTyped!=="DELETE"){showToast('Type "DELETE" to confirm',"err");return;}
    wr("historyTrash/"+key,{...history[key],deletedAt:Date.now(),deletedBy:"portal"});
    dl("history/"+key);
    showToast("Moved to trash ✓");
    setConfirmDel(null);setDelTyped("");setOpen(null);
  }

  return(<div>
    <Toast msg={toast.msg} type={toast.type}/>
    <div className="pg-eyebrow">Archive</div>
    <div className="pg-title">Round History</div>
    <div className="pg-sub">{rounds.length} rounds on record</div>
    {isMaster(user.role)&&<div className="warn"><strong>Caution:</strong> Deleting a round moves it to trash — recoverable from the main app History tab. Every delete requires typing "DELETE" to confirm.</div>}
    {rounds.length===0&&<div className="info-box">No history yet. End Week archives current week sign-ups here.</div>}
    {rounds.map(([key,r])=>{
      const count=pc(r);
      const isOpen=open===key;
      return(
        <div key={key} style={{background:"#1e293b",border:"1px solid rgba(255,255,255,0.07)",borderRadius:12,marginBottom:8,overflow:"hidden"}}>
          <div style={{display:"flex",alignItems:"center",gap:10,padding:"11px 16px",cursor:"pointer"}} onClick={()=>setOpen(isOpen?null:key)}>
            <div style={{flex:1}}>
              <div style={{fontSize:14,fontWeight:700,color:"#e2e8f0"}}>{r.day} — {fmtD(r.date)}</div>
              <div style={{fontSize:11,color:"rgba(255,255,255,0.3)",marginTop:1}}>{count} players{r.scores?` · Front:${r.scores.frontPlaces||1}pl Back:${r.scores.backPlaces||1}pl`:""}</div>
            </div>
            <div style={{display:"flex",gap:4,alignItems:"center"}}>
              {isMaster(user.role)&&<button className="btn btn-r btn-xs" onClick={e=>{e.stopPropagation();setConfirmDel({key,round:r});setDelTyped("");}}>Delete</button>}
              <span style={{fontSize:12,color:"rgba(255,255,255,0.2)",transform:isOpen?"rotate(180deg)":"none",transition:"transform 0.2s",display:"inline-block"}}>▾</span>
            </div>
          </div>
          {isOpen&&(
            <div style={{padding:"12px 16px",borderTop:"1px solid rgba(255,255,255,0.05)",background:"rgba(0,0,0,0.1)"}}>
              {safeArr(r.teams).map((t,ti)=>(
                <div key={ti} style={{marginBottom:8}}>
                  <div style={{fontSize:10,fontWeight:700,color:"#10b981",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:3}}>{t.name} HCP {t.totalHcp}</div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:3}}>
                    {Object.values(t.players||{}).map((p,pi)=>(
                      <span key={pi} style={{fontSize:11,background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:6,padding:"2px 8px"}}>
                        <span style={{fontSize:9,color:"#60a5fa",fontWeight:700,marginRight:3}}>{p.slot}</span>{p.name}
                      </span>
                    ))}
                  </div>
                </div>
              ))}
              {r.scores&&(
                <div style={{marginTop:10,paddingTop:10,borderTop:"1px solid rgba(255,255,255,0.06)"}}>
                  <div className="lbl">Score Splits Stored</div>
                  {[
                    {s:"Front",c1:r.scores.f1,c2:r.scores.f2,pl:r.scores.frontPlaces||1,pot:r.scores.frontPot},
                    {s:"Back",c1:r.scores.b1,c2:r.scores.b2,pl:r.scores.backPlaces||1,pot:r.scores.backPot},
                    {s:"Overall",c1:r.scores.o1,c2:r.scores.o2,pl:r.scores.overallPlaces||1,pot:r.scores.overallPot}
                  ].map(({s,c1,c2,pl,pot})=>(
                    <div key={s} style={{fontSize:12,color:"rgba(255,255,255,0.5)",marginBottom:2}}>{s}: {c1>0?`${f$(c1)} / ${f$(c2||0)}`:`${f$(Math.floor((pot||0)*(pl===1?1:0.6)))} / ${f$(Math.floor((pot||0)*0.4))}`} ({pl} place{pl>1?"s":""})</div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      );
    })}

    {confirmDel&&(
      <div className="overlay">
        <div className="modal">
          <div style={{fontSize:14,fontWeight:700,marginBottom:6,color:"#f87171"}}>Delete Round</div>
          <div style={{fontSize:13,fontWeight:600,marginBottom:2}}>{confirmDel.round.day} — {fmtD(confirmDel.round.date)}</div>
          <div style={{fontSize:11,color:"rgba(255,255,255,0.3)",marginBottom:14}}>Moved to trash — recoverable from main app History tab.</div>
          <div style={{fontSize:12,color:"rgba(255,255,255,0.45)",marginBottom:8}}>Type <strong style={{color:"#fca5a5"}}>DELETE</strong> to confirm:</div>
          <input className="inp" value={delTyped} onChange={e=>setDelTyped(e.target.value)} placeholder='Type "DELETE"' style={{marginBottom:14}} autoFocus/>
          <div style={{display:"flex",gap:8}}>
            <button className="btn btn-r" style={{flex:1}} onClick={()=>deleteRound(confirmDel.key)} disabled={delTyped!=="DELETE"}>Move to Trash</button>
            <button className="btn btn-gh" style={{flex:1}} onClick={()=>{setConfirmDel(null);setDelTyped("");}}>Cancel</button>
          </div>
        </div>
      </div>
    )}
  </div>);
}

// ── ATTEND TAB (matches main app: attendance/rounds = array of {date, players[]}) ──
function AttendTab({user}){
  const rosterEdits=useDB("rosterEdits");
  const extra=useDB("extraPlayers");
  const rawRounds=useDB("attendance/rounds");
  const [section,setSection]=useState("history");
  const [toast,showToast]=useToast();
  const [openRound,setOpenRound]=useState(null);
  const [logModal,setLogModal]=useState(false);
  const [editRound,setEditRound]=useState(null); // {index, data}
  const [confirmDel,setConfirmDel]=useState(null);
  const [delTyped,setDelTyped]=useState("");
  const [search,setSearch]=useState("");

  // Normalize: Firebase may store as array or object
  const rounds=useMemo(()=>{
    if(!rawRounds)return[];
    const arr=Array.isArray(rawRounds)?rawRounds:Object.values(rawRounds);
    return arr.filter(r=>r&&r.date).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  },[rawRounds]);

  const allPlayers=useMemo(()=>{
    const base=ROSTER.map(p=>({...p,name:(rosterEdits&&rosterEdits[p.id])||p.name}));
    const ex=Object.values(extra||{});
    return[...base,...ex].sort((a,b)=>a.name.localeCompare(b.name));
  },[extra,rosterEdits]);

  // Standings data
  const standings=useMemo(()=>{
    const p={};
    rounds.forEach(r=>{(r.players||[]).forEach(raw=>{
      const name=normName(raw);
      if(!p[name])p[name]={name,rounds:0,dates:[]};
      p[name].rounds++;p[name].dates.push(r.date);
    });});
    return Object.values(p).sort((a,b)=>b.rounds-a.rounds);
  },[rounds]);

  const totalEntries=rounds.reduce((s,r)=>s+(r.players||[]).length,0);

  function saveRounds(newRounds){
    const sorted=[...newRounds].sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    wr("attendance/rounds",sorted);
  }

  function deleteRound(index){
    if(delTyped!=="DELETE"){showToast('Type "DELETE" to confirm',"err");return;}
    const updated=rounds.filter((_,i)=>i!==index);
    saveRounds(updated);
    setConfirmDel(null);setDelTyped("");setOpenRound(null);
    showToast("Round deleted ✓");
  }

  // ── LOG/EDIT MODAL (multi-select players, matches main app exactly) ──
  function LogModal({editData,onSave,onClose}){
    const[date,setDate]=useState(editData?editData.date:new Date().toISOString().split("T")[0]);
    const[selected,setSelected]=useState(new Set(editData?editData.players:[]));
    const[q,setQ]=useState("");
    const[guestName,setGuestName]=useState("");
    const allNames=allPlayers.map(r=>r.name).sort((a,b)=>a.localeCompare(b));
    const extraGuests=[...selected].filter(n=>!allNames.includes(n));
    const filtered=allNames.filter(n=>n.toLowerCase().includes(q.toLowerCase()));
    function toggle(name){const s=new Set(selected);if(s.has(name))s.delete(name);else s.add(name);setSelected(s);}
    function addGuest(){if(!guestName.trim())return;const s=new Set(selected);s.add(guestName.trim());setSelected(s);setGuestName("");}
    return(
      <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
        <div className="modal">
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
            <div style={{fontSize:16,fontWeight:700,color:"#e2e8f0"}}>{editData?"Edit Round":"Log a Round"}</div>
            <button onClick={onClose} style={{width:28,height:28,borderRadius:"50%",border:"1px solid rgba(255,255,255,0.15)",background:"rgba(255,255,255,0.06)",cursor:"pointer",color:"rgba(255,255,255,0.5)",fontSize:16,lineHeight:1}}>✕</button>
          </div>
          <div style={{marginBottom:12}}>
            <div className="lbl">Date</div>
            <input className="inp" type="date" value={date} onChange={e=>setDate(e.target.value)}/>
          </div>
          <div style={{marginBottom:12}}>
            <div className="lbl">Players ({selected.size} selected)</div>
            <div style={{position:"relative",marginBottom:6}}>
              <input className="inp" style={{paddingLeft:12,fontSize:13}} placeholder="Search roster..." value={q} onChange={e=>setQ(e.target.value)}/>
            </div>
            <div style={{maxHeight:240,overflowY:"auto",border:"1px solid rgba(255,255,255,0.08)",borderRadius:8,marginBottom:8}}>
              {/* Extra guests (names not in roster) */}
              {extraGuests.map(name=>(
                <div key={name} onClick={()=>toggle(name)} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 11px",borderBottom:"1px solid rgba(255,255,255,0.04)",cursor:"pointer",background:"rgba(16,185,129,0.12)"}}>
                  <div style={{width:16,height:16,borderRadius:4,background:"#10b981",border:"2px solid #10b981",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg></div>
                  <span style={{fontSize:12,fontWeight:500,flex:1,color:"#e2e8f0"}}>{name}</span>
                  <span style={{fontSize:10,color:"rgba(255,255,255,0.3)",background:"rgba(255,255,255,0.06)",padding:"1px 6px",borderRadius:10}}>Guest</span>
                </div>
              ))}
              {/* Roster players */}
              {filtered.map(name=>{const on=selected.has(name);return(
                <div key={name} onClick={()=>toggle(name)} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 11px",borderBottom:"1px solid rgba(255,255,255,0.04)",cursor:"pointer",background:on?"rgba(16,185,129,0.08)":"transparent"}}>
                  <div style={{width:16,height:16,borderRadius:4,border:"2px solid",borderColor:on?"#10b981":"rgba(255,255,255,0.2)",background:on?"#10b981":"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{on&&<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg>}</div>
                  <span style={{fontSize:12,fontWeight:500,color:"#e2e8f0"}}>{name}</span>
                </div>
              );})}
            </div>
            <div style={{display:"flex",gap:6}}>
              <input className="inp" style={{flex:1,fontSize:12}} placeholder="Add guest name..." value={guestName} onChange={e=>setGuestName(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addGuest();}}/>
              <button className="btn btn-gh btn-sm" onClick={addGuest} disabled={!guestName.trim()}>+ Guest</button>
            </div>
          </div>
          <button className="btn btn-g btn-full" style={{opacity:(!date||selected.size===0)?0.4:1,marginTop:8}} disabled={!date||selected.size===0}
            onClick={()=>{if(!date||selected.size===0)return;onSave({date,players:[...selected].sort()});onClose();}}>
            {editData?"Save Changes":"Log Round ("+selected.size+" players)"}
          </button>
        </div>
      </div>
    );
  }

  return(<div>
    <Toast msg={toast.msg} type={toast.type}/>
    <div className="pg-eyebrow">Tracking</div>
    <div className="pg-eyebrow">Tracking</div>
    <div className="pg-title">Attendance</div>
    <div className="pg-sub">{rounds.length} round{rounds.length!==1?"s":""} · {standings.length} unique players · ${totalEntries} to tournament fund</div>

    <div className="sec-tabs">
      {[["standings","📊 Standings"],["history","📋 History"]].map(([id,label])=>(
        <button key={id} className={`mtab${section===id?" on":""}`} style={{fontSize:12}} onClick={()=>setSection(id)}>{label}</button>
      ))}
    </div>

    {/* ── STANDINGS ── */}
    {section==="standings"&&(
      <div>
        <div className="stat-grid sg-4" style={{marginBottom:14}}>
          <div className="stat"><div className="stat-v" style={{color:"#10b981"}}>{standings.length}</div><div className="stat-l">Players</div></div>
          <div className="stat"><div className="stat-v" style={{color:"#60a5fa"}}>{rounds.length}</div><div className="stat-l">Rounds</div></div>
          <div className="stat"><div className="stat-v" style={{color:"#a78bfa"}}>{standings.length>0?standings[0].rounds:0}</div><div className="stat-l">Top Played</div></div>
          <div className="stat"><div className="stat-v" style={{color:"#fbbf24"}}>${totalEntries}</div><div className="stat-l">Tourn Fund</div></div>
        </div>

        <div className="card">
          <div className="srch"><input className="inp" placeholder="🔍 Search players..." value={search} onChange={e=>setSearch(e.target.value)}/></div>
          {standings.filter(p=>!search||p.name.toLowerCase().includes(search.toLowerCase())).length===0&&(
            <div style={{padding:"20px 16px",fontSize:12,color:"rgba(255,255,255,0.3)",textAlign:"center"}}>No attendance data yet. Rounds are logged when weeks are closed out.</div>
          )}
          {standings.filter(p=>!search||p.name.toLowerCase().includes(search.toLowerCase())).map((p,i)=>{
            const maxR=standings[0]?.rounds||1;
            return(
              <div key={p.name} className="s-row">
                <div style={{width:22,height:22,borderRadius:"50%",background:i<3?"#f59e0b":"rgba(255,255,255,0.08)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:800,color:i<3?"#1e293b":"rgba(255,255,255,0.4)",flexShrink:0,fontFamily:"Barlow Condensed,sans-serif"}}>{i+1}</div>
                <span style={{flex:1,fontSize:13,fontWeight:600,color:"#e2e8f0"}}>{p.name}</span>
                <div style={{width:50,height:5,background:"rgba(255,255,255,0.07)",borderRadius:3,overflow:"hidden",flexShrink:0}}>
                  <div style={{height:5,background:"#10b981",borderRadius:3,width:Math.round((p.rounds/maxR)*100)+"%"}}/>
                </div>
                <span style={{fontFamily:"Barlow Condensed,sans-serif",fontSize:18,fontWeight:700,color:"#a78bfa",width:28,textAlign:"right",flexShrink:0}}>{p.rounds}</span>
              </div>
            );
          })}
        </div>
      </div>
    )}

    {/* ── HISTORY (rounds list — matches main app) ── */}
    {section==="history"&&(
      <div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <div className="lbl" style={{marginBottom:0}}>{rounds.length} round{rounds.length!==1?"s":""}</div>
          <button className="btn btn-g btn-sm" onClick={()=>{setEditRound(null);setLogModal(true);}}>+ Log Round</button>
        </div>

        {rounds.length===0&&<div className="info-box"><strong>No rounds logged yet.</strong> Rounds are added automatically when you close out a week, or you can log one manually.</div>}

        {rounds.map((r,ri)=>{
          const players=r.players||[];
          const isOpen=openRound===ri;
          return(
            <div key={r.date+"-"+ri} className="card" style={{marginBottom:8}}>
              <div onClick={()=>setOpenRound(isOpen?null:ri)} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"11px 16px",cursor:"pointer"}}>
                <div>
                  <div style={{fontSize:14,fontWeight:700,color:"#e2e8f0"}}>{fmtD(r.date)}</div>
                  <div style={{fontSize:11,color:"rgba(255,255,255,0.3)",marginTop:1}}>{players.length} player{players.length!==1?"s":""} · ${players.length} to pot</div>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:5}}>
                  <span style={{fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:20,background:"#10b981",color:"#fff"}}>{players.length}</span>
                  <span style={{fontSize:12,color:"rgba(255,255,255,0.2)",transform:isOpen?"rotate(180deg)":"none",transition:"transform 0.2s",display:"inline-block"}}>▾</span>
                </div>
              </div>
              {isOpen&&(
                <div style={{borderTop:"1px solid rgba(255,255,255,0.05)"}}>
                  <div style={{padding:"8px 16px"}}>
                    {players.map((name,pi)=>(
                      <div key={name} style={{display:"flex",alignItems:"center",gap:7,padding:"5px 0",borderBottom:pi<players.length-1?"1px solid rgba(255,255,255,0.04)":"none",fontSize:13,fontWeight:500,color:"#e2e8f0"}}>
                        <span style={{width:18,height:18,borderRadius:"50%",background:"rgba(255,255,255,0.06)",color:"rgba(255,255,255,0.4)",fontSize:9,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontFamily:"Barlow Condensed,sans-serif"}}>{pi+1}</span>
                        {name}
                      </div>
                    ))}
                  </div>
                  <div style={{borderTop:"1px solid rgba(255,255,255,0.05)",padding:"8px 16px",display:"flex",gap:6,justifyContent:"flex-end"}}>
                    <button className="btn btn-gh btn-xs" onClick={e=>{e.stopPropagation();setEditRound({index:ri,data:r});setLogModal(true);}}>Edit</button>
                    <button className="btn btn-r btn-xs" onClick={e=>{e.stopPropagation();setConfirmDel({index:ri,round:r});setDelTyped("");}}>Delete</button>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    )}

    {/* ── LOG/EDIT MODAL ── */}
    {logModal&&<LogModal
      editData={editRound?editRound.data:null}
      onSave={data=>{
        if(editRound){
          const updated=[...rounds];
          updated[editRound.index]=data;
          saveRounds(updated);
          showToast("Round updated ✓");
        }else{
          saveRounds([...rounds,data]);
          showToast("Round logged — "+data.players.length+" players ✓");
        }
        setEditRound(null);
      }}
      onClose={()=>{setLogModal(false);setEditRound(null);}}
    />}

    {/* ── DELETE CONFIRM ── */}
    {confirmDel&&(
      <div className="overlay">
        <div className="modal">
          <div style={{fontSize:14,fontWeight:700,marginBottom:5,color:"#f87171"}}>Delete Attendance Round</div>
          <div style={{fontSize:13,fontWeight:600,marginBottom:2}}>{fmtD(confirmDel.round.date)}</div>
          <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginBottom:16}}>{(confirmDel.round.players||[]).length} players</div>
          <div style={{fontSize:12,color:"rgba(255,255,255,0.45)",marginBottom:8}}>Type <strong style={{color:"#fca5a5"}}>DELETE</strong> to confirm:</div>
          <input className="inp" value={delTyped} onChange={e=>setDelTyped(e.target.value)} placeholder='Type "DELETE"' style={{marginBottom:14}} autoFocus/>
          <div style={{display:"flex",gap:8}}>
            <button className="btn btn-r" style={{flex:1}} onClick={()=>deleteRound(confirmDel.index)} disabled={delTyped!=="DELETE"}>Delete Forever</button>
            <button className="btn btn-gh" style={{flex:1}} onClick={()=>{setConfirmDel(null);setDelTyped("");}}>Cancel</button>
          </div>
        </div>
      </div>
    )}
  </div>);
}

function SettingsTab({user,onSignOut}){
  const settings=useDB("settings");
  const [tfBal,setTfBal]=useState("");
  const [newPw,setNewPw]=useState("");
  const [confirmPw,setConfirmPw]=useState("");
  const [pwMsg,setPwMsg]=useState("");
  const [toast,showToast]=useToast();

  useEffect(()=>{if(settings)setTfBal(String(settings.tournFundStartingBalance||0));},[settings?.tournFundStartingBalance]);

  function saveTF(){wr("settings/tournFundStartingBalance",parseFloat(tfBal)||0);showToast("Saved ✓");}
  function savePw(){
    if(newPw!==confirmPw){setPwMsg("Passwords do not match");return;}
    if(newPw.length<4){setPwMsg("Minimum 4 characters");return;}
    wr("settings/masterPassword",newPw);
    setNewPw("");setConfirmPw("");setPwMsg("");
    showToast("Password updated ✓");
  }

  return(<div>
    <Toast msg={toast.msg} type={toast.type}/>
    <div className="pg-eyebrow">Master Only</div>
    <div className="pg-title">Settings</div>
    <div className="pg-sub">Master-only system configuration</div>

    <div className="card">
      <div className="card-hdr"><span className="card-title">🔐 Set Up Firebase Email Login</span></div>
      <div className="card-body">
        <div style={{fontSize:12,color:"rgba(255,255,255,0.4)",marginBottom:12,lineHeight:1.8}}>Replace the password fallback with proper Firebase email authentication. No effect on the main app.</div>
        <div style={{background:"#0e1d19",border:"1px solid rgba(255,255,255,0.08)",borderRadius:10,padding:"12px 14px",fontSize:12,color:"rgba(255,255,255,0.45)",lineHeight:2}}>
          <div><strong style={{color:"#60a5fa"}}>1.</strong> <a href="https://console.firebase.google.com/project/clark-group-dd15e/authentication" target="_blank" style={{color:"#10b981"}}>Firebase Console → Authentication</a></div>
          <div><strong style={{color:"#60a5fa"}}>2.</strong> Sign-in method → Enable <strong style={{color:"#e2e8f0"}}>Email/Password</strong></div>
          <div><strong style={{color:"#60a5fa"}}>3.</strong> Users tab → Add user (your email + password)</div>
          <div><strong style={{color:"#60a5fa"}}>4.</strong> Use Email Login tab on the portal gate</div>
        </div>
      </div>
    </div>

    <div className="card">
      <div className="card-hdr"><span className="card-title">Tournament Fund Starting Balance</span></div>
      <div className="card-body">
        <div style={{fontSize:11,color:"rgba(255,255,255,0.35)",marginBottom:8}}>Balance from before rounds were tracked in the app:</div>
        <div style={{display:"flex",gap:8}}>
          <input className="inp" type="number" value={tfBal} onChange={e=>setTfBal(e.target.value)} style={{flex:1}}/>
          <button className="btn btn-g" onClick={saveTF}>Save</button>
        </div>
      </div>
    </div>

    <div className="card">
      <div className="card-hdr"><span className="card-title">Fallback Master Password</span></div>
      <div className="card-body">
        {pwMsg&&<div style={{fontSize:11,color:"#f87171",marginBottom:8}}>{pwMsg}</div>}
        <input className="inp" type="password" value={newPw} onChange={e=>setNewPw(e.target.value)} placeholder="New password" style={{marginBottom:7}}/>
        <input className="inp" type="password" value={confirmPw} onChange={e=>setConfirmPw(e.target.value)} placeholder="Confirm password" style={{marginBottom:10}}/>
        <button className="btn btn-a btn-full" onClick={savePw}>Update Password</button>
      </div>
    </div>

    <div className="card">
      <div className="card-hdr"><span className="card-title">Firebase Links</span></div>
      <div className="card-body" style={{display:"flex",flexDirection:"column",gap:6}}>
        <a href="https://console.firebase.google.com/project/clark-group-dd15e/database" target="_blank" className="btn btn-gh" style={{textDecoration:"none",textAlign:"center",fontSize:12}}>🔥 Firebase Realtime Database</a>
        <a href="https://console.firebase.google.com/project/clark-group-dd15e/authentication/users" target="_blank" className="btn btn-gh" style={{textDecoration:"none",textAlign:"center",fontSize:12}}>🔐 Auth Users</a>
      </div>
    </div>

    <div className="card">
      <div className="card-hdr"><span className="card-title">Session</span></div>
      <div className="card-body"><button className="btn btn-gh btn-full" onClick={onSignOut}>🔒 Lock Portal & Sign Out</button></div>
    </div>
  </div>);
}

function Portal(){
  const [user,setUser]=useState(()=>{try{const s=sessionStorage.getItem("portal_user");return s?JSON.parse(s):null;}catch{return null;}});
  const [tab,setTab]=useState("dash");

  useEffect(()=>{
    if(!auth)return;
    const unsub=auth.onAuthStateChanged(u=>{
      if(u&&!user){const ud={email:u.email,role:"superadmin",method:"firebase"};sessionStorage.setItem("portal_user",JSON.stringify(ud));setUser(ud);}
    });
    return()=>unsub();
  },[]);

  // Redirect if non-master lands on master-only tab
  useEffect(()=>{
    if(user&&!isMaster(user.role)&&(tab==="settings"||tab==="season")){setTab("dash");}
  },[user,tab]);

  function onAuth(u){sessionStorage.setItem("portal_user",JSON.stringify(u));setUser(u);}
  function signOut(){sessionStorage.removeItem("portal_user");try{if(auth&&auth.currentUser)auth.signOut();}catch(e){}setUser(null);}

  if(!user)return<Gate onAuth={onAuth}/>;

  // Filter nav based on role
  const NAV_ITEMS=ALL_NAV_ITEMS.filter(n=>!n.master||isMaster(user.role));

  const ini=(user.email&&user.email!=="master")?user.email.charAt(0).toUpperCase():(user.name?user.name.charAt(0).toUpperCase():"J");

  return(
    <div className="shell">
      <div className="topbar">
        <div style={{display:"flex",alignItems:"baseline",gap:6}}><div className="logo">Clark <em>Golf</em> Group</div><div className="logo-sub">Portal</div></div>
        <span className={`role-badge ${isMaster(user.role)?"rb-master":"rb-superadmin"}`}>{isMaster(user.role)?"Master Admin":"Super Admin"}</span>
        <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:10}}>
          <div style={{display:"flex",alignItems:"center",gap:8,padding:"5px 12px 5px 7px",background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:24}}>
            <div style={{width:26,height:26,borderRadius:"50%",background:"#10b981",color:"#fff",fontSize:11,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"Barlow Condensed,sans-serif",flexShrink:0}}>{ini}</div>
            <span style={{fontSize:12,fontWeight:600,color:"rgba(255,255,255,0.65)",maxWidth:120,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{user.name||user.email||"Admin"}</span>
          </div>
          <a href="index.html" style={{fontSize:11,fontWeight:600,color:"rgba(255,255,255,0.2)",textDecoration:"none",padding:"5px 12px",borderRadius:20,border:"1px solid rgba(255,255,255,0.08)",transition:"all 0.2s",whiteSpace:"nowrap"}} onMouseEnter={e=>{e.currentTarget.style.color="rgba(255,255,255,0.5)";e.currentTarget.style.borderColor="rgba(255,255,255,0.18)";}} onMouseLeave={e=>{e.currentTarget.style.color="rgba(255,255,255,0.2)";e.currentTarget.style.borderColor="rgba(255,255,255,0.08)";}}>← App</a>
        </div>
      </div>
      <div className="mob-nav">
        {NAV_ITEMS.map(n=>(
          <button key={n.id} className={`mob-btn${tab===n.id?" on":""}`} onClick={()=>setTab(n.id)}>{n.icon}<span>{n.label}</span></button>
        ))}
        <button className="mob-btn" onClick={signOut} style={{marginLeft:4,borderLeft:"1px solid rgba(255,255,255,0.08)",paddingLeft:8}}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" style={{width:18,height:18}}><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          <span>Sign Out</span>
        </button>
      </div>
      <div className="body">
        <div className="sidebar">
          {NAV_ITEMS.filter(n=>!n.master).map(n=>(
            <button key={n.id} className={`ni${tab===n.id?" on":""}`} onClick={()=>setTab(n.id)}>{n.icon}{n.label}</button>
          ))}
          {isMaster(user.role)&&NAV_ITEMS.some(n=>n.master)&&(
            <>
              <div className="nav-sep">Master Only</div>
              {NAV_ITEMS.filter(n=>n.master).map(n=>(
                <button key={n.id} className={`ni${tab===n.id?" on":""}`} onClick={()=>setTab(n.id)}>{n.icon}{n.label}</button>
              ))}
            </>
          )}
          <div className="ni-foot">
            <button className="ni" onClick={signOut} style={{color:"rgba(255,255,255,0.25)"}}>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" style={{width:15,height:15}}><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>Sign Out
            </button>
          </div>
        </div>
        <div className="main">
          {tab==="dash"&&<DashTab user={user}/>}
          {tab==="week"&&<WeekTab user={user}/>}
          {tab==="email"&&<EmailTab/>}
          {tab==="roster"&&<RosterTab/>}
          {tab==="access"&&<AccessTab user={user}/>}
          {tab==="history"&&<HistoryTab user={user}/>}
          {tab==="attend"&&<AttendTab user={user}/>}
          {tab==="season"&&isMaster(user.role)&&<SeasonTab/>}
          {tab==="settings"&&isMaster(user.role)&&<SettingsTab user={user} onSignOut={signOut}/>}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Portal/>);
</script>
</body>
</html>
